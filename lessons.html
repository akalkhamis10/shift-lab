<style>
:root{
  
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  
  --font-display:'Lalezar','Baloo Bhaijaan 2','Cairo',sans-serif;   
  --font-text:'Cairo','IBM Plex Sans Arabic',sans-serif;             
  --fs-hero:72px;      
  --fs-title:52px;     
  --fs-question:40px;  
  --fs-answer:44px;    
  --fs-hud:28px;       
  --fs-body:22px;      
  --fs-small:18px;     
  --lh-tight:1.1; --lh-text:1.5;

  --tv-root:  max(16px, 4.44cqh);
  --tv-min:   1em;      
  --tv-text:  1em;
  --tv-label: 1em;
  --tv-answer:1.25em;
  --tv-question: 2em;   
  --tv-hero:  2.6em;
  --tv-max-interactive: 6;   

  --bg:#F3E3C9;        
  --paper:#FBF7F0;     
  --ink:#22344E;       
  --ink2:#4A5A72;      
  --clay:#D9A066;      
  --mud:#A86A3E;       
  --sadu:#C0392B;      
  --sadu2:#962C21;  
  --palm:#3E8E5E;      
  --palm2:#255C3B;  
  --palm-soft:#DDEFE3; 
  --palm-ink:#1F5A3A;
  --sadu-soft:#F8E1DD; 
  --sadu-ink:#7A1F16;
  --sky:#8EC9E6;
  --gold:#E0A83A; --gold2:#B8842A; --gold-soft:#FBEBD2;   
  --sea:#2F8F8F;
  --line:#EAD9BF;      
  --shade:rgba(120,80,40,.35);  
  --shade-soft:rgba(60,40,20,.25);

  --t1:var(--sky); --t2:var(--sadu); --t3:var(--palm); --t4:var(--gold);   

  --r-chip:26px; --r-card:22px; --r-bar:22px;
  --shadow-clay:0 10px 0 var(--shade),0 18px 30px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.7);
  --shadow-press:0 4px 0 var(--shade),0 8px 14px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.7);
  --border-ink:3px solid var(--ink);

  --sp-1:6px; --sp-2:12px; --sp-3:18px; --sp-4:24px; --sp-5:36px;
  --hit:64px;          

  --d-tap:150ms; --d-pop:200ms; --d-slide:300ms; --d-settle:300ms;
  --d-hold:50ms;      
  --d-shake:240ms;    
  --ease-pop:cubic-bezier(.34,1.56,.64,1);   
  --ease-settle:cubic-bezier(.22,1,.36,1);   
}
@media (prefers-reduced-motion:reduce){
  :root{ --d-tap:0ms; --d-slide:1ms; --d-pop:1ms; --d-settle:1ms; --d-hold:0ms; --d-shake:0ms; }
}

:root[data-proj="1"]{
  --fs-question:46px; --fs-answer:50px; --fs-hud:32px; --fs-body:26px; --fs-small:20px;
}

.ds{ font-family:var(--font-text); color:var(--ink); direction:rtl; }
.ds *{ box-sizing:border-box; }

.ds .chip{ display:inline-flex; align-items:center; gap:14px; height:var(--hit); padding:0 24px;
  font-size:var(--fs-hud); font-weight:700; line-height:1; white-space:nowrap; flex:none;
  background:var(--paper); color:var(--ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay); }
.ds .chip .k{ font-size:var(--fs-small); font-weight:600; color:var(--ink2); }
.ds .chip .dot{ width:22px; height:22px; border-radius:50%; background:var(--tc,var(--t1)); box-shadow:0 0 0 4px rgba(255,255,255,.55); }
.ds .chip .n{ font-family:var(--font-display); font-size:calc(var(--fs-hud) + 4px); font-weight:800; }

.ds .score{ display:inline-flex; align-items:center; gap:10px; height:var(--hit); padding:0 18px;
  font-size:var(--fs-hud); font-weight:700; white-space:nowrap; flex:none;
  background:var(--paper); color:var(--ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay); }
.ds .score .dot{ width:18px; height:18px; border-radius:50%; background:var(--tc,var(--t1)); }
.ds .score .v{ font-family:var(--font-display); font-size:calc(var(--fs-hud) + 4px); font-weight:800; min-width:44px; text-align:center; }

.ds .pause{ display:inline-flex; align-items:center; gap:12px; height:var(--hit); padding:0 24px; border:0; cursor:pointer;
  font-family:var(--font-display); font-size:var(--fs-hud); font-weight:800; line-height:1; white-space:nowrap;
  background:var(--sadu); color:#fff; border-radius:var(--r-chip);
  box-shadow:0 10px 0 var(--sadu2),0 18px 30px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.35); }
.ds .pause:active{ transform:translateY(6px); box-shadow:0 4px 0 var(--sadu2),0 8px 14px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.35); }
.ds .pause svg{ width:22px; height:22px; fill:currentColor; }

.ds .qbar{ display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 32px;
  font-family:var(--font-display); font-size:var(--fs-question); font-weight:800; line-height:1.22; white-space:nowrap;
  background:var(--paper); color:var(--ink); border:var(--border-ink); border-radius:var(--r-bar); box-shadow:var(--shadow-clay); }
.ds .qbar.verdict{ flex-direction:column; padding:6px 40px 8px; color:#fff; border-color:transparent; }
.ds .qbar.verdict.ok{ background:var(--palm2); }  .ds .qbar.verdict.bad{ background:var(--sadu2); }
.ds .qbar.verdict .q{ font-size:28px; font-weight:700; line-height:1.2; opacity:.92; }
.ds .qbar.verdict .v{ font-size:var(--fs-hero); font-weight:800; line-height:1.05; }
.ds .qbar.verdict .v small{ font-family:var(--font-text); font-size:26px; font-weight:700; margin-inline-end:14px; vertical-align:middle; }

.ds .lane{ position:relative; display:inline-flex; align-items:center; justify-content:center; height:78px; padding:0 34px 0 52px;
  font-family:var(--font-display); font-size:var(--fs-answer); font-weight:800; line-height:1; white-space:nowrap;
  background:var(--paper); color:var(--ink); border:var(--border-ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay);
  transition:background var(--d-pop) var(--ease-settle), color var(--d-pop) var(--ease-settle), border-color var(--d-pop) var(--ease-settle); }
.ds .lane::before{ content:''; position:absolute; inset:8px auto 8px 10px; width:14px; border-radius:7px;
  background:repeating-linear-gradient(180deg,var(--sadu) 0 9px,var(--ink) 9px 13px,#F1D39A 13px 21px,var(--paper) 21px 25px); }
.ds .lane.ok{ border-color:var(--palm); background:var(--palm-soft); color:var(--palm-ink); }

"},{"id":"f7","tag":"صورة","text":"الكرة الأرضية ملوّنة بمفتاح (يابسة/ماء)؛ جزر المالديف وجزر القمر في نشاط تحديد نوع المسطح","obj":"KW-SOC-G5-LOC-01-02","source":"موثّق"}],"pairs":[{"a":"المسطحات المائية","b":"أشكال المياه على الأرض","obj":"KW-SOC-G5-LOC-01-03","from":"f3","page":20},{"a":"المحيط","b":"مسطح مائي كبير جداً","obj":"KW-SOC-G5-LOC-01-03","from":"f4a","page":20},{"a":"البحر","b":"أصغر من المحيط","obj":"KW-SOC-G5-LOC-01-03","from":"f4b","page":20},{"a":"الخليج","b":"جزء يمتدّ داخل اليابسة","obj":"KW-SOC-G5-LOC-01-03","from":"f4c","page":20},{"a":"الأرض","b":"الكوكب الوحيد فيه حياة","obj":"KW-SOC-G5-LOC-01-01","from":"f1","page":18},{"a":"الهادي","b":"أكبر المحيطات","obj":"KW-SOC-G5-LOC-01-02","from":"f5b","page":20}],"questions":[{"q":"كم نسبة المسطحات المائية من سطح الأرض؟","options":["71%","61%","79%"],"answer":0,"obj":"KW-SOC-G5-LOC-01-01","from":"f2","page":18},{"q":"ما المسطحات المائية؟","options":["أشكال المياه على سطح الأرض","أشكال اليابسة على سطح الأرض","أشكال المياه داخل القارات فقط"],"answer":0,"obj":"KW-SOC-G5-LOC-01-02","from":"f3","page":20},{"q":"ما المسطح المائي الكبير جداً؟","options":["المحيط","البحر","الخليج"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4a","page":20},{"q":"أيّ المسطحات أصغر من المحيط؟","options":["البحر","القارة","اليابسة"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4b","page":20},{"q":"ما المسطح المائي الذي يمتدّ داخل اليابسة؟","options":["الخليج","المحيط","البحر"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4c","page":20},{"q":"ما أكبر المحيطات؟","options":["الهادي","الأطلسي","الهندي"],"answer":0,"obj":"KW-SOC-G5-LOC-01-02","from":"f5b","page":20},{"q":"كم نسبة اليابسة من مساحة سطح الأرض؟","options":["29%","25%","39%"],"answer":0,"obj":"KW-SOC-G5-LOC-01-01","from":"f2b","page":18},{"q":"كم عدد المحيطات في العالم؟","options":["خمسة","أربعة","ستة"],"answer":0,"obj":"KW-SOC-G5-LOC-01-02","from":"f5a","page":20}],"sequences":[{"label":"رتّب من الأكبر إلى الأصغر","order":["المحيط","البحر","الخليج"],"obj":"KW-SOC-G5-LOC-01-03","from":"f4a","page":20}],"categories":[{"label":"امسك المحيطات وحدها","items":[{"t":"المحيط الهادي","in":true,"why":"أحد المحيطات الخمسة، وأكبرها مساحةً"},{"t":"المحيط الأطلسي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط الهندي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط المتجمد الشمالي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط المتجمد الجنوبي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"البحر المتوسط","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"},{"t":"بحر العرب","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"},{"t":"البحر الأحمر","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"}],"obj":"KW-SOC-G5-LOC-01-02","from":"f5a","source":"موثّق · ص ٢٠","page":20}],"places":[],"note_questions":"سؤال واحد لكل حقيقة · ولا سؤال يُجاب بمعرفة عامة بلا هذا الدرس (كان «ما الكوكب الوحيد الذي توجد عليه الحياة؟» ومشتّتاته من خارج الدرس) · والمشتّت قريب من الصحيح ومن مفردات الدرس (كان 50% و90% مقابل 71% — قسمةَ منتصف ومبالغةً، فصارا 61% و79%). الثلاثة تُفحص آلياً في `questionIssues`. **24 سبتمبر:** أُضيف سؤالان بطلب المؤسّس (15 بنداً بالصيغ الثلاث): نسبة اليابسة 29% من حقيقة f2b (فُصلت عن f2 كما فُصلت f4 وf5 — الكتاب يذكر الرقمين في السطر نفسه ص ١٨)، وعدد المحيطات من f5a ص ٢٠؛ مشتّتا العدد 4 و6 على مسافة 20%. ولكل سؤال وزوج وتصنيف **رقم صفحة الكتاب** (`page`).","note_facts":"الحقائق المركّبة فُصلت (‏f4 → f4a/b/c و f5 → f5a/b) — نقلٌ أمين: الكتاب يذكرها صراحةً في سطر واحد. والفصل يفتح ستّ حقائق قابلة للسؤال فتكتمل دورتان لثلاثة فِرَق. **24 سبتمبر:** f2b (نسبة اليابسة) فُصلت من f2 للسبب نفسه.","note_pairs":"نصوص البطاقات مختصرة اختصاراً أميناً من الحقيقة نفسها — بطاقة المطابقة أضيق من سطر الخيار، والحدّ مقيس في `PAIR_MAX`.","note_objectives":"لكل هدف **صيغة قصيرة** تُعرض على شاشة النتيجة — النصّ المنهجي الكامل لا يُقرأ في عشر ثوانٍ من آخر الصفّ (قيس 15 سبتمبر: 53 محرفاً تفيض عن الشاشة).","note_sequences":"تسلسل واحد لا غير: «المحيط ← البحر ← الخليج» من تعريفات ص ٢٠ (‏f4a–f4c). والصفحات ١٨–٢١ **لا تحمل ترتيباً زمنياً ولا مرحلياً آخر**: الكتاب يذكر أنّ أكبر المحيطات هو الهادي ولا يرتّب الخمسة، فترتيبها بالمساحة تأليفٌ لا نقل. ولأن `timeline` يشترط أربعة عناصر فأكثر، يبقى هذا التسلسل الثلاثي دون حدّ المحرّك — نقصٌ في الكتاب لا في العقد.","note_categories":"تصنيف واحد من ص ٢٠: المحيطات الخمسة كما عدّها الكتاب نصّاً، ومقابلها البحار الثلاثة المكتوبة بأسمائها على خريطة العالم شكل (٣) — لا اسم من خارج الصفحتين. **صيغة النداء من عندنا** («امسك المحيطات وحدها») لأن الكتاب يكتب المهمّة بصيغة «حدّد نوع المسطح المائي»، أمّا كل عنصر وسببه فمن الكتاب. و**الخلجان بلا أعضاء**: الصفحات ١٨–٢١ تعرّف الخليج ولا تسمّي خليجاً واحداً، فلا يصحّ تصنيف ثالث. والنشاط الأول ص ٢١ تصنيفٌ بالصور لا بالأسماء، وأجوبته غير مطبوعة، فلم يُنقل منه شيء.","revision":{"at":"2026-09-24","by":"Claude Fable 5.1","what":"رُفع من 13 إلى 16 بنداً: 8 أسئلة · 6 أزواج · تسلسل · تصنيف — ورقم الصفحة لكل بند","review":"بانتظار مراجعة معلّمة المادة — لم يُوسَم «مراجَع» بعد"}},"KW-SOC-G5-LOC-02":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-02","unit_id":"KW-SOC-G5-LOC","title":"قارات الكرة الأرضية","grade":5,"subject":"SOC","pages":[22,23],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول حرفياً من الحقائق المستخرجة في صفحة المراجعة — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-02-01","text":"تعريف القارة","short":"تعريف القارة"},{"code":"KW-SOC-G5-LOC-02-02","text":"أسماء قارات العالم","short":"أسماء قارات العالم"},{"code":"KW-SOC-G5-LOC-02-03","text":"أكبر القارات وأصغرها مساحةً","short":"أكبر القارات وأصغرها"},{"code":"KW-SOC-G5-LOC-02-04","text":"القارة غير المأهولة بالسكان","short":"القارة غير المأهولة"},{"code":"KW-SOC-G5-LOC-02-05","text":"موقع وطني الكويت","short":"موقع وطني الكويت"}],"facts":[{"id":"f1","tag":"مفهوم","text":"القارة: مساحة كبيرة من اليابسة يحيط بها الماء","obj":"KW-SOC-G5-LOC-02-01","source":"موثّق · ص ٢٢ و٢٣"},{"id":"f2","tag":"رقم","text":"قارات العالم سبع قارات","obj":"KW-SOC-G5-LOC-02-02","source":"موثّق · ص ٢٢"},{"id":"f3","tag":"اسم","text":"قارات العالم هي: -SOC-G5-LOC-02-03","from":"f4","page":22},{"q":"أستراليا في قارات العالم هي:","options":["ثاني أصغر القارات بعد أوروبا","أصغر القارات","دولة لا قارة"],"answer":1,"obj":"KW-SOC-G5-LOC-02-03","from":"f5","page":22},{"q":"أيّ القارات غير مأهولة بالسكان؟","options":["القطبية الجنوبية","أستراليا","أمريكا الجنوبية"],"answer":0,"obj":"KW-SOC-G5-LOC-02-04","from":"f6","page":22},{"q":"في أيّ قارة يقع وطني الكويت؟","options":["أفريقيا","آسيا","أوروبا"],"answer":1,"obj":"KW-SOC-G5-LOC-02-05","from":"f7","page":22},{"q":"ما أكبر قارات العالم مساحةً؟","options":["آسيا","أفريقيا","أوروبا"],"answer":0,"obj":"KW-SOC-G5-LOC-02-03","from":"f4a","page":22}],"sequences":[],"categories":[{"label":"امسك القارات وحدها","items":[{"t":"آسيا","in":true,"why":"إحدى القارات السبع، وأكبرها مساحةً وأكثرها سكاناً"},{"t":"أفريقيا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أوروبا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الشمالية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الجنوبية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أستراليا","in":true,"why":"إحدى القارات السبع، وأصغرها مساحةً"},{"t":"القطبية الجنوبية","in":true,"why":"إحدى القارات السبع، وهي غير مأهولة بالسكان"},{"t":"المحيط الهادي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة، والقارة مساحة كبيرة من اليابسة"},{"t":"المحيط الأطلسي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط الهندي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الشمالي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الجنوبي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"}],"obj":"KW-SOC-G5-LOC-02-02","from":"f3","source":"موثّق · ص ٢٢ و٢٣","page":22}],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الدرس — لا اسم قارة خارج `f3`، **ولا مشتّت صحيح خارج الدرس ولا مناقض لنصّ سؤاله**. وسبب كل مشتّت:\n• «مساحة كبيرة من الماء» (f1): يقلب التعريف — الماء يحيط باليابسة لا العكس، وهو خلط القارة بالمحيط.\n• «دولة كبيرة من اليابسة» (f1): الخلط بين القارة والدولة — طفلة تعرف «الكويت» دولةً وتقيس عليها.\n• «خمس قارات» و«ست قارات» (f2): العدد الأقرب للصحيح لا رقم بعيد، فلا يُستبعد بالشكل.\n• «أمريكا الشرقية» و«أمريكا الغربية» (f3): **اسمان مركّبان لا وجود لهما** — القائمة تعرف الشمالية والجنوبية وحدهما. والسؤال يقيس معرفة القائمة لا حفظ ترتيبها: الخيارات الثلاثة «أمريكا + جهة»، فالتمييز بمعرفة أيّ جهة قارةٌ فعلاً.\n  (وهذا استثناء مُقرَّر من قاعدة «لا اسم قارة خارج f3»: المحظور اسمُ قارة **حقيقية** غائبة عن القائمة — نفيُها يعلّم خطأ؛ أمّا الاسم المركّب الذي لا وجود له فنفيُه تصحيح.)\n• «أصغرها في عدد السكان» (f4): **أخصب خطأ في الصفحة** — الكتاب يجمع الأكبر مساحةً والأكثر سكاناً في جملة واحدة، فقلب أحد الطرفين مغرٍ.\n• «الثانية في عدد السكان» (f4): من طرف السكان نفسه لا من حقيقة أخرى — خطأ ترتيب لا خطأ محور، فلا يكشف نفسه بسؤال آخر.\n• «ثاني أصغر القارات بعد أوروبا» (f5): ينسب «الأصغر» إلى أوروبا — وهي صغيرة فعلاً في ذهن الطفلة، والخطأ في الترتيب لا في الجنس.\n• «دولة لا قارة» (f5): عدّها دولة — اسمها اسم دولة أيضاً.\n• «أستراليا» (f6): نسبة «غير مأهولة» إليها بدل القطبية الجنوبية — قِلّة سكانها تُلبِس.\n• «أمريكا الجنوبية» (f6): تشترك مع الصحيح في كلمة «الجنوبية» وحدها.\n• «أفريقيا» و«أوروبا» (f7): أقرب قارتين إلى الكويت في ذهن الطفلة. **24 سبتمبر:** أُضيف سؤال «أكبر القارات مساحةً» من f4a (فُصلت عن f4: المساحة والسكان معلومتان في الجملة نفسها ص ٢٢) — مشتّتاه اسما قارتين من f3 لا «أمريكا الشمالية» لأنها جواب السؤال الثالث فتكشف نفسها. وزوج «سبع قارات» من f2. ورقم الصفحة لكل بند (`page`).","note_facts":"منقول من صفحتَي ٢٢–٢٣ (صفحتا الملف ٢٣–٢٤). **تحويلان مُقرَّان من المؤسّس:** (١) الكتاب يسرد المعلومة حواراً على لسان أمين المكتبة، ونُقلت جملاً خبرية لأن سطر الخيار لا يسع حواراً — المعنى كما هو والصياغة تغيّرت. (٢) نصّ الـPDF يخرج مشوّه الإملاء («األرضية» و«أسرتاليا» و«اوروبا» و«أوربا» في الصفحة نفسها)، فأُعيدت الحروف إلى صورتها الصحيحة. وسبع حقائق لا ستّ: الصفحتان تحملان سبعاً موثّقة، ولكل هدف من الخمسة حقيقة — و`f7` وحدها تخدم «موقع وطني الكويت».","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (٤–١٦ محرفاً) لأن بطاقة المطابقة أضيق من سطر الخيار.","note_objectives":"الأهداف الخمسة من «ماذا سنتعلم» ص ٢٢، وصيغها المختصرة ١٢–٢٧ محرفاً (الحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان ٢٢–٢٣ تذكران أكبر القارات (آسيا) وأصغرها (أستراليا) ولا ترتّبان السبع بينهما، ولا يرد في الدرس تاريخ ولا مراحل. فترتيب القارات بالمساحة أو بالسكان تأليفٌ من خارج الكتاب — تُرك فارغاً عمداً.","note_categories":"تصنيف واحد: القارات السبع كما عدّها الحوار ص ٢٢ ومفتاح الخريطة ص ٢٣، ومقابلها المحيطات الخمسة المكتوبة بأسمائها على شكل (٤) في الصفحة نفسها — الفرق بينهما هو التعريف المقرّر: القارة يابسة يحيط بها الماء. **صيغة النداء من عندنا** وكل عنصر وسببه من الكتاب. ولم يُكتب تصنيف «مأهولة / غير مأهولة» لأن الكتاب ينصّ على أن القطبية الجنوبية غير مأهولة ولا ينصّ على سكّان القارات الستّ الأخرى — فنسبته إليها استنتاج لا نقل.","revision":{"at":"2026-09-24","by":"Claude Fable 5.1","what":"رُفع من 13 إلى 15 بنداً: 8 أسئلة · 6 أزواج · تصنيف — ورقم الصفحة لكل بند","review":"بانتظار مراجعة معلّمة المادة — لم يُوسَم «مراجَع» بعد"}},"KW-SOC-G5-LOC-03":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-03","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الخليج العربية","grade":5,"subject":"SOC","pages":[24,25],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٤–٢٥ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-03-01","text":"موقع دول الخليج العربية بالنسبة للخليج العربي","short":"موقع دول الخليج العربية"},{"code":"KW-SOC-G5-LOC-03-02","text":"موقع وطني الكويت بالنسبة لشبه الجزيرة العربية","short":"موقع الكويت من شبه الجزيرة"},{"code":"KW-SOC-G5-LOC-03-03","text":"سبب تسمية دول الخليج العربية بهذا الاسم","short":"سبب تسمية دول الخليج"}],"facts":[{"id":"f1","tag":"مفهوم","text":"يقع وطني الكويت ودول الخليج العربية على مسطح مائي اسمه الخليج العربي","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤"},{"id":"f2","tag":"مفهوم","text":"سُمّيت دول الخليج العربية بهذا الاسم لأنها تقع على الخليج العربي","obj":"KW-SOC-G5-LOC-03-0 ],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f1","page":24},{"q":"في أي جهة يقع وطني الكويت بالنسبة للخليج العربي؟","options":["الجنوب الغربي","الشمال الغربي","الجنوب الشرقي"],"answer":1,"obj":"KW-SOC-G5-LOC-03-01","from":"f3","page":24},{"q":"أين يقع وطني الكويت بالنسبة لشبه الجزيرة؟","options":["الجنوب الشرقي","الجنوب الغربي","الشمال الشرقي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-02","from":"f4","page":24},{"q":"أيّ هذه من دول الخليج العربية؟","options":["سلطنة عُمان","شبه الجزيرة العربية","الوطن العربي"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f5","page":24},{"q":"لماذا سُمّيت دول الخليج العربية بهذا الاسم؟","options":["لأنها تقع على خليج عُمان","لأنها تقع في شبه الجزيرة","لأنها تقع على الخليج العربي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-03","from":"f2","page":24},{"q":"ما المسطحان المائيان على خريطة دول الخليج العربية؟","options":["الخليج العربي وخليج عُمان","الخليج العربي والبحر الأحمر","خليج عُمان والبحر الأحمر"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f6","page":24},{"q":"في نشاط خطّ سير العربة، ما أول دولة بعد الكويت؟","options":["المملكة العربية السعودية","مملكة البحرين","دولة قطر"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f7","page":25},{"q":"كم عدد دول الخليج العربية على خريطة الدرس؟","options":["ستّ دول","خمس دول","سبع دول"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f8","page":24}],"sequences":[],"categories":[{"label":"امسك دول الخليج العربية وحدها","items":[{"t":"دولة الكويت","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"المملكة العربية السعودية","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"مملكة البحرين","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"دولة قطر","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"دولة الإمارات","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"سلطنة عُمان","in":true,"why":"إحدى دول الخليج العربية على شكل (٦)"},{"t":"الخليج العربي","in":false,"why":"مسطح مائي على الخريطة نفسها لا دولة — والدول تقع عليه"},{"t":"خليج عُمان","in":false,"why":"مسطح مائي على الخريطة نفسها لا دولة"}],"obj":"KW-SOC-G5-LOC-03-01","from":"f5","source":"موثّق · ص ٢٤ شكل (٦) وخريطة النشاط الأول ص ٢٥","page":24}],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «خليج عُمان» (f1): المسطح الآخر المكتوب على الخريطة نفسها — أقرب خطأ ممكن.\n• «الخليج الشمالي» (f1): **اسم مركّب لا وجود له** — الطفلة تعرف «الخليج» و«الشمال» من الدرس فتركّبهما؛ نفيُه تصحيح لا تعليمُ خطأ.\n• «الجنوب الغربي» و«الجنوب الشرقي» (f3 وf4): قلبُ طرف واحد من الجهة المركّبة — أخصب خطأ في الصفحة لأن الدرس يجمع جهتين مركّبتين متشابهتين في سطرين متتاليين.\n• «خليج عُمان» (f5): الخلط بين المسطح والدولة — الاسم نفسه يتكرّر في «سلطنة عُمان».\n• «شبه الجزيرة العربية» (f5): الخلط بين الإقليم والدولة.\n• «لأنها تقع على خليج عُمان» و«لأنها تقع في شبه الجزيرة» (f2): سببان من مفردات الدرس نفسه، وكلاهما يصف موقعاً حقيقياً لكنه ليس سبب التسمية. **24 سبتمبر:** ثلاثة أسئلة أُضيفت بطلب المؤسّس (15 بنداً بالصيغ الثلاث): المسطحان على الخريطة من f6 ص ٢٤ (مشتّتاه يبدّلان أحد المسطحين بالبحر الأحمر)، أول دولة في خطّ سير العربة من f7 ص ٢٥ (النشاط الأول)، وعدد دول الخليج على الخريطة من f8 — **عدٌّ من الخريطة لا نصٌّ في الكتاب**، فتؤكّده المعلّمة المراجعة أو يُحذف. ورقم الصفحة لكل بند (`page`). وبُدّل مشتّت «خليج عُمان» في السؤالين الأول والرابع (صار «خليج الكويت» و«الوطن العربي» — من مفردات الدرس والوحدة) لأنه صار محورَ جواب السؤال السادس فيكشف نفسه (حارس القاعدة ٥).","note_facts":"ستّ حقائق من صفحتَي الدرس: أربع من نصّ «الموضوع» ص ٢٤، وواحدة من أسماء الدول على شكل (٦) وخريطة النشاط الأول ص ٢٥، وواحدة من اسمَي المسطحين على شكل (٦). **والاسم كما كُتب في الكتاب**: «مملكة البحرين» على شكل (٦) و«البحرين» على خريطة ص ٢٥ — أُخذت الصيغة الأولى.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير لأن بطاقة المطابقة أضيق من سطر الخيار. **24 سبتمبر:** زوج سادس من f2 (سبب التسمية).","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٤ بصيغها المختصرة (٢٠–٢٦ محرفاً، والحدّ ٣٤).","note_sequences":"**وجدتُ تسلسلاً واحداً ولم أكتبه:** النشاط الأول ص ٢٥ يرقّم خطّ سير العربة من الكويت (١ الكويت ← ٢ السعودية ← ٣ البحرين ← ٤ قطر ← ٥ الإمارات ← ٦ عُمان). تسلسلٌ واحد يعطي المحرّك جولةً واحدة، وجولةٌ واحدة تُجلس فريقين متفرّجين (القرار ٣٣)، فتُرك الحقل فارغاً حتى يأتي في الوحدة ما يكمل ثلاثة. ولا ترتيب زمنيّ في الدرس أصلاً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «دول الخليج العربية الست مقابل المسطحين المائيين على الخريطة» — ستة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، والصفحتان لا تحملان غيره: شكل (٥) صندوقٌ بثمانية أسهم بلا أسماء جهات مكتوبة، فلا يصحّ منه تصنيف «أصلية/فرعية». **24 سبتمبر — كُتب:** بطلب المؤسّس (الصيغة الثالثة لكل درس) دخل تصنيف «دول الخليج العربية الست مقابل المسطحين المائيين» من شكل (٦) ص ٢٤ وخريطة ص ٢٥. ويبقى حدّ «امسك الصحيح» ثلاثة تصنيفات (القرار ٣٣) فلا يفتح المحرّك وحده، كما في الدرسين قبله.","revision":{"at":"2026-09-24","by":"Claude Fable 5.1","what":"رُفع من 10 إلى 15 بنداً: 8 أسئلة · 6 أزواج · تصنيف — ورقم الصفحة لكل بند","review":"بانتظار مراجعة معلّمة المادة — لم يُوسَم «مراجَع» بعد"}},"KW-SOC-G5-LOC-04":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-04","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الوطن العربي","grade":5,"subject":"SOC","pages":[26,27],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٦–٢٧ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-04-01","text":"تعريف الوطن العربي","short":"تعريف الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-02","text":"مفهوم المضيق","short":"مفهوم المضيق"},{"code":"KW-SOC-G5-LOC-04-03","text":"موقع وطني الكويت بالنسبة للوطن العربي","short":"موقع الكويت من الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-04","text":"السمات المشتركة بين دول الوطن العربي","short":"السمات المشتركة بين دوله"}],"facts":[{"id":"f1","tag":"مفهوم","text":"الوطن العربي: مجموعة من الدول تجمعها سمات مشتركة مثل الدين الإسلامي واللغة العربية والتراث والتاريخ","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f2","tag":"مفهوم","text":"المضيق: ممر مائي ضيق من الماء يفصل بين مسطحين مائيين","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f3","tag":"اسم","text":"الوطن العربي يقع في وسط العالم ويمتد بين قارتي آسيا وأفريقيا","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f4","tag":"اسم","text":"يفصل بين دول القارتين مسطح مائي هو البحر الأحمر","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f5","tag":"رقم","text":"عدد دول الوطن العربي ٢٢ دولة","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f6","tag":"اسم","text":"يقع وطني الكويت في الجهة الشرقية من الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","source":"موثّق · ص ٢٦"},{"id":"f7","tag":"مفهوم","text":"يطل الوطن العربي على العديد من المسطحات المائية","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f8","tag":"مفهوم","text":"الوطن العربي يشرف على العديد من المضائق المائية جعلت له أهمية كبيرة في الملاحة والتجارة العالمية","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f9","tag":"اسم","text":"تحمل خريطة الوطن العربي ثلاثة مضائق مائية هي مضيق جبل طارق ومضيق هرمز ومضيق باب المندب، وقناة مائية هي قناة السويس","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"id":"f10","tag":"اسم","text":"مسطحات مكتوبة على خريطة الوطن العربي: البحر المتوسط والبحر الأحمر والمحيط الأطلسي والمحيط الهندي وبحر العرب وخليج عدن","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f11","tag":"اسم","text":"دول مكتوبة على خريطة الوطن العربي: المغرب والجزائر وتونس وليبيا ومصر والسودان وموريتانيا والصومال والسعودية واليمن وعمان والعراق وسوريا، ومعها خارج لون الوطن العربي أسبانيا وإيران","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f12","tag":"مفهوم","text":"نشاط ص ٢٧: البحر الذي يفصل بين الجناح الأفريقي والجناح الآسيوي من الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٧ — النشاط الثالث"}],"pairs":[{"a":"المضيق","b":"ممر مائي ضيق بين مسطحين","obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"a":"البحر الأحمر","b":"يفصل بين دول القارتين","obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"a":"وطني الكويت","b":"شرق الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"a":"٢٢ دولة","b":"عدد دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"a":"قناة السويس","b":"قناة مائية على الخريطة","obj":"KW-SOC-G5-LOC-04-02","from":"f9"},{"a":"اللغة العربية","b":"سمة تجمع دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-04","from":"f1"}],"questions":[{"q":"ما الوطن العربي؟","options":["مجموعة من الدول تجمعها سمات","مجموعة من القارات المتصلة","دولة واحدة كبيرة المساحة"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f1"},{"q":"ما المضيق؟","options":["ممر بري ضيق بين دولتين","ممر مائي ضيق من الماء","مسطح مائي واسع بين قارتين"],"answer":1,"obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"q":"بين أي قارتين يمتد الوطن العربي؟","options":["آسيا وأوروبا","أفريقيا وأوروبا","آسيا وأفريقيا"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f3"},{"q":"ما المسطح المائي الذي يفصل بين دول القارتين؟","options":["البحر الأحمر","البحر المتوسط","المحيط الهندي"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"q":"كم عدد دول الوطن العربي؟","options":["١٨ دولة","٢٦ دولة","٢٢ دولة"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"q":"في أي جهة يقع وطني الكويت من الوطن العربي؟","options":["الجهة الغربية","الجهة الشرقية","الجهة الشمالية"],"answer":1,"obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"q":"أيّ هذه قناة مائية لا مضيقاً؟","options":["مضيق هرمز","مضيق باب المندب","قناة السويس"],"answer":2,"obj":"KW-SOC-G5-LOC-04-02","from":"f9"}],"sequences":[],"categories":[{"label":"امسك المضائق والقنوات المائية وحدها","items":[{"t":"مضيق جبل طارق","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق هرمز","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق باب المندب","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"قناة السويس","in":true,"why":"قناة مائية على خريطة الدرس"},{"t":"البحر الأحمر","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"البحر المتوسط","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"المحيط الهندي","in":false,"why":"محيط لا ممر مائي ضيق"},{"t":"بحر العرب","in":false,"why":"بحر لا ممر مائي ضيق"}],"obj":"KW-SOC-G5-LOC-04-02","from":"f9","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"label":"امسك المسطحات المائية وحدها","items":[{"t":"البحر المتوسط","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"البحر الأحمر","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الأطلسي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الهندي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"بحر العرب","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"خليج عدن","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"السودان","in":false,"why":"دولة لا مسطح مائي"},{"t":"أسبانيا","in":false,"why":"دولة لا مسطح مائي"},{"t":"إيران","in":false,"why":"دولة لا مسطح مائي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f10","source":"موثّق · ص ٢٦ — شكل (٧)"},{"label":"امسك دول الوطن العربي وحدها","items":[{"t":"المغرب","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الجزائر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"تونس","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"ليبيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"مصر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السودان","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"موريتانيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الصومال","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السعودية","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"اليمن","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"العراق","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"سوريا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"أسبانيا","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"},{"t":"إيران","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f11","source":"موثّق · ص ٢٦ — شكل (٧)"}],"places":[],"note_questions":"سبعة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «مجموعة من القارات المتصلة» و«دولة واحدة كبيرة المساحة» (f1): الخلط بين تجمّع دول وبين قارة أو دولة واحدة — وهو الخلط الذي يسبق مفهوم «الوطن العربي» عند الطفلة.\n• «ممر بري ضيق بين دولتين» (f2): يبدّل الماء بالبرّ ويبقي «الممر الضيق» — أقرب خطأ إلى التعريف.\n• «مسطح مائي واسع بين قارتين» (f2): يقلب الضيق سعةً، وهو وصف البحر لا المضيق.\n• «آسيا وأوروبا» و«أفريقيا وأوروبا» (f3): قارة صحيحة مع أخرى من خارج الامتداد — نصفُ الجواب صحيح فيغري.\n• «البحر المتوسط» و«المحيط الهندي» (f4): مسطحان مكتوبان على الخريطة نفسها ويلامسان الوطن العربي، لكنهما لا يفصلان بين جناحيه.\n• «١٨ دولة» و«٢٦ دولة» (f5): على بُعد ١٨٪ من الصحيح صعوداً وهبوطاً، وليسا من مضاعفات العشرة فلا يُستبعدان بالشكل.\n• «الجهة الغربية» و«الجهة الشمالية» (f6): الجهات الثلاث الأخرى من الرباعية نفسها.\n• «مضيق هرمز» و«مضيق باب المندب» (f9): مضيقان حقيقيان على الخريطة، والسؤال يسأل عن القناة — فنفيُهما تصحيحٌ لا تعليمُ خطأ.","note_facts":"اثنتا عشرة حقيقة: ثمانٍ من نصّ الدرس وفقاعاته ص ٢٦، وثلاث من أسماء شكل (٧) ومفتاحه — المضائق والقناة، والمسطحات، والدول. ونصّ الكتاب يكتب «أوربا» في درس لاحق و«أسبانيا» على هذه الخريطة، وأُبقيت الصيغتان كما طُبعتا. وحقيقةٌ من نشاط ص ٢٧ تسمّي جناحَي الوطن العربي: الأفريقي والآسيوي.","note_pairs":"ستة أزواج من ستّ حقائق، والوجه الأول اسمٌ قصير (٦–١٣ محرفاً).","note_objectives":"الأهداف الأربعة من «ماذا سنتعلم» ص ٢٦ (١٢–٢٧ محرفاً في صيغها المختصرة، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان لا تحملان ترتيباً زمنياً ولا مرحلياً: الخريطة تسمّي ولا ترتّب، والنشاطان تلوينٌ وتحويط. وترتيب المضائق من الغرب إلى الشرق قراءةٌ منّي للخريطة لا نصٌّ في الكتاب، فلم يُكتب.","note_categories":"ثلاثة تصنيفات، كلّها من شكل (٧) ومفتاحه في الصفحة نفسها: المضائق والقناة (٤ داخل الفئة و٤ خارجها) · المسطحات المائية (٦ و٣) · دول الوطن العربي (١٢ واثنتان خارج اللون). صيغة النداء من عندنا، وكل عنصر وسببه من الخريطة. وأسماء الدول المأخوذة هي المكتوبة بخطّ ظاهر على الخريطة؛ والأسماء الصغيرة جداً (لبنان، فلسطين، الأردن، جيبوتي، جزر القمر ودول الخليج) لم تُنقل لأن قراءتها من الصورة غير مؤكّدة."},"KW-SOC-G5-LOC-05":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-05","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول العالم الإسلامي","grade":5,"subject":"SOC","pages":[28,29],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٨–٢٩ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-05-01","text":"تعريف العالم الإسلامي","short":"تعريف العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-02","text":"مميزات موقع العالم الإسلامي","short":"مميزات موقع العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-03","text":"موقع وطني الكويت بالنسبة للعالم الإسلامي","short":"موقع الكويت من العالم الإسلامي"}],"facts":[{"id":"f1","tag":"مفهوم","text":"العالم الإسلامي: مجموعة من الدول يكون فيها عدد المسلمين ٥٠٪ فأكثر من مجموع السكان","obj":"KW-SOC-G5-LOC-05-01","source":"موثّق · ص ٢٨"},{"id":"f2","tag":"مفهوم","text":"يشغل العالم الإسلامي مساحة واسعة شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f3","tag":"مفهوم","text":"يحتل العالم الإسلامي موقعاً متوسطاً بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f4","tag":"اسم","text":"يمتد العالم الإسلامي في أربع قارات هي آسيا وأفريقيا وأوربا وأمريكا الجنوبية","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f5","tag":"اسم","text":"يقع وطني الكويت في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","source":"موثّق · ص ٢٨"},{"id":"f6","tag":"اسم","text":"خريطة العالم الإسلامي شكل (٨) مكتوب عليها القارات: آسيا وأفريقيا وأستراليا وأمريكا الشمالية وأمريكا الجنوبية، والمحيطات الخمسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨ — شكل (٨)"}],"pairs":[{"a":"العالم الإسلامي","b":"نصف السكان مسلمون فأكثر","obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"a":"أربع قارات","b":"آسيا وأفريقيا وأوربا وأمريكا","obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"a":"وطني الكويت","b":"في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","from":"f5"},{"a":"موقع متوسط","b":"بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"a":"مساحة واسعة","b":"شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","from":"f2"}],"questions":[{"q":"ما نسبة المسلمين في دول العالم الإسلامي؟","options":["٤٠٪ فأكثر","٥٠٪ فأكثر","٦٥٪ فأكثر"],"answer":1,"obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"q":"ما مساحة العالم الإسلامي من اليابسة؟","options":["مساحة واسعة شبه متصلة","مساحة صغيرة متفرقة","مساحة متقطعة بين البحار"],"answer":0,"obj":"KW-SOC-G5-LOC-05-02","from":"f2"},{"q":"ما موقع العالم الإسلامي بين قارات العالم؟","options":["موقعاً طرفياً بعيداً","موقعاً في قارة واحدة","موقعاً متوسطاً"],"answer":2,"obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"q":"في كم قارة يمتد العالم الإسلامي؟","options":["ثلاث قارات","أربع قارات","خمس قارات"],"answer":1,"obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"q":"أين يقع وطني الكويت من العالم الإسلامي؟","options":["في شمال العالم الإسلامي","في غرب العالم الإسلامي","في وسط العالم الإسلامي"],"answer":2,"obj":"KW-SOC-G5-LOC-05-03","from":"f5"}],"sequences":[],"categories":[],"places":[],"note_questions":"خمسة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «٤٠٪ فأكثر» و«٦٥٪ فأكثر» (f1): على بُعد ٢٠٪ و٣٠٪ من الصحيح — قريبان فلا يُستبعدان بالشكل، والنسبة هي بيت القصيد في التعريف.\n• «مساحة صغيرة متفرقة» و«مساحة متقطعة بين البحار» (f2): يقلبان «الواسعة شبه المتصلة» إلى ضدّها — وهو تصوّر شائع عند طفلة ترى الدول مبعثرة على الخريطة.\n• «موقعاً طرفياً بعيداً» و«موقعاً في قارة واحدة» (f3): الأول يقلب «المتوسط»، والثاني يخلط الموقع المتوسط بالانحصار في قارة — وهو الخطأ الذي يسبق الفكرة.\n• «ثلاث قارات» و«خمس قارات» (f4): العددان المجاوران للصحيح صعوداً وهبوطاً (٢٥٪ لكلٍّ).\n• «في شمال العالم الإسلامي» و«في غرب العالم الإسلامي» (f5): جهتان بدل «الوسط» — والكويت تقع شمال الخليج في الدرس الثالث، فالخلط بين الموقعين وارد.","note_facts":"ستّ حقائق: خمس من نصّ الدرس ص ٢٨، وواحدة من أسماء شكل (٨). ونصّ الكتاب يكتب «أوربا» في هذا الدرس و«أوروبا» في غيره — نُقلت كما طُبعت هنا.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (١٠–١٥ محرفاً).","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٨ (٢١–٣٠ محرفاً، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** لا تاريخ ولا مراحل ولا ترتيب في الصفحتين؛ القارات الأربع تُذكر عدّاً لا ترتيباً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «القارات التي يمتد فيها العالم الإسلامي (آسيا · أفريقيا · أوربا · أمريكا الجنوبية) مقابل ما لم يُذكر منها على الخريطة (أستراليا · أمريكا الشمالية)» — أربعة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، ولا يحمل الدرس غيره: نشاط ص ٢٩ ثلاثة فراغات بلا أجوبة مطبوعة، وأشكال القارات فيه صُوَرٌ صمّاء بلا أسماء."}};

<script>
(function () {
  const C = {};

  C.MAP = {
    quiz:     { needs: 'questions',  min: 4, round: 4, tags: ['رقم', 'اسم', 'مفهوم'], name: 'سباق المعرفة' },
    match:    { needs: 'pairs',      min: 4, round: 5, tags: ['زوج', 'مفهوم'],        name: 'مطابقة وذاكرة',
                lead: 'طابق المفهوم بتعريفه' },    
    timeline: { needs: 'sequences',  min: 1, minItems: 4, round: 4, tags: ['تسلسل'],  name: 'ترتيب' },
     
    catch:    { needs: 'categories', min: 1, minItems: 6, minGroups: 3, round: 6, tags: ['فئة'], name: 'امسك الصحيح' },
    map:      { needs: 'places',     min: 4, round: 4, tags: ['خريطة'], name: 'خريطة بلادي', blocked: true },
  };

  C.PLACE_KINDS = ['region', 'point'];
  C.GEO_KEY = /^[a-z][a-z0-9]*:[^\s:/]+\/[^\s:]+$/;    

  C.supply = (lesson, engineId) => {
    const r = C.MAP[engineId]; if (!r || !lesson) return 0;
    const arr = lesson[r.needs] || [];
    if (r.minItems) {                        
      const inner = arr.map(x => (x.order || x.items || []).length);
      return inner.length ? Math.max.apply(null, inner) : 0;
    }
    return arr.length;
  };

  C.eligible = (lesson, engineId) => {
    const r = C.MAP[engineId];
    if (!r) return { ok: false, why: 'محرّك غير معروف' };
    if (r.blocked) return { ok: false, why: 'المحرّك موقوف' };
    const n = C.supply(lesson, engineId);
    const need = r.minItems || r.min;
    if (n < need) return { ok: false, why: `يحتاج ${need} على الأقل، والدرس فيه ${n}` , have: n, need };
     
    if (r.minGroups) {
      const g = (lesson[r.needs] || []).length;
      if (g < r.minGroups)
        return { ok: false, why: `يحتاج ${r.minGroups} مجموعات على الأقل (جولة لكل فريق)، والدرس فيه ${g}`, have: n, need };
    }
    return { ok: true, have: n, need, rounds: Math.ceil(n / r.round) };
  };

  C.enginesFor = lesson => Object.keys(C.MAP)
    .map(id => Object.assign({ id, name: C.MAP[id].name }, C.eligible(lesson, id)))
    .filter(x => x.ok);

  C.rejectedFor = lesson => Object.keys(C.MAP)
    .map(id => Object.assign({ id, name: C.MAP[id].name }, C.eligible(lesson, id)))
    .filter(x => !x.ok);

  C.rounds = (lesson, engineId) => {
    const r = C.MAP[engineId]; if (!r) return [];
    const arr = (lesson[r.needs] || []).slice();
    if (r.minItems) return arr.map(x => [x]);         
    const out = [];
    for (let i = 0; i < arr.length; i += r.round) out.push(arr.slice(i, i + r.round));
    return out;
  };

  C.fairCount = (n, teams) => (teams > 0 ? Math.floor(n / teams) * teams : n);
  C.fairPlan = (n, teams) => {
    const play = C.fairCount(n, teams);
    return { play, perTeam: teams > 0 ? play / teams : play, left: n - play };
  };

  C.OPTION_MAX = 32;
   
  C.OBJ_SHORT_MAX = 34;

  const WORDNUM = { 'صفر': 0, 'واحد': 1, 'واحدة': 1, 'اثنان': 2, 'اثنين': 2, 'اثنتان': 2, 'ثلاث': 3, 'ثلاثة': 3,
    'أربع': 4, 'أربعة': 4, 'خمس': 5, 'خمسة': 5, 'ست': 6, 'ستة': 6, 'سبع': 7, 'سبعة': 7,
    'ثمان': 8, 'ثماني': 8, 'ثمانية': 8, 'تسع': 9, 'تسعة': 9, 'عشر': 10, 'عشرة': 10 };
  const digits = t => {
    const s0 = String(t).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const m = s0.match(/\d+(\.\d+)?/); if (m) return m;
    const w = String(t == null ? '' : t).replace(/[\u064B-\u0652]/g, '').trim().split(/[^\u0621-\u064A]+/)
      .map(x => x.replace(/^ال/, '')).find(x => WORDNUM[x] !== undefined);
    return w === undefined ? null : [String(WORDNUM[w])];
  };
  const norm = t => String(t == null ? '' : t).replace(/[\u064B-\u0652]/g, '').replace(/[٪%]/g, '').trim();
  const STOP = ['على', 'من', 'في', 'التي', 'الذي', 'هذا', 'هذه', 'أو', 'ما'];
  const words = t => norm(t).split(/[^\u0621-\u064A]+/).filter(w => w.length >= 3 && STOP.indexOf(w) < 0)
    .map(w => w.replace(/^ال/, ''));
   
  const shares = (a, vocabWords) => words(a).some(w => vocabWords.some(v => v.startsWith(w.slice(0, 3)) || w.startsWith(v.slice(0, 3))));

  C.OUTSIDE_TRUE = ['أكبر جزيرة في العالم'];

  C.ANTONYMS = [['أكبر', 'أصغر'], ['أكبر', 'أقل'], ['أكثر', 'أقل'], ['أكثر', 'أصغر'],
                ['كبير', 'صغير'], ['أطول', 'أقصر']];

  C.questionIssues = lesson => {
    const out = [];
    const facts = {}; (lesson.facts || []).forEach(f => { facts[f.id] = f; });
     
    const vocab = words([
      ...(lesson.facts || []).map(f => f.text),
      ...(lesson.pairs || []).flatMap(p => [p.a, p.b]),
      ...(lesson.sequences || []).flatMap(s => s.order || []),
    ].join(' · '));

    const seen = {};
    (lesson.questions || []).forEach((q, i) => {
      const at = `سؤال ${i + 1}`;
      if (!q.from) { out.push({ i, why: `${at}: بلا حقيقة مصدر (from)` }); return; }
      if (!facts[q.from]) { out.push({ i, why: `${at}: يشير إلى حقيقة غير موجودة (${q.from})` }); return; }
      if (seen[q.from] !== undefined) out.push({ i, why: `${at}: الحقيقة ${q.from} لها سؤال آخر (${seen[q.from] + 1})` });
      else seen[q.from] = i;

      const opts = q.options || [], right = opts[q.answer];
      opts.forEach((o, k) => {
        const len = String(o).length;
        if (len > C.OPTION_MAX)
          out.push({ i, why: `${at}: الخيار ${k + 1} طوله ${len} محرفاً والحدّ ${C.OPTION_MAX} — يلتفّ فيفيض عن الشاشة` });
      });
      const factText = norm(facts[q.from].text);
      if (right == null) { out.push({ i, why: `${at}: بلا جواب` }); return; }
       
      if (factText.indexOf(norm(right)) < 0)
        out.push({ i, why: `${at}: الجواب «${right}» ليس في نصّ حقيقته ${q.from} — فالسؤال لا يقيس الدرس` });
       
      const others = (lesson.questions || []).filter((_, j) => j !== i)
        .map(x => norm((x.q || '') + ' ' + ((x.options || [])[x.answer] || '')));
      (q.options || []).forEach((o, k) => {
        if (k === q.answer) return;
        if (words(o).length < 2) return;
        if (others.some(h => h.indexOf(norm(o)) >= 0))
          out.push({ i, why: `${at}: المشتّت «${o}» محورُ سؤال آخر — يكشف نفسه` });
      });

      const stemW = words(q.q || '');
      const hasStem = (list, w) => list.some(v => v.startsWith(w) || w.startsWith(v));
      opts.forEach((o, k) => {
        if (k === q.answer) return;
        const on = norm(o);
        const hit = C.OUTSIDE_TRUE.find(ph => on.indexOf(norm(ph)) >= 0);
        if (hit) out.push({ i, why: `${at}: المشتّت «${o}» عبارة صحيحة خارج الدرس — نفيها يعلّم خطأ` });
        const ow = words(o);
        for (const [a, b] of C.ANTONYMS) {
          const clash = (hasStem(stemW, a) && hasStem(ow, b)) || (hasStem(stemW, b) && hasStem(ow, a));
          if (!clash) continue;
           
          const shared = ow.some(w => w.startsWith(a.slice(0, 3)) || w.startsWith(b.slice(0, 3)) ? false
            : stemW.some(v => v.startsWith(w.slice(0, 3)) || w.startsWith(v.slice(0, 3))));
          if (shared) out.push({ i, why: `${at}: المشتّت «${o}» يناقض نصّ السؤال — يُستبعد بلا معرفة` });
        }
      });
      opts.forEach((o, k) => {
        if (k === q.answer) return;
        if (digits(o)) return;                  
         
        if (!shares(o, vocab))
          out.push({ i, why: `${at}: المشتّت «${o}» لا يشترك في كلمة واحدة مع مفردات الدرس — يُستبعد بمعرفة عامة` });
      });
       
      const rn = digits(right);
      if (rn) {
        const R = +rn[0];
        opts.forEach((o, k) => {
          if (k === q.answer) return;
          const dn = digits(o); if (!dn) return;
          const D = +dn[0], rel = Math.abs(D - R) / (R || 1);
          if (rel < 0.05 || rel > 0.40)
            out.push({ i, why: `${at}: المشتّت ${D} مسافته ${Math.round(rel * 100)}% من ${R} — المدى 5–40%` });
          if (R % 10 !== 0 && D % 10 === 0)
            out.push({ i, why: `${at}: المشتّت ${D} من مضاعفات العشرة والجواب ${R} ليس كذلك — يُستبعد بالشكل` });
        });
      }
    });
    return out;
  };

  C.objectiveIssues = lesson => {
    const out = [];
    (lesson.objectives || []).forEach((o, i) => {
      if (!o.short) out.push({ i, why: `الهدف ${o.code || i + 1}: بلا صيغة قصيرة (short)` });
      else if (o.short.length > C.OBJ_SHORT_MAX)
        out.push({ i, why: `الهدف ${o.code}: الصيغة القصيرة ${o.short.length} محرفاً والحدّ ${C.OBJ_SHORT_MAX}` });
    });
    return out;
  };

  C.POS_RUN_MAX = 2;

  C.rng = function (seed) {
    let a = (seed >>> 0);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  C.seedOf = function (str) {
    let h = 2166136261 >>> 0;
    const x = String(str || '');
    for (let i = 0; i < x.length; i++) { h ^= x.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  };

  C.shuffle = function (arr, rnd) {
    const a = (arr || []).slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };

  C.positionsOk = function (pos) {
    pos = pos || [];
    if (pos.length < 2) return true;
    let run = 1;
    for (let i = 1; i < pos.length; i++) {
      run = (pos[i] === pos[i - 1]) ? run + 1 : 1;
      if (run > C.POS_RUN_MAX) return false;
    }
    const count = {};
    pos.forEach(p => { count[p] = (count[p] || 0) + 1; });
    const half = Math.floor(pos.length / 2);
    return Object.keys(count).every(k => count[k] <= half);
  };

  C.orderQuestions = function (lesson, seed) {
    const qs = (lesson && lesson.questions) || [];
    const base = (seed === undefined || seed === null ? C.seedOf(lesson && lesson.lesson_id) : seed) >>> 0;
    let last = qs.slice();
    for (let attempt = 0; attempt < 400; attempt++) {
      const rnd = C.rng((base + attempt * 0x9E3779B1) >>> 0);
      last = qs.map(q => {
        const perm = C.shuffle((q.options || []).map((_, i) => i), rnd);
        return Object.assign({}, q, {
          options: perm.map(i => q.options[i]),
          answer: perm.indexOf(q.answer),
        });
      });
      if (C.positionsOk(last.map(q => q.answer))) return last;
    }
    return last;    
  };

  C.TEACHER_SOURCE = 'teacher';
  C.isCurriculum = q => !q || q.source !== C.TEACHER_SOURCE;

  C.objectivesOf = items => [...new Set((items || []).map(x => x && x.obj).filter(Boolean))];

  (typeof window !== 'undefined' ? window : globalThis).SHIFT =
    (typeof window !== 'undefined' ? window : globalThis).SHIFT || {};
  (typeof window !== 'undefined' ? window : globalThis).SHIFT.contract = C;
  if (typeof module !== 'undefined' && module.exports) module.exports = C;
})();

</script>
<script>
(function () {
  const KEY = 'shift.session.v1';
  const LAST = 'shift.session.last.v1';

  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
    catch (e) { console.warn('SHIFT: تعذّرت قراءة الحالة —', e && e.message); return null; }
  }

  function write(s) {
    try {
      localStorage.setItem(KEY, JSON.stringify(s));
       
      const back = JSON.parse(localStorage.getItem(KEY) || 'null');
      return !!back && back.at === s.at;
    } catch (e) { console.warn('SHIFT: تعذّر حفظ الحالة —', e && e.message); return false; }
  }

  function Store() {
    const self = { state: read() };
    self.open = init => { self.state = Object.assign({ at: Date.now() }, init || {}); write(self.state); return self.state; };
    self.patch = fields => {
      self.state = Object.assign({}, self.state || {}, fields, { at: Date.now() });
      return write(self.state);
    };
    self.clear = () => { try { localStorage.removeItem(KEY); } catch (e) {} self.state = null; };
     
    self.keepLast = s => { try { localStorage.setItem(LAST, JSON.stringify(s || {})); } catch (e) {} };
    self.last = () => { try { return JSON.parse(localStorage.getItem(LAST) || 'null'); } catch (e) { return null; } };
    return self;
  }

  const PICK = 'shift.lesson.v1';
  Store.pick = id => {
    try { localStorage.setItem(PICK, String(id || '')); return true; }
    catch (e) { console.warn('SHIFT: تعذّر حفظ اختيار الدرس —', e && e.message); return false; }
  };
  Store.picked = () => { try { return localStorage.getItem(PICK) || ''; } catch (e) { return ''; } };

  const BANK = 'shift.play.v1';
  Store.pickBank = (id, engine) => {
    try {
      if (!id) { localStorage.removeItem(BANK); return true; }
      localStorage.setItem(BANK, JSON.stringify({ id: String(id), engine: String(engine || 'quiz') }));
      const back = JSON.parse(localStorage.getItem(BANK) || 'null');
      return !!back && back.id === String(id);
    } catch (e) { console.warn('SHIFT: تعذّر حفظ اختيار المسابقة —', e && e.message); return false; }
  };
  Store.pickedBank = () => {
    try { const v = JSON.parse(localStorage.getItem(BANK) || 'null'); return (v && v.id) ? v : null; }
    catch (e) { console.warn('SHIFT: تعذّرت قراءة اختيار المسابقة —', e && e.message); return null; }
  };
  Store.clearBank = () => { try { localStorage.removeItem(BANK); return true; } catch (e) { return false; } };

  const G = (typeof window !== 'undefined' ? window : globalThis);
  G.SHIFT = G.SHIFT || {}; G.SHIFT.Store = Store;
  if (typeof module !== 'undefined' && module.exports) module.exports = Store;
})();

</script>
<script>
(function () {
  const G = (typeof window !== 'undefined' ? window : globalThis);
  const H = {};

  H.ROUTES = { hub: 'index.html', play: 'play.html', report: 'report.html' };
  H.go = name => { G.location.href = H.ROUTES[name] || H.ROUTES.hub; };
  H.back = () => { if (G.history && G.history.length > 1) G.history.back(); else H.go('hub'); };

  H.param = k => { try { return new URLSearchParams(G.location.search).get(k); } catch (e) { return null; } };

  H.print = () => { try { G.print(); return true; } catch (e) { console.warn('SHIFT: تعذّرت الطباعة —', e && e.message); return false; } };

  H.share = async (text, title) => {
    try { if (G.navigator && G.navigator.share) { await G.navigator.share({ text, title: title || 'SHIFT' }); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    try { await G.navigator.clipboard.writeText(text); return 'copied'; }
    catch (e) { console.warn('SHIFT: تعذّر النسخ —', e && e.message); return 'manual'; }
  };

  G.SHIFT = G.SHIFT || {}; G.SHIFT.host = H;
})();

          <li><b>النتيجة</b> — شاشة تُقرأ في عشر ثوانٍ، ومنها «احفظ التقرير».</li>
        </ol>
        <p><b>إن تعطّل شيء:</b> أعد فتح الصفحة — تعود من آخر موضع بنقاطها. كل ضغطة تُحفظ على
        الجهاز فور وقوعها. ولا تفتحها في نافذة خفيّة، ولا على جهاز آخر.</p>
        <p><b>بلا إنترنت:</b> بعد فتح الصفحة تعمل الحصة كاملةً بلا شبكة.</p>
      </details>
    </section>`;

  document.getElementById('go').innerHTML = goHtml;
  el.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => {
    const id = b.dataset.lesson;
    if (LIVE && LIVE.lesson !== id) {
      if (!confirm('فتح درس آخر؟ تُحفظ نتيجة الحصة الجارية للتقرير.')) return;
      store.keepLast(store.state); store.clear();
    }
    SHIFT.Store.pick(id);
    location.href = 'play.html';
  });
  const fresh = document.getElementById('fresh');
  if (fresh) fresh.onclick = () => {
    if (!confirm('بدء حصّة جديدة؟ تُحفظ نتيجة الحصة الجارية للتقرير.')) return;
    store.keepLast(store.state); store.clear();
    location.href = 'play.html';
  };
})();
</script>
