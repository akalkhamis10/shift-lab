      '.rc-q{font-size:clamp(16px,1.6em,34px)}' +
      '.rc .gw-opt{font-size:clamp(16px,1.15em,34px)}' +
       
      '@media (min-width:900px) and (min-height:560px){' +
      '.rc .gw-opts{flex-direction:row;width:min(46em,100%)}' +
      '.rc .gw-opt{flex:1 1 0;min-width:0;justify-content:center;text-align:center}}' +
      '.rc-track{min-height:5em}' +
      '.rc-run{transition:transform .38s ease}' +
       
      '@media (max-height:560px) and (min-width:660px){' +
      '.rc{flex-direction:row;align-items:stretch;gap:.6em}' +
      '.rc-track{flex:1 1 46%}' +
      '.rc-ask{flex:1 1 54%;width:auto;justify-content:center}}' +
      '@media (prefers-reduced-motion:reduce){.rc-run{transition:none}}';
    document.head.appendChild(st);
  }

  S.games.define({
    kind: 'سرعة',
     
    keys: { verb: 'اختيار', relation: 'فرق ضد فرق', second: 'مطاردة', form: 'سؤال بخيارات' },
    id: 'race',
    name: 'السباق',
    line: 'كل فريق عدّاء على مساره، والإجابة الصحيحة تقدّمه خطوة.',
    mins: [8, 12],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'المتأخّر يأخذ خطوة مجانية كل جولتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="10" width="108" height="58" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="14" y="19" width="92" height="12" rx="6" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<rect x="14" y="34" width="92" height="12" rx="6" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<rect x="14" y="49" width="92" height="12" rx="6" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<rect x="20" y="19" width="6" height="42" fill="var(--sea-ink)"/>' +
        '<rect x="26" y="19" width="6" height="7" fill="var(--sea-white)"/>' +
        '<rect x="26" y="33" width="6" height="7" fill="var(--sea-white)"/>' +
        '<rect x="26" y="47" width="6" height="7" fill="var(--sea-white)"/>' +
        '<circle cx="92" cy="25" r="5" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<circle cx="80" cy="40" r="5" fill="var(--sea-t2)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<circle cx="62" cy="55" r="5" fill="var(--sea-t3)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '</svg>';
    },

    mount(el, api) {
      css();

      const N = api.teams.length;
      const H = PAD * 2 + N * LANE;
      const pos = api.teams.map(() => 0);    
      const hot = api.teams.map(() => 0);    
      const timers = [];

      let i = 0, locked = false, turns = 0, freeNow = false;

      const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
      const xAt = p => +(X0 - p * DX).toFixed(2);
      const laneTop = k => PAD + k * LANE + 1;    

      function dist(x) {
        if (x === 1) return 'خطوة واحدة';
        if (x === 2) return 'خطوتان';
        return api.AR(x) + ' خطوات';
      }

      function runner(color) {
        return '<path d="M-1.3 0 L0 -2.4 L1.3 0" fill="none" stroke="var(--sea-ink)" ' +
                 'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
                
               '<circle cx="1.4" cy="-7.9" r="2.4" fill="var(--sea-ink)"/>' +
               '<rect x="-1" y="-5.6" width="4.8" height="5" rx="2.4" fill="var(--sea-ink)"/>' +
               '<rect x="-2.4" y="-7.1" width="4.8" height="5" rx="2.4" fill="' + color + '" ' +
                 'stroke="var(--sea-ink)" stroke-width="1.6"/>' +
               '<circle cx="0" cy="-9.4" r="2.4" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="1.6"/>';
      }

      function track() {
        let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
                'aria-label="مضمار السباق: لكل فريق مسار، وخطّ النهاية إلى اليسار">';
         
        for (let k = 0; k < N; k++) {
          const y = laneTop(k), cy = y + 7;
          s += '<rect x="6" y="' + y + '" width="108" height="14" rx="5" ' +
               'fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2"/>';
          for (let st = 1; st < GOAL; st++) {
            s += '<circle cx="' + xAt(st) + '" cy="' + cy + '" r="0.9" fill="var(--sea-sand)"/>';
          }
          s += '<circle cx="118" cy="' + cy + '" r="4" fill="' + api.esc(api.teams[k].color) +
               '" stroke="var(--sea-ink)" stroke-width="2"/>';
        }
         
        for (let c = 0; c < 2; c++) {
          for (let r = 0; r < N * 4; r++) {
            const f = (c + r) % 2 ? 'var(--sea-white)' : 'var(--sea-ink)';
            s += '<rect x="' + (12 + c * 4) + '" y="' + (PAD + r * 4) + '" width="4" height="4" fill="' + f + '"/>';
          }
        }
        s += '<rect x="12" y="' + PAD + '" width="8" height="' + (N * LANE) + '" fill="none" ' +
             'stroke="var(--sea-ink)" stroke-width="1.6"/>';
         
        for (let k = 0; k < N; k++) {
          s += '<g class="rc-run" data-r="' + k + '" style="transform:translate(' + xAt(0) +
               'px,' + (laneTop(k) + 13) + 'px)">' + runner(api.esc(api.teams[k].color)) + '</g>';
        }
        return s + '</svg>';
      }

      el.innerHTML =
        '<div class="rc">' +
          '<div class="rc-track" id="rcTrack">' + track() + '</div>' +
          '<div class="rc-ask">' +
            '<div class="rc-tags" id="rcTags"></div>' +
            '<h2 class="gw-q rc-q" id="rcQ"></h2>' +
            '<div class="gw-opts" id="rcOpts"></div>' +
          '</div>' +
        '</div>';

      const $ = s => el.querySelector(s);
      const elTags = $('#rcTags'), elQ = $('#rcQ'), elOpts = $('#rcOpts');
      const runs = [];
      el.querySelectorAll('[data-r]').forEach(g => { runs[+g.dataset.r] = g; });

      function place(k) {
        const g = runs[k]; if (!g) return;
        g.style.transform = 'translate(' + xAt(pos[k]) + 'px,' + (laneTop(k) + 13) + 'px)';
      }

      function bump(k, n) {
        const add = Math.min(GOAL, pos[k] + n) - pos[k];
        if (add <= 0) return;
        pos[k] += add;
        api.score(k, add);
        place(k);
      }

      function behind(k) {
        const lo = Math.min.apply(null, pos);
        const hi = Math.max.apply(null, pos);
        return pos[k] === lo && hi > lo;
      }

      function tags() {
        const cur = api.turn();
        const rem = GOAL - Math.max.apply(null, pos.concat([0]));
        let h = '';
        if (freeNow) h += '<p class="gw-tag">خطوة مجانية للفريق المتأخّر</p>';
        if (hot[cur] >= 2) {
          h += '<p class="gw-tag">سرعة مضاعفة — خطوتان لفريق ' + api.esc(api.teams[cur].name) + '</p>';
        }
        if (rem > 0 && rem <= 4) {
          h += '<p class="gw-sub">المتصدّر على بُعد ' + dist(rem) + ' من خطّ النهاية</p>';
        }
        elTags.innerHTML = h;
      }

      function draw() {
        const q = api.qs[i];
        if (!q) return api.finish();
        api.step(i, api.qs.length);
        elQ.innerHTML = api.esc(q.q);
        elOpts.innerHTML = q.a.map((t, k) =>
          '<button class="gw-opt" type="button" data-k="' + k + '">' +
            '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(t) + '</span>' +
          '</button>').join('');
        elOpts.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function begin() {
        turns++;
        freeNow = false;
        const cur = api.turn();
        const round = Math.ceil(turns / N);
        if (round % 2 === 0 && pos[cur] < GOAL && behind(cur)) {
          freeNow = true;
          bump(cur, 1);
          api.sfx('pop');
        }
         
        tags();
        if (pos[cur] >= GOAL) return win(cur);
        draw();
      }

      function choose(k) {
        if (locked) return;
        locked = true;
        const q = api.qs[i], cur = api.turn(), ok = k === q.c;
        const n = hot[cur] >= 2 ? 2 : 1;
        elOpts.querySelectorAll('.gw-opt').forEach((b, m) => {
          b.disabled = true;
          if (m === q.c) b.dataset.st = 'ok';
          else if (m === k) b.dataset.st = 'no';
        });
        if (ok) { hot[cur]++; bump(cur, n); } else { hot[cur] = 0; }
        api.judge(ok, { text: ok ? (n > 1 ? 'صحيح — خطوتان' : 'صحيح') : 'خطأ' });
        later(() => {
          locked = false; i++;
          if (pos[cur] >= GOAL) return win(cur);
          api.step(i, api.qs.length);
          if (i >= api.qs.length) return api.finish();
          api.nextTurn();
          begin();
        }, 1500);
      }

      function win(k) {
        locked = true;
        api.say('فريق ' + api.teams[k].name + ' بلغ خطّ النهاية', 'good');
        later(() => api.finish(), 950);
      }

      begin();

      return {
        destroy() {
          locked = true;
          timers.forEach(t => clearTimeout(t));
          timers.length = 0;
        },
      };
    },
  });
})();

  const geom = cols => {
    const rows = Math.ceil(CELLS / cols);
    return {
      cols: cols, rows: rows,
      vw: cols * CW + (cols - 1) * GAP + PAD * 2,
      vh: rows * CH + (rows - 1) * GAP + PAD * 2,
    };

        '<rect x="78" y="44" width="28" height="20" rx="5" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="46" y="44" width="28" height="20" rx="5" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +

        '<rect x="53" y="52" width="14" height="9" rx="2" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '</svg>';

    mount(el, api) {

      const T = [];

      for (let k = vals.length - 1; k > 0; k--) {
        const j = Math.floor(api.rnd() * (k + 1));
        const t = vals[k]; vals[k] = vals[j]; vals[j] = t;
      }
      const open = vals.map(() => false);

      let i = 0, phase = 'ask', hits = 0, dbl = false, locked = false, left = vals.length;
      let cols = COLS[0];                             

      function two() {
        const sc = api.teams.map(t => t.score || 0);
        const me = sc[api.turn()] || 0;
        const top = Math.max.apply(null, sc.concat([0]));
        const low = Math.min.apply(null, sc);
        return me === low && (top - me) >= 3;
      }

      function drawAsk() {
        const q = api.qs[i];
        if (!q) return end();
        api.step(i, api.qs.length);
        el.innerHTML = '<div class="tg-ask">' +
          (two() ? '<p class="gw-tag">الضربة المزدوجة — إجابتك الصحيحة تضرب مربّعين</p>' : '') +
          '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +

          else if (n === k) b.dataset.st = 'no';
        });
         
        api.judge(ok, { text: ok ? (big ? 'صحيح — لك ضربتان' : 'صحيح — لك ضربة') : 'خطأ — ينتقل الدور' });
        if (ok) {
          hits = big ? 2 : 1; dbl = big;
          wait(() => { locked = false; phase = 'dig'; drawDig(-1); }, 950);
        } else {
          wait(() => { locked = false; nextQ(); }, 1400);
        }
      }

      function head() {
        if (dbl) {
          const t = hits > 1 ? 'بقيت لك ضربتان' : hits === 1 ? 'بقيت لك ضربة واحدة' : 'انتهت ضربتاك';
          return '<p class="gw-tag">الضربة المزدوجة — ' + t + '</p>';
        }
        return '<p class="gw-head">' + (hits > 0 ? 'اختر مربّعاً واكشف ما تحته' : 'أحسنت — الدور للفريق التالي') + '</p>';
      }

      function shut(n) {
         
        return '<rect x="2" y="2" width="' + CW + '" height="' + CH + '" rx="7" fill="var(--sea-ink)"/>' +
          '<rect width="' + CW + '" height="' + CH + '" rx="7" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
          '<text x="' + (CW / 2) + '" y="' + (CH / 2 + 6.5) + '" text-anchor="middle" font-size="19" fill="var(--sea-closed-mark)">' +
          api.AR(n + 1) + '</text>';
      }

      function shown(v) {
        const bg = '<rect width="' + CW + '" height="' + CH + '" rx="7" fill="' +
          (v === 3 ? 'var(--sea-sun)' : 'var(--sea-white)') +
          '" stroke="var(--sea-ink)" stroke-width="2.5"/>';
         
        if (!v) {
          return bg +
            '<path d="M9 16 q6 -5 12 0 t12 0 t12 0" fill="none" stroke="var(--sea-closed-mark)" stroke-width="3.8" stroke-linecap="round"/>' +
            '<path d="M9 27 q6 -5 12 0 t12 0 t12 0" fill="none" stroke="var(--sea-closed-mark)" stroke-width="3.8" stroke-linecap="round"/>';
        }
         
        const big = v === 3;
        const lid = big
          ? '<rect x="4" y="7" width="27" height="8" rx="4" fill="var(--sea-coral)" stroke="var(--sea-ink)" stroke-width="2"/>'
          : '<rect x="8" y="10" width="22" height="7" rx="3.5" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2"/>';
        const body = big
          ? '<rect x="6" y="14" width="23" height="20" rx="3" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2"/>' +
            '<rect x="15" y="20" width="5" height="7" rx="1.5" fill="var(--sea-ink)"/>'
          : '<rect x="9.5" y="16" width="19" height="16" rx="3" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2"/>' +
            '<rect x="16.5" y="22" width="5" height="6" rx="1.5" fill="var(--sea-ink)"/>';
         
        return bg + lid + body +
          '<text x="44" y="' + (CH / 2 + 7.5) + '" text-anchor="middle" font-size="22" fill="var(--sea-ink)">' +
          api.AR(v) + '</text>';
      }

      function board(justOpened) {
        const g = geom(cols);
        let s = '<svg id="tgBoard" viewBox="0 0 ' + g.vw + ' ' + g.vh + '" preserveAspectRatio="xMidYMid meet"' +
          ' role="group" aria-label="شبكة الكنز">';
        for (let n = 0; n < CELLS; n++) {
          const x = PAD + (n % g.cols) * (CW + GAP);
          const y = PAD + Math.floor(n / g.cols) * (CH + GAP);
          s += '<g class="tg-cell' + (n === justOpened ? ' tg-new' : '') + '"' +
            ' data-n="' + n + '" data-open="' + (open[n] ? '1' : '0') + '"' +
            (open[n] ? '' : ' role="button" tabindex="0"') +
            ' aria-label="مربّع ' + api.AR(n + 1) + '"' +
            ' transform="translate(' + x + ',' + y + ')">' +
            (open[n] ? shown(vals[n]) : shut(n)) + '</g>';
        }
        return s + '</svg>';
      }

      function paint(justOpened) {
        el.innerHTML = head() + '<div class="gw-board">' + board(justOpened) + '</div>';
        el.querySelectorAll('.tg-cell[role="button"]').forEach(g => {
          g.onclick = () => hit(+g.dataset.n);
          g.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(+g.dataset.n); }
          };
        });
      }

      function drawDig(justOpened) {
        paint(justOpened);
        const box = el.querySelector('.gw-board');
        const r = box ? box.getBoundingClientRect() : null;
        if (!r || !r.width || !r.height) return;       
        const want = bestCols(r.width, r.height);
        if (want !== cols) { cols = want; paint(justOpened); }
      }

      function hit(n) {
        if (dead || locked || phase !== 'dig' || hits <= 0 || open[n]) return;
        const v = vals[n];
        open[n] = true; left--; hits--;
        if (v) api.score(api.turn(), v);
        api.sfx(v ? 'good' : 'soft');
        api.say(v === 3 ? 'صندوق كبير — ثلاث نقاط' : v === 1 ? 'صندوق صغير — نقطة' : 'رمل — لا نقاط', v ? 'good' : '');
        drawDig(n);
        if (left <= 0) { locked = true; return wait(end, 1300); }
        if (hits > 0) return;                          
        locked = true;
        wait(() => { locked = false; dbl = false; nextQ(); }, 1100);
      }

      function nextQ() {
        i++; api.nextTurn();
        if (i >= api.qs.length || left <= 0) return end();
        phase = 'ask'; drawAsk();
      }

      function end() {
        api.step(Math.min(i, api.qs.length), api.qs.length);
        api.finish();
      }

      const onResize = () => { if (!dead && phase === 'dig') drawDig(-1); };
      const win = (typeof window !== 'undefined') ? window : null;
      if (win) win.addEventListener('resize', onResize);

      drawAsk();
      return {
        destroy() {
          dead = true; locked = true;
          T.forEach(clearTimeout); T.length = 0;
          if (win) win.removeEventListener('resize', onResize);
        },
      };
    },
  });
})();

<script>
(function () {
  const S = (typeof window !== 'undefined' ? window : globalThis).SHIFT;
  const KEY = ['أ', 'ب', 'ج', 'د'];

  S.games.define({
    kind: 'تعاون',
     
    keys: { verb: 'اختيار', relation: 'الفصل ضد الوقت', second: 'بناء', form: 'سؤال بخيارات' },
    id: 'towers',
    name: 'الأبراج',
    line: 'الفصل كلّه يبني برجاً واحداً — كل إجابة صحيحة قطعة.',
    mins: [8, 12],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'حين يتعذّر بلوغ البرج تصير كل إجابة قطعتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="4" y="8" width="112" height="64" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="20" y="64" width="80" height="7" rx="3.5" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="40" y="50" width="42" height="12" rx="3" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="44" y="36" width="34" height="12" rx="3" fill="var(--sea-t3)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="48" y="22" width="26" height="12" rx="3" fill="var(--sea-t2)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M46 22 L61 8 L76 22 Z" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="3" stroke-linejoin="round"/>' +
        '</svg>';
    },

    mount(el, api) {
       
      const GOAL = Math.max(1, Math.min(12, api.qs.length));

      const UNIT = GOAL >= 11 ? 'قطعة' : 'قطع';

      const built = [];             
      const timers = [];            
      let i = 0, locked = false, boost = false;

      const after = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

      style();

      const headText = () => 'البرج ' + api.AR(built.length) + ' من ' + api.AR(GOAL) + ' ' + UNIT;

      function rescue() {
        const left = api.qs.length - i;
        return (GOAL - built.length) > left;
      }

      function svg() {
        const span = Math.max(1, GOAL - 1);
        const H = 156 / GOAL, BASE = 186;
        let s = '<svg viewBox="0 0 60 200" aria-hidden="true" preserveAspectRatio="xMidYMid meet">';
        for (let k = 0; k < GOAL; k++) {
          const w = 40 - k * (16 / span);
          const x = 30 - w / 2;
          const y = BASE - (k + 1) * H;
          const h = H - 2;
          if (k < built.length) {
             
            s += '<rect x="' + (x + 2).toFixed(1) + '" y="' + (y + 2).toFixed(1) + '" width="' + w.toFixed(1) +
                 '" height="' + h.toFixed(1) + '" rx="2.5" fill="var(--sea-ink)"/>';
            s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) +
                 '" height="' + h.toFixed(1) + '" rx="2.5" fill="' + api.esc(built[k]) +
                 '" stroke="var(--sea-ink)" stroke-width="2.5"/>';
          } else {
            s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) +
                 '" height="' + h.toFixed(1) + '" rx="2.5" fill="none" stroke="var(--sea-sub)" ' +
                 'stroke-width="2.5" stroke-dasharray="5 4" opacity="0.6"/>';
          }
        }
        if (built.length >= GOAL) {
          const top = BASE - GOAL * H;
          s += '<path d="M15 ' + top.toFixed(1) + ' L30 ' + (top - 18).toFixed(1) + ' L45 ' + top.toFixed(1) +
               ' Z" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="3" stroke-linejoin="round"/>';
        }
        s += '<rect x="4" y="188" width="56" height="8" rx="4" fill="var(--sea-ink)"/>';
        s += '<rect x="2" y="186" width="56" height="8" rx="4" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>';
        return s + '</svg>';
      }

      function draw() {
        const q = api.qs[i];
        if (!q) return over();
        api.step(i, api.qs.length);
        boost = rescue();
        el.innerHTML =
          '<div class="tw-wrap">' +
            '<div class="tw-main">' +
              (boost ? '<p class="gw-tag">قطعة الإنقاذ — كل إجابة صحيحة قطعتان</p>' : '') +
              '<p class="gw-head">' + api.esc(headText()) + '</p>' +
              '<p class="gw-sub tw-sub">برج واحد للفصل كلّه — والخطأ لا يهدم.</p>' +
              '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
              '<div class="gw-opts">' + q.a.map((t, k) =>
                '<button class="gw-opt" type="button" data-k="' + k + '">' +
                  '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(t) + '</span>' +
                '</button>').join('') + '</div>' +
            '</div>' +
            '<div class="tw-side" id="twSide">' + svg() + '</div>' +
          '</div>';
        el.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function choose(k) {
        if (locked) return;
        locked = true;
        const q = api.qs[i], ok = k === q.c, gain = boost ? 2 : 1;
        let laid = 0;                 
        el.querySelectorAll('.gw-opt').forEach((b, n) => {
          b.disabled = true;
          if (n === q.c) b.dataset.st = 'ok';
          else if (n === k) b.dataset.st = 'no';
        });

        if (ok) {
          const t = api.teams[api.turn()];
          const color = (t && t.color) || 'var(--sea-t1)';
          const before = built.length;
          for (let n = 0; n < gain && built.length < GOAL; n++) built.push(color);
          laid = built.length - before;
           
          api.score(api.turn(), gain);
           
          const side = el.querySelector('#twSide');
          if (side) side.innerHTML = svg();
          const head = el.querySelector('.gw-head');
          if (head) head.textContent = headText();
          api.sfx('pop');
        }

        api.judge(ok, { text: ok ? (laid > 1 ? 'صحيح — قطعتان' : 'صحيح — قطعة') : 'فاتت القطعة' });

        if (ok && built.length >= GOAL) {
          api.step(api.qs.length, api.qs.length);
          after(() => api.say('اكتمل البرج', 'good'), 800);
          after(() => api.finish(), 2000);
          return;
        }

        after(() => {
          locked = false; i++; api.nextTurn();
          if (i >= api.qs.length) over(); else draw();
        }, 1500);
      }

      function over() {
        locked = true;
        api.step(api.qs.length, api.qs.length);
        api.say('بلغتم ' + api.AR(built.length) + ' من ' + api.AR(GOAL) + ' ' + UNIT);    
        after(() => api.finish(), 1600);
      }

      function style() {
        if (document.getElementById('css-towers')) return;
        const s = document.createElement('style');
        s.id = 'css-towers';
        s.textContent = [
           
          '.tw-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;' +
            'gap:.45em;width:100%;flex:1 1 auto;min-height:0}',
           
          '.tw-side{flex:1 1 0;min-height:2.5em;width:100%;min-width:0;' +
            'display:flex;align-items:center;justify-content:center}',
          '.tw-side svg{width:100%;height:100%;max-height:100%;display:block}',
          '.tw-main{flex:0 0 auto;width:100%;min-width:0;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:.4em}',
          '.tw-main .gw-q,.tw-main .gw-opts{width:min(26em,100%)}',
           
          '@media (min-width:660px){.tw-wrap{flex-direction:row;align-items:stretch;gap:.6em}',
          '.tw-side{flex:0 1 clamp(3em,14%,6em);width:auto;align-self:stretch}',
          '.tw-main{flex:1 1 auto;min-height:0}}',
           
          '@media (max-height:560px){.tw-sub{display:none}',
          '.tw-main{gap:.3em}',
          '.tw-main .gw-head{font-size:clamp(14px,1.05em,32px)}',
          '.tw-main .gw-q{font-size:clamp(16px,1.25em,36px)}',
          '.tw-main .gw-opts{flex-direction:row;flex-wrap:wrap;gap:.3em}',
          '.tw-main .gw-opt{flex:1 1 calc(50% - .3em);min-height:44px;padding:.25em .6em}}',
        ].join('\n');
        document.head.appendChild(s);
      }

      draw();
      return {
        destroy() {
          locked = true;
          timers.forEach(clearTimeout);
          timers.length = 0;
        },
      };
    },
  });
})();

</script>

      '.cn-log{width:min(34em,100%);display:flex;flex-direction:column;gap:.3em}' +
      '.cn-row{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}' +
      '.cn-row>b{font-family:var(--sea-display);font-weight:800;' +
      'font-size:clamp(14px,.95em,28px);min-width:5.5em}' +
      '.cn-b{font:inherit;font-size:clamp(13px,.85em,26px);font-weight:700;cursor:pointer;' +
      'min-height:44px;padding:0 .7em;border:2px solid var(--sea-ink);border-radius:999px;' +
      'background:var(--sea-white);color:var(--sea-ink)}' +
      '.cn-b[data-on="1"]{background:var(--sea-sun);font-weight:800}' +

  S.games.define({
    kind: 'حركة',
     
    keys: { verb: 'حركة جسد', relation: 'فرق ضد فرق', second: 'بناء', form: 'سؤال بخيارات' },
    id: 'corners',
    name: 'أركان الفصل',
    line: 'كل ركن إجابة — الفريق يمشي إليه، وأنت تسجّل بلمسة.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
     
    need: { min: 3, max: 4 },
    minQ: 5,
    comeback: 'المتأخّر بثلاث نقاط تصير وقفته الصحيحة بنقطتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="8" width="108" height="64" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="14" y="16" width="38" height="22" rx="5" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="68" y="16" width="38" height="22" rx="5" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="14" y="44" width="38" height="22" rx="5" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="68" y="44" width="38" height="22" rx="5" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<circle cx="33" cy="27" r="4.5" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<circle cx="87" cy="55" r="4.5" fill="var(--sea-t3)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '</svg>';
    },

    mount(el, api) {
      const T = api.teams, N = T.length;
      const names = (api.theme && api.theme.corners) ? api.theme.corners(4) : ['الأول', 'الثاني', 'الثالث', 'الرابع'];
      let i = 0, locked = false, gone = false;
      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };
       
      const flags = [], owner = [];
       
      let stood = [];

      function bonusFor(t) {
        const top = Math.max.apply(null, T.map(x => x.score || 0).concat([0]));
        return (top - (T[t].score || 0)) >= 3 ? 2 : 1;
      }
      const anyBonus = () => T.some((_, t) => bonusFor(t) > 1);

      function cornerCount() { return Math.min(names.length, (api.qs[i] || { a: [] }).a.length); }

      function mapHtml(reveal) {
        const q = api.qs[i] || { a: [] };
        const n = cornerCount();
         
        let s = '<div class="cn-map" style="--cn-n:' + (n === 4 ? 2 : n) + '">';
        for (let c = 0; c < n; c++) {
          const own = owner[c];
          const st = reveal && c === q.c ? ' data-st="ok"' : '';
          s += '<div class="cn-c"' + (own != null ? ' data-own="1"' : '') + st + '>' +
            '<b>' + api.esc(names[c]) + '</b>' +
             
            '<i>' + api.esc(q.a[c] || '') + '</i>' +
            '<span class="cn-f">' + T.map((t, k) => {
              const nf = (flags[c] && flags[c][k]) || 0;
              let out = '';
              for (let z = 0; z < nf; z++) out += '<s style="background:' + t.color + '"></s>';
              return out;
            }).join('') + '</span>' +
            (own != null ? '<i>ركن ' + api.esc(T[own].name) + '</i>' : '') +
            '</div>';
        }
        return s + '</div>';
      }

      function draw() {
        const q = api.qs[i];
        if (!q) return api.finish();
        api.step(i, api.qs.length);
        stood = T.map(() => -1);
        locked = false;
        el.innerHTML =
          (anyBonus() ? '<p class="gw-tag">ركن مضاعف للمتأخّر — وقفته الصحيحة بنقطتين</p>' : '') +
          '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
          mapHtml(false) +
          '<div class="cn-log gw-mine">' + T.map((t, k) =>
            '<div class="cn-row"><b style="color:' + t.color + '">' + api.esc(t.name) + '</b>' +
            names.slice(0, cornerCount()).map((nm, c) =>
              '<button class="cn-b" type="button" data-t="' + k + '" data-c="' + c + '">' + api.esc(nm) + '</button>').join('') +
            '</div>').join('') + '</div>' +
          '<p class="gw-sub">نادِ الأركان بأسمائها، ثم سجّل أين وقف كل فريق.</p>';
        el.querySelectorAll('[data-t]').forEach(b => { b.onclick = () => log(+b.dataset.t, +b.dataset.c); });
      }

      function log(t, c) {
        if (locked) return;
        stood[t] = c;
        el.querySelectorAll('[data-t="' + t + '"]').forEach(b => {
          if (+b.dataset.c === c) b.dataset.on = '1'; else b.removeAttribute('data-on');
        });
        api.sfx('pop');
        if (stood.every(x => x >= 0)) wait(300, reveal);
      }

      function reveal() {
        if (locked) return;
        locked = true;
        const q = api.qs[i];
        let any = false;
        const built = [];
        T.forEach((t, k) => {
          const ok = stood[k] === q.c;
          if (!ok) return;
          any = true;
          api.score(k, bonusFor(k));
          flags[q.c] = flags[q.c] || [];
          flags[q.c][k] = (flags[q.c][k] || 0) + 1;
           
          if (owner[q.c] == null && flags[q.c][k] >= BUILD) { owner[q.c] = k; api.score(k, BONUS); built.push(t.name); }
        });
        el.querySelectorAll('[data-t]').forEach(b => {
          const t = +b.dataset.t, c = +b.dataset.c;
          b.disabled = true;
          if (stood[t] !== c) return;
          b.dataset.st = (c === q.c) ? 'ok' : 'no';
        });
        const map = el.querySelector('.cn-map');
        if (map) map.outerHTML = mapHtml(true);
        api.judge(any, {
          text: built.length ? 'بُني ركن ' + built[0] : (any ? 'الركن الصحيح: ' + names[q.c] : 'لا فريق في الركن الصحيح'),
        });
        wait(1900, () => {
          i++;
          if (i >= api.qs.length) { api.step(api.qs.length, api.qs.length); return api.finish(); }
          draw();
        });
      }

      draw();
      return { destroy() { gone = true; locked = true; timers.forEach(clearTimeout); timers.length = 0; } };
    },
  });
})();

      api.teams[TEACH].name = 'المعلّم';

      const cards = S.forms.judge(api.qs, api.rnd() * 1e9 | 0);
      const fig = (api.theme && api.theme.figure) ? api.theme.figure('teacher', 'main', { size: 'lg' }) : null;
      let i = 0, locked = false, gone = false;
      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };

      const boost = () => ((api.teams[TEACH].score || 0) - (api.teams[CLASS].score || 0)) >= 3 ? 2 : 1;

      function draw() {
        const c = cards[i];
        if (!c) return api.finish();
        api.step(i, cards.length);
        locked = false;
        const pts = boost();
        el.innerHTML =
          '<div class="dl">' +
            (pts > 1 ? '<p class="gw-tag">بطاقة الفصل — بنقطتين</p>' : '') +

          (fig ? '<div class="dl-who"><img alt="" src=' + JSON.stringify(fig) + '></div>' : '') +
          '</div>';
        el.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => judge(b.dataset.v === '1'); });
      }

      function judge(said) {
        if (locked) return;
        locked = true;
        const c = cards[i], ok = (said === c.ok), pts = boost();
        el.querySelectorAll('[data-v]').forEach(b => {
          b.disabled = true;
          const v = b.dataset.v === '1';
          if (v === c.ok) b.dataset.st = 'ok';
          else if (v === said) b.dataset.st = 'no';
        });
        if (ok) api.score(CLASS, pts); else api.score(TEACH, 1);
         
        const wrap = el.querySelector('.dl');
        if (wrap) wrap.dataset.r = ok ? 'lose' : 'win';
        api.judge(ok, {
          text: ok ? (pts > 1 ? 'أحسنتم — نقطتان للفصل' : 'أحسنتم — نقطة للفصل')
                   : 'الصحيح: ' + c.right + ' — نقطة للمعلّم',
        });
        wait(1800, () => {
          i++;
          if (i >= cards.length) { api.step(cards.length, cards.length); return api.finish(); }
          draw();
        });
      }

      draw();
      return { destroy() { gone = true; locked = true; timers.forEach(clearTimeout); timers.length = 0; } };
    },
  });
})();

(function () {

  const CW = 44, CH = 40, GAP = 6, PAD = 5, ROWS = 4;

  const SIDES_LAST = 2;

  function css() {

      '  flex:1 1 11em; min-width:0; min-height:44px; max-width:100%;',
      '  padding:.25em .8em; cursor:pointer; touch-action:none;',
      '  overflow-wrap:anywhere; background:var(--sea-white); color:var(--sea-ink);',
      '  border:var(--sea-bd) solid var(--sea-ink); border-radius:var(--sea-r);',
      '  box-shadow:0 4px 0 var(--sea-ink) }',
      '.fr-c[data-on="1"]{ background:var(--sea-sun) }',
      '.fr-c[data-st="ok"]{ background:var(--sea-t3); color:var(--sea-white) }',
      '.fr-c[data-st="no"]{ background:var(--sea-coral); color:var(--sea-white) }',
      '.fr-c[disabled]{ cursor:default }',
       
      '.fr-ghost{ position:fixed; left:0; top:0; z-index:60; pointer-events:none;',
      '  box-sizing:border-box; font-family:var(--sea-text); font-weight:700;',
      '  font-size:clamp(15px,2.4vw,30px); line-height:1.25; padding:.3em .8em;',
      '  max-width:60vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;',
      '  background:var(--sea-sun); color:var(--sea-ink);',
      '  border:var(--sea-bd) solid var(--sea-ink); border-radius:var(--sea-r);',
      '  box-shadow:var(--sea-shadow) }',
       
      '@media (max-height:520px) and (orientation:landscape){ .fr-c{ font-size:clamp(13px,.85em,22px) } }',
      '@media (prefers-reduced-motion:reduce){ .fr-h[data-new="1"]{ animation:none } }',
    ].join('\n');
    document.head.appendChild(s);
  }

  S.games.define({
    kind: 'تخطيط',
     
    keys: { verb: 'سحب وفرز', relation: 'فرق ضد فرق', second: 'أرض', form: 'أزواج' },
    id: 'freej',
    name: 'الفريج',
    line: 'اسحب الإجابة إلى بيت على الخريطة، والبيت المحاصر ينتقل إلى من حاصره.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'الأخير يحاصر بجهتين لا بثلاث',

    art() {
       
      const h = (x, y, f) =>
        '<g transform="translate(' + x + ',' + y + ')">' +
          '<rect x="3" y="10" width="20" height="13" rx="2" fill="' + f +
            '" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
          '<path d="M0 11 L13 2 L26 11 Z" fill="var(--sea-ink)"/>' +
        '</g>';
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="8" width="108" height="64" rx="10" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        h(14, 16, 'var(--sea-t1)') + h(47, 16, 'var(--sea-white)') + h(80, 16, 'var(--sea-t3)') +
        h(14, 45, 'var(--sea-white)') + h(47, 45, 'var(--sea-t1)') + h(80, 45, 'var(--sea-t1)') +
        '</svg>';
    },

    mount(el, api) {
      css();

      const T = api.teams;
      const AR = api.AR;

      const pairs = S.forms.pairs(api.qs, api.rnd() * 1e9 | 0);
       
      const COLS = pairs.length >= 12 ? 5 : 4;
      const HOUSES = COLS * ROWS;
      const VW = COLS * CW + (COLS - 1) * GAP + PAD * 2;
      const VH = ROWS * CH + (ROWS - 1) * GAP + PAD * 2;

      const ROUNDS = Math.min(pairs.length, HOUSES);

      const deck = [];
      for (let n = 0; n < ROUNDS; n++) {
        const right = pairs[n].a;
        const pool = [];
        for (let m = 1; m < pairs.length && pool.length < 8; m++) {
          const t = pairs[(n + m) % pairs.length].a;
          if (t !== right && pool.indexOf(t) < 0) pool.push(t);
        }
        const chips = [right];
        while (chips.length < 3 && pool.length) {
          chips.push(pool.splice(Math.floor(api.rnd() * pool.length), 1)[0]);
        }
         
        for (let k = chips.length - 1; k > 0; k--) {
          const j = Math.floor(api.rnd() * (k + 1));
          const t = chips[k]; chips[k] = chips[j]; chips[j] = t;
        }
        deck.push({ q: pairs[n].q, right: right, chips: chips });
      }

      const owner = [];                     
      let fresh = [];                       
      let i = 0, sel = -1, hot = -1, note = '';
      let locked = false, gone = false;
      let dragK = -1, moved = false, sx = 0, sy = 0, ghost = null;
      const timers = [];
      const wait = (ms, fn) => { timers.push(setTimeout(() => { if (!gone) fn(); }, ms)); };

      function nbrs(n) {
        const c = n % COLS, r = (n / COLS) | 0, out = [];
        if (c > 0) out.push(n - 1);
        if (c < COLS - 1) out.push(n + 1);
        if (r > 0) out.push(n - COLS);
        if (r < ROWS - 1) out.push(n + COLS);
        return out;
      }
      function houses(k) { let n = 0; for (let x = 0; x < HOUSES; x++) if (owner[x] === k) n++; return n; }

      function sides(k) {
        const c = T.map((_, x) => houses(x));
        const me = c[k], top = Math.max.apply(null, c), low = Math.min.apply(null, c);
        return (me === low && (top - me) >= BEHIND) ? SIDES_LAST : SIDES;
      }

      function siege(k, need) {
        const snap = owner.slice(), took = [];
        for (let n = 0; n < HOUSES; n++) {
          if (snap[n] == null || snap[n] === k) continue;
          let c = 0;
          nbrs(n).forEach(m => { if (snap[m] === k) c++; });
          if (c >= need) took.push(n);
        }
        took.forEach(n => { owner[n] = k; });
        return took;
      }

      function sync() {
        T.forEach((t, k) => {
          const d = houses(k) - (t.score || 0);
          if (d) api.score(k, d);
        });
      }

      function home(o) {
        const fill = o == null ? 'var(--sea-white)' : T[o].color;
        return '<rect class="fr-hit" width="' + CW + '" height="' + CH + '" fill="none"/>' +
           
          '<path d="M4 19 L22 5 L40 19 L40 37 L4 37 Z" transform="translate(2,2)" fill="var(--sea-ink)"/>' +
          '<rect x="8" y="19" width="28" height="18" rx="2.5" fill="' + fill +
            '" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
          '<path d="M3 20 L22 5 L41 20 Z" fill="var(--sea-ink)"/>' +
          '<rect x="17" y="26" width="10" height="11" rx="2" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2"/>' +
          '<rect class="fr-ring" x="1" y="2" width="' + (CW - 2) + '" height="' + (CH - 4) +
            '" rx="6" fill="none" stroke="var(--sea-sun)" stroke-width="3.2" stroke-dasharray="7 5"/>';
      }

      function map() {
        let s = '<svg class="fr-map" viewBox="0 0 ' + VW + ' ' + VH +
          '" preserveAspectRatio="xMidYMid meet" role="group" aria-label="خريطة الفريج">';
        for (let n = 0; n < HOUSES; n++) {
          const x = PAD + (n % COLS) * (CW + GAP);
          const y = PAD + ((n / COLS) | 0) * (CH + GAP);
          const o = owner[n];
          s += '<g class="fr-h" data-n="' + n + '" data-free="' + (o == null ? '1' : '0') + '"' +
            (fresh.indexOf(n) >= 0 ? ' data-new="1"' : '') +
            ' role="button" tabindex="0" aria-label="بيت ' + AR(n + 1) +
            (o == null ? ' خالٍ' : ' لفريق ' + api.esc(T[o].name)) + '"' +
            ' transform="translate(' + x + ',' + y + ')">' + home(o) + '</g>';
        }
        return s + '</svg>';
      }

      function tagHtml() {
        if (note) return '<p class="gw-tag">' + api.esc(note) + '</p>';
         
        if (sides(api.turn()) === SIDES_LAST) return '<p class="gw-tag">الفريق الأخير يحاصر بجهتين لا بثلاث</p>';
        return '';
      }

      function render() {
        const R = deck[i];
        el.innerHTML =
          '<div class="fr">' +
            '<div class="fr-tag">' + tagHtml() + '</div>' +
            '<h2 class="gw-q">' + api.esc(R.q) + '</h2>' +
            '<div class="gw-board">' + map() + '</div>' +
            '<div class="fr-ans">' + R.chips.map((t, k) =>
              '<button class="fr-c" type="button" data-k="' + k + '">' + api.esc(t) + '</button>').join('') +
            '</div>' +
             
            '<p class="gw-sub gw-mine">اسحب الإجابة إلى بيت خالٍ، أو المس الإجابة ثم المس البيت.</p>' +
          '</div>';
        bindChips();
        bindHouses();
      }

      function redrawMap() {
        const box = el.querySelector('.gw-board');
        if (!box) return;
        box.innerHTML = map();
        bindHouses();
      }
      function redrawTag() {
        const t = el.querySelector('.fr-tag');
        if (t) t.innerHTML = tagHtml();
      }

      function live(on) {
        const m = el.querySelector('.fr-map');
        if (!m) return;
        if (on) m.dataset.live = '1'; else m.removeAttribute('data-live');
      }
      function pick(k) {
        if (locked || sel === k) return;
        sel = k;
        el.querySelectorAll('.fr-c').forEach(b => {
          if (+b.dataset.k === k) b.dataset.on = '1'; else b.removeAttribute('data-on');
        });
        live(true);
        api.sfx('pop');
      }
      function setHot(n) {
        if (hot === n) return;
        const m = el.querySelector('.fr-map');
        if (!m) { hot = n; return; }
        const prev = m.querySelector('.fr-h[data-hot="1"]');
        if (prev) prev.removeAttribute('data-hot');
        hot = -1;
        if (n < 0) return;
        const g = m.querySelector('.fr-h[data-n="' + n + '"]');
        if (g && g.getAttribute('data-free') === '1') { g.dataset.hot = '1'; hot = n; }
      }
      function houseAt(x, y) {
        if (typeof document.elementFromPoint !== 'function') return -1;
        const t = document.elementFromPoint(x, y);
        const g = t && t.closest ? t.closest('.fr-h') : null;
        return g ? +g.getAttribute('data-n') : -1;
      }
      function ghostOn(text) {
        ghostOff();
        ghost = document.createElement('div');
        ghost.className = 'fr-ghost';
        ghost.textContent = text;
        document.body.appendChild(ghost);
      }
      function ghostAt(x, y) {
        if (ghost) ghost.style.transform =
          'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(-50%,-150%)';
      }
      function ghostOff() {
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
        ghost = null;
      }

      function onDown(e, k) {
        if (locked) return;
        pick(k);
        dragK = k; moved = false; sx = e.clientX; sy = e.clientY;
         
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      }
      function onMove(e) {
        if (dragK < 0) return;
        if (!moved) {
          if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 8) return;
          moved = true;
          ghostOn(deck[i].chips[dragK]);
        }
        ghostAt(e.clientX, e.clientY);
        setHot(houseAt(e.clientX, e.clientY));
      }
      function onUp(e) {
        if (dragK < 0) return;
        const k = dragK;
        dragK = -1;
        if (!moved) return;       
        moved = false;
        ghostOff();
        const h = houseAt(e.clientX, e.clientY);
        setHot(-1);
        if (h >= 0) drop(k, h);
      }
      function onCancel() {
        dragK = -1; moved = false; ghostOff(); setHot(-1);
      }

      function tapHouse(n) {
        if (locked) return;
        if (sel < 0) { api.say('المس الإجابة أولاً', 'bad'); return; }
        drop(sel, n);
      }

      function bindChips() {
        el.querySelectorAll('.fr-c').forEach(b => {
          const k = +b.dataset.k;
          b.onpointerdown = e => onDown(e, k);
          b.onclick = () => pick(k);
          b.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(k); }
          };
        });
      }
      function bindHouses() {
        el.querySelectorAll('.fr-h').forEach(g => {
          const n = +g.getAttribute('data-n');
          g.onclick = () => tapHouse(n);
          g.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapHouse(n); }
          };
        });
      }

      function drop(k, h) {
        if (locked) return;
         
        if (owner[h] != null) { api.say('اختر بيتاً خالياً', 'bad'); api.sfx('soft'); return; }
        locked = true;
        live(false);
        setHot(-1);

        const R = deck[i], t = api.turn(), ok = (R.chips[k] === R.right);
         
        const need = sides(t);
        el.querySelectorAll('.fr-c').forEach(b => {
          const n = +b.dataset.k;
          b.disabled = true;
          b.removeAttribute('data-on');
          if (R.chips[n] === R.right) b.dataset.st = 'ok';
          else if (n === k) b.dataset.st = 'no';
        });

        let took = [];
        fresh = [];
        if (ok) {
          owner[h] = t;
          fresh = [h];
          took = siege(t, need);
          fresh = fresh.concat(took);
          sync();
        }
        redrawMap();

        api.judge(ok, {
          text: ok
            ? (took.length ? 'حصار — ' + (took.length > 1 ? AR(took.length) + ' بيوت تنتقل' : 'بيت ينتقل')
                           : 'بيت لفريق ' + T[t].name)
            : 'الصحيح: ' + R.right,
        });
        if (took.length) {
          note = 'حاصر فريق ' + T[t].name + ' فأخذ ' +
            (took.length > 1 ? AR(took.length) + ' بيوت' : 'بيتاً');
          redrawTag();
          api.sfx('turn');
        }
        wait(1900, next);
      }

      function next() {
        i++;
        api.nextTurn();
        if (i >= ROUNDS) { api.step(ROUNDS, ROUNDS); return api.finish(); }
        draw();
      }

      function draw() {
        if (!deck[i]) return api.finish();
        api.step(i, ROUNDS);
         
        locked = false; sel = -1; hot = -1; note = ''; fresh = [];
        render();
      }

      function cleanup() {
        gone = true; locked = true;
        timers.forEach(clearTimeout); timers.length = 0;
        ghostOff();
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
      }

      window.addEventListener('pointermove', onMove, { passive: true });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
      api.onDestroy(cleanup);

      if (ROUNDS) draw(); else api.finish();
      return { destroy: cleanup };
    },
  });
})();

</script>
<script>

  const WAVE_MS = 9000;    
   
  const WY0 = -20, WY1 = 122;

      'font-size:calc(clamp(17px,1.3em,38px)*var(--wl-fit,1));line-height:1.3;overflow-wrap:anywhere}' +
      '.wl-a{margin:0;font-family:var(--sea-display);font-weight:800;text-align:center;' +
      'font-size:calc(clamp(18px,1.55em,46px)*var(--wl-fit,1));line-height:1.25;color:var(--sea-coral);' +
      'overflow-wrap:anywhere}' +
      '.wl-acts{display:flex;gap:.5em;width:100%}' +
      '.wl-acts .gw-opt{justify-content:center;text-align:center;' +
      'font-size:calc(1.15em*var(--wl-fit,1))}' +
       
      '.wl .gw-head{font-size:calc(clamp(16px,1.2em,36px)*var(--wl-fit,1))}' +
      '.wl .gw-tag{font-size:calc(.8em*var(--wl-fit,1))}' +
       
      '@media (min-width:640px){' +
      '.wl{flex-direction:row;align-items:center;gap:.6em}' +
      '.wl-board{flex:1 1 46%;width:auto;aspect-ratio:auto;align-self:stretch}' +
      '.wl-side{flex:1 1 54%;width:auto;max-width:30em}}' +
       
      '@media (max-width:639px) and (max-height:560px){' +
      '.wl-board{flex:1 1 0;aspect-ratio:auto;min-height:2.6em}}' +
       
      '@media (max-height:560px){' +
      '.wl-q{font-size:calc(clamp(15px,1.15em,32px)*var(--wl-fit,1))}' +
      '.wl-a{font-size:calc(clamp(16px,1.35em,38px)*var(--wl-fit,1))}' +
      '.wl-card{gap:.15em;padding:.35em .6em}' +
      '.wl-side{gap:.25em}.wl-top{gap:.3em}' +
      '.wl .gw-head{font-size:calc(clamp(13px,.92em,24px)*var(--wl-fit,1))}' +
       
      '.wl .gw-tag{font-size:calc(.66em*var(--wl-fit,1));padding:.28em .7em}' +
      '.wl-t{font-size:calc(1em*var(--wl-fit,1));min-width:1.7em;padding:.2em .3em}' +
      '.wl-board{flex:1 1 34%}.wl-side{flex:1 1 66%}}';
    document.head.appendChild(st);
  }

  S.games.define({
    kind: 'تعاون',
     
    keys: { verb: 'توقيت ضغطة', relation: 'الفصل ضد الوقت', second: 'بناء', form: 'بطاقة حكم' },
    id: 'wall2',
    name: 'السور',
    line: 'موجة تتقدّم نحو بوابة — والحكم الصحيح قبل وصولها يضع حارساً.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 8,
    comeback: 'عند ثلث الصحّة تضع كل بطاقة حارسين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="4" y="8" width="112" height="64" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<path d="M12 30 q8 -11 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 V40 H12 Z" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<rect x="12" y="46" width="96" height="6" rx="3" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="12" y="52" width="96" height="16" rx="4" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="18" y="56" width="24" height="12" rx="5" fill="var(--sea-t3)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="48" y="56" width="24" height="12" rx="5" fill="var(--sea-ink)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="78" y="56" width="24" height="12" rx="5" fill="var(--sea-ink)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<circle cx="60" cy="61" r="4" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '</svg>';
    },

    mount(el, api) {
       
      const cards = S.forms.judge(api.qs, api.rnd() * 1e9 | 0);
      const guards = [];
      for (let k = 0; k < GATES; k++) guards.push(0);

      let health = LIFE, i = 0, target = 0;
      let locked = false, gone = false, boost = false;
      let t0 = 0, tick = 0, lastSec = -1, waveX = '0';
      let waveEl = null, badgeEl = null;

      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };
       
      const stop = () => { if (tick) { clearInterval(tick); tick = 0; } };

      let fitRaf = 0;
      function fit() {
        const side = el.querySelector('.wl-side');
        if (!side || !el.clientHeight) return;
        side.style.setProperty('--wl-fit', '1');
         
        for (let k = 1; k > 0.56 && el.scrollHeight > el.clientHeight + 1;) {
          k -= 0.06;
          side.style.setProperty('--wl-fit', k.toFixed(2));
        }
      }
       
      const refit = () => { if (gone) return; cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); };
      addEventListener('resize', refit);
       
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit, () => {});

      const builtCount = () => guards.filter(g => g >= BUILD).length;
      const held = () => guards.reduce((a, b) => a + Math.min(b, BUILD), 0);

      const gateX = k => 25 + (GATES - 1 - k) * 88;

      function guardShape(cx) {
        return '<circle cx="' + cx.toFixed(1) + '" cy="182" r="5" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2"/>' +
          '<rect x="' + (cx - 5.5).toFixed(1) + '" y="187" width="11" height="15" rx="4" ' +
          'fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2"/>';
      }

      function board(p) {
        let s = '<svg viewBox="0 0 300 230" aria-hidden="true" preserveAspectRatio="xMidYMid meet">';
         
        s += '<rect x="6" y="154" width="288" height="9" rx="4" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>';
        s += '<rect x="13" y="165" width="280" height="40" rx="6" fill="var(--sea-ink)"/>';
        s += '<rect x="10" y="162" width="280" height="40" rx="6" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>';

        for (let k = 0; k < GATES; k++) {
          const x = gateX(k);
          const done = guards[k] >= BUILD;
           
          const hot = (k === target && !done && p !== null);
          s += '<rect x="' + (x + 3) + '" y="171" width="74" height="34" rx="10" fill="var(--sea-ink)"/>';
           
          s += '<rect x="' + x + '" y="168" width="74" height="34" rx="10" fill="' +
            (done ? 'var(--sea-t3)' : 'var(--sea-ink)') + '" stroke="' +
            (hot ? 'var(--sea-coral)' : 'var(--sea-ink)') + '" stroke-width="3"/>';
          const n = Math.min(guards[k], BUILD);
          for (let g = 0; g < n; g++) s += guardShape(x + 18.5 + g * 18.5);
          if (done) {
             
            s += '<rect x="' + (x + 35.5) + '" y="146" width="3" height="22" fill="var(--sea-ink)"/>';
            s += '<path d="M' + (x + 38) + ' 146 L' + (x + 59) + ' 152 L' + (x + 38) + ' 158 Z" ' +
              'fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>';
          }
        }

        for (let j = 0; j < LIFE; j++) {
          const x = 290 - 25 - j * 28.333;
          if (j < health) {
            s += '<rect x="' + x.toFixed(1) + '" y="208" width="25" height="12" rx="3" ' +
              'fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2"/>';
          } else {
            s += '<rect x="' + x.toFixed(1) + '" y="208" width="25" height="12" rx="3" fill="none" ' +
              'stroke="var(--sea-sub)" stroke-width="2" stroke-dasharray="4 3"/>';
          }
        }

        if (p !== null) {
          const ty = (WY0 + p * (WY1 - WY0)).toFixed(1);
          s += '<g id="wlWave" transform="translate(' + waveX + ',' + ty + ')">' +
            '<path d="' + WAVE_D + '" fill="var(--sea-ink)" transform="translate(3,3)"/>' +
            '<path d="' + WAVE_D + '" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
            '</g>';
        }
        return s + '</svg>';
      }

      const headText = () => 'صحّة السور ' + api.AR(health) + ' من ' + api.AR(LIFE) +
        ' — الحرّاس ' + api.AR(held()) + ' من ' + api.AR(GATES * BUILD);

      function draw() {
        const c = cards[i];
        if (!c) return over('نجا السور — الصحّة ' + api.AR(health) + ' من ' + api.AR(LIFE));
        api.step(i, cards.length);
        locked = false;
        boost = health <= THIRD;
         
        const open = [];
        for (let k = 0; k < GATES; k++) if (guards[k] < BUILD) open.push(k);
        target = open[Math.floor(api.rnd() * open.length) % open.length];
         
        waveX = (gateX(target) - 2).toFixed(1);

        el.innerHTML =
          '<div class="wl">' +
            '<div class="wl-board" id="wlBoard">' + board(0) + '</div>' +
            '<div class="wl-side">' +
              (boost ? '<p class="gw-tag">صحّة السور في الثلث — كل بطاقة تضع حارسين</p>' : '') +
              '<div class="wl-top">' +
                '<p class="gw-head">' + api.esc(headText()) + '</p>' +
                '<span class="wl-t" id="wlT">' + api.AR(Math.ceil(WAVE_MS / 1000)) + '</span>' +
              '</div>' +
              '<div class="wl-card">' +
                '<p class="wl-q">' + api.esc(c.q) + '</p>' +
                '<p class="wl-a">' + api.esc(c.shown) + '</p>' +
              '</div>' +
              '<div class="wl-acts">' +
                '<button class="gw-opt" type="button" data-v="1">صح</button>' +
                '<button class="gw-opt" type="button" data-v="0">خطأ</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        el.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => resolve(b.dataset.v === '1'); });
        waveEl = el.querySelector('#wlWave');
        badgeEl = el.querySelector('#wlT');
        fit();
        run();
      }

      function run() {
        stop();
        t0 = Date.now();
        lastSec = -1;
        tick = setInterval(() => {
          if (gone || locked) return;
          const ms = Date.now() - t0;
          const p = Math.min(1, ms / WAVE_MS);
          if (waveEl) waveEl.setAttribute('transform', 'translate(' + waveX + ',' + (WY0 + p * (WY1 - WY0)).toFixed(1) + ')');
          const sec = Math.max(0, Math.ceil((WAVE_MS - ms) / 1000));
          if (sec !== lastSec && badgeEl) {
            lastSec = sec;
            badgeEl.textContent = api.AR(sec);
            if (sec <= 3) badgeEl.dataset.near = '1'; else badgeEl.removeAttribute('data-near');
          }
          if (p >= 1) resolve(null);
        }, 50);
      }

      function resolve(said) {
        if (locked) return;
        locked = true;
        stop();
        const c = cards[i];
        const late = (said === null);
        const ok = !late && (said === c.ok);

        el.querySelectorAll('[data-v]').forEach(b => {
          b.disabled = true;
          const v = b.dataset.v === '1';
          if (v === c.ok) b.dataset.st = 'ok';
          else if (!late && v === said) b.dataset.st = 'no';
        });

        let text;
        if (ok) {
          const add = boost ? 2 : 1;
          const before = guards[target];
          guards[target] = Math.min(BUILD, before + add);
          const laid = guards[target] - before;
          api.score(api.turn(), 1);
          api.sfx('pop');
           
          text = guards[target] >= BUILD ? 'اكتملت البوابة'
            : (laid > 1 ? 'حارسان على البوابة' : 'حارس على البوابة');
        } else if (guards[target] > 0) {
           
          guards[target]--;
          text = 'صدّ الحارس الموجة — الصحيح: ' + c.right;
        } else {
          health = Math.max(0, health - 1);
          text = (late ? 'بلغت الموجة البوابة' : 'دخلت الموجة') + ' — الصحيح: ' + c.right;
        }

        const bd = el.querySelector('#wlBoard');
         
        if (bd) bd.innerHTML = board(ok ? null : 1);
        waveEl = null;
        const hd = el.querySelector('.gw-head');
        if (hd) hd.textContent = headText();

        api.judge(ok, { text: text });
        wait(1800, next);
      }

      function next() {
        if (health <= 0) return over('سقط السور — البوابات المبنيّة ' + api.AR(builtCount()) + ' من ' + api.AR(GATES));
         
        if (builtCount() >= GATES) return over('اكتمل السور — كل بوابة مبنيّة');
        i++;
        api.nextTurn();
        if (i >= cards.length) return over('نجا السور — الصحّة ' + api.AR(health) + ' من ' + api.AR(LIFE));
        draw();
      }

      function over(msg) {
        locked = true;
        stop();
        api.step(cards.length, cards.length);
        api.say(msg);
        wait(1700, () => api.finish());
      }

      draw();
      return {
        destroy() {
          gone = true; locked = true;
          stop();
          timers.forEach(clearTimeout);
          timers.length = 0;
          cancelAnimationFrame(fitRaf); fitRaf = 0;
          removeEventListener('resize', refit);
        },
      };
    },
  });
})();

</script>

      '.nk .gw-tag{font-size:.62em;padding:.26em .6em}' +
      '.nk .nk-q{font-size:clamp(14px,1.22em,28px);line-height:1.25}' +
       
      '.nk .gw-opts{flex-direction:row;flex-wrap:wrap;gap:.16em}' +
      '.nk .gw-opt{flex:1 1 46%;min-width:0;font-size:clamp(14px,1.02em,26px);padding:.2em .6em}' +
      '.nk-call{font-size:clamp(18px,1.55em,40px)}' +
      '.nk-act{font-size:clamp(15px,1.05em,28px)}' +
      '.nk .gw-sub{font-size:.7em}}' +
      '@media (prefers-reduced-motion:reduce){' +
      '.nk-boat,.nk-storm{transition:none}.nk-bob,.nk-bob-s{animation:none}}';
    document.head.appendChild(st);

  S.games.define({
    kind: 'حركة',
     
    keys: { verb: 'حركة جسد', relation: 'الفصل ضد الوقت', second: 'مطاردة', form: 'سؤال بخيارات' },
    id: 'nokhitha',
    name: 'نداء النوخذة',
    line: 'الفصل في مركب يهرب من عاصفة — والإجابة تدفعه، والنداء يدفعه أكثر.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'حين تقترب العاصفة يصير النداء بدفعتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="10" width="108" height="58" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="10" y="44" width="100" height="20" rx="6" fill="var(--sea-teal)"/>' +
        '<circle cx="86" cy="28" r="11" fill="var(--sea-sub)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<circle cx="97" cy="32" r="8" fill="var(--sea-sub)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M84 42 L81 50" stroke="var(--sea-sub)" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M94 43 L91 51" stroke="var(--sea-sub)" stroke-width="3" stroke-linecap="round"/>' +
        '<rect x="20" y="16" width="4" height="30" fill="var(--sea-ink)"/>' +
        '<path d="M26 17 L36 21 L26 25 Z" fill="var(--sea-coral)" stroke="var(--sea-ink)" stroke-width="2"/>' +
        '<path d="M56 20 L56 44 L40 44 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="M60 26 L60 44 L72 44 Z" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<rect x="56" y="18" width="3" height="28" fill="var(--sea-ink)"/>' +
        '<path d="M42 46 L76 46 L70 56 L48 56 Z" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '</svg>';
    },

    mount(el, api) {
      css();

      const N = api.qs.length;
       
      const GOAL = START + Math.max(8, Math.round(N * 1.6));
      const DX = (X0 - X1) / GOAL;

      const CALLS = (api.theme && api.theme.calls) ? api.theme.calls(N + 2) : [
        { call: 'استعدّوا', act: 'قفوا ثم اجلسوا' },
        { call: 'ادفعوا', act: 'مدّوا أذرعكم إلى الأمام' },
        { call: 'انتبهوا', act: 'ميلوا يميناً ثم يساراً' },
      ];

      let boat = START, storm = 0;
      let i = 0, locked = false, gone = false, over = false;
      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };

      const xBoat = () => +(X0 - boat * DX).toFixed(2);
      const xStorm = () => +(X0 - storm * DX + SOFF).toFixed(2);
      const gapNow = () => Math.max(0, boat - storm);
      const boostOn = () => gapNow() <= NEAR;

      function waves(x) {
        if (x === 1) return 'موجة واحدة';
        if (x === 2) return 'موجتان';
        return api.AR(x) + (x <= 10 ? ' موجات' : ' موجة');
      }

      function port() {
        return '<rect x="9.6" y="33" width="2.6" height="8" fill="var(--sea-ink)"/>' +
               '<rect x="20.4" y="33" width="2.6" height="8" fill="var(--sea-ink)"/>' +
               '<rect x="6" y="28" width="21" height="5.4" rx="1.6" fill="var(--sea-sand)" ' +
                 'stroke="var(--sea-ink)" stroke-width="2"/>' +
               '<rect x="14.4" y="8" width="2.6" height="20" fill="var(--sea-ink)"/>' +
               '<path d="M17 9 L26 12.6 L17 16.2 Z" fill="var(--sea-coral)" ' +
                 'stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/>';
      }

      function boatArt() {
         
        return '<path d="M-11 34.6 L14 34.6 L10.6 41.6 L-6.4 41.6 Z" fill="var(--sea-ink)"/>' +
               '<rect x="-1.1" y="13" width="2.3" height="20" fill="var(--sea-ink)"/>' +
               '<path d="M-0.7 13.6 L-0.7 31.6 L-12.6 31.6 Z" fill="var(--sea-white)" ' +
                 'stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/>' +
               '<path d="M1.5 17.4 L1.5 31.6 L9.6 31.6 Z" fill="var(--sea-sun)" ' +
                 'stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/>' +
               '<path d="M1.2 13.4 L6.2 15.1 L1.2 16.8 Z" fill="var(--sea-coral)" ' +
                 'stroke="var(--sea-ink)" stroke-width="1.6" stroke-linejoin="round"/>' +
               '<path d="M-12.6 33 L12.6 33 L9.2 40 L-7.8 40 Z" fill="var(--sea-sand)" ' +
                 'stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/>' +
               '<path d="M12.6 33 L15.6 25.6" fill="none" stroke="var(--sea-ink)" ' +
                 'stroke-width="2" stroke-linecap="round"/>';
      }

      function cloud(grow, fill, dx, dy) {
        return '<circle cx="' + (6.5 + dx) + '" cy="' + (17 + dy) + '" r="' + (6.5 + grow) + '" fill="' + fill + '"/>' +
               '<circle cx="' + (15 + dx) + '" cy="' + (12 + dy) + '" r="' + (9.5 + grow) + '" fill="' + fill + '"/>' +
               '<circle cx="' + (25 + dx) + '" cy="' + (15.5 + dy) + '" r="' + (8 + grow) + '" fill="' + fill + '"/>' +
                
               '<rect x="' + (4 - grow + dx) + '" y="' + (15 - grow + dy) + '" width="' + (150 + grow) +
                 '" height="' + (8 + grow * 2) + '" rx="' + (3.5 + grow) + '" fill="' + fill + '"/>';
      }

      function stormArt() {
        let s = cloud(2, 'var(--sea-ink)', 2.4, 2.4) +    
                cloud(2, 'var(--sea-ink)', 0, 0) +        
                cloud(0, 'var(--sea-sub)', 0, 0);         
         
        for (let k = 0; k < 6; k++) {
          const x = 5 + k * 7;
          s += '<path d="M' + x + ' 24 L' + (x - 2.4) + ' 33" stroke="var(--sea-sub)" ' +
               'stroke-width="2.4" stroke-linecap="round"/>';
        }
         
        s += '<path d="M-2 37 q4 -3.4 8 0 q4 3.4 8 0 q4 -3.4 8 0" fill="none" ' +
             'stroke="var(--sea-white)" stroke-width="2" stroke-linecap="round"/>';
        return s;
      }

      function scene() {
        const F = 'x="1.5" y="1.5" width="147" height="45" rx="6"';
        let s = '<svg viewBox="0 0 150 48" role="img" aria-label="' +
                'رحلة المركب: الميناء إلى اليسار والعاصفة خلفه إلى اليمين">' +
                '<defs><clipPath id="nkClip"><rect ' + F + '/></clipPath></defs>' +
                '<rect ' + F + ' fill="var(--sea-white)"/>' +
                '<g clip-path="url(#nkClip)">' +
                '<rect x="0" y="33" width="150" height="15" fill="var(--sea-teal)"/>';
         
        for (let k = 0; k < 9; k++) {
          const x = 6 + k * 16;
          s += '<path d="M' + x + ' 43.6 q3 -2.6 6 0" fill="none" stroke="var(--sea-white)" ' +
               'stroke-width="1.8" stroke-linecap="round"/>';
        }
        s += port();
        s += '<g class="nk-storm" id="nkStorm" style="transform:translateX(' + xStorm() + 'px)">' +
               '<g class="nk-bob-s">' + stormArt() + '</g></g>';
        s += '<g class="nk-boat" id="nkBoat" style="transform:translateX(' + xBoat() + 'px)">' +
               '<g class="nk-bob">' + boatArt() + '</g></g>';
        s += '</g><rect ' + F + ' fill="none" stroke="var(--sea-ink)" stroke-width="2.5"/>';
        return s + '</svg>';
      }

      el.innerHTML =
        '<div class="nk">' +
          '<div class="nk-sea">' + scene() + '</div>' +
          '<div class="nk-ask">' +
            '<div class="nk-tags" id="nkTags"></div>' +
            '<div class="nk-body" id="nkBody"></div>' +
          '</div>' +
        '</div>';

      const $ = s => el.querySelector(s);
      const elTags = $('#nkTags'), elBody = $('#nkBody'),
            elBoat = $('#nkBoat'), elStorm = $('#nkStorm');

      function place() {
        if (elBoat) elBoat.style.transform = 'translateX(' + xBoat() + 'px)';
        if (elStorm) elStorm.style.transform = 'translateX(' + xStorm() + 'px)';
      }

      function tags() {
        const g = gapNow(), rem = GOAL - boat;
        let h = '';
        if (boostOn()) h += '<p class="gw-tag">العاصفة قريبة — النداء بدفعتين</p>';
        h += '<p class="gw-head">بين المركب والعاصفة ' + api.esc(waves(g)) +
             (rem > 0 && rem <= 3 ? ' — وإلى الميناء ' + api.esc(waves(rem)) : '') + '</p>';
        elTags.innerHTML = h;
      }

      function headline(text) {
        elTags.innerHTML = '<p class="gw-head">' + api.esc(text) + '</p>';
      }

      function push(n) {
        const add = Math.min(GOAL, boat + n) - boat;
        if (add <= 0) return;
        boat += add;
        place();
      }

      function ask() {
        const q = api.qs[i];
        if (!q) return finishRun();
        api.step(i, N);
        locked = false;
        tags();
        elBody.innerHTML =
          '<h2 class="gw-q nk-q">' + api.esc(q.q) + '</h2>' +
          '<div class="gw-opts">' + q.a.map((t, k) =>
            '<button class="gw-opt" type="button" data-k="' + k + '">' +
              '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(t) + '</span>' +
            '</button>').join('') + '</div>';
        elBody.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function choose(k) {
        if (locked || over) return;
        locked = true;
        const q = api.qs[i], ok = k === q.c;
        elBody.querySelectorAll('.gw-opt').forEach((b, m) => {
          b.disabled = true;
          if (m === q.c) b.dataset.st = 'ok';
          else if (m === k) b.dataset.st = 'no';
        });
         
        if (ok) { api.score(api.turn(), 1); push(1); tags(); }
        api.judge(ok, { text: ok ? 'صحيح — تقدّم المركب' : 'خطأ — لم يتقدّم المركب' });
        wait(1400, callPhase);
      }

      function callPhase() {
        if (over) return;
        locked = false;
        const c = CALLS[i % CALLS.length] || { call: 'استعدّوا', act: 'قفوا ثم اجلسوا' };
        const pts = boostOn() ? 2 : 1;
        tags();
        elBody.innerHTML =
          '<p class="nk-call">' + api.esc(c.call) + '</p>' +
          '<p class="nk-act">' + api.esc(c.act) + '</p>' +
          '<div class="nk-do gw-mine">' +
            '<button class="nk-b nk-b-main" type="button" data-d="1">نفّذوه</button>' +
            '<button class="nk-b" type="button" data-d="0">تخطَّ النداء</button>' +
          '</div>' +
          '<p class="gw-sub gw-mine">اقرأ النداء بصوت عالٍ، ثم اضغط بعد أن ينفّذه الطلبة.</p>';
        elBody.querySelectorAll('[data-d]').forEach(b => {
          b.onclick = () => answerCall(b.dataset.d === '1', pts);
        });
      }

      function answerCall(did, pts) {
        if (locked || over) return;
        locked = true;
        elBody.querySelectorAll('[data-d]').forEach(b => { b.disabled = true; });
        if (did) {
          push(pts);
          api.sfx('good');
          api.say(pts > 1 ? 'دفعتان للمركب' : 'دفعة للمركب', 'good');
        } else {
          api.sfx('soft');
          api.say('مرّ النداء بلا دفعة', 'bad');
        }
        tags();
        wait(900, sail);
      }

      function sail() {
        if (over) return;
        storm++;
        place();
        api.sfx('turn');
         
        if (boat >= GOAL) return endRun('بلغ المركب الميناء', 'good');
        if (boat <= storm) return endRun('لحقت العاصفة بالمركب', 'bad');
        tags();
        wait(700, () => {
          i++;
          if (i >= N) return finishRun();
          api.nextTurn();
          ask();
        });
      }

      function finishRun() { endRun('انتهت الأسئلة والمركب في عرض البحر', ''); }

      function endRun(text, kind) {
        if (over) return;
        over = true; locked = true;
        headline(text);
        api.say(text, kind);
        wait(1100, () => { api.step(N, N); api.finish(); });
      }

      ask();

      return {
        destroy() {
          gone = true; locked = true; over = true;
          timers.forEach(t => clearTimeout(t));
          timers.length = 0;
        },
      };
    },
  });
})();

</script>
<script>
(function () {
  const S = (typeof window !== 'undefined' ? window : globalThis).SHIFT;

  const SECS = 60;         
  const SECS_BACK = 90;    
  const GAP = 3;           
  const MAX_TERMS = 8;     

  if (!document.getElementById('css-draw')) {
    const st = document.createElement('style');
    st.id = 'css-draw';
    st.textContent =
      '.dw{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:.4em}' +
       
      '.dw-top{width:min(34em,100%);display:flex;align-items:center;' +
