<style>
:root{
  --sea-sand:#fbf3e4;        
  --sea-teal:#0f8b8d;        
  
  --sea-head:#0c7274;        
  --sea-ink:#0b3c49;         
  --sea-coral:#c8432f;       
  --sea-sun:#f2b134;         
  --sea-closed:#0c7274;      
  --sea-closed-mark:#6fc3c4; 
  --sea-sub:#3d5a63;         
  --sea-faint:#e6f4f4;       
  --sea-white:#ffffff;
  --sea-t1:#4e9fc7;          
  --sea-t2:#c8432f;          
  --sea-t3:#2f8f5b;          
  --sea-t4:#7a5ea8;          

  --sea-r-sm:16px; --sea-r:20px; --sea-r-lg:26px;
  --sea-bd:3px;                        
  --sea-shadow:4px 4px 0 var(--sea-ink);        
  --sea-shadow-board:0 8px 0 var(--sea-ink);    
  --sea-display:'Baloo Sea','Baloo Bhaijaan 2',system-ui,sans-serif;
  --sea-text:'Readex Sea','Readex Pro',system-ui,sans-serif;
}

.sea{ min-height:100dvh; background:var(--sea-sand); color:var(--sea-ink);
  font-family:var(--sea-text); font-weight:400; display:flex; flex-direction:column; }
.sea *{ box-sizing:border-box; }

.sea-top{ background:var(--sea-head); color:var(--sea-white);
  padding:max(14px, env(safe-area-inset-top)) 18px 6px;
  display:flex; flex-direction:column; gap:6px; }
.sea-brand{ font-family:var(--sea-text); font-weight:600; font-size:14px;
  color:var(--sea-faint); letter-spacing:.02em; }
.sea-wave svg path{ fill:var(--sea-sand); }
.sea-top h1{ font-family:var(--sea-display); font-weight:800; margin:0;
  font-size:clamp(26px,6.2vw,40px); line-height:1.15; }
.sea-lede{ margin:0 0 4px; font-size:15px; font-weight:400; color:var(--sea-faint); line-height:1.55; }

.sea-wave{ display:block; width:100%; height:22px; background:var(--sea-head); }
.sea-wave svg{ display:block; width:100%; height:22px; }

.sea-body{ flex:1; display:flex; flex-direction:column; gap:16px;
  padding:16px 18px max(18px, env(safe-area-inset-bottom)); max-width:46em; width:100%; margin-inline:auto; }
.sea-sec{ display:flex; flex-direction:column; gap:10px; }
.sea-h2{ font-family:var(--sea-display); font-weight:800; font-size:19px; margin:0; color:var(--sea-ink); }

.sea-field{ width:100%; font:inherit; font-size:17px; line-height:1.7; color:var(--sea-ink);
  background:var(--sea-white); border:var(--sea-bd) solid var(--sea-ink);
  border-radius:var(--sea-r); box-shadow:var(--sea-shadow);
  padding:13px 15px; min-height:9em; resize:vertical; }
.sea-field::placeholder{ color:var(--sea-sub); opacity:.75; }
.sea-input{ min-height:52px; resize:none; }
.sea-hint{ margin:0; font-size:14px; font-weight:400; color:var(--sea-sub); line-height:1.5; }
.sea-label{ margin:0; font-size:14px; font-weight:600; color:var(--sea-sub); }

.sea-btn{ font:inherit; font-family:var(--sea-display); font-weight:800; font-size:19px;
  min-height:56px; padding:0 22px; border-radius:var(--sea-r);
  border:var(--sea-bd) solid var(--sea-ink); box-shadow:var(--sea-shadow);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:9px;
  transition:transform .08s ease, box-shadow .08s ease; }
.sea-btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--sea-ink); }
.sea-btn-main{ background:var(--sea-coral); color:var(--sea-white); }
.sea-btn-plain{ background:var(--sea-white); color:var(--sea-ink); }
.sea-btn[disabled]{ opacity:.45; cursor:default; box-shadow:none; transform:none; }
.sea-acts{ display:flex; flex-direction:column; gap:10px; }

.sea-link{ font-size:16px; font-weight:600; color:var(--sea-ink);
  min-height:44px; display:inline-flex; align-items:center; gap:7px; text-decoration:underline;
  text-underline-offset:4px; }
.sea-foot{ margin-block-start:auto; padding-block-start:10px;
  border-block-start:2px solid rgba(11,60,73,.18); }    

.sea-cards{ display:flex; flex-direction:column; gap:10px; }
.sea-card{ font:inherit; text-align:start; display:flex; flex-direction:column; gap:3px;
  background:var(--sea-white); color:var(--sea-ink);
  border:var(--sea-bd) solid var(--sea-ink); border-radius:var(--sea-r);
  box-shadow:var(--sea-shadow); padding:13px 15px; min-height:56px; cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease; }
.sea-card:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--sea-ink); }
.sea-card b{ font-family:var(--sea-display); font-weight:800; font-size:19px; }
.sea-card span{ font-size:14px; color:var(--sea-sub); line-height:1.5; }
.sea-card[disabled]{ opacity:.45; cursor:default; box-shadow:none; }
.sea-fit{ color:var(--sea-teal) !important; font-weight:600; }
.sea-n{ font-family:var(--sea-display); font-weight:800; color:var(--sea-coral); }

.sea-qs{ display:flex; flex-direction:column; gap:12px; }
.sea-q{ background:var(--sea-white); border:var(--sea-bd) solid var(--sea-ink);
  border-radius:var(--sea-r); box-shadow:var(--sea-shadow); padding:13px 14px;
  display:flex; flex-direction:column; gap:9px; }
.sea-q[data-pending="1"]{ border-color:var(--sea-sun); box-shadow:4px 4px 0 var(--sea-sun); }
.sea-q-t{ font-family:var(--sea-display); font-weight:800; font-size:17px; line-height:1.45; }
.sea-opts{ display:flex; flex-direction:column; gap:7px; }
.sea-opt{ font:inherit; font-size:16px; display:flex; align-items:center; gap:10px; text-align:start;
  min-height:48px; padding:8px 11px; border:2px solid var(--sea-ink); border-radius:var(--sea-r-sm);
  background:var(--sea-sand); color:var(--sea-ink); cursor:pointer; }
.sea-opt .k{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--sea-white);
  border:2px solid var(--sea-ink); display:grid; place-items:center;
  font-family:var(--sea-display); font-weight:800; font-size:13px; }
.sea-opt .t{ min-width:0; overflow-wrap:anywhere; }
.sea-opt[data-on="1"]{ background:var(--sea-sun); border-color:var(--sea-ink); font-weight:600; }
.sea-opt[data-on="1"] .k{ background:var(--sea-ink); color:var(--sea-sun); }

.sea-note{ margin:0; font-size:15px; line-height:1.55; color:var(--sea-ink);
  background:var(--sea-white); border:2px solid var(--sea-ink);
  border-radius:var(--sea-r-sm); box-shadow:var(--sea-shadow); padding:11px 13px; }
.sea-warn{ background:var(--sea-white); border:var(--sea-bd) solid var(--sea-sun);
  box-shadow:4px 4px 0 var(--sea-sun); border-radius:var(--sea-r); padding:12px 14px;
  display:flex; flex-direction:column; gap:7px; }
.sea-warn ul{ margin:0; padding-inline-start:1.1em; display:flex; flex-direction:column; gap:5px; }
.sea-warn li{ font-size:14px; line-height:1.5; color:var(--sea-sub); }
.sea-tag{ margin:0; align-self:flex-start; font-size:13px; font-weight:600;
  color:var(--sea-ink); background:var(--sea-sun);
  border:2px solid var(--sea-ink); border-radius:999px; padding:4px 12px; }

.sea-figure{ display:none; }
.sea-figure img{ display:block; width:100%; height:auto;
  filter:drop-shadow(4px 4px 0 var(--sea-ink)); }
.sea-figure[data-ready="1"]{ display:block; }
.sea-figure-entry{ width:clamp(88px,22vw,136px); align-self:flex-end; margin-block-start:-8px; }
.sea-figure-win{ width:clamp(110px,26vw,190px); }

@media (max-height:460px){
  .sea-top{ padding-block:10px 4px; }
  .sea-top h1{ font-size:25px; }
  .sea-lede{ font-size:14px; }
  .sea-body{ gap:11px; padding-block:11px; }
  .sea-field{ min-height:4.6em; height:4.6em; font-size:16px; }
  .sea-btn{ min-height:50px; font-size:18px; }
  .sea-acts{ flex-direction:row; flex-wrap:wrap; }
  .sea-acts .sea-btn{ flex:1 1 auto; }
  .sea-wave,.sea-wave svg{ height:16px; }
}

.sea-row{ display:flex; align-items:stretch; gap:8px; }
.sea-row .sea-card{ flex:1 1 auto; min-width:0; }
.sea-more{ flex:none; width:52px; min-height:56px; cursor:pointer;
  display:grid; place-items:center; color:var(--sea-sub);
  background:var(--sea-white); border:var(--sea-bd) solid var(--sea-ink);
  border-radius:var(--sea-r); box-shadow:var(--sea-shadow); }
.sea-more:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--sea-ink); }

.sea-sheet{ position:fixed; inset:0; z-index:30; display:grid; place-items:center;
  padding:18px; background:rgba(11,60,73,.55); }   
.sea-card-lg{ width:min(30em,100%); max-height:92dvh; overflow:auto;
  background:var(--sea-sand); border:var(--sea-bd) solid var(--sea-ink);
  border-radius:var(--sea-r-lg); box-shadow:var(--sea-shadow);
  padding:16px; display:flex; flex-direction:column; gap:10px; }

.sea-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.sea-chip{ font:inherit; font-size:15px; font-weight:600; min-height:44px; padding:0 16px;
  cursor:pointer; background:var(--sea-white); color:var(--sea-ink);
  border:2px solid var(--sea-ink); border-radius:999px; }
.sea-chip[data-on="1"]{ background:var(--sea-sun); font-weight:700; }

.sea-games{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:640px){ .sea-games{ grid-template-columns:1fr 1fr; } }
.sea-game{ font:inherit; text-align:start; cursor:pointer;
  display:flex; align-items:stretch; gap:12px; padding:11px;
  background:var(--sea-white); color:var(--sea-ink);
  border:var(--sea-bd) solid var(--sea-ink); border-radius:var(--sea-r);
  box-shadow:var(--sea-shadow); min-height:88px;
  transition:transform .08s ease, box-shadow .08s ease; }
.sea-game:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--sea-ink); }
.sea-game[disabled]{ opacity:.5; cursor:default; box-shadow:none; }

.sea-game-art{ flex:none; width:92px; display:grid; place-items:center; }
.sea-game-art svg{ width:100%; height:auto; display:block; }
.sea-game-txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.sea-game-txt b{ font-family:var(--sea-display); font-weight:800; font-size:19px; }
.sea-game-line{ font-size:14px; color:var(--sea-sub); line-height:1.45; }
.sea-game-meta{ font-size:13px; font-weight:600; color:var(--sea-ink); }

.sea-kind{ display:inline-block; font-family:var(--sea-display); font-weight:800;
  font-size:12px; line-height:1; color:var(--sea-ink); background:var(--sea-sun);
  border:2px solid var(--sea-ink); border-radius:999px;
  padding:3px 9px; margin-inline-end:7px; vertical-align:middle; }

@media (max-height:460px) and (min-width:660px){
  
  .sea-body[data-v="home"]{ display:grid; grid-template-columns:1fr 1fr; align-items:start;
    column-gap:16px; row-gap:8px; max-width:none; }
  .sea-body[data-v="home"] > .sea-sec{ min-width:0; }
  .sea-body[data-v="home"] > .sea-figure{ display:none; }
  .sea-body[data-v="home"] > .sea-foot{ grid-column:1 / -1; margin-block-start:0; }
  
  .sea-body[data-v="home"] > .sea-sec:first-child .sea-cards{ max-height:16em; overflow-y:auto; }
}

.sea-dot{ display:inline-block; width:4px; height:4px; border-radius:50%;
  background:var(--sea-sub); margin-inline:8px; vertical-align:middle; }

</style>
</head>

ر لا محيط — والبحر مسطح مائي أصغر من المحيط"},{"t":"البحر الأحمر","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"}],"obj":"KW-SOC-G5-LOC-01-02","from":"f5a","source":"موثّق · ص ٢٠"}],"places":[],"note_questions":"سؤال واحد لكل حقيقة · ولا سؤال يُجاب بمعرفة عامة بلا هذا الدرس (كان «ما الكوكب الوحيد الذي توجد عليه الحياة؟» ومشتّتاته من خارج الدرس) · والمشتّت قريب من الصحيح ومن مفردات الدرس (كان 50% و90% مقابل 71% — قسمةَ منتصف ومبالغةً، فصارا 61% و79%). الثلاثة تُفحص آلياً في `questionIssues`.","note_facts":"الحقائق المركّبة فُصلت (‏f4 → f4a/b/c و f5 → f5a/b) — نقلٌ أمين: الكتاب يذكرها صراحةً في سطر واحد. والفصل يفتح ستّ حقائق قابلة للسؤال فتكتمل دورتان لثلاثة فِرَق.","note_pairs":"نصوص البطاقات مختصرة اختصاراً أميناً من الحقيقة نفسها — بطاقة المطابقة أضيق من سطر الخيار، والحدّ مقيس في `PAIR_MAX`.","note_objectives":"لكل هدف **صيغة قصيرة** تُعرض على شاشة النتيجة — النصّ المنهجي الكامل لا يُقرأ في عشر ثوانٍ من آخر الصفّ (قيس 15 سبتمبر: 53 محرفاً تفيض عن الشاشة).","note_sequences":"تسلسل واحد لا غير: «المحيط ← البحر ← الخليج» من تعريفات ص ٢٠ (‏f4a–f4c). والصفحات ١٨–٢١ **لا تحمل ترتيباً زمنياً ولا مرحلياً آخر**: الكتاب يذكر أنّ أكبر المحيطات هو الهادي ولا يرتّب الخمسة، فترتيبها بالمساحة تأليفٌ لا نقل. ولأن `timeline` يشترط أربعة عناصر فأكثر، يبقى هذا التسلسل الثلاثي دون حدّ المحرّك — نقصٌ في الكتاب لا في العقد.","note_categories":"تصنيف واحد من ص ٢٠: المحيطات الخمسة كما عدّها الكتاب نصّاً، ومقابلها البحار الثلاثة المكتوبة بأسمائها على خريطة العالم شكل (٣) — لا اسم من خارج الصفحتين. **صيغة النداء من عندنا** («امسك المحيطات وحدها») لأن الكتاب يكتب المهمّة بصيغة «حدّد نوع المسطح المائي»، أمّا كل عنصر وسببه فمن الكتاب. و**الخلجان بلا أعضاء**: الصفحات ١٨–٢١ تعرّف الخليج ولا تسمّي خليجاً واحداً، فلا يصحّ تصنيف ثالث. والنشاط الأول ص ٢١ تصنيفٌ بالصور لا بالأسماء، وأجوبته غير مطبوعة، فلم يُنقل منه شيء."},"KW-SOC-G5-LOC-02":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-02","unit_id":"KW-SOC-G5-LOC","title":"قارات الكرة الأرضية","grade":5,"subject":"SOC","pages":[22,23],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول حرفياً من الحقائق المستخرجة في صفحة المراجعة — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-02-01","text":"تعريف القارة","short":"تعريف القارة"},{"code":"KW-SOC-G5-LOC-02-02","text":"أسماء قارات العالم","short":"أسماء قارات العالم"},{"code":"KW-SOC-G5-LOC-02-03","text":"أكبر القارات وأصغرها مساحةً","short":"أكبر القارات وأصغرها"},{"code":"KW-SOC-G5-LOC-02-04","text":"القارة غير المأهولة بالسكان","short":"القارة غير المأهولة"},{"code":"KW-SOC-G5-LOC-02-05","text":"موقع وطني الكويت","short":"موقع وطني الكويت"}],"facts":[{"id":"f1","tag":"مفهوم","text":"القارة: مساحة كبيرة من اليابسة يحيط بها الماء","obj":"KW-SOC-G5-LOC-02-01","source":"موثّق · ص ٢٢ و٢٣"},{"id":"f2","tag":"رقم","text":"قارات العالم سبع قارات","obj":"KW-SOC-G5-LOC-02-02","source":"موثّق · ص ٢٢"},{"id":"f3","tag":"اسم","text":"قارات العالم هي: آسيا، أفريقيا، أوروبا، أمريكا الشمالية، أمريكا الجنوبية، أستراليا، القطبية الجنوبية","obj":"KW-SOC-G5-LOC-02-02","source":"موثّق · ص ٢٢"},{"id":"f4","tag":"اسم","text":"آسيا أكبر قارات العالم مساحةً وأكثرها في عدد السكان","obj":"KW-SOC-G5-LOC-02-03","source":"موثّق · ص ٢٢"},{"id":"f5","tag":"اسم","text":"أستراليا أصغر القارات من حيث المساحة","obj":"KW-SOC-G5-LOC-02-03","source":"موثّق · ص ٢٢"},{"id":"f6","tag":"اسم","text":"القارة القطبية الجنوبية قارة غير مأهولة بالسكان","obj":"KW-SOC-G5-LOC-02-04","source":"موثّق · ص ٢٢"},{"id":"f7","tag":"اسم","text":"يقع وطني الكويت في قارة آسيا","obj":"KW-SOC-G5-LOC-02-05","source":"موثّق · ص ٢٢ و٢٣"}],"pairs":[{"a":"القارة","b":"مساحة كبيرة من اليابسة","obj":"KW-SOC-G5-LOC-02-01","from":"f1"},{"a":"آسيا","b":"أكبر القارات مساحةً وسكاناً","obj":"KW-SOC-G5-LOC-02-03","from":"f4"},{"a":"أستراليا","b":"أصغر القارات مساحةً","obj":"KW-SOC-G5-LOC-02-03","from":"f5"},{"a":"القطبية الجنوبية","b":"قارة غير مأهولة بالسكان","obj":"KW-SOC-G5-LOC-02-04","from":"f6"},{"a":"الكويت","b":"تقع في قارة آسيا","obj":"KW-SOC-G5-LOC-02-05","from":"f7"}],"questions":[{"q":"ما القارة؟","options":["مساحة كبيرة من الماء","مساحة كبيرة من اليابسة","دولة كبيرة من اليابسة"],"answer":1,"obj":"KW-SOC-G5-LOC-02-01","from":"f1"},{"q":"كم عدد قارات العالم؟","options":["خمس قارات","ست قارات","سبع قارات"],"answer":2,"obj":"KW-SOC-G5-LOC-02-02","from":"f2"},{"q":"آسيا وأفريقيا وأوروبا ثلاث من قارات العالم، والرابعة منها:","options":["أمريكا الشمالية","أمريكا الشرقية","أمريكا الغربية"],"answer":0,"obj":"KW-SOC-G5-LOC-02-02","from":"f3"},{"q":"آسيا أكبر قارات العالم مساحةً، وهي أيضاً:","options":["أصغرها في عدد السكان","الثانية في عدد السكان","أكثرها في عدد السكان"],"answer":2,"obj":"KW-SOC-G5-LOC-02-03","from":"f4"},{"q":"أستراليا في قارات العالم هي:","options":["ثاني أصغر القارات بعد أوروبا","أصغر القارات","دولة لا قارة"],"answer":1,"obj":"KW-SOC-G5-LOC-02-03","from":"f5"},{"q":"أيّ القارات غير مأهولة بالسكان؟","options":["القطبية الجنوبية","أستراليا","أمريكا الجنوبية"],"answer":0,"obj":"KW-SOC-G5-LOC-02-04","from":"f6"},{"q":"في أيّ قارة يقع وطني الكويت؟","options":["أفريقيا","آسيا","أوروبا"],"answer":1,"obj":"KW-SOC-G5-LOC-02-05","from":"f7"}],"sequences":[],"categories":[{"label":"امسك القارات وحدها","items":[{"t":"آسيا","in":true,"why":"إحدى القارات السبع، وأكبرها مساحةً وأكثرها سكاناً"},{"t":"أفريقيا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أوروبا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الشمالية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الجنوبية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أستراليا","in":true,"why":"إحدى القارات السبع، وأصغرها مساحةً"},{"t":"القطبية الجنوبية","in":true,"why":"إحدى القارات السبع، وهي غير مأهولة بالسكان"},{"t":"المحيط الهادي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة، والقارة مساحة كبيرة من اليابسة"},{"t":"المحيط الأطلسي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط الهندي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الشمالي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الجنوبي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"}],"obj":"KW-SOC-G5-LOC-02-02","from":"f3","source":"موثّق · ص ٢٢ و٢٣"}],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الدرس — لا اسم قارة خارج `f3`، **ولا مشتّت صحيح خارج الدرس ولا مناقض لنصّ سؤاله**. وسبب كل مشتّت:\n• «مساحة كبيرة من الماء» (f1): يقلب التعريف — الماء يحيط باليابسة لا العكس، وهو خلط القارة بالمحيط.\n• «دولة كبيرة من اليابسة» (f1): الخلط بين القارة والدولة — طفلة تعرف «الكويت» دولةً وتقيس عليها.\n• «خمس قارات» و«ست قارات» (f2): العدد الأقرب للصحيح لا رقم بعيد، فلا يُستبعد بالشكل.\n• «أمريكا الشرقية» و«أمريكا الغربية» (f3): **اسمان مركّبان لا وجود لهما** — القائمة تعرف الشمالية والجنوبية وحدهما. والسؤال يقيس معرفة القائمة لا حفظ ترتيبها: الخيارات الثلاثة «أمريكا + جهة»، فالتمييز بمعرفة أيّ جهة قارةٌ فعلاً.\n  (وهذا استثناء مُقرَّر من قاعدة «لا اسم قارة خارج f3»: المحظور اسمُ قارة **حقيقية** غائبة عن القائمة — نفيُها يعلّم خطأ؛ أمّا الاسم المركّب الذي لا وجود له فنفيُه تصحيح.)\n• «أصغرها في عدد السكان» (f4): **أخصب خطأ في الصفحة** — الكتاب يجمع الأكبر مساحةً والأكثر سكاناً في جملة واحدة، فقلب أحد الطرفين مغرٍ.\n• «الثانية في عدد السكان» (f4): من طرف السكان نفسه لا من حقيقة أخرى — خطأ ترتيب لا خطأ محور، فلا يكشف نفسه بسؤال آخر.\n• «ثاني أصغر القارات بعد أوروبا» (f5): ينسب «الأصغر» إلى أوروبا — وهي صغيرة فعلاً في ذهن الطفلة، والخطأ في الترتيب لا في الجنس.\n• «دولة لا قارة» (f5): عدّها دولة — اسمها اسم دولة أيضاً.\n• «أستراليا» (f6): نسبة «غير مأهولة» إليها بدل القطبية الجنوبية — قِلّة سكانها تُلبِس.\n• «أمريكا الجنوبية» (f6): تشترك مع الصحيح في كلمة «الجنوبية» وحدها.\n• «أفريقيا» و«أوروبا» (f7): أقرب قارتين إلى الكويت في ذهن الطفلة.","note_facts":"منقول من صفحتَي ٢٢–٢٣ (صفحتا الملف ٢٣–٢٤). **تحويلان مُقرَّان من المؤسّس:** (١) الكتاب يسرد المعلومة حواراً على لسان أمين المكتبة، ونُقلت جملاً خبرية لأن سطر الخيار لا يسع حواراً — المعنى كما هو والصياغة تغيّرت. (٢) نصّ الـPDF يخرج مشوّه الإملاء («األرضية» و«أسرتاليا» و«اوروبا» و«أوربا» في الصفحة نفسها)، فأُعيدت الحروف إلى صورتها الصحيحة. وسبع حقائق لا ستّ: الصفحتان تحملان سبعاً موثّقة، ولكل هدف من الخمسة حقيقة — و`f7` وحدها تخدم «موقع وطني الكويت».","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (٤–١٦ محرفاً) لأن بطاقة المطابقة أضيق من سطر الخيار.","note_objectives":"الأهداف الخمسة من «ماذا سنتعلم» ص ٢٢، وصيغها المختصرة ١٢–٢٧ محرفاً (الحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان ٢٢–٢٣ تذكران أكبر القارات (آسيا) وأصغرها (أستراليا) ولا ترتّبان السبع بينهما، ولا يرد في الدرس تاريخ ولا مراحل. فترتيب القارات بالمساحة أو بالسكان تأليفٌ من خارج الكتاب — تُرك فارغاً عمداً.","note_categories":"تصنيف واحد: القارات السبع كما عدّها الحوار ص ٢٢ ومفتاح الخريطة ص ٢٣، ومقابلها المحيطات الخمسة المكتوبة بأسمائها على شكل (٤) في الصفحة نفسها — الفرق بينهما هو التعريف المقرّر: القارة يابسة يحيط بها الماء. **صيغة النداء من عندنا** وكل عنصر وسببه من الكتاب. ولم يُكتب تصنيف «مأهولة / غير مأهولة» لأن الكتاب ينصّ على أن القطبية الجنوبية غير مأهولة ولا ينصّ على سكّان القارات الستّ الأخرى — فنسبته إليها استنتاج لا نقل."},"KW-SOC-G5-LOC-03":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-03","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الخليج العربية","grade":5,"subject":"SOC","pages":[24,25],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٤–٢٥ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-03-01","text":"موقع دول الخليج العربية بالنسبة للخليج العربي","short":"موقع دول الخليج العربية"},{"code":"KW-SOC-G5-LOC-03-02","text":"موقع وطني الكويت بالنسبة لشبه الجزيرة العربية","short":"موقع الكويت من شبه الجزيرة"},{"code":"KW-SOC-G5-LOC-03-03","text":"سبب تسمية دول الخليج العربية بهذا الاسم","short":"سبب تسمية دول الخليج"}],"facts":[{"id":"f1","tag":"مفهوم","text":"يقع وطني الكويت ودول الخليج العربية على مسطح مائي اسمه الخليج العربي","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤"},{"id":"f2","tag":"مفهوم","text":"سُمّيت دول الخليج العربية بهذا الاسم لأنها تقع على الخليج العربي","obj":"KW-SOC-G5-LOC-03-03","source":"موثّق · ص ٢٤"},{"id":"f3","tag":"اسم","text":"يقع وطني الكويت في جهة الشمال الغربي بالنسبة للخليج العربي","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤"},{"id":"f4","tag":"اسم","text":"يقع وطني الكويت في جهة الشمال الشرقي بالنسبة لشبه الجزيرة العربية","obj":"KW-SOC-G5-LOC-03-02","source":"موثّق · ص ٢٤"},{"id":"f5","tag":"اسم","text":"دول الخليج العربية على الخريطة: دولة الكويت والمملكة العربية السعودية ومملكة البحرين ودولة قطر ودولة الإمارات وسلطنة عُمان","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤ و٢٥ — شكل (٦) وخريطة النشاط الأول"},{"id":"f6","tag":"اسم","text":"تحمل خريطة دول الخليج العربية مسطحين مائيين: الخليج العربي وخليج عُمان","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤ — شكل (٦)"}],"pairs":[{"a":"الخليج العربي","b":"المسطح الذي تقع عليه دول الخليج","obj":"KW-SOC-G5-LOC-03-01","from":"f1"},{"a":"وطني الكويت","b":"شمال غربي الخليج العربي","obj":"KW-SOC-G5-LOC-03-01","from":"f3"},{"a":"شبه الجزيرة","b":"الكويت في شمالها الشرقي","obj":"KW-SOC-G5-LOC-03-02","from":"f4"},{"a":"سلطنة عُمان","b":"إحدى دول الخليج العربية","obj":"KW-SOC-G5-LOC-03-01","from":"f5"},{"a":"خليج عُمان","b":"مسطح مائي على خريطة الدرس","obj":"KW-SOC-G5-LOC-03-01","from":"f6"}],"questions":[{"q":"على أي مسطح مائي تقع دول الخليج العربية؟","options":["الخليج العربي","خليج عُمان","الخليج الشمالي"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f1"},{"q":"في أي جهة يقع وطني الكويت بالنسبة للخليج العربي؟","options":["الجنوب الغربي","الشمال الغربي","الجنوب الشرقي"],"answer":1,"obj":"KW-SOC-G5-LOC-03-01","from":"f3"},{"q":"أين يقع وطني الكويت بالنسبة لشبه الجزيرة؟","options":["الجنوب الشرقي","الجنوب الغربي","الشمال الشرقي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-02","from":"f4"},{"q":"أيّ هذه من دول الخليج العربية؟","options":["سلطنة عُمان","خليج عُمان","شبه الجزيرة العربية"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f5"},{"q":"لماذا سُمّيت دول الخليج العربية بهذا الاسم؟","options":["لأنها تقع على خليج عُمان","لأنها تقع في شبه الجزيرة","لأنها تقع على الخليج العربي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-03","from":"f2"}],"sequences":[],"categories":[],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «خليج عُمان» (f1): المسطح الآخر المكتوب على الخريطة نفسها — أقرب خطأ ممكن.\n• «الخليج الشمالي» (f1): **اسم مركّب لا وجود له** — الطفلة تعرف «الخليج» و«الشمال» من الدرس فتركّبهما؛ نفيُه تصحيح لا تعليمُ خطأ.\n• «الجنوب الغربي» و«الجنوب الشرقي» (f3 وf4): قلبُ طرف واحد من الجهة المركّبة — أخصب خطأ في الصفحة لأن الدرس يجمع جهتين مركّبتين متشابهتين في سطرين متتاليين.\n• «خليج عُمان» (f5): الخلط بين المسطح والدولة — الاسم نفسه يتكرّر في «سلطنة عُمان».\n• «شبه الجزيرة العربية» (f5): الخلط بين الإقليم والدولة.\n• «لأنها تقع على خليج عُمان» و«لأنها تقع في شبه الجزيرة» (f2): سببان من مفردات الدرس نفسه، وكلاهما يصف موقعاً حقيقياً لكنه ليس سبب التسمية.","note_facts":"ستّ حقائق من صفحتَي الدرس: أربع من نصّ «الموضوع» ص ٢٤، وواحدة من أسماء الدول على شكل (٦) وخريطة النشاط الأول ص ٢٥، وواحدة من اسمَي المسطحين على شكل (٦). **والاسم كما كُتب في الكتاب**: «مملكة البحرين» على شكل (٦) و«البحرين» على خريطة ص ٢٥ — أُخذت الصيغة الأولى.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير لأن بطاقة المطابقة أضيق من سطر الخيار.","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٤ بصيغها المختصرة (٢٠–٢٦ محرفاً، والحدّ ٣٤).","note_sequences":"**وجدتُ تسلسلاً واحداً ولم أكتبه:** النشاط الأول ص ٢٥ يرقّم خطّ سير العربة من الكويت (١ الكويت ← ٢ السعودية ← ٣ البحرين ← ٤ قطر ← ٥ الإمارات ← ٦ عُمان). تسلسلٌ واحد يعطي المحرّك جولةً واحدة، وجولةٌ واحدة تُجلس فريقين متفرّجين (القرار ٣٣)، فتُرك الحقل فارغاً حتى يأتي في الوحدة ما يكمل ثلاثة. ولا ترتيب زمنيّ في الدرس أصلاً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «دول الخليج العربية الست مقابل المسطحين المائيين على الخريطة» — ستة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، والصفحتان لا تحملان غيره: شكل (٥) صندوقٌ بثمانية أسهم بلا أسماء جهات مكتوبة، فلا يصحّ منه تصنيف «أصلية/فرعية»."},"KW-SOC-G5-LOC-04":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-04","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الوطن العربي","grade":5,"subject":"SOC","pages":[26,27],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٦–٢٧ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-04-01","text":"تعريف الوطن العربي","short":"تعريف الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-02","text":"مفهوم المضيق","short":"مفهوم المضيق"},{"code":"KW-SOC-G5-LOC-04-03","text":"موقع وطني الكويت بالنسبة للوطن العربي","short":"موقع الكويت من الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-04","text":"السمات المشتركة بين دول الوطن العربي","short":"السمات المشتركة بين دوله"}],"facts":[{"id":"f1","tag":"مفهوم","text":"الوطن العربي: مجموعة من الدول تجمعها سمات مشتركة مثل الدين الإسلامي واللغة العربية والتراث والتاريخ","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f2","tag":"مفهوم","text":"المضيق: ممر مائي ضيق من الماء يفصل بين مسطحين مائيين","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f3","tag":"اسم","text":"الوطن العربي يقع في وسط العالم ويمتد بين قارتي آسيا وأفريقيا","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f4","tag":"اسم","text":"يفصل بين دول القارتين مسطح مائي هو البحر الأحمر","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f5","tag":"رقم","text":"عدد دول الوطن العربي ٢٢ دولة","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f6","tag":"اسم","text":"يقع وطني الكويت في الجهة الشرقية من الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","source":"موثّق · ص ٢٦"},{"id":"f7","tag":"مفهوم","text":"يطل الوطن العربي على العديد من المسطحات المائية","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f8","tag":"مفهوم","text":"الوطن العربي يشرف على العديد من المضائق المائية جعلت له أهمية كبيرة في الملاحة والتجارة العالمية","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f9","tag":"اسم","text":"تحمل خريطة الوطن العربي ثلاثة مضائق مائية هي مضيق جبل طارق ومضيق هرمز ومضيق باب المندب، وقناة مائية هي قناة السويس","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"id":"f10","tag":"اسم","text":"مسطحات مكتوبة على خريطة الوطن العربي: البحر المتوسط والبحر الأحمر والمحيط الأطلسي والمحيط الهندي وبحر العرب وخليج عدن","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f11","tag":"اسم","text":"دول مكتوبة على خريطة الوطن العربي: المغرب والجزائر وتونس وليبيا ومصر والسودان وموريتانيا والصومال والسعودية واليمن وعمان والعراق وسوريا، ومعها خارج لون الوطن العربي أسبانيا وإيران","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f12","tag":"مفهوم","text":"نشاط ص ٢٧: البحر الذي يفصل بين الجناح الأفريقي والجناح الآسيوي من الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٧ — النشاط الثالث"}],"pairs":[{"a":"المضيق","b":"ممر مائي ضيق بين مسطحين","obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"a":"البحر الأحمر","b":"يفصل بين دول القارتين","obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"a":"وطني الكويت","b":"شرق الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"a":"٢٢ دولة","b":"عدد دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"a":"قناة السويس","b":"قناة مائية على الخريطة","obj":"KW-SOC-G5-LOC-04-02","from":"f9"},{"a":"اللغة العربية","b":"سمة تجمع دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-04","from":"f1"}],"questions":[{"q":"ما الوطن العربي؟","options":["مجموعة من الدول تجمعها سمات","مجموعة من القارات المتصلة","دولة واحدة كبيرة المساحة"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f1"},{"q":"ما المضيق؟","options":["ممر بري ضيق بين دولتين","ممر مائي ضيق من الماء","مسطح مائي واسع بين قارتين"],"answer":1,"obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"q":"بين أي قارتين يمتد الوطن العربي؟","options":["آسيا وأوروبا","أفريقيا وأوروبا","آسيا وأفريقيا"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f3"},{"q":"ما المسطح المائي الذي يفصل بين دول القارتين؟","options":["البحر الأحمر","البحر المتوسط","المحيط الهندي"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"q":"كم عدد دول الوطن العربي؟","options":["١٨ دولة","٢٦ دولة","٢٢ دولة"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"q":"في أي جهة يقع وطني الكويت من الوطن العربي؟","options":["الجهة الغربية","الجهة الشرقية","الجهة الشمالية"],"answer":1,"obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"q":"أيّ هذه قناة مائية لا مضيقاً؟","options":["مضيق هرمز","مضيق باب المندب","قناة السويس"],"answer":2,"obj":"KW-SOC-G5-LOC-04-02","from":"f9"}],"sequences":[],"categories":[{"label":"امسك المضائق والقنوات المائية وحدها","items":[{"t":"مضيق جبل طارق","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق هرمز","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق باب المندب","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"قناة السويس","in":true,"why":"قناة مائية على خريطة الدرس"},{"t":"البحر الأحمر","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"البحر المتوسط","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"المحيط الهندي","in":false,"why":"محيط لا ممر مائي ضيق"},{"t":"بحر العرب","in":false,"why":"بحر لا ممر مائي ضيق"}],"obj":"KW-SOC-G5-LOC-04-02","from":"f9","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"label":"امسك المسطحات المائية وحدها","items":[{"t":"البحر المتوسط","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"البحر الأحمر","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الأطلسي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الهندي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"بحر العرب","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"خليج عدن","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"السودان","in":false,"why":"دولة لا مسطح مائي"},{"t":"أسبانيا","in":false,"why":"دولة لا مسطح مائي"},{"t":"إيران","in":false,"why":"دولة لا مسطح مائي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f10","source":"موثّق · ص ٢٦ — شكل (٧)"},{"label":"امسك دول الوطن العربي وحدها","items":[{"t":"المغرب","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الجزائر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"تونس","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"ليبيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"مصر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السودان","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"موريتانيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الصومال","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السعودية","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"اليمن","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"العراق","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"سوريا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"أسبانيا","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"},{"t":"إيران","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f11","source":"موثّق · ص ٢٦ — شكل (٧)"}],"places":[],"note_questions":"سبعة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «مجموعة من القارات المتصلة» و«دولة واحدة كبيرة المساحة» (f1): الخلط بين تجمّع دول وبين قارة أو دولة واحدة — وهو الخلط الذي يسبق مفهوم «الوطن العربي» عند الطفلة.\n• «ممر بري ضيق بين دولتين» (f2): يبدّل الماء بالبرّ ويبقي «الممر الضيق» — أقرب خطأ إلى التعريف.\n• «مسطح مائي واسع بين قارتين» (f2): يقلب الضيق سعةً، وهو وصف البحر لا المضيق.\n• «آسيا وأوروبا» و«أفريقيا وأوروبا» (f3): قارة صحيحة مع أخرى من خارج الامتداد — نصفُ الجواب صحيح فيغري.\n• «البحر المتوسط» و«المحيط الهندي» (f4): مسطحان مكتوبان على الخريطة نفسها ويلامسان الوطن العربي، لكنهما لا يفصلان بين جناحيه.\n• «١٨ دولة» و«٢٦ دولة» (f5): على بُعد ١٨٪ من الصحيح صعوداً وهبوطاً، وليسا من مضاعفات العشرة فلا يُستبعدان بالشكل.\n• «الجهة الغربية» و«الجهة الشمالية» (f6): الجهات الثلاث الأخرى من الرباعية نفسها.\n• «مضيق هرمز» و«مضيق باب المندب» (f9): مضيقان حقيقيان على الخريطة، والسؤال يسأل عن القناة — فنفيُهما تصحيحٌ لا تعليمُ خطأ.","note_facts":"اثنتا عشرة حقيقة: ثمانٍ من نصّ الدرس وفقاعاته ص ٢٦، وثلاث من أسماء شكل (٧) ومفتاحه — المضائق والقناة، والمسطحات، والدول. ونصّ الكتاب يكتب «أوربا» في درس لاحق و«أسبانيا» على هذه الخريطة، وأُبقيت الصيغتان كما طُبعتا. وحقيقةٌ من نشاط ص ٢٧ تسمّي جناحَي الوطن العربي: الأفريقي والآسيوي.","note_pairs":"ستة أزواج من ستّ حقائق، والوجه الأول اسمٌ قصير (٦–١٣ محرفاً).","note_objectives":"الأهداف الأربعة من «ماذا سنتعلم» ص ٢٦ (١٢–٢٧ محرفاً في صيغها المختصرة، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان لا تحملان ترتيباً زمنياً ولا مرحلياً: الخريطة تسمّي ولا ترتّب، والنشاطان تلوينٌ وتحويط. وترتيب المضائق من الغرب إلى الشرق قراءةٌ منّي للخريطة لا نصٌّ في الكتاب، فلم يُكتب.","note_categories":"ثلاثة تصنيفات، كلّها من شكل (٧) ومفتاحه في الصفحة نفسها: المضائق والقناة (٤ داخل الفئة و٤ خارجها) · المسطحات المائية (٦ و٣) · دول الوطن العربي (١٢ واثنتان خارج اللون). صيغة النداء من عندنا، وكل عنصر وسببه من الخريطة. وأسماء الدول المأخوذة هي المكتوبة بخطّ ظاهر على الخريطة؛ والأسماء الصغيرة جداً (لبنان، فلسطين، الأردن، جيبوتي، جزر القمر ودول الخليج) لم تُنقل لأن قراءتها من الصورة غير مؤكّدة."},"KW-SOC-G5-LOC-05":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-05","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول العالم الإسلامي","grade":5,"subject":"SOC","pages":[28,29],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٨–٢٩ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-05-01","text":"تعريف العالم الإسلامي","short":"تعريف العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-02","text":"مميزات موقع العالم الإسلامي","short":"مميزات موقع العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-03","text":"موقع وطني الكويت بالنسبة للعالم الإسلامي","short":"موقع الكويت من العالم الإسلامي"}],"facts":[{"id":"f1","tag":"مفهوم","text":"العالم الإسلامي: مجموعة من الدول يكون فيها عدد المسلمين ٥٠٪ فأكثر من مجموع السكان","obj":"KW-SOC-G5-LOC-05-01","source":"موثّق · ص ٢٨"},{"id":"f2","tag":"مفهوم","text":"يشغل العالم الإسلامي مساحة واسعة شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f3","tag":"مفهوم","text":"يحتل العالم الإسلامي موقعاً متوسطاً بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f4","tag":"اسم","text":"يمتد العالم الإسلامي في أربع قارات هي آسيا وأفريقيا وأوربا وأمريكا الجنوبية","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f5","tag":"اسم","text":"يقع وطني الكويت في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","source":"موثّق · ص ٢٨"},{"id":"f6","tag":"اسم","text":"خريطة العالم الإسلامي شكل (٨) مكتوب عليها القارات: آسيا وأفريقيا وأستراليا وأمريكا الشمالية وأمريكا الجنوبية، والمحيطات الخمسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨ — شكل (٨)"}],"pairs":[{"a":"العالم الإسلامي","b":"نصف السكان مسلمون فأكثر","obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"a":"أربع قارات","b":"آسيا وأفريقيا وأوربا وأمريكا","obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"a":"وطني الكويت","b":"في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","from":"f5"},{"a":"موقع متوسط","b":"بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"a":"مساحة واسعة","b":"شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","from":"f2"}],"questions":[{"q":"ما نسبة المسلمين في دول العالم الإسلامي؟","options":["٤٠٪ فأكثر","٥٠٪ فأكثر","٦٥٪ فأكثر"],"answer":1,"obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"q":"ما مساحة العالم الإسلامي من اليابسة؟","options":["مساحة واسعة شبه متصلة","مساحة صغيرة متفرقة","مساحة متقطعة بين البحار"],"answer":0,"obj":"KW-SOC-G5-LOC-05-02","from":"f2"},{"q":"ما موقع العالم الإسلامي بين قارات العالم؟","options":["موقعاً طرفياً بعيداً","موقعاً في قارة واحدة","موقعاً متوسطاً"],"answer":2,"obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"q":"في كم قارة يمتد العالم الإسلامي؟","options":["ثلاث قارات","أربع قارات","خمس قارات"],"answer":1,"obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"q":"أين يقع وطني الكويت من العالم الإسلامي؟","options":["في شمال العالم الإسلامي","في غرب العالم الإسلامي","في وسط العالم الإسلامي"],"answer":2,"obj":"KW-SOC-G5-LOC-05-03","from":"f5"}],"sequences":[],"categories":[],"places":[],"note_questions":"خمسة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «٤٠٪ فأكثر» و«٦٥٪ فأكثر» (f1): على بُعد ٢٠٪ و٣٠٪ من الصحيح — قريبان فلا يُستبعدان بالشكل، والنسبة هي بيت القصيد في التعريف.\n• «مساحة صغيرة متفرقة» و«مساحة متقطعة بين البحار» (f2): يقلبان «الواسعة شبه المتصلة» إلى ضدّها — وهو تصوّر شائع عند طفلة ترى الدول مبعثرة على الخريطة.\n• «موقعاً طرفياً بعيداً» و«موقعاً في قارة واحدة» (f3): الأول يقلب «المتوسط»، والثاني يخلط الموقع المتوسط بالانحصار في قارة — وهو الخطأ الذي يسبق الفكرة.\n• «ثلاث قارات» و«خمس قارات» (f4): العددان المجاوران للصحيح صعوداً وهبوطاً (٢٥٪ لكلٍّ).\n• «في شمال العالم الإسلامي» و«في غرب العالم الإسلامي» (f5): جهتان بدل «الوسط» — والكويت تقع شمال الخليج في الدرس الثالث، فالخلط بين الموقعين وارد.","note_facts":"ستّ حقائق: خمس من نصّ الدرس ص ٢٨، وواحدة من أسماء شكل (٨). ونصّ الكتاب يكتب «أوربا» في هذا الدرس و«أوروبا» في غيره — نُقلت كما طُبعت هنا.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (١٠–١٥ محرفاً).","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٨ (٢١–٣٠ محرفاً، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** لا تاريخ ولا مراحل ولا ترتيب في الصفحتين؛ القارات الأربع تُذكر عدّاً لا ترتيباً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «القارات التي يمتد فيها العالم الإسلامي (آسيا · أفريقيا · أوربا · أمريكا الجنوبية) مقابل ما لم يُذكر منها على الخريطة (أستراليا · أمريكا الشمالية)» — أربعة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، ولا يحمل الدرس غيره: نشاط ص ٢٩ ثلاثة فراغات بلا أجوبة مطبوعة، وأشكال القارات فيه صُوَرٌ صمّاء بلا أسماء."}};

<script>
(function () {
  const KEY = 'shift.session.v1';
  const LAST = 'shift.session.last.v1';

  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
    catch (e) { console.warn('SHIFT: تعذّرت قراءة الحالة —', e && e.message); return null; }
  }

  function write(s) {
    try {
      localStorage.setItem(KEY, JSON.stringify(s));
       
      const back = JSON.parse(localStorage.getItem(KEY) || 'null');
      return !!back && back.at === s.at;
    } catch (e) { console.warn('SHIFT: تعذّر حفظ الحالة —', e && e.message); return false; }
  }

  function Store() {
    const self = { state: read() };
    self.open = init => { self.state = Object.assign({ at: Date.now() }, init || {}); write(self.state); return self.state; };
    self.patch = fields => {
      self.state = Object.assign({}, self.state || {}, fields, { at: Date.now() });
      return write(self.state);
    };
    self.clear = () => { try { localStorage.removeItem(KEY); } catch (e) {} self.state = null; };
     
    self.keepLast = s => { try { localStorage.setItem(LAST, JSON.stringify(s || {})); } catch (e) {} };
    self.last = () => { try { return JSON.parse(localStorage.getItem(LAST) || 'null'); } catch (e) { return null; } };
    return self;
  }

  const PICK = 'shift.lesson.v1';
  Store.pick = id => {
    try { localStorage.setItem(PICK, String(id || '')); return true; }
    catch (e) { console.warn('SHIFT: تعذّر حفظ اختيار الدرس —', e && e.message); return false; }
  };
  Store.picked = () => { try { return localStorage.getItem(PICK) || ''; } catch (e) { return ''; } };

  const BANK = 'shift.play.v1';
  Store.pickBank = (id, engine) => {
    try {
      if (!id) { localStorage.removeItem(BANK); return true; }
      localStorage.setItem(BANK, JSON.stringify({ id: String(id), engine: String(engine || 'quiz') }));
      const back = JSON.parse(localStorage.getItem(BANK) || 'null');
      return !!back && back.id === String(id);
    } catch (e) { console.warn('SHIFT: تعذّر حفظ اختيار المسابقة —', e && e.message); return false; }
  };
  Store.pickedBank = () => {
    try { const v = JSON.parse(localStorage.getItem(BANK) || 'null'); return (v && v.id) ? v : null; }
    catch (e) { console.warn('SHIFT: تعذّرت قراءة اختيار المسابقة —', e && e.message); return null; }
  };
  Store.clearBank = () => { try { localStorage.removeItem(BANK); return true; } catch (e) { return false; } };

  const G = (typeof window !== 'undefined' ? window : globalThis);
  G.SHIFT = G.SHIFT || {}; G.SHIFT.Store = Store;
  if (typeof module !== 'undefined' && module.exports) module.exports = Store;
})();

</script>

(function () {
  const G = (typeof window !== 'undefined' ? window : globalThis);
  const H = {};

  H.ROUTES = { hub: 'index.html', play: 'play.html', report: 'report.html' };

  H.back = () => { if (G.history && G.history.length > 1) G.history.back(); else H.go('hub'); };

  H.param = k => { try { return new URLSearchParams(G.location.search).get(k); } catch (e) { return null; } };

  H.print = () => { try { G.print(); return true; } catch (e) { console.warn('SHIFT: تعذّرت الطباعة —', e && e.message); return false; } };

  H.share = async (text, title) => {

    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    try { await G.navigator.clipboard.writeText(text); return 'copied'; }
    catch (e) { console.warn('SHIFT: تعذّر النسخ —', e && e.message); return 'manual'; }

  G.SHIFT = G.SHIFT || {}; G.SHIFT.host = H;

<script>
(function () {
  const G = (typeof window !== 'undefined' ? window : globalThis);
  const S = G.SHIFT = G.SHIFT || {};
  const B = {};

  B.LIM = { min: 2, max: 4, q: 90, a: 40 };
   
  B.FIT = {
    quiz:   { name: 'سباق المعرفة',  min: 2, max: 4 },
    runner: { name: 'عدّاء الديرة',  min: 3, max: 3 },
  };

  const ORD = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع',
    'الثامن', 'التاسع', 'العاشر', 'الحادي عشر', 'الثاني عشر'];
  const ord = i => ORD[i] || String(i + 1);
   
  const stripNum = s => String(s).replace(/^\s*(?:[0-9٠-٩]{1,2}|[أ-ي])\s*[\).\-–—:]\s*/, '').trim();
   
  const stripBullet = s => String(s).replace(/^\s*[-–—•·]\s*/, '').trim();
   
  const MARK = /[*✓✔️√☑✅★☆]/;
  function unmark(line) {
    let t = String(line).trim(), on = false;
    const head = t.match(/^\s*(?:صح|الصحيحة|الإجابة|الجواب)\s*[:：]\s*/);
    if (head) { on = true; t = t.slice(head[0].length); }
    const tail = t.match(/\s*[*✓✔️√☑✅★☆]+\s*$/);
    if (tail) { on = true; t = t.slice(0, t.length - tail[0].length); }
    const lead = t.match(/^\s*[*✓✔️√☑✅★☆]+\s*/);
    if (lead) { on = true; t = t.slice(lead[0].length); }
    return { t: stripBullet(stripNum(t)), on };
  }

  B.parse = function (text) {
    const L = B.LIM;
    const raw = String(text || '').replace(/\r/g, '');
     
    const lines = raw.split('\n').map(l => l.trim());
    const isQ = l => /[؟?]\s*$/.test(l);
    let blocks = [], cur = [];
    const flush = () => { if (cur.length) blocks.push(cur); cur = []; };
    for (const l of lines) {
      if (!l) { flush(); continue; }
      if (isQ(l) && cur.length >= 3) flush();
      cur.push(l);
    }
    flush();

    let head = [];
    const usable = blocks.filter(b => b.length >= 3).length;
    if (blocks.length && usable * 2 < blocks.length && lines.some(isQ)) {
      blocks = []; cur = []; head = [];
      for (const l of lines) {
        if (!l) continue;                                    
        if (isQ(l)) { flush(); cur.push(l); continue; }
        if (!cur.length && !blocks.length) { head.push(l); continue; }
        cur.push(l);
      }
      flush();
    }

    const items = [], problems = [], dropped = [];
    if (head.length) problems.push('تُرك ما قبل أول سؤال (' + head.length + (head.length === 1 ? " سطر): «" : " أسطر), أوّلها: «") + head[0].slice(0, 26) + '».');
    blocks.forEach((b, i) => {
      const q = stripBullet(stripNum(b[0]));
      const short = q.length > 26 ? q.slice(0, 26) + '…' : q;
      const label = 'السؤال ' + ord(i) + (q ? ' «' + short + '»' : '');
      const bad = msg => { problems.push(label + ': ' + msg); dropped.push(short || ('السؤال ' + ord(i))); };
      const rest = b.slice(1).map(unmark).filter(x => x.t);

      if (!q) return bad('لا يوجد نص للسؤال.');
      if (!rest.length) return bad('بلا إجابات — اكتب تحته إجابتين على الأقل.');
      if (rest.length < L.min) return bad('إجابة واحدة فقط — المطلوب ' + L.min + ' على الأقل.');
      if (rest.length > L.max) return bad(rest.length + ' إجابات — الحدّ ' + L.max + '.');
      const marked = rest.filter(x => x.on);
      if (marked.length > 1) return bad('حدّدت ' + marked.length + ' إجابات صحيحة — الصحيحة واحدة فقط.');
      const texts = rest.map(x => x.t);
      if (new Set(texts).size !== texts.length) return bad('تكرّرت إجابة — الإجابات يجب أن تختلف.');
      if (q.length > L.q) return bad('نصّ السؤال طويل (' + q.length + ' حرفاً) — اختصره إلى ' + L.q + '.');
      const over = texts.find(x => x.length > L.a);
      if (over) return bad('إجابة طويلة («' + over.slice(0, 18) + '…») — اختصرها إلى ' + L.a + ' حرفاً.');

      items.push({ q, a: texts, c: marked.length ? rest.findIndex(x => x.on) : -1 });
    });
    return { items, problems, dropped, blocks: blocks.length };
  };

  B.pending = items => (items || []).filter(it => it.c < 0).length;
   
  B.ready = items => (items || []).filter(it => it.c >= 0);

  B.fits = (it, key) => {
    const f = B.FIT[key]; if (!f || !it) return false;
    const n = (it.a || []).length;
    return it.c >= 0 && n >= f.min && n <= f.max;
  };
   
  const COUNT = ['', 'الواحد', 'الاثنين', 'الثلاثة', 'الأربعة', 'الخمسة', 'الستّة',
    'السبعة', 'الثمانية', 'التسعة', 'العشرة'];
   
  const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
  B.fitLine = function (items, key) {
    const f = B.FIT[key]; if (!f) return '';
    const ready = B.ready(items), n = ready.filter(it => B.fits(it, key)).length;
    if (!ready.length) return '';
    if (n === ready.length) return f.name + ' يقبلها كلّها';
    const need = f.min === f.max ? ('يحتاج ' + AR(f.min) + ' خيارات')
      : ('يحتاج ' + AR(f.min) + '–' + AR(f.max) + ' خيارات');
    const whole = COUNT[ready.length] ? ('أسئلتك ' + COUNT[ready.length]) : ('أسئلتك الـ' + AR(ready.length));
    return AR(n) + ' من ' + whole + ' تعمل في ' + f.name + ' (' + need + ')';
  };

  B.serialize = items => (items || []).map(it =>
    [it.q].concat((it.a || []).map((t, k) => t + (k === it.c ? ' *' : ''))).join('\n')
  ).join('\n\n');

  const KEY = 'shift.bank.v1';
  const read = () => {
    try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); return (v && Array.isArray(v.games)) ? v : { games: [] }; }
    catch (e) { console.warn('SHIFT: تعذّرت قراءة بنك الأسئلة —', e && e.message); return { games: [] }; }
  };
   
  const write = v => {
    try {
      localStorage.setItem(KEY, JSON.stringify(v));
      const back = JSON.parse(localStorage.getItem(KEY) || 'null');
      return !!back && (back.games || []).length === (v.games || []).length;
    } catch (e) { console.warn('SHIFT: تعذّر حفظ بنك الأسئلة —', e && e.message); return false; }
  };

  B.list = () => read().games.map(g => ({ id: g.id, title: g.title, n: (g.items || []).length, at: g.at, grade: g.grade || '' }))
    .sort((a, b) => (b.at || 0) - (a.at || 0));
  B.get = id => read().games.find(g => g.id === id) || null;

  B.GRADES = [
    { id: 'g4', name: 'الصف الرابع' },
    { id: 'g5', name: 'الصف الخامس' },
    { id: '',   name: 'بلا صفّ' },
  ];
  B.gradeName = g => (B.GRADES.find(x => x.id === (g || '')) || B.GRADES[2]).name;

  B.setMeta = function (id, fields) {
    const v = read();
    const g = v.games.find(x => x.id === id);
    if (!g) return { ok: false, why: 'لم تعد هذه المسابقة على الجهاز.' };
    if (typeof fields.title === 'string') {
      const t = fields.title.trim().slice(0, 40);
      if (!t) return { ok: false, why: 'الاسم لا يكون فارغاً.' };
      g.title = t;
    }
    if (typeof fields.grade === 'string') g.grade = B.GRADES.some(x => x.id === fields.grade) ? fields.grade : '';
    g.at = (S.nowOverride || Date.now());
    const ok = write(v);
    return { ok, why: ok ? '' : 'لم يُحفظ التعديل على هذا الجهاز.' };
  };

  B.save = function (title, items, id) {
    const v = read();
    const now = (S.nowOverride || Date.now());
    const clean = (items || []).filter(it => it && it.q && (it.a || []).length >= B.LIM.min);
    if (!clean.length) return { ok: false, why: 'لا سؤال مكتمل لحفظه.' };
    const gid = id || ('G' + now.toString(36) + Math.floor(now % 997).toString(36));
    const k0 = v.games.findIndex(x => x.id === gid);
     
    const keep = k0 >= 0 ? (v.games[k0].grade || '') : '';
    const g = { id: gid, title: String(title || 'أسئلتي').slice(0, 40), items: clean, at: now, grade: keep };
    const k = v.games.findIndex(x => x.id === gid);
    if (k >= 0) v.games[k] = g; else v.games.unshift(g);
     
    let trimmed = 0;
    while (v.games.length > 40) { v.games.pop(); trimmed++; }
    const ok = write(v);
    return { ok, id: gid, trimmed, why: ok ? '' : 'لم تُحفظ على هذا الجهاز — تعمل الآن فقط. انسخ نصّ أسئلتك.' };
  };

  B.remove = function (id) {
    const v = read(); const n = v.games.length;
    v.games = v.games.filter(g => g.id !== id);
    if (v.games.length === n) return false;
    return write(v);
  };

  S.bank = B;
  if (typeof module !== 'undefined' && module.exports) module.exports = B;
})();

<script>
(function () {
  const G = (typeof window !== 'undefined' ? window : globalThis);
  const S = G.SHIFT = G.SHIFT || {};

  const REG = [];
  const BY = {};

  const MUST = ['id', 'name', 'line', 'comeback', 'kind', 'keys'];

  const KEY_SETS = {
    verb:     ['اختيار', 'سحب وفرز', 'توقيت ضغطة', 'رسم', 'حركة جسد', 'رهان'],
    relation: ['فرق ضد فرق', 'الفصل ضد الوقت', 'الفصل ضد المعلّم'],
    second:   ['اقتصاد', 'بناء', 'أرض', 'مطاردة', 'كشف', 'حظّ', 'لا شيء'],
    form:     ['سؤال بخيارات', 'أزواج', 'بطاقة حكم', 'قائمة مصطلحات'],
  };
   
  const KINDS = ['تخطيط', 'سرعة', 'حركة', 'رسم', 'تعاون', 'حظّ'];

  const Games = {
     
    define(spec) {
      const miss = MUST.filter(k => !spec || !spec[k]);
      if (spec && !spec.mount && !spec.page) miss.push('mount أو page');
      if (miss.length) {
        console.warn('SHIFT: لعبة مرفوضة — ينقصها ' + miss.join('، ') +
          (miss.indexOf('comeback') >= 0 ? ' (آلية العودة شرطٌ في العقد: لا فوز محسوم مبكراً)' : ''));
        return false;
      }
      if (BY[spec.id]) { console.warn('SHIFT: لعبة مكرّرة — ' + spec.id); return false; }
       
      const badKey = Object.keys(KEY_SETS).filter(k => KEY_SETS[k].indexOf((spec.keys || {})[k]) < 0);
      if (badKey.length || KINDS.indexOf(spec.kind) < 0) {
        console.warn('SHIFT: لعبة مرفوضة — ' + spec.id + ': مفتاحٌ خارج القائمة (' +
          badKey.concat(KINDS.indexOf(spec.kind) < 0 ? ['kind'] : []).join('، ') + ')');
        return false;
      }
      const g = Object.assign({
        mins: [8, 15],
        teams: { min: 2, max: 4 },
        need: { min: 2, max: 4 },
        minQ: 4,
        art: () => '',
        world: 'sea',
      }, spec);
      REG.push(g); BY[g.id] = g;
      return true;
    },

    all: () => REG.slice(),
    KEY_SETS: KEY_SETS,
    KINDS: KINDS,

    clash() {
      const out = [];
      for (let i = 0; i < REG.length; i++) for (let j = i + 1; j < REG.length; j++) {
        const a = REG[i], b = REG[j];
        const same = Object.keys(KEY_SETS).filter(k => a.keys[k] === b.keys[k]);
        if (same.length > 2) out.push({ a: a.id, b: b.id, same: same, on: same.map(k => a.keys[k]) });
      }
      return out;
    },
    get: id => BY[id] || null,

    fits(item, id) {
      const g = BY[id]; if (!g || !item) return false;
      const n = (item.a || []).length;
      return item.c >= 0 && item.c < n && n >= g.need.min && n <= g.need.max;
    },

    prep(items, id, seed) {
      const g = BY[id]; if (!g) return [];
      const ok = (items || []).filter(it => Games.fits(it, id));
      return Games.shuffle(ok, seed);
    },

    seed(str) {
      let h = 2166136261;
      const t = String(str || '');
      for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0) || 1;
    },
    rng(seed) {
      let x = seed >>> 0 || 1;
      return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
    },
    shuffle(arr, seed) {
      const a = (arr || []).slice(), r = Games.rng(typeof seed === 'number' ? seed : Games.seed(String(seed)));
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    },

    fitLine(items, id) {
      const g = BY[id]; if (!g) return '';
      const ready = (items || []).filter(it => it && it.c >= 0);
      if (!ready.length) return '';
      const n = ready.filter(it => Games.fits(it, id)).length;
      if (n === ready.length) return 'كل أسئلتك تعمل هنا';
       
      const need = g.need.min === g.need.max
        ? ('تحتاج ' + AR(g.need.min) + ' خيارات')
        : ('تحتاج من ' + AR(g.need.min) + ' إلى ' + AR(g.need.max) + ' خيارات');
      return AR(n) + ' من ' + AR(ready.length) + ' تعمل هنا (' + need + ')';
    },

    ready(items, id) {
      const g = BY[id]; if (!g) return { ok: false, why: 'لعبة غير معروفة.' };
      const n = (items || []).filter(it => Games.fits(it, id)).length;
      if (n < g.minQ) return { ok: false, n, why: 'تحتاج ' + AR(g.minQ) + ' أسئلة على الأقل، وعندك ' + AR(n) + '.' };
      return { ok: true, n };
    },
  };

  const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
  Games.AR = AR;

  Games.TEAMS = [
    { id: 't1', name: 'اللؤلؤ', color: 'var(--sea-t1)' },
    { id: 't2', name: 'السدو', color: 'var(--sea-t2)' },
    { id: 't3', name: 'النخلة', color: 'var(--sea-t3)' },
    { id: 't4', name: 'الشراع', color: 'var(--sea-t4)' },
  ];
  Games.teamSet = n => Games.TEAMS.slice(0, Math.max(2, Math.min(4, n | 0 || 3)))
    .map(t => Object.assign({ score: 0 }, t));

  S.games = Games;
  if (typeof module !== 'undefined' && module.exports) module.exports = Games;
})();

(function () {
  const G = (typeof window !== 'undefined' ? window : globalThis);
  const S = G.SHIFT = G.SHIFT || {};

  const good = it => !!it && !!it.q && Array.isArray(it.a) && it.c >= 0 && it.c < it.a.length;
  const shuffle = (arr, seed) => (S.games ? S.games.shuffle(arr, seed) : (arr || []).slice());

  const F = {
     
    pairs(items, seed, max) {
      const out = shuffle((items || []).filter(good), seed)
        .map(it => ({ q: it.q, a: it.a[it.c] }));
      return max ? out.slice(0, max) : out;
    },

    judge(items, seed, max) {
      const src = shuffle((items || []).filter(good), seed);
      const out = [];
      src.forEach((it, n) => {
        const wrongs = it.a.filter((_, k) => k !== it.c);
         
        const asTrue = (n % 2 === 0) || !wrongs.length;
        const shown = asTrue ? it.a[it.c] : wrongs[n % wrongs.length];
        out.push({ q: it.q, shown: shown, ok: asTrue, right: it.a[it.c] });
      });
      return max ? out.slice(0, max) : out;
    },

    terms(items, seed, max, maxLen) {
      const lim = maxLen || 28;
      const seen = Object.create(null), out = [];
      shuffle((items || []).filter(good), seed).forEach(it => {
        const t = String(it.a[it.c] || '').trim();
        if (!t || t.length > lim || seen[t]) return;
        seen[t] = 1; out.push({ t: t, q: it.q });
      });
      return max ? out.slice(0, max) : out;
    },

    count(items, form, seed) {
      if (form === 'أزواج') return F.pairs(items, seed).length;
      if (form === 'بطاقة حكم') return F.judge(items, seed).length;
      if (form === 'قائمة مصطلحات') return F.terms(items, seed).length;
      return (items || []).filter(good).length;
    },
  };

  S.forms = F;
  if (typeof module !== 'undefined' && module.exports) module.exports = F;
})();

        '</svg>';
    },

    mount(el, api) {
      let i = 0, locked = false;

      function bonus() {
         
        const top = Math.max.apply(null, api.teams.map(t => t.score || 0).concat([0]));
        return (top - (api.teams[api.turn()].score || 0)) >= 3 ? 2 : 1;
      }

      function draw() {
        const q = api.qs[i];
        if (!q) return api.finish();
        api.step(i, api.qs.length);
        const pts = bonus();
        el.innerHTML =
          (pts > 1 ? '<p class="gw-tag">سؤال الفرصة — بنقطتين</p>' : '') +
          '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
          '<div class="gw-opts">' + q.a.map((t, k) =>
            '<button class="gw-opt" type="button" data-k="' + k + '">' +
              '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(t) + '</span>' +
            '</button>').join('') + '</div>';
        el.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function choose(k) {
        if (locked) return;
        locked = true;
        const q = api.qs[i], ok = k === q.c, pts = bonus();
        el.querySelectorAll('.gw-opt').forEach((b, n) => {
          b.disabled = true;
          if (n === q.c) b.dataset.st = 'ok';
          else if (n === k) b.dataset.st = 'no';
        });
        if (ok) api.score(api.turn(), pts);
        api.judge(ok, { text: ok ? (pts > 1 ? 'صحيح — نقطتان' : 'صحيح') : 'خطأ' });
        setTimeout(() => {
          locked = false; i++; api.nextTurn();
          if (i >= api.qs.length) { api.step(api.qs.length, api.qs.length); api.finish(); }
          else draw();
        }, 1500);
      }

      draw();
      return { destroy() { locked = true; } };
    },
  });
})();

      const dbl = () => live() <= 2;

      let open = null, locked = false, timer = 0;

      function pts(v) {
        if (v === 1) return 'نقطة';
        if (v === 2) return 'نقطتان';
        return api.AR(v) + ' نقاط';
      }

      function board() {
        open = null;
        api.step(total - live(), total);
        if (!live()) return api.finish();

        const x2 = dbl();
        let h = '<div class="bd-line">' +
            (x2 ? '<p class="gw-tag">آخر مربّعين — نقاطهما مضاعفة</p>' : '') +
            '<p class="gw-head">دور ' + api.esc(api.teams[api.turn()].name) + ' — اختر مربّعاً</p>' +
          '</div>' +
          '<div class="bd-wrap"><div class="bd-grid" style="--bd-cols:' + cols + '">';

        for (let c = 0; c < cols; c++) h += '<div class="bd-cat">المجموعة ' + ORD[c] + '</div>';

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < cols; c++) {
            const t = tiles[c * 3 + r];
            if (!t.q) { h += '<span></span>'; continue; }
            if (t.off) { h += '<span class="bd-tile" data-off="1">' + MARK + '</span>'; continue; }
            const v = t.pts * (x2 ? 2 : 1);
            h += '<button class="bd-tile" type="button" data-i="' + (c * 3 + r) + '"' +
              (x2 ? ' data-x="1"' : '') +
              ' aria-label="المجموعة ' + ORD[c] + ' — ' + pts(v) + '">' + api.AR(v) + '</button>';
          }
        }
        h += '</div></div>';
        el.innerHTML = h;
        el.querySelectorAll('[data-i]').forEach(b => { b.onclick = () => pickTile(+b.dataset.i); });
      }

      function pickTile(i) {
        if (locked) return;
        const t = tiles[i];
        if (!t || t.off || !t.q) return;
         
        t.val = t.pts * (dbl() ? 2 : 1);
        open = t;
        api.sfx('pop');
        ask();
      }

      function ask() {
        const t = open, q = t.q;
         
        el.innerHTML =
          '<div class="bd-ask">' +
            '<div class="bd-line">' +
              (t.val > t.pts ? '<p class="gw-tag">آخر مربّعين — نقاطهما مضاعفة</p>' : '') +
              '<p class="gw-sub">المجموعة ' + ORD[t.c] + ' — ' + pts(t.val) + '</p>' +
            '</div>' +
            '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
            '<div class="gw-opts">' + q.a.map((x, k) =>
              '<button class="gw-opt" type="button" data-k="' + k + '">' +
                '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(x) + '</span>' +
              '</button>').join('') + '</div>' +
          '</div>';
        el.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function choose(k) {
        if (locked || !open) return;
        locked = true;
        const t = open, q = t.q, ok = k === q.c;
        el.querySelectorAll('.gw-opt').forEach((b, x) => {
          b.disabled = true;
          if (x === q.c) b.dataset.st = 'ok';
          else if (x === k) b.dataset.st = 'no';
        });
        if (ok) api.score(api.turn(), t.val);
        api.judge(ok, { text: ok ? ('صحيح — ' + pts(t.val)) : 'خطأ — لا نقاط' });
        timer = setTimeout(() => {
          locked = false;
           
          t.off = true;
          api.nextTurn();
          board();
        }, 1500);
      }

      board();
      return { destroy() { locked = true; clearTimeout(timer); } };
    },
  });
})();

<script>
(function () {
  const S = (typeof window !== 'undefined' ? window : globalThis).SHIFT;
  const KEY = ['أ', 'ب', 'ج', 'د'];

  const PTS = n => (n >= 3 && n <= 10 ? ' نقاط' : ' نقطة');

  function closed() {
    return '<svg viewBox="0 0 100 86" aria-hidden="true">' +
      '<path d="M9,54 C9,26 97,26 97,54 C97,78 9,78 9,54 Z" fill="var(--sea-ink)"/>' +
      '<path d="M6,50 C6,74 94,74 94,50 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
      '<path d="M6,50 C6,22 94,22 94,50 Z" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="3"/>' +
      '<g stroke="var(--sea-closed-mark)" stroke-width="2.5" stroke-linecap="round">' +
        '<path d="M50,49 L26,44"/><path d="M50,49 L35,33"/><path d="M50,49 L50,28"/>' +
        '<path d="M50,49 L65,33"/><path d="M50,49 L74,44"/>' +
      '</g>' +
      '<path d="M6,50 L94,50" stroke="var(--sea-ink)" stroke-width="3" stroke-linecap="round"/>' +
      '</svg>';
  }

  function bead(kind) {
    if (kind === 'dana') {
      return '<circle cx="50" cy="50" r="15" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<circle cx="44" cy="44" r="4" fill="var(--sea-white)"/>';
    }
    if (kind === 'pearl') {
      return '<circle cx="50" cy="52" r="9" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<circle cx="46" cy="48" r="2.5" fill="var(--sea-sand)"/>';
    }
    return '<circle cx="50" cy="52" r="15" fill="var(--sea-t4)" stroke="var(--sea-ink)" stroke-width="3"/>' +
      '<g fill="none" stroke="var(--sea-white)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M41,47 L57,47"/><path d="M53,43 L57,47 L53,51"/>' +
        '<path d="M59,57 L43,57"/><path d="M47,53 L43,57 L47,61"/>' +
      '</g>';
  }

  function opened(kind) {
    return '<svg viewBox="0 0 100 86" aria-hidden="true">' +
      '<path d="M9,58 C9,82 97,82 97,58 Z" fill="var(--sea-ink)"/>' +
      '<g transform="rotate(-24 6 54)">' +
        '<path d="M6,54 C6,26 94,26 94,54 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<g stroke="var(--sea-closed-mark)" stroke-width="2.5" stroke-linecap="round">' +
          '<path d="M50,53 L30,48"/><path d="M50,53 L38,38"/><path d="M50,53 L62,38"/><path d="M50,53 L70,48"/>' +
        '</g>' +
      '</g>' +
      bead(kind) +
      '<path d="M6,54 C6,78 94,78 94,54 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
      '<path d="M14,58 C16,70 84,70 86,58" fill="none" stroke="var(--sea-sand)" stroke-width="4" stroke-linecap="round"/>' +
      '</svg>';
  }

  function css() {
    if (typeof document === 'undefined' || document.getElementById('css-oyster')) return;
    const s = document.createElement('style');
    s.id = 'css-oyster';
    s.textContent = [
      '.oy-row{ width:min(34em,100%); display:flex; flex-wrap:nowrap; justify-content:center;',
      '  align-items:flex-end; gap:.5em; }',
      '.oy{ font:inherit; flex:1 1 0; min-width:0; max-width:min(11em,30vh);',
      '  min-height:max(44px,5em); padding:.4em .3em; cursor:pointer;',
      '  display:flex; flex-direction:column; align-items:center; gap:.2em;',
      '  background:var(--sea-white); color:var(--sea-ink);',
      '  border:var(--sea-bd) solid var(--sea-ink); border-radius:var(--sea-r);',
      '  box-shadow:0 4px 0 var(--sea-ink); }',
      '.oy:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--sea-ink); }',
      '.oy[disabled]{ cursor:default; }',
      '.oy svg{ width:100%; height:auto; display:block; }',
      '.oy b{ font-family:var(--sea-display); font-weight:800; font-size:clamp(14px,1.15em,34px);',
      '  line-height:1.2; text-align:center; white-space:nowrap; }',
      '.oy[data-st="pick"]{ background:var(--sea-sun); }',
      '.oy[data-st="miss"]{ opacity:.55; box-shadow:none; }',
       
      '@media (max-height:460px){',
      '  .oy{ max-width:min(11em,22vh); min-height:44px; padding:.25em; gap:.1em; }',
      '  .oy svg{ max-height:16vh; }',
      '  .oy b{ font-size:clamp(13px,.95em,26px); }',
      '}',
    ].join('\n');
    document.head.appendChild(s);
  }

  S.games.define({
    kind: 'حظّ',
     
    keys: { verb: 'رهان', relation: 'فرق ضد فرق', second: 'حظّ', form: 'سؤال بخيارات' },
    id: 'oyster',
    name: 'المحار',
    line: 'أجب صحيحاً، ثم افتح محارة: دانة أو لؤلؤة أو تبديل مراكز.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 5,
    comeback: 'محارة التبديل تقلب نقاط المتصدّر والأخير',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="10" width="108" height="58" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<path d="M16,52 C16,62 42,62 42,52 Z" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M16,52 C16,40 42,40 42,52 Z" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M78,52 C78,62 104,62 104,52 Z" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M78,52 C78,40 104,40 104,52 Z" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<g transform="rotate(-24 48 54)">' +
          '<path d="M48,54 C48,40 72,40 72,54 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '</g>' +
        '<circle cx="60" cy="50" r="8" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M48,54 C48,66 72,66 72,54 Z" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '</svg>';
    },

    mount(el, api) {
      css();
      let i = 0, locked = false, gone = false;
      const timers = [];
       
      function wait(ms, fn) { timers.push(setTimeout(() => { if (!gone) fn(); }, ms)); }

      function ranks() {
        let hi = 0, lo = 0;
        api.teams.forEach((t, k) => {
          if ((t.score || 0) > (api.teams[hi].score || 0)) hi = k;
          if ((t.score || 0) < (api.teams[lo].score || 0)) lo = k;
        });
        return { hi: hi, lo: lo, gap: (api.teams[hi].score || 0) - (api.teams[lo].score || 0) };
      }

      function fill() {
        const r = ranks();
        const armed = r.gap >= 3;
        const slots = armed
          ? ['dana', 'pearl', 'swap']
          : (api.rnd() < 0.35 ? ['dana', 'dana', 'pearl'] : ['dana', 'pearl', 'pearl']);
        for (let k = slots.length - 1; k > 0; k--) {
          const j = Math.floor(api.rnd() * (k + 1));
          const t = slots[k]; slots[k] = slots[j]; slots[j] = t;
        }
        return { slots: slots, armed: armed, gap: r.gap };
      }

      let bet = 'deep';
      function wager() {
        const q = api.qs[i];
        if (!q) return api.finish();
        api.step(i, api.qs.length);
        locked = false;
        el.innerHTML =
          '<p class="gw-head">دور ' + api.esc(api.teams[api.turn()].name) + ' — كم تخاطر؟</p>' +
          '<div class="oy-row">' +
            '<button class="oy" type="button" data-bet="near">' + closed() +
              '<b>محارة قريبة</b></button>' +
            '<button class="oy" type="button" data-bet="deep">' + closed() +
              '<b>غوصة عميقة</b></button>' +
          '</div>' +
          '<p class="gw-sub">القريبة: نقطة على الصحيح. والعميقة: نقطتان ومحارة — ولا شيء على الخطأ.</p>';
        el.querySelectorAll('[data-bet]').forEach(b => { b.onclick = () => {
          if (locked) return; locked = true; bet = b.dataset.bet; api.sfx('pop'); ask();
        }; });
      }

      function ask() {
        const q = api.qs[i];
        if (!q) return api.finish();
        locked = false;
        el.innerHTML =
          '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
          '<div class="gw-opts">' + q.a.map((t, k) =>
            '<button class="gw-opt" type="button" data-k="' + k + '">' +
              '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(t) + '</span>' +
            '</button>').join('') + '</div>';
        el.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => answer(+b.dataset.k); });
      }

      function answer(k) {
        if (locked) return;
        locked = true;
        const q = api.qs[i], ok = k === q.c;
        el.querySelectorAll('.gw-opt').forEach((b, n) => {
          b.disabled = true;
          if (n === q.c) b.dataset.st = 'ok';
          else if (n === k) b.dataset.st = 'no';
        });
        const deep = bet === 'deep';
        if (ok) api.score(api.turn(), deep ? 2 : 1);
        api.judge(ok, { text: ok ? (deep ? 'صحيح — نقطتان ولك محارة' : 'صحيح — نقطة') : 'خطأ' });
         
        wait(1300, () => { if (ok && deep) board(); else step(); });
      }

      function board() {
        const F = fill();
        el.innerHTML =
          '<p class="gw-head">إجابة صحيحة — افتح محارة</p>' +
          (F.armed
            ? '<p class="gw-tag">محارة التبديل في اللوح — الفارق ' + api.AR(F.gap) + PTS(F.gap) + '</p>'
            : '') +
          '<div class="oy-row">' + F.slots.map((s, k) =>
            '<button class="oy" type="button" data-o="' + k + '">' +
              closed() + '<b>محارة ' + api.AR(k + 1) + '</b>' +
            '</button>').join('') + '</div>' +
          '<p class="gw-sub">المس محارة واحدة لفريقك</p>';
        locked = false;
        el.querySelectorAll('[data-o]').forEach(b => { b.onclick = () => pick(F, +b.dataset.o); });
      }

      function apply(kind) {
        const me = api.turn();
        if (kind === 'dana') { api.score(me, 3); return { text: 'دانة كبيرة — ' + api.AR(3) + PTS(3), tag: '' }; }
        if (kind === 'pearl') { api.score(me, 1); return { text: 'لؤلؤة صغيرة — نقطة واحدة', tag: '' }; }
        const r = ranks();
         
        if (r.gap <= 0) { api.score(me, 1); return { text: 'النقاط متساوية فلا تبديل — لك لؤلؤة', tag: '' }; }
        const hiS = api.teams[r.hi].score || 0, loS = api.teams[r.lo].score || 0;
        api.score(r.hi, loS - hiS);
        api.score(r.lo, hiS - loS);
        return {
          text: 'تبديل المراكز',
          tag: 'تبديل المراكز: ' + api.esc(api.teams[r.hi].name) + ' و' +
               api.esc(api.teams[r.lo].name) + ' تبادلا نقاطهما',
        };
      }

      function pick(F, n) {
        if (locked) return;
        locked = true;
        const got = apply(F.slots[n]);
        api.sfx(F.slots[n] === 'dana' ? 'good' : F.slots[n] === 'swap' ? 'turn' : 'pop');
        api.say(got.text, 'good');
         
        el.innerHTML =
          '<p class="gw-head">' + api.esc(got.text) + '</p>' +
          (got.tag ? '<p class="gw-tag">' + got.tag + '</p>' : '') +
          '<div class="oy-row">' + F.slots.map((s, k) =>
            '<button class="oy" type="button" disabled data-st="' + (k === n ? 'pick' : 'miss') + '">' +
              opened(s) + '<b>' + (s === 'dana' ? 'دانة' : s === 'pearl' ? 'لؤلؤة' : 'تبديل') + '</b>' +
            '</button>').join('') + '</div>';
        wait(2000, step);
      }

      function step() {
        locked = false;
        i++;
        api.nextTurn();
        if (i >= api.qs.length) { api.step(api.qs.length, api.qs.length); return api.finish(); }
        wager();
      }

      wager();
      return {
        destroy() {
          gone = true; locked = true;
          timers.forEach(clearTimeout);
          timers.length = 0;
        },
      };
    },
  });
})();

      '<path d="M' + (cx - f * 5) + ' 47L' + (cx - f * 13) + ' 46" fill="none" stroke="' + INK + '" stroke-width="3.4" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="31" r="7" fill="' + color + '" stroke="' + INK + '" stroke-width="2.6"/>' +

  function board(right, left) {

    return '<svg viewBox="0 0 200 96" aria-hidden="true">' +
      '<rect x="6" y="72" width="188" height="3.5" rx="1.75" fill="' + INK + '"/>' +

      '<rect x="24" y="43" width="152" height="6" rx="3" fill="var(--sea-white)" stroke="' + INK + '" stroke-width="2.6"/>' +
      puller(188, right, 1, '0') +
      puller(12, left, -1, '1') +
      '<g class="tug-mark">' +
        '<rect x="90.5" y="12.5" width="22" height="15" rx="6" fill="' + INK + '"/>' +

      '</svg>';
  }

  S.games.define({
    kind: 'سرعة',
     
    keys: { verb: 'اختيار', relation: 'فرق ضد فرق', second: 'أرض', form: 'سؤال بخيارات' },

    mins: [8, 12],
    teams: { min: 2, max: 4 },         
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'المتأخّر بثلاث خطوات يسحب خطوتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="8" y="62" width="104" height="4" rx="2" fill="var(--sea-ink)"/>' +
        '<rect x="10" y="36" width="100" height="6" rx="3" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="14" y="32" width="14" height="22" rx="6" fill="var(--sea-t2)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<circle cx="21" cy="20" r="8" fill="var(--sea-t2)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="92" y="32" width="14" height="22" rx="6" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<circle cx="99" cy="20" r="8" fill="var(--sea-t1)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="56" y="16" width="10" height="46" rx="5" fill="var(--sea-ink)"/>' +
        '<circle cx="60" cy="39" r="9" fill="var(--sea-coral)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '</svg>';
    },

    mount(el, api) {
      style();
      const AR = api.AR;
      const T = api.teams;
       
      const dir = t => (t % 2 === 0 ? 1 : -1);
       
      const sideOf = d => T.map((t, k) => k).filter(k => dir(k) === d);
       
      const label = d => {
        const ns = sideOf(d).map(k => T[k].name);
        return ns.length === 1 ? 'فريق ' + ns[0] : 'ناحية ' + ns.join(' و');
      };
      const right = label(1), left = label(-1);

      let i = 0, pos = 0, locked = false, over = false, tid = 0;
      const after = (fn, ms) => { clearTimeout(tid); tid = setTimeout(fn, ms); };

      const word = n => (n === 1 ? 'خطوة واحدة' : n === 2 ? 'خطوتان' : AR(n) + ' خطوات');
       
      const lag = t => Math.max(0, dir(t) === 1 ? -pos : pos);
      const gain = t => (lag(t) >= BACK ? 2 : 1);

      el.innerHTML =
        '<div class="tug" data-turn="0">' +
          '<div class="tug-l">' +
            '<div class="tug-b">' + board(api.esc(T[0].color), api.esc(T[1].color)) + '</div>' +
            '<p class="gw-sub tug-st"></p>' +
          '</div>' +
          '<div class="tug-r"></div>' +
        '</div>';

      const wrap = el.querySelector('.tug');
      const mark = el.querySelector('.tug-mark');
      const st = el.querySelector('.tug-st');
      const side = el.querySelector('.tug-r');

      function paint() {
        mark.style.transform = 'translateX(' + (pos * STEP) + 'px)';
        const n = Math.abs(pos);
        const who = pos > 0 ? right : left;
        st.textContent = !n ? 'الحبل في المنتصف'
          : n >= WIN ? 'الحبل كامله مع ' + who
          : 'الحبل مع ' + who + '، وتبقّى ' + word(WIN - n);
      }

      function drawQ() {
        const q = api.qs[i];
        if (!q) return end();
        const t = api.turn();
        api.step(i, api.qs.length);
        wrap.dataset.turn = String(t % 2);
        const dot = el.querySelector('.tug-now[data-t="' + (t % 2) + '"]');
        if (dot) dot.setAttribute('fill', T[t].color);
        side.innerHTML =
          (gain(t) > 1
            ? '<p class="gw-tag">سحبة العودة — إجابة فريق ' + api.esc(T[t].name) + ' الصحيحة تسحب خطوتين</p>'
            : '') +
          '<h2 class="gw-q">' + api.esc(q.q) + '</h2>' +
          '<div class="gw-opts tug-o">' + q.a.map((x, k) =>
            '<button class="gw-opt" type="button" data-k="' + k + '">' +
              '<span class="k">' + (KEY[k] || '') + '</span><span>' + api.esc(x) + '</span>' +
            '</button>').join('') + '</div>';
        side.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => choose(+b.dataset.k); });
      }

      function choose(k) {
        if (locked || over) return;
        locked = true;
        const q = api.qs[i], t = api.turn(), ok = k === q.c;
        side.querySelectorAll('.gw-opt').forEach((b, n) => {
          b.disabled = true;
          if (n === q.c) b.dataset.st = 'ok';
          else if (n === k) b.dataset.st = 'no';
        });

        let got = 0;
        if (ok) {
          const to = Math.max(-WIN, Math.min(WIN, pos + dir(t) * gain(t)));
          got = Math.abs(to - pos);
          pos = to;
           
          if (got) sideOf(dir(t)).forEach(ti => api.score(ti, got));
          paint();
        }
        api.judge(ok, { text: ok ? (got > 1 ? 'صحيح — خطوتان' : 'صحيح — خطوة') : 'خطأ — الحبل مكانه' });

        if (Math.abs(pos) >= WIN) {
          over = true;
          api.step(api.qs.length, api.qs.length);
          api.say('الحبل كامله مع ' + (pos > 0 ? right : left), 'good');
          return after(() => api.finish(), WAIT);
        }
        after(() => {
          locked = false; i++; api.nextTurn();
          if (i >= api.qs.length) return end();
          drawQ();
        }, WAIT);
      }

      function end() {
        over = true;
        api.step(api.qs.length, api.qs.length);
        api.finish();
      }

      paint();
      drawQ();

      return { destroy() { locked = true; over = true; clearTimeout(tid); } };
    },
  });
})();

<script>
(function () {
  const S = (typeof window !== 'undefined' ? window : globalThis).SHIFT;
  const KEY = ['أ', 'ب', 'ج', 'د'];

  const GOAL = 10;           
  const W = 124;             
  const PAD = 5;             
  const LANE = 16;           
  const X0 = 107;            
  const X1 = 16;             
  const DX = (X0 - X1) / GOAL;

  function css() {
    if (typeof document === 'undefined' || document.getElementById('css-race')) return;
    const st = document.createElement('style');
    st.id = 'css-race';
    st.textContent =
      '.rc{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:.5em}' +
       
      '.rc-track{width:100%;flex:1 1 0;min-height:3em;display:grid;place-items:stretch}' +
