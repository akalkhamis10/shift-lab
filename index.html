      '.dw-bar{width:min(34em,100%);flex:none;height:.7em;min-height:12px;overflow:hidden;' +
      'border:2px solid var(--sea-ink);border-radius:999px;background:var(--sea-white)}' +
      '.dw-bar s{display:block;height:100%;text-decoration:none;' +
      'background:var(--sea-teal);transition:width .2s linear}' +
      '.dw-bar[data-low="1"] s{background:var(--sea-coral)}' +
       
      '.dw-pad{flex:1 1 auto;min-height:0;width:min(34em,100%);overflow:hidden;' +
      'border:var(--sea-bd) solid var(--sea-ink);border-radius:var(--sea-r);' +
      'background:var(--sea-white);box-shadow:0 4px 0 var(--sea-ink)}' +
       
      '.dw-pad canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}' +
       
      '.dw-card{width:min(30em,100%);display:flex;flex-direction:column;align-items:center;' +
      'gap:.4em;padding:.6em .7em;border:var(--sea-bd) solid var(--sea-ink);' +
      'border-radius:var(--sea-r);background:var(--sea-white);box-shadow:0 5px 0 var(--sea-ink)}' +
      '.dw-term{margin:0;font-family:var(--sea-display);font-weight:800;text-align:center;' +
      'font-size:clamp(20px,1.5em,44px);line-height:1.25;color:var(--sea-coral);' +
      'overflow-wrap:anywhere}' +
       
      '.dw-row{width:min(34em,100%);display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}' +
      '.dw-b{font:inherit;font-size:clamp(13px,.85em,26px);font-weight:700;cursor:pointer;' +
      'flex:1 1 auto;min-height:44px;padding:0 .8em;border:2px solid var(--sea-ink);' +
      'border-radius:999px;background:var(--sea-white);color:var(--sea-ink)}' +
      '.dw-b:active{transform:translate(1px,1px)}' +
      '.dw-b-main{background:var(--sea-sun);font-weight:800}' +
       
      '@media (max-height:460px){.dw-pad{min-height:96px}.dw-bar{height:.55em}}' +
      '@media (prefers-reduced-motion:reduce){.dw-bar s{transition:none}}';
    document.head.appendChild(st);
  }

  S.games.define({
    kind: 'رسم',
     
    keys: { verb: 'رسم', relation: 'فرق ضد فرق', second: 'لا شيء', form: 'قائمة مصطلحات' },
    id: 'draw',
    name: 'ارسم وخمّن',
    line: 'طالب يرسم المصطلح بإصبعه على الموبايل، وفريقه يخمّن قبل انتهاء الوقت.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 5,
    comeback: 'المتأخّر بثلاث نقاط يأخذ وقتاً أطول',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="8" width="108" height="64" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="14" y="17" width="66" height="46" rx="6" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M24 50 q9 -22 20 -8 q9 12 22 -14" fill="none" stroke="var(--sea-teal)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<g transform="rotate(18 99 40)">' +
          '<rect x="94" y="20" width="10" height="34" rx="2" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
          '<path d="M94 54 L104 54 L99 64 Z" fill="var(--sea-sand)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<path d="M96.6 59 L101.4 59 L99 63.5 Z" fill="var(--sea-ink)"/>' +
        '</g>' +
        '</svg>';
    },

    mount(el, api) {
      const T = api.teams;
      const terms = S.forms.terms(api.qs, api.rnd() * 1e9 | 0, MAX_TERMS);

      let INK = '';
      try { INK = (getComputedStyle(document.documentElement).getPropertyValue('--sea-ink') || '').trim(); }
      catch (e) { console.warn('SHIFT: تعذّرت قراءة لون الحبر —', e && e.message); }

      let i = 0;                  
      let phase = 'peek';         
      let seen = false;           
      let locked = false;
      let gone = false;
      let wonRound = false;

      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };

      let cv = null, ctx = null, ro = null;
      let padW = 1, padH = 1;
      const strokes = [];         
      let cur = null;
       
      let penId = null;

      function pen() {
        if (!ctx) return;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, Math.round(Math.min(padW, padH) * 0.014));
        if (INK) { ctx.strokeStyle = INK; ctx.fillStyle = INK; }
      }

      function paint() {
        if (!ctx) return;
        ctx.clearRect(0, 0, padW, padH);
        pen();
        strokes.forEach(s => {
          if (!s.length) return;
          if (s.length === 1) {
             
            ctx.beginPath();
            ctx.arc(s[0].x * padW, s[0].y * padH, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
            return;
          }
          ctx.beginPath();
          s.forEach((p, k) => { if (k) ctx.lineTo(p.x * padW, p.y * padH); else ctx.moveTo(p.x * padW, p.y * padH); });
          ctx.stroke();
        });
      }

      function fit() {
        if (!cv) return;
        const r = cv.getBoundingClientRect();
        padW = Math.max(1, Math.round(r.width));
        padH = Math.max(1, Math.round(r.height));
         
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        cv.width = Math.round(padW * dpr);
        cv.height = Math.round(padH * dpr);
        ctx = cv.getContext('2d');
        if (!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paint();
      }

      function at(e) {
        const r = cv.getBoundingClientRect();
        const x = (e.clientX - r.left) / (r.width || 1);
        const y = (e.clientY - r.top) / (r.height || 1);
        return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
      }

      function down(e) {
        if (phase !== 'draw' || locked) return;
        if (penId !== null) return;           
        e.preventDefault();
        penId = e.pointerId;
         
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        cur = [at(e)];
        strokes.push(cur);
        paint();
      }
      function move(e) {
        if (!cur || e.pointerId !== penId) return;
        e.preventDefault();
        const a = cur[cur.length - 1], b = at(e);
        cur.push(b);
         
        if (ctx) { ctx.beginPath(); ctx.moveTo(a.x * padW, a.y * padH); ctx.lineTo(b.x * padW, b.y * padH); ctx.stroke(); }
      }
       
      function up(e) { if (e && e.pointerId !== penId) return; penId = null; cur = null; }

      function bindPad() {
        cv = el.querySelector('.dw-pad canvas');
        penId = null; cur = null;    
         
        if (!cv) { ctx = null; if (ro) { try { ro.disconnect(); } catch (err) {} ro = null; } return; }
        fit();
        if (phase === 'draw') {
          cv.addEventListener('pointerdown', down);
          cv.addEventListener('pointermove', move);
          cv.addEventListener('pointerup', up);
          cv.addEventListener('pointercancel', up);
          cv.addEventListener('pointerleave', up);
        }
         
        if (typeof ResizeObserver === 'function') {
          if (ro) ro.disconnect();
          ro = new ResizeObserver(() => fit());
          ro.observe(cv);
        }
      }

      let clock = 0, endAt = 0, span = 1;

      function secsFor(t) {
        const top = Math.max.apply(null, T.map(x => x.score || 0).concat([0]));
        return (top - (T[t].score || 0)) >= GAP ? SECS_BACK : SECS;
      }

      function stopClock() { if (clock) { clearInterval(clock); clock = 0; } }

      function startClock(secs) {
        span = secs * 1000;
        endAt = Date.now() + span;
        stopClock();
        tick();
         
        clock = setInterval(tick, 200);
      }

      function tick() {
        if (gone) return stopClock();
        const ms = Math.max(0, endAt - Date.now());
        const bar = el.querySelector('.dw-bar');
        const fill = el.querySelector('.dw-bar s');
        const num = el.querySelector('.dw-t[data-clock]');
        const left = Math.ceil(ms / 1000);
        if (num) num.textContent = 'الوقت ' + api.AR(left);
        if (fill) fill.style.width = (ms / span * 100) + '%';
        if (bar) { if (left <= 10) bar.dataset.low = '1'; else bar.removeAttribute('data-low'); }
        if (ms <= 0) { stopClock(); resolve(false); }
      }

      function render() {
        const term = terms[i];
        const t = api.turn();
        const name = T[t] ? T[t].name : '';
        const long = secsFor(t) > SECS;
        let h = '';

        if (phase === 'peek') {
          h = '<div class="dw">' +
            (long ? '<p class="gw-tag">وقتٌ أطول للمتأخّر — تسعون ثانية بدل ستّين</p>' : '') +
            '<h2 class="gw-head">دور فريق ' + api.esc(name) + '</h2>' +
            '<div class="dw-card gw-mine">' +
              (seen
                ? '<p class="dw-term">' + api.esc(term.t) + '</p>' +
                  '<p class="gw-sub">ارسمه بإصبعك — بلا حروف ولا أرقام.</p>' +
                  '<button class="dw-b dw-b-main" type="button" data-a="go">رأيته — ابدأ</button>'
                : '<p class="gw-sub">أعطِ الموبايل للرسّام بعيداً عن نظر الصفّ.</p>' +
                  '<button class="dw-b dw-b-main" type="button" data-a="see">أظهر المصطلح للرسّام</button>') +
            '</div>' +
          '</div>';
        } else if (phase === 'draw') {
          h = '<div class="dw">' +
            (long ? '<p class="gw-tag">وقتٌ أطول للمتأخّر — تسعون ثانية بدل ستّين</p>' : '') +
            '<div class="dw-top">' +
              '<b class="dw-t">فريق ' + api.esc(name) + '</b>' +
              '<b class="dw-t" data-clock="1">الوقت ' + api.AR(secsFor(t)) + '</b>' +
            '</div>' +
            '<div class="dw-bar"><s style="width:100%"></s></div>' +
            '<div class="dw-pad"><canvas></canvas></div>' +
            '<div class="dw-row gw-mine">' +
              '<button class="dw-b" type="button" data-a="clear">امسح</button>' +
              '<button class="dw-b dw-b-main" type="button" data-a="win">خمّنوا</button>' +
              '<button class="dw-b" type="button" data-a="time">مرّ الوقت</button>' +
            '</div>' +
          '</div>';
        } else {
          h = '<div class="dw">' +
            '<h2 class="gw-q">' + api.esc(term.t) + '</h2>' +
            '<div class="dw-pad"><canvas></canvas></div>' +
            '<p class="gw-sub">' +
              (wonRound ? 'نقطة لفريق ' + api.esc(name) : 'مرّ الوقت — بلا خصم') +
            '</p>' +
          '</div>';
        }

        el.innerHTML = h;
        bindPad();
        el.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => act(b.dataset.a); });
      }

      function act(a) {
        if (a === 'see') { seen = true; api.sfx('pop'); return render(); }
        if (a === 'go') { return begin(); }
        if (a === 'clear') {
          strokes.length = 0; penId = null; cur = null; paint(); api.sfx('soft');
          return;
        }
        if (a === 'win') return resolve(true);
        if (a === 'time') return resolve(false);
        if (a === 'end') return api.finish();
      }

      function begin() {
        phase = 'draw';
        locked = false;
        strokes.length = 0; penId = null; cur = null;
        api.sfx('turn');
        render();
        startClock(secsFor(api.turn()));
      }

      function resolve(ok) {
        if (locked || phase !== 'draw') return;
        locked = true;
        stopClock();
        wonRound = !!ok;
        const t = api.turn();
         
        if (ok) api.score(t, 1);
        phase = 'end';
        render();
        api.judge(ok, {
          text: ok ? 'أحسنتم — المصطلح: ' + terms[i].t : 'المصطلح: ' + terms[i].t,
        });
        wait(2200, next);
      }

      function next() {
        i++;
        api.step(i, terms.length);
        if (i >= terms.length) return api.finish();
        api.nextTurn();
        phase = 'peek'; seen = false; locked = false; wonRound = false;
        strokes.length = 0; penId = null; cur = null;
        render();
      }

      if (!terms.length) {
        api.step(0, 0);
        el.innerHTML = '<div class="dw">' +
          '<h2 class="gw-head">لا مصطلح قصيراً يصلح للرسم في هذه الأسئلة.</h2>' +
          '<p class="gw-sub">الإجابات الصحيحة هنا جملٌ طويلة — جرّب لعبة أخرى بالأسئلة نفسها.</p>' +
          '<div class="dw-row gw-mine"><button class="dw-b dw-b-main" type="button" data-a="end">انتقل إلى النتيجة</button></div>' +
        '</div>';
        el.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => act(b.dataset.a); });
      } else {
        api.step(0, terms.length);
        render();
      }

      return {
        destroy() {
          gone = true; locked = true;
          stopClock();
          timers.forEach(clearTimeout);
          timers.length = 0;
          if (ro) { try { ro.disconnect(); } catch (e) {} ro = null; }    
          cv = null; ctx = null; cur = null; penId = null;
        },
      };
    },
  });
})();

<script>
(function () {

  const SECS = 90;       
  const LAST = 20;       
  const GRAB = 6;        

  if (!document.getElementById('css-baskets')) {

    st.id = 'css-baskets';

      '.bk-card{width:100%;min-height:4.4em;display:flex;flex-direction:column;' +

      'border:var(--sea-bd) solid var(--sea-ink);border-radius:var(--sea-r);' +

      '.bk-card[data-grab="1"]{cursor:grabbing;position:relative;z-index:2;' +
      'box-shadow:0 9px 0 var(--sea-ink)}' +
      '.bk-card[data-st="ok"]{border-color:var(--sea-t3);box-shadow:0 5px 0 var(--sea-t3)}' +
      '.bk-card[data-st="no"]{border-color:var(--sea-coral);box-shadow:0 5px 0 var(--sea-coral)}' +
      '.bk-q{margin:0;text-align:center;overflow-wrap:anywhere;' +
      'font-family:var(--sea-display);font-weight:800;' +
      'font-size:clamp(17px,1.3em,40px);line-height:1.3}' +
      '.bk-a{margin:0;text-align:center;overflow-wrap:anywhere;color:var(--sea-coral);' +
      'font-family:var(--sea-display);font-weight:800;' +
      'font-size:clamp(18px,1.55em,46px);line-height:1.25}' +
       
      '.bk-bs{width:min(30em,100%);display:flex;gap:.5em}' +
      '.bk-b{flex:1 1 0;min-width:0;font:inherit;font-family:var(--sea-display);font-weight:800;' +
      'font-size:clamp(18px,1.45em,44px);line-height:1.2;cursor:pointer;' +
      'min-height:max(44px,2.3em);padding:.15em .5em;' +
      'border:var(--sea-bd) solid var(--sea-ink);border-radius:var(--sea-r);' +
      'color:var(--sea-white);box-shadow:0 5px 0 var(--sea-ink)}' +
      '.bk-b[data-v="1"]{background:var(--sea-t3)}' +
      '.bk-b[data-v="0"]{background:var(--sea-coral)}' +
      '.bk-b:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sea-ink)}' +
       
      '.bk-b[data-over="1"]{transform:translateY(2px);box-shadow:0 2px 0 var(--sea-ink);' +
      'outline:3px solid var(--sea-sun);outline-offset:3px}' +
      '.bk-b[data-st="ok"]{outline:3px solid var(--sea-ink);outline-offset:3px}' +
      '.bk-b[data-st="no"]{outline:3px dashed var(--sea-ink);outline-offset:3px}' +
      '.bk-b[disabled]{cursor:default}' +
       
      '@media (max-height:460px){.bk{gap:.25em}.bk-card{min-height:0;padding:.3em .6em}' +
       
      '.bk-q{font-size:clamp(13px,1.3em,40px)}.bk-a{font-size:clamp(14px,1.55em,46px)}' +
       
      '.bk .gw-tag{font-size:.62em;padding:.25em .6em}' +
      '.bk-b{min-height:44px}}' +
      '@media (prefers-reduced-motion:reduce){.bk-track s{transition:none}}';
    document.head.appendChild(st);
  }

  S.games.define({
    kind: 'سرعة',
     
    keys: { verb: 'سحب وفرز', relation: 'الفصل ضد الوقت', second: 'لا شيء', form: 'بطاقة حكم' },
    id: 'baskets',
    name: 'السلال',
    line: 'بطاقة وإجابة — تُسحب إلى سلّة صح أو سلّة خطأ، والوقت يجري.',
    mins: [8, 12],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 8,
    comeback: 'آخر عشرين ثانية كل بطاقة بنقطتين',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="5" y="6" width="110" height="68" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
        '<rect x="45" y="12" width="32" height="23" rx="4" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5" transform="rotate(-8 61 23)"/>' +
        '<path d="M61 37 V45" stroke="var(--sea-ink)" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M14 47 H50 L45 68 H19 Z" fill="var(--sea-t3)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="M70 47 H106 L101 68 H75 Z" fill="var(--sea-coral)" stroke="var(--sea-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="M26 55 l5 5 l9 -9" fill="none" stroke="var(--sea-white)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M83 55 l10 10 M93 55 l-10 10" stroke="var(--sea-white)" stroke-width="3" stroke-linecap="round"/>' +
        '</svg>';
    },

    mount(el, api) {
       
      const cards = S.forms.judge(api.qs, api.rnd() * 1e9 | 0);
      const timers = [];
      let i = 0, locked = true, gone = false, over = false, drag = null, tagOn = false;

      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };

      el.innerHTML =
        '<div class="bk">' +
          '<p class="gw-tag" hidden>آخر عشرين ثانية — كل بطاقة بنقطتين</p>' +
          '<div class="bk-time" data-last="0">' +
            '<b></b><em>ثانية</em>' +
            '<span class="bk-track"><s></s></span>' +
          '</div>' +
          '<div class="bk-mid">' +
            '<div class="bk-card"><p class="bk-q"></p><p class="bk-a"></p></div>' +
          '</div>' +
          '<div class="bk-bs">' +
            '<button class="bk-b" type="button" data-v="1">صح</button>' +
            '<button class="bk-b" type="button" data-v="0">خطأ</button>' +
          '</div>' +
          '<p class="gw-sub gw-mine">اسحب البطاقة إلى سلّتها، أو المس السلّة.</p>' +
        '</div>';

      const wrap = el.querySelector('.bk');
      const elTag = el.querySelector('.gw-tag');
      const elTime = el.querySelector('.bk-time');
      const elSec = elTime.querySelector('b');
      const elBar = el.querySelector('.bk-track s');
      const elMid = el.querySelector('.bk-mid');
      const elCard = el.querySelector('.bk-card');
      const elQ = el.querySelector('.bk-q');
      const elA = el.querySelector('.bk-a');
      const bs = Array.prototype.slice.call(el.querySelectorAll('.bk-b'));

      function fit() {
        if (gone) return;
        elCard.style.fontSize = '';
        for (let f = 100, n = 0; n < 10; n++) {
          const box = elMid.clientHeight;
          if (!box || elCard.getBoundingClientRect().height <= box + 0.5) return;
          f -= 5;
          if (f <= 45) { elCard.style.fontSize = '45%'; return; }
          elCard.style.fontSize = f + '%';
        }
      }
       
      const onSize = () => fit();
      addEventListener('resize', onSize);
      if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
        document.fonts.ready.then(() => { if (!gone) fit(); }, () => {});
      }

      const t0 = Date.now();
      const leftMs = () => Math.max(0, SECS * 1000 - (Date.now() - t0));
      const boost = () => leftMs() <= LAST * 1000 && leftMs() > 0;

      function clock() {
        if (gone) return;
        const ms = leftMs();
        const sec = api.AR(Math.ceil(ms / 1000));
        if (elSec.textContent !== sec) elSec.textContent = sec;
        elBar.style.width = (ms / (SECS * 10)) + '%';
        const last = boost();
        elTime.dataset.last = last ? '1' : '0';
         
        if (last !== tagOn) { tagOn = last; elTag.hidden = !last; fit(); }
         
        if (ms <= 0 && !locked) end('انتهى الوقت');
      }
       
      clock();
      const tick = setInterval(clock, 200);

      function draw() {
        const c = cards[i];
        if (!c) return end('انتهت البطاقات');
        api.step(i, cards.length);
         
        api.setTurn(i % api.teams.length);
        locked = false;
         
        elQ.textContent = c.q;
        elA.textContent = c.shown;
        elCard.removeAttribute('data-st');
        elCard.style.transform = '';
        bs.forEach(b => { b.disabled = false; b.removeAttribute('data-st'); b.removeAttribute('data-over'); });
        fit();           
      }

      function sort(said) {
        if (locked || gone) return;
        const c = cards[i];
        if (!c) return;
        locked = true;
        const ok = (said === c.ok);
        const pts = boost() ? 2 : 1;
        if (ok) api.score(api.turn(), pts);    
        mark(null);
        bs.forEach(b => {
          b.disabled = true;
          if ((b.dataset.v === '1') === said) b.dataset.st = ok ? 'ok' : 'no';
        });
        elCard.dataset.st = ok ? 'ok' : 'no';
        api.judge(ok, {
          text: ok ? (pts > 1 ? 'في سلّتها — نقطتان' : 'في سلّتها') : ('الصحيح: ' + c.right),
        });
        wait(ok ? 650 : 1100, next);
      }

      function next() {
        i++;
        if (gone || over) return;
        if (i >= cards.length) return end('انتهت البطاقات');
        if (leftMs() <= 0) return end('انتهى الوقت');
        draw();
      }

      function end(why) {
        if (over || gone) return;
        over = true; locked = true;
        clearInterval(tick);
        bs.forEach(b => { b.disabled = true; });
        api.step(Math.min(i, cards.length), cards.length);
        api.say(why);
        api.finish();
      }

      function basketAt(x, y) {
        for (let k = 0; k < bs.length; k++) {
          const r = bs[k].getBoundingClientRect();
          if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return bs[k].dataset.v === '1';
        }
        return null;
      }
      function mark(v) {
        bs.forEach(b => {
          if (v !== null && (b.dataset.v === '1') === v) b.dataset.over = '1';
          else b.removeAttribute('data-over');
        });
      }
      function release() {
        drag = null;
        wrap.removeAttribute('data-drag');
        elCard.removeAttribute('data-grab');
        elCard.style.transform = '';
        mark(null);
      }

      elCard.addEventListener('pointerdown', e => {
        if (locked || gone || !e.isPrimary) return;
        try { elCard.setPointerCapture(e.pointerId); } catch (err) {
           
          console.warn('SHIFT: تعذّر التقاط المؤشّر في السلال، والفرز باللمس وحده —', err && err.message);
          return;
        }
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
        wrap.dataset.drag = '1';
        elCard.dataset.grab = '1';
      });
      elCard.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && (Math.abs(dx) > GRAB || Math.abs(dy) > GRAB)) drag.moved = true;
        elCard.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        if (drag.moved) mark(basketAt(e.clientX, e.clientY));
      });
      elCard.addEventListener('pointerup', e => {
        if (!drag || e.pointerId !== drag.id) return;
        const moved = drag.moved, v = basketAt(e.clientX, e.clientY);
        release();
         
        if (moved && v !== null) sort(v);
      });
      elCard.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) release(); });

      bs.forEach(b => { b.onclick = () => { if (!drag) sort(b.dataset.v === '1'); }; });

      draw();
      return {
        destroy() {
          gone = true; locked = true;
          clearInterval(tick);
          timers.forEach(clearTimeout); timers.length = 0;
          removeEventListener('resize', onSize);    
        },
      };
    },
  });
})();

      'border:2px solid var(--sea-ink);border-radius:999px;' +
      'background:var(--sea-white);color:var(--sea-ink)}' +
      '.rv-b:active{transform:translate(1px,1px)}' +
      '.rv-b[data-g="1"]{background:var(--sea-t3);color:var(--sea-white)}' +
      '.rv-b[data-g="0"]{background:var(--sea-coral);color:var(--sea-white)}' +
      '@media (prefers-reduced-motion:reduce){.rv-t{transition:none}}' +
       
      '@media (max-height:460px){' +
      '.rv{flex-direction:row;align-items:stretch;gap:.5em}' +
      '.rv-box{flex:1 1 38%;width:auto;min-width:0}' +
      '.rv-side{flex:1 1 62%;min-width:0;justify-content:center;overflow:hidden}' +
      '.rv-hint{font-size:clamp(14px,1em,26px)}' +
      '}';
    document.head.appendChild(st);
  }

  S.games.define({
    kind: 'حظّ',
     
    keys: { verb: 'رهان', relation: 'فرق ضد فرق', second: 'كشف', form: 'قائمة مصطلحات' },
    id: 'reveal',
    name: 'اكشف الصورة',
    line: 'صورة تحت قطع — أجب فتكشف قطعة، أو خاطر وخمّن الصورة كلّها.',
    mins: [10, 15],
    teams: { min: 2, max: 4 },
    need: { min: 2, max: 4 },
    minQ: 6,
    comeback: 'تخمين المتأخّر بخمس نقاط لا أربع',

    art() {
      return '<svg viewBox="0 0 120 80" aria-hidden="true">' +
        '<rect x="6" y="8" width="108" height="64" rx="10" fill="var(--sea-white)" stroke="var(--sea-ink)" stroke-width="3"/>' +
         
        '<circle cx="34" cy="30" r="9" fill="var(--sea-sun)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M12 58 Q26 48 40 58 Q54 68 68 58" fill="none" stroke="var(--sea-t1)" stroke-width="3" stroke-linecap="round"/>' +
         
        '<rect x="62" y="14" width="24" height="24" rx="3" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="88" y="14" width="22" height="24" rx="3" fill="var(--sea-closed)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<rect x="88" y="42" width="22" height="24" rx="3" fill="var(--sea-teal)" stroke="var(--sea-ink)" stroke-width="2.5"/>' +
        '<path d="M99 50 L106 57 L99 64 L92 57 Z" fill="var(--sea-closed-mark)" stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/>' +
        '</svg>';
    },

    mount(el, api) {
      const T = api.teams;
      const esc = api.esc;
      let gone = false, locked = false;
      const timers = [];
      const wait = (ms, fn) => { const t = setTimeout(() => { if (!gone) fn(); }, ms); timers.push(t); return t; };

      const seed = (api.rnd() * 1e9) | 0;

      const LIST = S.forms.terms(api.qs, seed);
      const R = (api.qs || []).map((it, n) => {
        const t = String(it.a[it.c]);
        const other = [];
        for (let k = 1; other.length < 2 && k <= LIST.length; k++) {
          const o = LIST[(n + k) % LIST.length];
          if (o && o.t !== t && other.indexOf(o.t) < 0) other.push(o.t);
        }
         
        for (let k = 0; other.length < 2 && k < it.a.length; k++) {
          const o = String(it.a[k]);
          if (o !== t && other.indexOf(o) < 0) other.push(o);
        }
        return { q: it.q, t: t, opts: S.games.shuffle([t].concat(other), seed + n) };
      });

      const th = api.theme;
      const wide = (typeof matchMedia === 'function') && matchMedia('(min-width: 700px)').matches;
      let pic = null, fit = 'cover';
      if (th) {
        if (wide && th.background) pic = th.background('classroom');
        if (!pic && th.figure) { pic = th.figure('student', 'happy', { size: wide ? 'lg' : 'sm' }); fit = 'contain'; }
      }

      const ORDER = S.games.shuffle(Array.from({ length: TILES }, (_, k) => k), seed + 97);
      const open = [];       
      const shown = [];      
      let i = 0;             
      let phase = 'bet';     
      let turns = 0;
       
      const MAX = R.length * 2 + T.length;

      const behind = k => {
        const top = Math.max.apply(null, T.map(x => x.score || 0).concat([0]));
        return (top - (T[k].score || 0)) >= GAP;
      };
      const guessPts = k => (behind(k) ? WIN_BACK : WIN);

      function tilesHtml() {
        let s = '<div class="rv-box"><div class="rv-pic" id="rvPic">';
        if (!pic) s += '<span class="rv-say">ارفع صورتك أمام الشاشة</span>';
        for (let k = 0; k < TILES; k++) {
          const alt = (((k % COLS) + Math.floor(k / COLS)) % 2) ? ' data-alt="1"' : '';
          s += '<span class="rv-t" data-k="' + k + '"' + alt +
            (open.indexOf(k) >= 0 ? ' data-off="1"' : '') + '>' +
            '<svg viewBox="0 0 20 20" aria-hidden="true">' +
            '<path d="M10 2.5 L17.5 10 L10 17.5 L2.5 10 Z" fill="var(--sea-closed-mark)" ' +
            'stroke="var(--sea-ink)" stroke-width="2" stroke-linejoin="round"/></svg></span>';
        }
        return s + '</div></div>';
      }

      function paint() {
        const box = el.querySelector('#rvPic');
        if (!box || !pic) return;
        box.style.backgroundImage = 'url("' + pic + '")';
        box.style.backgroundSize = fit;
      }

      const hintHtml = () => (shown.length
        ? '<p class="rv-hint">كُشف: ' + esc(shown.slice(-HINTS).join('، ')) + '</p>' : '');

      function draw() {
        if (i >= R.length || open.length >= TILES || turns >= MAX) return over();
        api.step(i, R.length);
        locked = false;
        const k = api.turn();
        const pts = guessPts(k);
        let body = '';
        if (phase === 'bet') {
          body =
            '<p class="gw-head">دور فريق ' + esc(T[k].name) + ' — ماذا يختار؟</p>' +
            '<div class="gw-opts">' +
              '<button class="gw-opt" type="button" data-b="ask">' +
                '<span class="k">١</span>أجب — قطعة ونقطة</button>' +
              '<button class="gw-opt" type="button" data-b="guess">' +
                '<span class="k">٢</span>خمّن الصورة — ' + api.AR(pts) + PTS(pts) + '</button>' +
            '</div>';
        } else if (phase === 'ask') {
          const r = R[i];
          body =
            '<h2 class="gw-q">' + esc(r.q) + '</h2>' +
            '<div class="gw-opts">' + r.opts.map((o, n) =>
              '<button class="gw-opt" type="button" data-o="' + n + '">' +
                '<span class="k">' + KEY[n] + '</span>' + esc(o) + '</button>').join('') +
            '</div>';
        } else {
          body =
            '<p class="gw-head">قل ما في الصورة بصوت واضح</p>' +
            '<div class="rv-mine gw-mine">' +
              '<button class="rv-b" type="button" data-g="1">صحيح</button>' +
              '<button class="rv-b" type="button" data-g="0">لا</button>' +
            '</div>';
        }
        el.innerHTML =
          '<div class="rv">' + tilesHtml() +
            '<div class="rv-side">' +
               
              (phase === 'bet' && pts > WIN
                ? '<p class="gw-tag">تخمين المتأخّر بخمس نقاط لا أربع</p>' : '') +
              hintHtml() + body +
            '</div>' +
          '</div>';
        paint();
        el.querySelectorAll('[data-b]').forEach(b => { b.onclick = () => bet(b.dataset.b); });
        el.querySelectorAll('[data-o]').forEach(b => { b.onclick = () => answer(+b.dataset.o); });
        el.querySelectorAll('[data-g]').forEach(b => { b.onclick = () => guess(b.dataset.g === '1'); });
      }

      function bet(which) {
        if (locked) return;
        api.sfx('pop');
        phase = (which === 'guess') ? 'guess' : 'ask';
        draw();
      }

      function pass() {
        turns++;
        api.nextTurn();
        phase = 'bet';
        draw();
      }

      function answer(n) {
        if (locked) return;
        locked = true;
        const r = R[i], k = api.turn(), ok = (r.opts[n] === r.t);
        el.querySelectorAll('[data-o]').forEach(b => {
          b.disabled = true;
          const v = +b.dataset.o;
          if (r.opts[v] === r.t) b.dataset.st = 'ok';
          else if (v === n) b.dataset.st = 'no';
        });
        if (ok) {
          api.score(k, 1);
          const t = ORDER[open.length];
          open.push(t);
           
          if (shown.indexOf(r.t) < 0) shown.push(r.t);
          const tile = el.querySelector('[data-k="' + t + '"]');
          if (tile) tile.dataset.off = '1';      
        }
         
        api.judge(ok, { text: ok ? 'انكشفت قطعة' : 'الصحيح: ' + r.t });
        i++;
        wait(1700, () => {
          if (i >= R.length || open.length >= TILES) return over();
          pass();
        });
      }

      function guess(ok) {
        if (locked) return;
        locked = true;
        const k = api.turn(), pts = guessPts(k);
        el.querySelectorAll('[data-g]').forEach(b => { b.disabled = true; });
        if (ok) api.score(k, pts);
        api.judge(ok, {
          text: ok ? ('أحسنتم — ' + api.AR(pts) + PTS(pts) + ' لفريق ' + T[k].name)
                   : 'ليست هي — يمضي الدور بلا خصم',
        });
         
        wait(1700, () => { if (ok) return over(); pass(); });
      }

      function over() {
        locked = true;
        api.step(R.length, R.length);
        api.finish();
      }

      api.setTurn(0);
      draw();
      return { destroy() { gone = true; locked = true; timers.forEach(clearTimeout); timers.length = 0; } };
    },
  });
})();

</script>

<script>(function () {
  const el = document.getElementById('en');
  const B = SHIFT.bank, GM = SHIFT.games;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
  const KEY = ['أ', 'ب', 'ج', 'د'];
  const word = (n, one, two, many) => n === 1 ? one : n === 2 ? two : many;

  const ICON = {
    play: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>',
    share: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 14v4a2 2 0 002 2h10a2 2 0 002-2v-4"/></svg>',
    more: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>',
  };
   
  const WAVE = '<div class="sea-wave"><svg viewBox="0 0 1200 22" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="M0 22V8c100-10 200 10 300 6s200-18 300-12 200 16 300 12 200-14 300-6v14z"/></svg></div>';

  const DEMO = [
    'ما عاصمة الكويت؟\nمدينة الكويت *\nالجهراء\nحولي',
    'كم عدد محافظات الكويت؟\nستّ *\nأربع\nثماني',
    'على أي خليج تقع الكويت؟\nالخليج العربي *\nخليج عدن\nالبحر الأحمر',
    'ما اسم العملة الكويتية؟\nالدينار *\nالريال\nالدرهم',
    'الكويت في شبه الجزيرة العربية\nصح *\nخطأ',
    'ما أكبر جزر الكويت؟\nبوبيان *\nفيلكا\nوربة',
    'ما أطول أنهار العالم؟\nالنيل *\nالأمازون\nالفرات',
    'كم عدد أيام الأسبوع؟\nسبعة *\nستّة\nثمانية',
  ].join('\n\n');

  const TEAMS_KEY = 'shift.teams.v1';
  const teamsN = () => { try { return Math.max(2, Math.min(4, +localStorage.getItem(TEAMS_KEY) || 3)); } catch (e) { return 3; } };
  const setTeams = n => { try { localStorage.setItem(TEAMS_KEY, String(n)); }
    catch (e) { console.warn('SHIFT: تعذّر حفظ عدد الفِرَق —', e && e.message); } };

  const S = { view: 'home', text: '', items: [], problems: [], title: '', demo: false, note: '', savedId: null, manage: null };
  const go = v => { S.view = v; scrollTo(0, 0); render(); };

  const top = (title, lede) => `
    <header class="sea-top">
      <span class="sea-brand">SHIFT · مسابقة الفصل</span>
      <h1>${title}</h1>
      ${lede ? `<p class="sea-lede">${lede}</p>` : ''}
    </header>${WAVE}`;

  function vHome() {
    const mine = B.list();
     
    const groups = B.GRADES.map(g => ({ g, rows: mine.filter(m => (m.grade || '') === g.id) }))
      .filter(x => x.rows.length);
    const many = groups.length > 1;
    return top('الصق أسئلتك… واختر لعبة!',
      'في دقيقة تصير مسابقة فِرَق على شاشة الفصل، من موبايلك.') + `
      <div class="sea-body" data-v="home">
        ${mine.length ? `
        <section class="sea-sec">
          <h2 class="sea-h2">مسابقاتي</h2>
          ${groups.map(x => `
            ${many ? `<p class="sea-label">${esc(x.g.name)}</p>` : ''}
            <div class="sea-cards">${x.rows.map(g => `
              <div class="sea-row">
                <button class="sea-card" data-play="${esc(g.id)}">
                  <b>${esc(g.title)}</b>
                  <span><span class="sea-n">${AR(g.n)}</span> ${word(g.n, 'سؤال', 'سؤالان', 'أسئلة')}</span>
                </button>
                <button class="sea-more" data-manage="${esc(g.id)}" aria-label="خيارات ${esc(g.title)}">${ICON.more}</button>
              </div>`).join('')}</div>`).join('')}
        </section>` : ''}
        <section class="sea-sec">
          ${mine.length ? '<h2 class="sea-h2">أو الصق أسئلة جديدة</h2>' : ''}
          
          <textarea id="paste" class="sea-field" placeholder="اكتب السؤال في سطر، وتحته كل إجابة في سطر. والصحيحة تحدّدها بإصبعك بعد اللصق."></textarea>
          <p class="sea-hint">اكتب ثلاث إجابات لكل سؤال — تعمل في كل الألعاب. وإجابتان تكفيان لصح/خطأ.</p>
          <div class="sea-acts">
            <button class="sea-btn sea-btn-main" id="make">${ICON.play}اصنع المسابقة</button>
            <button class="sea-btn sea-btn-plain" id="demo">جرّب بأسئلة جاهزة</button>
          </div>
          ${S.note ? `<p class="sea-note">${esc(S.note)}</p>` : ''}
        </section>
        
        ${(() => { const u = SHIFT.theme && SHIFT.theme.figure('teacher', 'main', { size: 'sm' });
          return u ? `<div class="sea-figure sea-figure-entry" data-ready="1"><img src="${u}" alt=""></div>` : ''; })()}
        <section class="sea-sec sea-foot">
          <a class="sea-link" href="lessons.html">دروس جاهزة من المنهج</a>
        </section>
      </div>
      ${S.manage ? vManage() : ''}`;
  }

  function vManage() {
    const g = B.list().find(x => x.id === S.manage);
    if (!g) return '';
    return `<div class="sea-sheet">
      <div class="sea-card-lg">
        <h2 class="sea-h2">${esc(g.title)}</h2>
        <label class="sea-label" for="mgName">الاسم</label>
        <input id="mgName" class="sea-field sea-input" maxlength="40" value="${esc(g.title)}">
        <p class="sea-label">الصفّ</p>
        <div class="sea-chips">${B.GRADES.map(x =>
          `<button class="sea-chip" data-grade="${esc(x.id)}"${(g.grade || '') === x.id ? ' data-on="1"' : ''}>${esc(x.name)}</button>`).join('')}</div>
        <div class="sea-acts">
          <button class="sea-btn sea-btn-main" id="mgSave">احفظ</button>
          <button class="sea-btn sea-btn-plain" id="mgDel">احذف هذه المسابقة</button>
          <button class="sea-btn sea-btn-plain" id="mgClose">${ICON.back}رجوع</button>
        </div>
      </div>
    </div>`;
  }

  function vPreview() {
    const pend = B.pending(S.items), ready = B.ready(S.items).length;
    return top(S.demo ? 'أسئلة تجريبية' : 'أسئلتك',
      pend ? 'المس الإجابة الصحيحة في كل سؤال — ' + AR(pend) + ' ' + word(pend, 'ينتظر', 'ينتظران', 'تنتظر') + '.'
           : 'كل الإجابات محدّدة.') + `
      <div class="sea-body" data-v="preview">
        ${S.demo ? '<p class="sea-tag">أسئلة تجريبية — ليست محتوى منهج مُراجَعاً.</p>' : ''}
        ${S.problems.length ? `
        <section class="sea-sec sea-warn">
          <h2 class="sea-h2">تُرك ${AR(S.problems.length)} ${word(S.problems.length, 'سؤال', 'سؤالان', 'أسئلة')}، وتُصنع المسابقة بالباقي</h2>
          <ul>${S.problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
        </section>` : ''}
        <section class="sea-sec">
          <div class="sea-qs">${S.items.map((it, i) => `
            <article class="sea-q"${it.c < 0 ? ' data-pending="1"' : ''}>
              <b class="sea-q-t">${AR(i + 1)}. ${esc(it.q)}</b>
              <div class="sea-opts">${it.a.map((t, k) => `
                <button class="sea-opt" data-q="${i}" data-o="${k}"${k === it.c ? ' data-on="1"' : ''}>
                  <span class="k">${KEY[k] || ''}</span><span class="t">${esc(t)}</span>
                </button>`).join('')}</div>
            </article>`).join('')}</div>
        </section>
        <section class="sea-sec">
          <label class="sea-label" for="title">اسم المسابقة</label>
          <input id="title" class="sea-field sea-input" maxlength="40" value="${esc(S.title)}" placeholder="أسئلة الوحدة الأولى">
          <div class="sea-acts">
            <button class="sea-btn sea-btn-main" id="next"${ready ? '' : ' disabled'}>${ICON.play}اختر اللعبة</button>
            <button class="sea-btn sea-btn-plain" id="back">${ICON.back}رجوع</button>
          </div>
        </section>
      </div>`;
  }

  function vPick() {
    const items = B.ready(S.items);
    const n = teamsN();
     
    const card = g => {
      const r = GM.ready(items, g.id);
       
      const mins = g.mins[0] === g.mins[1] ? AR(g.mins[0]) : 'من ' + AR(g.mins[0]) + ' إلى ' + AR(g.mins[1]);
      const tm = g.teams.min === g.teams.max ? AR(g.teams.min) : 'من ' + AR(g.teams.min) + ' إلى ' + AR(g.teams.max);
      return `<button class="sea-game" data-game="${esc(g.id)}"${r.ok ? '' : ' disabled'}>
        <span class="sea-game-art">${g.art()}</span>
        <span class="sea-game-txt">
          <b>${esc(g.name)}</b>
          <span class="sea-game-line">${esc(g.line)}</span>
          
          <span class="sea-game-meta"><b class="sea-kind">${esc(g.kind)}</b>${mins} دقيقة<i class="sea-dot"></i>${tm} ${word(g.teams.max, 'فريق', 'فريقان', 'فِرَق')}</span>
          <span class="sea-fit">${esc(r.ok ? GM.fitLine(items, g.id) : r.why)}</span>
        </span>
      </button>`;
    };
    return top('اختر اللعبة',
      AR(items.length) + ' ' + word(items.length, 'سؤال جاهز', 'سؤالان جاهزان', 'أسئلة جاهزة') +
      ' — والأسئلة نفسها تعمل في كل لعبة.') + `
      <div class="sea-body" data-v="pick">
        <section class="sea-sec">
          <p class="sea-label">كم فريقاً في الصفّ؟</p>
          <div class="sea-chips">${[2, 3, 4].map(k =>
            `<button class="sea-chip" data-teams="${k}"${k === n ? ' data-on="1"' : ''}>${AR(k)}</button>`).join('')}</div>
        </section>
        <section class="sea-sec">
          <div class="sea-games">${GM.all().map(card).join('')}</div>
        </section>
        <section class="sea-sec">
          <div class="sea-acts">
            <button class="sea-btn sea-btn-plain" id="share">${ICON.share}شارك أسئلتي</button>
            <button class="sea-btn sea-btn-plain" id="back2">${ICON.back}رجوع</button>
          </div>
          ${S.note ? `<p class="sea-note">${esc(S.note)}</p>` : ''}
        </section>
      </div>`;
  }

  function render() {
    el.innerHTML = S.view === 'home' ? vHome() : S.view === 'preview' ? vPreview() : vPick();
    const $ = s => el.querySelector(s);

    if (S.view === 'home') {
      const ta = $('#paste'); if (ta) ta.value = S.text;
      $('#demo').onclick = () => { S.text = DEMO; S.demo = true; S.title = 'أسئلة تجريبية'; parse(); };
      $('#make').onclick = () => { S.text = ta ? ta.value : ''; S.demo = false; S.title = ''; parse(); };
      el.querySelectorAll('[data-play]').forEach(b => b.onclick = () => openBank(b.dataset.play));
      el.querySelectorAll('[data-manage]').forEach(b => b.onclick = () => { S.manage = b.dataset.manage; render(); });
      if (S.manage) bindManage();
      return;
    }

    if (S.view === 'preview') {
       
      el.querySelectorAll('.sea-opt').forEach(b => b.onclick = () => {
        const q = +b.dataset.q, o = +b.dataset.o;
        S.items[q].c = (S.items[q].c === o ? -1 : o);
        render();
      });
      $('#back').onclick = () => go('home');
      $('#next').onclick = () => {
        const t = $('#title');
        S.title = (t && t.value.trim()) || (S.demo ? 'أسئلة تجريبية' : 'أسئلتي');
        const r = B.save(S.title, B.ready(S.items), S.savedId);
        S.savedId = r.ok ? r.id : null;
        S.note = r.ok
          ? 'حُفظت باسم «' + S.title + '» على هذا الجهاز. ونصّ أسئلتك هو نسختك الاحتياطية — «شارك أسئلتي» يُخرجه.'
          : (r.why || 'لم تُحفظ على هذا الجهاز.');
        go('pick');
      };
      return;
    }

    el.querySelectorAll('[data-teams]').forEach(b => b.onclick = () => { setTeams(+b.dataset.teams); render(); });
    $('#back2').onclick = () => go('preview');
    $('#share').onclick = async () => {
      const txt = B.serialize(B.ready(S.items)) + '\n\nشغّلها مسابقةً على شاشة الفصل:\n' + location.href;
      const how = await SHIFT.host.share(txt, S.title || 'أسئلتي');
      S.note = how === 'shared' ? 'شورك.'
        : how === 'copied' ? 'نُسخ النصّ — الصقه في أي محادثة.'
        : how === 'cancelled' ? '' : 'تعذّرت المشاركة — انسخ نصّ أسئلتك من صندوق اللصق.';
      render();
    };
    el.querySelectorAll('[data-game]').forEach(b => b.onclick = () => start(b.dataset.game));
  }

  function bindManage() {
    const $ = s => el.querySelector(s);
    let grade = (B.list().find(x => x.id === S.manage) || {}).grade || '';
    el.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => {
      grade = b.dataset.grade;
      el.querySelectorAll('[data-grade]').forEach(x => {
        if (x.dataset.grade === grade) x.dataset.on = '1'; else x.removeAttribute('data-on');
      });
    });
    $('#mgClose').onclick = () => { S.manage = null; render(); };
    $('#mgSave').onclick = () => {
      const r = B.setMeta(S.manage, { title: $('#mgName').value, grade: grade });
      S.note = r.ok ? '' : (r.why || 'لم يُحفظ التعديل.');
      S.manage = null; render();
    };
    $('#mgDel').onclick = () => {
      const g = B.list().find(x => x.id === S.manage);
      if (!g) { S.manage = null; return render(); }
       
      if (!confirm('حذف «' + g.title + '»؟ تُفقد ' + AR(g.n) + ' ' +
        word(g.n, 'سؤال', 'سؤالان', 'أسئلة') + ' من هذا الجهاز، ولا رجعة.')) return;
      const ok = B.remove(S.manage);
      S.note = ok ? 'حُذفت «' + g.title + '».' : 'تعذّر الحذف على هذا الجهاز.';
      S.manage = null; render();
    };
  }

  function openBank(id) {
    const g = B.get(id); if (!g) return;
    S.items = g.items.map(x => Object.assign({}, x)); S.title = g.title;
    S.problems = []; S.savedId = g.id; S.demo = false; S.note = ''; go('pick');
  }

  function start(id) {
    const g = GM.get(id); if (!g) return;
    const items = B.ready(S.items);
    if (!GM.ready(items, id).ok) return;
    if (!S.savedId) { const r = B.save(S.title || 'أسئلتي', items); if (r.ok) S.savedId = r.id; }
    SHIFT.Store.pickBank(S.savedId, id);
     
    try { sessionStorage.setItem('shift.entry.v1', '1'); }
    catch (e) { console.warn('SHIFT: تعذّرت علامة المدخل —', e && e.message); }
    location.href = g.page || 'game.html';
  }

  function parse() {
    const r = B.parse(S.text);
    S.items = r.items; S.problems = r.problems; S.savedId = null; S.note = '';
    if (!S.items.length && !r.problems.length) {
      S.note = 'لم نتعرّف على أي سؤال مكتمل بعد — السؤال في سطر، وتحته كل إجابة في سطر.';
      render(); return;
    }
    go('preview');
  }

  (function resume() {
    let flag = '';
    try { flag = sessionStorage.getItem('shift.goto.v1') || ''; sessionStorage.removeItem('shift.goto.v1'); }
    catch (e) { flag = ''; }
    if (flag !== 'pick') return;
    const p = SHIFT.Store.pickedBank();
    if (p && p.id) openBank(p.id);
  })();

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SHIFT: تعذّر تجهيز العمل بلا شبكة —', e && e.message));
});
</script>
</body>
</html>
