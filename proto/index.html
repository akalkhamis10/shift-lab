<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حصة الكويت — منصة SHIFT</title>
<meta name="theme-color" content="#FAF7F1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حصة الكويت">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{
  
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  
  --font-display:'Lalezar','Baloo Bhaijaan 2','Cairo',sans-serif;   
  --font-text:'Cairo','IBM Plex Sans Arabic',sans-serif;             
  --fs-hero:72px;      
  --fs-title:52px;     
  --fs-question:40px;  
  --fs-answer:44px;    
  --fs-hud:28px;       
  --fs-body:22px;      
  --fs-small:18px;     
  --lh-tight:1.1; --lh-text:1.5;

  --tv-root:  max(16px, 4.44cqh);
  --tv-min:   1em;      
  --tv-text:  1em;
  --tv-label: 1em;
  --tv-answer:1.25em;
  --tv-question: 2em;   
  --tv-hero:  2.6em;
  --tv-max-interactive: 6;   

  --bg:#F3E3C9;        
  --paper:#FBF7F0;     
  --ink:#22344E;       
  --ink2:#4A5A72;      
  --clay:#D9A066;      
  --mud:#A86A3E;       
  --sadu:#C0392B;      
  --sadu2:#962C21;  
  --palm:#3E8E5E;      
  --palm2:#255C3B;  
  --palm-soft:#DDEFE3; 
  --palm-ink:#1F5A3A;
  --sadu-soft:#F8E1DD; 
  --sadu-ink:#7A1F16;
  --sky:#8EC9E6;
  --gold:#E0A83A; --gold2:#B8842A; --gold-soft:#FBEBD2;   
  --sea:#2F8F8F;
  --line:#EAD9BF;      
  --shade:rgba(120,80,40,.35);  
  --shade-soft:rgba(60,40,20,.25);

  --t1:var(--sky); --t2:var(--sadu); --t3:var(--palm); --t4:var(--gold);   

  --r-chip:26px; --r-card:22px; --r-bar:22px;
  --shadow-clay:0 10px 0 var(--shade),0 18px 30px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.7);
  --shadow-press:0 4px 0 var(--shade),0 8px 14px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.7);
  --border-ink:3px solid var(--ink);

  --sp-1:6px; --sp-2:12px; --sp-3:18px; --sp-4:24px; --sp-5:36px;
  --hit:64px;          

  --d-tap:150ms; --d-pop:200ms; --d-slide:300ms; --d-settle:300ms;
  --d-hold:50ms;      
  --d-shake:240ms;    
  --ease-pop:cubic-bezier(.34,1.56,.64,1);   
  --ease-settle:cubic-bezier(.22,1,.36,1);   
}
@media (prefers-reduced-motion:reduce){
  :root{ --d-tap:0ms; --d-slide:1ms; --d-pop:1ms; --d-settle:1ms; --d-hold:0ms; --d-shake:0ms; }
}

:root[data-proj="1"]{
  --fs-question:46px; --fs-answer:50px; --fs-hud:32px; --fs-body:26px; --fs-small:20px;
}

.ds{ font-family:var(--font-text); color:var(--ink); direction:rtl; }
.ds *{ box-sizing:border-box; }

.ds .chip{ display:inline-flex; align-items:center; gap:14px; height:var(--hit); padding:0 24px;
  font-size:var(--fs-hud); font-weight:700; line-height:1; white-space:nowrap; flex:none;
  background:var(--paper); color:var(--ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay); }
.ds .chip .k{ font-size:var(--fs-small); font-weight:600; color:var(--ink2); }
.ds .chip .dot{ width:22px; height:22px; border-radius:50%; background:var(--tc,var(--t1)); box-shadow:0 0 0 4px rgba(255,255,255,.55); }
.ds .chip .n{ font-family:var(--font-display); font-size:calc(var(--fs-hud) + 4px); font-weight:800; }

.ds .score{ display:inline-flex; align-items:center; gap:10px; height:var(--hit); padding:0 18px;
  font-size:var(--fs-hud); font-weight:700; white-space:nowrap; flex:none;
  background:var(--paper); color:var(--ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay); }
.ds .score .dot{ width:18px; height:18px; border-radius:50%; background:var(--tc,var(--t1)); }
.ds .score .v{ font-family:var(--font-display); font-size:calc(var(--fs-hud) + 4px); font-weight:800; min-width:44px; text-align:center; }

.ds .pause{ display:inline-flex; align-items:center; gap:12px; height:var(--hit); padding:0 24px; border:0; cursor:pointer;
  font-family:var(--font-display); font-size:var(--fs-hud); font-weight:800; line-height:1; white-space:nowrap;
  background:var(--sadu); color:#fff; border-radius:var(--r-chip);
  box-shadow:0 10px 0 var(--sadu2),0 18px 30px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.35); }
.ds .pause:active{ transform:translateY(6px); box-shadow:0 4px 0 var(--sadu2),0 8px 14px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.35); }
.ds .pause svg{ width:22px; height:22px; fill:currentColor; }

.ds .qbar{ display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 32px;
  font-family:var(--font-display); font-size:var(--fs-question); font-weight:800; line-height:1.22; white-space:nowrap;
  background:var(--paper); color:var(--ink); border:var(--border-ink); border-radius:var(--r-bar); box-shadow:var(--shadow-clay); }
.ds .qbar.verdict{ flex-direction:column; padding:6px 40px 8px; color:#fff; border-color:transparent; }
.ds .qbar.verdict.ok{ background:var(--palm2); }  .ds .qbar.verdict.bad{ background:var(--sadu2); }
.ds .qbar.verdict .q{ font-size:28px; font-weight:700; line-height:1.2; opacity:.92; }
.ds .qbar.verdict .v{ font-size:var(--fs-hero); font-weight:800; line-height:1.05; }
.ds .qbar.verdict .v small{ font-family:var(--font-text); font-size:26px; font-weight:700; margin-inline-end:14px; vertical-align:middle; }

.ds .lane{ position:relative; display:inline-flex; align-items:center; justify-content:center; height:78px; padding:0 34px 0 52px;
  font-family:var(--font-display); font-size:var(--fs-answer); font-weight:800; line-height:1; white-space:nowrap;
  background:var(--paper); color:var(--ink); border:var(--border-ink); border-radius:var(--r-chip); box-shadow:var(--shadow-clay);
  transition:background var(--d-pop) var(--ease-settle), color var(--d-pop) var(--ease-settle), border-color var(--d-pop) var(--ease-settle); }
.ds .lane::before{ content:''; position:absolute; inset:8px auto 8px 10px; width:14px; border-radius:7px;
  background:repeating-linear-gradient(180deg,var(--sadu) 0 9px,var(--ink) 9px 13px,#F1D39A 13px 21px,var(--paper) 21px 25px); }
.ds .lane.ok{ border-color:var(--palm); background:var(--palm-soft); color:var(--palm-ink); }

h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.2vw,44px);margin:0 0 6px;line-height:1.25;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,3vw,30px);margin:30px 0 12px;line-height:1.3}
p.sub{color:var(--ink2);margin:0 0 20px;font-size:17px;line-height:1.7;max-width:64ch}

.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-block:16px 26px}
.day{background:var(--paper);padding:12px 8px;text-align:center;min-height:82px;border-radius:16px;
  box-shadow:var(--shadow-clay);border:2px solid transparent}
.day b{display:block;font-size:15px;color:var(--ink2);font-weight:800;margin-block-end:6px}
.day .pill{font-size:14px;padding:5px 8px;border-radius:12px;background:var(--palm-soft);
  color:var(--palm-ink);font-weight:700;line-height:1.35;display:block}
.day.today{border-color:var(--gold);background:var(--gold-soft)} .day.today b{color:var(--gold2)}
.day .empty{font-size:14px;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--paper);border:3px solid var(--line);padding:18px 20px;border-radius:var(--r-card);
  text-align:right;width:100%;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-clay);
  transition:transform var(--d-pop) var(--ease-settle);min-height:128px}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
.card .obj{font-size:14px;color:var(--ink2);font-family:ui-monospace,Menlo,monospace;direction:ltr;
  background:var(--raised);padding:2px 8px;border-radius:8px;align-self:flex-start}
.card b{font-family:var(--font-display);font-size:24px;font-weight:400;line-height:1.3}
.card p{margin:0;font-size:15.5px;color:var(--ink2);line-height:1.6}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-block-start:auto;padding-block-start:8px}
.badge{font-size:14px;font-weight:800;padding:4px 12px;border-radius:999px;white-space:nowrap;line-height:1.5}
.b-rev{background:var(--palm-soft);color:var(--palm-ink)}
.b-eng{background:var(--raised);color:var(--ink2)}
.b-min{background:var(--gold-soft);color:var(--ink)}   
.b-new{background:var(--sadu-soft);color:var(--sadu-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 26px;
  font-size:19px;font-weight:800;border-radius:var(--r-chip);min-height:56px;line-height:1;
  transition:transform var(--d-tap) var(--ease-settle),box-shadow var(--d-tap) var(--ease-settle)}
.btn.pri{background:var(--palm2);color:#fff;font-family:var(--font-display);font-weight:400;font-size:22px;
  box-shadow:0 8px 0 #163D27,0 16px 26px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.28)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri:active{transform:translateY(5px);box-shadow:0 3px 0 #163D27,0 6px 12px var(--shade-soft),inset 0 3px 0 rgba(255,255,255,.28)}
.btn.sec{background:var(--paper);border:3px solid var(--ink);color:var(--ink);box-shadow:var(--shadow-clay)}
.btn.sec:hover{background:var(--raised)}
.btn.sec:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.btn.big{font-size:26px;padding:0 40px;min-height:var(--hit)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-block:14px 8px}
.opt{border:3px solid var(--line);background:var(--paper);padding:16px 18px;text-align:right;
  display:flex;flex-direction:column;gap:5px;border-radius:var(--r-card);min-height:56px;box-shadow:var(--shadow-clay)}
.opt[aria-pressed="true"]{border-color:var(--palm);background:var(--palm-soft)}
.opt b{font-family:var(--font-display);font-weight:400;font-size:22px} .opt span{font-size:15px;color:var(--ink2);line-height:1.6}
.opt:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.teamrow{display:flex;gap:10px;align-items:center;margin-block-end:10px;flex-wrap:wrap}
.teamrow .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.7)}
.teamrow input{flex:1;min-width:160px;padding:0 16px;border:3px solid var(--line);border-radius:18px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:18px;font-weight:700;min-height:52px}
.teamrow input:focus{border-color:var(--ink);outline:0}

.cover{margin-block:8px 18px}
.cover .track{position:relative;height:18px;background:var(--paper);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.cover .track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold);display:block}
.cover .track i.ok{background:var(--palm)}
.cover p{margin:8px 0 0;font-size:15px;color:var(--ink2)} .cover b{color:var(--ink)}
.wk{display:grid;grid-template-columns:36px repeat(5,1fr);gap:8px;align-items:start}
.wk-h{font-size:15px;font-weight:800;color:var(--ink2);display:grid;place-items:center;min-height:32px}
.wk-h.today{color:var(--gold2)}
.cell{min-height:56px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.cell.empty.today{border-color:var(--gold)}
.cell:not(.empty){border-style:solid;background:var(--paper);box-shadow:var(--shadow-clay);padding:10px 12px}
.cell.today:not(.empty){border-color:var(--gold);background:var(--gold-soft)}
.slot b{font-family:var(--font-display);font-size:20px;font-weight:400;display:block;line-height:1.3}
.slot .les{display:block;font-size:15px;color:var(--ink2);line-height:1.5} .slot .les em{font-style:normal;color:var(--sadu-ink)}
.slot .meta{display:flex;gap:6px;flex-wrap:wrap;margin-block:6px}
.slot .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .slot .acts .btn{min-height:48px;font-size:14px;padding:0 6px;border-width:2px}
.slot .acts .btn.pri{grid-column:1/-1;font-size:18px}
.slot button.les{text-align:right;color:var(--ink2);font-size:15px;line-height:1.5;padding:4px 0;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;min-height:44px}   
.slot button.les:hover{color:var(--ink)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:auto;padding-block-start:8px} .card .acts .btn{min-height:48px;font-size:15px;padding:0 14px}
.card .acts .btn.sec{border-width:2px;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 16px}
.lib{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.tree{display:flex;flex-direction:column;gap:6px}
.tree .ut{text-align:right;min-height:48px;padding:8px 14px;border-radius:14px;font-size:16px;font-weight:800;color:var(--ink2);border:2px solid transparent;width:100%}   
.tree .unit.open .ut{background:var(--paper);border-color:var(--line);color:var(--ink)}
.tree .ls{display:flex;flex-direction:column;gap:4px;padding:6px 10px 6px 0}
.tree .li{text-align:right;min-height:44px;padding:6px 14px;border-radius:12px;font-size:16px;font-weight:700;color:var(--ink2)}
.tree .li.on{background:var(--ink);color:var(--paper)} .tree .li:hover:not(.on){background:var(--raised)}
.pane{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-card);padding:20px 22px;box-shadow:var(--shadow-clay);min-height:320px}
.pane .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pane .card{border-width:2px;box-shadow:none;background:var(--bg)}
.pane code{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:isolate;background:var(--raised);padding:1px 6px;border-radius:6px;font-size:14px}
.shelf{font-family:var(--font-display);font-weight:400;font-size:22px;margin:20px 0 10px}
.bank{display:flex;flex-direction:column;gap:12px;max-width:760px}
.bank label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px;color:var(--ink2)}
.bank input,.bank textarea{padding:12px 16px;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:18px;font-weight:700;line-height:1.7}
.bank textarea{resize:vertical;min-height:150px}
.bank .notes{padding:12px 16px;border-radius:14px;background:var(--raised);font-size:15px;line-height:1.6}
.bank .notes.ok{background:var(--palm-soft);color:var(--palm-ink)} .bank .notes.warn{background:var(--gold-soft)}
.bank .notes ul{margin:6px 0 0;padding-inline-start:20px}
@media (max-width:760px){.lib{grid-template-columns:1fr}}

.card.add{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--ink2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-block:8px 6px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px;color:var(--ink2)}
.form input,.form select,#sNick,#sAv{min-height:52px;padding:0 16px;border:3px solid var(--line);border-radius:18px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:18px;font-weight:700}
.form input:focus,.form select:focus{border-color:var(--ink);outline:0}
.joinbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-card);
  padding:18px 22px;box-shadow:var(--shadow-clay)}
.joinbox .code{font-family:var(--font-display);font-size:56px;letter-spacing:.12em;direction:ltr;display:inline-block;line-height:1}
.joinbox .qr{width:128px;height:128px;flex:0 0 auto;background:#fff;border-radius:12px;padding:6px}
.joinbox .qr svg{width:100%;height:100%;display:block}
.tt{display:grid;grid-template-columns:44px repeat(5,1fr);gap:6px;max-width:720px}
.tt-h{font-size:14px;font-weight:800;color:var(--ink2);display:grid;place-items:center;min-height:36px}
.tt-c{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.tt-c.on{background:var(--palm-soft);border-color:var(--palm)}
.tt-c:hover{border-color:var(--ink)}
.students{display:flex;gap:8px;flex-wrap:wrap}
.stu{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 14px;border:2px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700}
.stu button{width:44px;height:44px;border-radius:50%;background:var(--raised);font-weight:800;font-size:16px}   
.btn.danger{border-color:var(--sadu);color:var(--sadu-ink)}
#toast{position:fixed;inset-inline:0;bottom:18px;margin-inline:auto;width:max-content;max-width:90vw;padding:12px 22px;border-radius:var(--r-chip);
  background:var(--ink);color:var(--paper);font-weight:800;opacity:0;transition:opacity var(--d-pop) var(--ease-settle);z-index:50;pointer-events:none}
#toast.show{opacity:1} #toast.warn{background:var(--sadu2)}

.scores{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-block-end:12px}
.tm{background:var(--paper);border:3px solid transparent;border-radius:var(--r-chip);padding:8px 14px;
  display:flex;flex-direction:column;gap:0;box-shadow:var(--shadow-clay);transition:border-color var(--d-pop) var(--ease-settle),transform var(--d-pop) var(--ease-settle)}
.tm.active{border-color:currentColor;transform:translateY(-3px)}
.tm .nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .nm i{width:14px;height:14px;border-radius:50%;background:currentColor;flex:0 0 auto;font-style:normal;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.tm .nm .short{display:none}   
.tm .pt{font-family:var(--font-display);font-size:32px;font-weight:400;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink);transition:transform var(--d-pop) var(--ease-pop)}
.tm.active .pt{color:currentColor}
.tm .pt.bump{transform:scale(1.28)}
.turn{font-size:14px;font-weight:800;color:var(--ink2);letter-spacing:.04em}

.stage{display:flex;flex-direction:column;flex:1;min-height:0}
#play{position:relative;flex:1;min-height:min(62svh,520px);background:var(--paper);
  border:3px solid var(--line);border-radius:var(--r-card);overflow:hidden;touch-action:manipulation}
#play canvas{display:block;width:100%;height:100%}
.say{margin-block-start:10px;font-size:clamp(17px,2.2vw,22px);font-weight:700;padding:0 18px;border-radius:var(--r-chip);line-height:1.4;
  display:flex;align-items:center;gap:12px;min-height:56px;opacity:0;transition:opacity var(--d-tap) var(--ease-settle);border:4px solid transparent}
.say.show{opacity:1}
.say.good{background:var(--palm-soft);color:var(--palm-ink);border-color:var(--palm)}
.say.soft{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.say .em{font-size:1.35em;line-height:1}
.playbar{display:flex;gap:10px;align-items:center;margin-block-start:10px;flex-wrap:wrap}

#quit{font-size:15px;font-weight:700;padding:0 14px;min-height:44px}

.rep .verdict{font-size:20px;font-weight:800;color:var(--ink);margin:0 0 10px}

.sub .sep,.sub-sep .sep{display:inline-block;margin-inline:.5em;opacity:.45}
.sub .part,.sub-sep .part{white-space:nowrap}

@keyframes feel-squash{0%{transform:scale(.97)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes feel-pop{from{transform:scale(.88)}}
@keyframes feel-settle{from{transform:scale(.96)}}
@keyframes feel-flip{from{transform:rotateY(0)}}
@keyframes feel-back{from{transform:rotateY(180deg)}}
@keyframes feel-shake{0%,100%{transform:translateX(0)}16%{transform:translateX(4px)}33%{transform:translateX(-4px)}50%{transform:translateX(4px)}66%{transform:translateX(-4px)}83%{transform:translateX(2px)}}
.feel-press{animation:feel-squash var(--d-pop) var(--ease-settle)}
#play .feel-flip{animation:feel-flip var(--d-settle) var(--ease-settle)}
#play .feel-back{animation:feel-back var(--d-settle) var(--ease-settle)}
#play .feel-settle{animation:feel-settle var(--d-tap) var(--ease-settle)}
.feel-pop{animation:feel-pop var(--d-pop) var(--ease-pop)}
.feel-shake{animation:feel-shake var(--d-shake) var(--ease-settle)}
#play.hitstop *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.feel-shake,.feel-press{animation:none}}

.hud{position:absolute;inset-inline:0;inset-block-start:0;padding:12px clamp(12px,2.4vw,20px);
  display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
  pointer-events:none;z-index:3;flex-wrap:wrap}
.hud .task{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-bar);
  padding:8px 18px;font-family:var(--font-display);font-size:clamp(18px,2.2vw,24px);
  line-height:1.35;max-width:min(72%,640px);box-shadow:var(--shadow-clay)}
.hud .pip{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-chip);
  padding:6px 14px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:var(--shadow-clay)}
.tapzone{position:absolute;pointer-events:auto;cursor:pointer}
.floatlbl{position:absolute;pointer-events:none;font-weight:800;
  font-size:clamp(14px,1.9vw,18px);line-height:1.35;text-align:center;
  text-shadow:0 1px 3px var(--paper),0 0 8px var(--paper)}

body.proj main{max-width:1560px}
body.proj .hud .task{font-size:clamp(24px,3vw,34px);padding:12px 22px}
body.proj .tm .pt{font-size:clamp(34px,3.6vw,46px)}
body.proj .say{font-size:clamp(21px,2.5vw,28px);min-height:64px}
body.proj .floatlbl{font-size:clamp(18px,2.4vw,25px)}
body.proj #play{min-height:min(70svh,760px)}
body.proj .slot .acts .btn{min-height:var(--hit)}

@media (max-width:560px){
  .nav{width:100%;order:9} .nav button{flex:1;padding:0 6px;font-size:15px}
  
  #projBtn{padding:0;width:44px;min-height:44px;justify-content:center;gap:0}
  #projBtn .lbl{display:none}
  .wk{grid-template-columns:1fr;gap:10px} .wk-h{display:none} .cell.empty{display:none}
  .cell:not(.empty)::before{content:attr(data-when);font-size:14px;font-weight:800;color:var(--ink2)}
  .tt{grid-template-columns:32px repeat(5,1fr);gap:4px} .tt-c{min-height:44px}
  .joinbox .code{font-size:40px}
}
@media (orientation:portrait) and (max-width:560px){
  #play{min-height:min(54svh,430px)}
  body.proj #play{min-height:min(60svh,520px)}
  .week{gap:6px} .day{padding:8px 4px;min-height:64px;border-radius:12px}
}

@media (orientation:portrait) and (max-width:560px){
  body.playing #app{height:100svh;overflow:hidden}
  body.playing .bar{min-height:52px;padding-block:4px;gap:8px}
  body.playing .nav{display:none}
  body.playing .brand{font-size:20px}
  body.playing main{padding:8px 10px 10px;min-height:0}
  body.playing .scores{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-block-end:8px}
  body.playing .tm{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 10px;min-height:44px;border-radius:14px;border-width:2px}
  body.playing .tm .nm{font-size:14px;min-width:0;flex:1}
  body.playing .tm .nm .full{display:none} body.playing .tm .nm .short{display:inline}
  body.playing .tm .nm i{width:12px;height:12px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  body.playing .tm .pt{font-size:20px}
  body.playing .turn{font-size:14px;flex:0 0 100%;line-height:1.2}
  body.playing #play{min-height:150px;flex:1 1 auto}
  body.playing .say{min-height:48px;margin-block-start:8px;font-size:16px;flex:0 0 auto}
  body.playing .playbar{margin-block-start:8px;flex-wrap:nowrap}
  body.playing .playbar .chip{display:none}          
  body.playing .playbar .btn{min-height:48px;flex:1}
  body.playing .playbar #quit{min-height:44px;flex:0 1 auto}   
  body.playing .foot{display:none}                   
  body.playing .stage{flex:1;min-height:0}
}

@media (orientation:landscape) and (max-height:520px){
  .bar{padding-block:5px;min-height:52px} main{padding-block:10px}
  .week{display:none}
  .scores{grid-template-columns:repeat(4,1fr);margin-block-end:8px}
  .tm{padding:5px 10px} .tm .pt{font-size:22px} .tm .nm{font-size:13px} .turn{display:none}
  #play{min-height:min(66svh,320px)}
  .say{min-height:44px;padding:0 12px;font-size:15px;margin-block-start:7px}
}

.rep{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-card);padding:clamp(18px,3vw,32px);box-shadow:var(--shadow-clay)}
.rep h3{font-family:var(--font-display);font-weight:400;font-size:24px;margin:28px 0 12px}
.rep h3:first-child{margin-block-start:0}
.rowbar{display:flex;align-items:center;gap:12px;margin-block-end:10px;font-size:16px}
.rowbar .lab{flex:0 0 auto;min-width:110px;font-weight:800}
.rowbar .track{flex:1;height:24px;background:var(--bg);border-radius:12px;overflow:hidden;min-width:70px}
.rowbar .fill{height:100%;background:var(--palm);display:block;border-radius:12px}
.rowbar .fill.low{background:var(--gold2)}
.rowbar .val{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:800;min-width:48px;text-align:left;font-family:var(--font-display);font-size:20px}
.qlist{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.qrow{display:flex;gap:12px;padding:12px 16px;border-block-end:1px solid var(--line);
  align-items:flex-start;font-size:15.5px;line-height:1.6}
.qrow span span{font-size:14px!important}   
.qrow:last-child{border-block-end:0}
.qrow .st{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:#fff}
.qrow .st.y{background:var(--palm2)} .qrow .st.n{background:var(--sadu2)}
.insight{background:var(--sadu-soft);border-inline-start:8px solid var(--sadu);padding:14px 18px;
  margin-block:18px;border-radius:12px}
.insight b{color:var(--sadu-ink)} .insight p{margin:0;line-height:1.7;font-size:16px}

.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:150px 1fr 1fr 64px;gap:12px;align-items:center;text-align:right;min-height:56px;padding:8px 16px;
  background:var(--paper);border:2px solid var(--line);border-radius:16px}

.srow span{font-size:14px}

<script>const SHIFT = (function(){
  const engines = {}, contents = {}, lessons = [], views = {};
  return {
    engine(id, def){ engines[id] = Object.assign({id}, def); },
    content(id, obj){ contents[id] = obj; },
    lesson(obj){ lessons.push(obj); },
     
    view(name, fn){ views[name] = fn; },
    _e:engines, _c:contents, _l:lessons, _v:views
  };
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const store = {
  get(k,d){ try{ const v=localStorage.getItem('shift_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('shift_'+k, JSON.stringify(v)); }catch(e){} }
};

const COLORS = ['var(--t1)','var(--t2)','var(--t3)','var(--t4)'];
const S = { screen:'home', lesson:null, gameKey:null, mode:'teams', teamCount:3,
            teams:[], turn:0, log:[], startedAt:0, sound:true, proj:false, live:null };

const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const kindWarned = new Set();
function warnKind(member, kind, known, tail){
  const key = member + ':' + String(kind);
  if(kindWarned.has(key)) return;
  kindWarned.add(key);
  let shown; try{ shown = JSON.stringify(kind); }catch(e){ shown = undefined; }
  if(shown === undefined) shown = String(kind);
  console.warn('SHIFT: ctx.' + member + '(' + shown + ') — ' + tail +
               ' المعروف: ' + known.join('، '));
}

const SAY_KINDS = ['good', 'soft'];

let AC = null;

const BEEP_MAP = { good:[660,990,.13], soft:[400,300,.18], tick:[560,560,.06],
                   win:[523,1046,.4], pop:[880,660,.08],
                   turn:[520,390,.12] };    

function beep(kind){
   
  if(!own(BEEP_MAP, kind))
    warnKind('beep', kind, Object.keys(BEEP_MAP),
             'اسم صوت غير معروف، استُبدل بـ«tick».');
  if(!S.sound) return;
   
  if(SHIFT.feel && SHIFT.feel.play(kind)) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const [f1,f2,dur] = own(BEEP_MAP, kind) ? BEEP_MAP[kind] : BEEP_MAP.tick;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = kind==='soft' ? 'triangle' : 'sine';
    o.connect(g); g.connect(AC.destination);
    o.frequency.setValueAtTime(f1, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime+dur);
    g.gain.setValueAtTime(.085, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur+.12);
    o.start(); o.stop(AC.currentTime+dur+.15);
  }catch(e){}
}
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setSound(on){
  S.sound = !!on; store.set('sound', S.sound);
  const b = $('#soundBtn');
  if(b){ b.textContent = S.sound ? '🔊' : '🔇'; b.setAttribute('aria-label', S.sound ? 'كتم الصوت' : 'تشغيل الصوت'); }
}

function minsWord(n){
  n = Number(n) || 0;
  if(n === 1) return 'دقيقة';
  if(n === 2) return 'دقيقتان';
  if(n >= 3 && n <= 10) return n + ' دقائق';
  return n + ' دقيقة';
}

const CLASS_SCREENS = ['play', 'report'];

function render(){
  const m = $('#main'); m.innerHTML='';
   
  document.body.classList.toggle('playing', S.screen === 'play');
  const builtin = {lesson:vLesson, setup:vSetup, play:vPlay};
  (SHIFT._v[S.screen] || builtin[S.screen])(m);
   
  if (CLASS_SCREENS.indexOf(S.screen) >= 0 && SHIFT.feel && SHIFT.feel.digitsIn) SHIFT.feel.digitsIn(m);
  document.querySelectorAll('#nav [data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === S.screen ? 'page' : 'false'));
  window.scrollTo(0,0);
}

function reviewBadge(state){
  const m = { approved:['b-rev','✓ مُراجَعة'], in_review:['b-min','قيد المراجعة'], blocked:['b-new','⛔ محجوبة'] };    
  const [cls, txt] = m[state] || ['b-new','غير مُراجَعة'];
  return `<span class="badge ${cls}" data-state="${esc(state||'unreviewed')}">${txt}</span>`;
}

  const L = S.lesson;
  m.innerHTML = `
    <p class="eyebrow">${esc(L.unit)}</p>
    <h1>${esc(L.title)}</h1>
    <p class="sub">أهداف التعلّم: ${L.objectives.map(esc).join(' · ')}</p>
    <h2>ألعاب هذا الدرس</h2>
    <div class="grid">${L.games.map(g=>{
      const E = SHIFT._e[g], C = SHIFT._c[g];
      if(!E || !C) return '';
      return `<button class="card" data-game="${g}">
        <b>${esc(C.title || E.name)}</b>
        <p>${esc(E.name)}</p>
        <span class="meta">
          <span class="badge b-min">${minsWord(E.mins)}</span>
          ${E.motion ? '<span class="badge b-new">حركة</span>' : ''}
          ${reviewBadge(SHIFT.data && SHIFT.data.games[g] ? SHIFT.data.games[g].approval_state : 'unreviewed')}
        </span></button>`;}).join('')}
    </div>
    <div class="row" style="margin-block-start:24px"><button class="btn sec" id="back">→ رجوع لأسبوعي</button></div>`;
  m.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { S.gameKey=b.dataset.game; S.screen='setup'; render(); });
  $('#back').onclick = () => { S.screen='home'; render(); };

      + '<h1>' + esc(gameTitle(S.gameKey)) + '</h1>'
      + '<p class="sub">أُوقفت مؤقّتاً ولم تُحذف. اختر لعبة أخرى من المكتبة.</p>'
      + '<div class="row"><button class="btn pri" id="toLib">المكتبة</button></div>';
    const b = $('#toLib'); if(b) b.onclick = () => SHIFT.go('library');
    return;
  }
   
  const saved = (S.cls && S.cls.teams && S.cls.teams.length) ? S.cls.teams.slice() : store.get('teams', TEACH.DEFAULT_TEAMS.slice());
  if(S.teams.length !== S.teamCount)
    S.teams = saved.slice(0,S.teamCount).map((n,i)=>({name:n,score:0,right:0,wrong:0,color:COLORS[i]}));
  m.innerHTML = `
    <p class="eyebrow">${esc(E.name)}</p>
    <h1>${esc(C.title || E.name)}</h1>
    <p class="sub">${esc(C.how || 'اختر وضع التشغيل المناسب لفصلك اليوم، ثم ابدأ.')}</p>
    <div class="row" style="margin-block:-8px 16px">
      <button class="chip${S.sound?'':' on'}" id="muteSetup" aria-pressed="${!S.sound}">${S.sound ? '🔊 الصوت مفعّل' : '🔇 الصوت مكتوم'}</button>
      <span style="font-size:14px;color:var(--ink2);font-weight:700">${S.sound ? 'يصطدم بشرحك؟ اكتمه من هنا قبل البدء — يُحفظ على هذا الجهاز' : 'المؤثرات مكتومة — الحكم يبقى بالألوان و✓'}</span>
    </div>
    <div class="opts">
      <button class="opt" data-mode="teams" aria-pressed="${S.mode==='teams'}">
        <b>فرق بجهاز واحد</b><span>جهاز المعلم على البروجكتر، ومندوب كل فريق يلعب دوره. لا يحتاج أجهزة للطلبة.</span></button>
      <button class="opt" data-mode="board" aria-pressed="${S.mode==='board'}">
        <b>لمس أمامي على السبورة</b><span>الطالب يلعب على الشاشة أمام الصف.</span></button>
      
    </div>
    <h2>الفرق</h2>
    <div class="row" style="margin-block-end:14px">
      ${[2,3,4].map(n=>`<button class="chip${S.teamCount===n?' on':''}" data-tc="${n}">${n} فرق</button>`).join('')}
    </div>
    <div>${S.teams.map((t,i)=>`
      <div class="teamrow"><span class="dot" style="background:${t.color}"></span>
        <input value="${esc(t.name)}" data-ti="${i}" aria-label="اسم الفريق ${i+1}" maxlength="18"></div>`).join('')}
    </div>
    <div class="row" style="margin-block-start:26px">
      <button class="btn pri big" id="go">▶ ابدأ اللعبة</button>
      <button class="btn sec" id="back">→ رجوع</button>
    </div>`;
  $('#muteSetup').onclick = () => { setSound(!S.sound); render(); };
  m.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode=b.dataset.mode; render(); });
  m.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => {
    const n = +b.dataset.tc;
    const names = S.teams.map(t=>t.name).concat(saved).slice(0,n);
    S.teamCount = n;
    S.teams = names.map((nm,i)=>({name:nm,score:0,right:0,wrong:0,color:COLORS[i]}));
    render(); });
  m.querySelectorAll('[data-ti]').forEach(inp => inp.oninput = () => { S.teams[+inp.dataset.ti].name = inp.value; });
  $('#back').onclick = () => { S.screen='lesson'; render(); };
  $('#go').onclick = () => {
    if(SHIFT.feel) SHIFT.feel.warm();    
    store.set('teams', S.teams.map(t=>t.name));
    if(S.cls){ S.cls.teams = S.teams.map(t => t.name).concat(S.cls.teams.slice(S.teams.length)); SHIFT.local.put('classes', S.cls); }
    S.teams.forEach(t=>{ t.score=0; t.right=0; t.wrong=0; });
    S.turn=0; S.log=[]; S.startedAt=Date.now(); S.screen='play'; render(); };
}

function scoreboardHTML(){
   
  const short = n => String(n).replace(/^فريق\s+/, '');
  return `<div class="scores" id="scores">${S.teams.map((t,i)=>`
    <div class="tm${i===S.turn?' active':''}" style="color:${t.color}">
      <span class="nm"><i></i><span class="full">${esc(t.name)}</span><span class="short">${esc(short(t.name))}</span></span>
      <span class="pt" data-pt="${i}">${SHIFT.feel ? SHIFT.feel.count(t.score) : t.score}</span>
      ${i===S.turn?'<span class="turn">الدور الآن</span>':''}
    </div>`).join('')}</div>`;
}

function vPlay(m){
  const E = SHIFT._e[S.gameKey];
  m.innerHTML = `<div class="stage">
      ${scoreboardHTML()}
      <div id="play"></div>
      <div class="say" id="say"></div>
      <div class="playbar noprint">
        <button class="btn sec" id="quit">إنهاء وأظهر التقرير</button>
        <span class="chip">${esc(E.name)}</span>
      </div>
    </div>`;
  $('#quit').onclick = finish;

  const root = $('#play');
  const rafs = [], timers = [];
  let dead = false;
   
  if(SHIFT.feel) SHIFT.feel.attach(root, $('#say'), $('#scores'), S.gameKey);

  const ctx = {
    content: SHIFT._c[S.gameKey],
    teams: S.teams,
    team: () => S.teams[S.turn],
    proj: S.proj,
    reduced: REDUCED,
    esc, shuffle, clamp,
    beep,
    correct(points, log){
      const t = S.teams[S.turn];
      t.score += points; t.right++;
      S.log.push(Object.assign({team:t.name, right:true}, log||{}));
      if(SHIFT.feel) SHIFT.feel.verdict('good');    
      ctx.sync(true);
    },
    wrong(log){
      const t = S.teams[S.turn];
      t.wrong++;
      S.log.push(Object.assign({team:t.name, right:false}, log||{}));
      if(SHIFT.feel) SHIFT.feel.verdict('bad');     
      ctx.sync();
    },
    next(){ S.turn = (S.turn+1) % S.teams.length; beep('turn'); if(SHIFT.feel) SHIFT.feel.turn(); ctx.sync(); },
    sync(bump){
      const box = $('#scores'); if(!box) return;
      S.teams.forEach((t,i)=>{
        const el = box.querySelector(`[data-pt="${i}"]`);
        const want = SHIFT.feel ? SHIFT.feel.count(t.score) : String(t.score);    
        if(el && el.textContent !== want){
          el.textContent = want;
          if(bump && !REDUCED){
            const go = () => { el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),260); };
            if(SHIFT.feel) setTimeout(go, SHIFT.feel.HOLD()); else go();    
          }
        }
        const card = el && el.closest('.tm');
        if(card) card.classList.toggle('active', i===S.turn);
      });
      const old = box.querySelector('.turn'); if(old) old.remove();
      const cur = box.querySelectorAll('.tm')[S.turn];
      if(cur && !cur.querySelector('.turn')){
        const s = document.createElement('span'); s.className='turn'; s.textContent='الدور الآن'; cur.appendChild(s);
      }
    },
    say(kind, html){
       
      if(SAY_KINDS.indexOf(kind) < 0)
        warnKind('say', kind, SAY_KINDS,
                 'نبرة غير معروفة، عُوملت كـ«soft» ومعها ◔ بدل ✓.');
      const el = $('#say'); if(!el) return;
      el.className = 'say show ' + (kind==='good'?'good':'soft') + (SHIFT.feel ? SHIFT.feel.sayClass(kind) : '');    
      el.innerHTML = `<span class="em">${kind==='good'?'✓':'◔'}</span><span>${html}</span>`;
    },
    clearSay(){ const el=$('#say'); if(el){ el.className='say'; el.innerHTML=''; } },
    finish,
    after(ms, fn){ const h = setTimeout(()=>{ if(!dead) fn(); }, ms); timers.push(h); return h; },
    raf(fn){
      let last = performance.now(), id;
      const step = now => { if(dead) return; const dt = Math.min(50, now-last); last = now;
        fn(dt, now); id = requestAnimationFrame(step); };
      id = requestAnimationFrame(step); rafs.push(()=>cancelAnimationFrame(id));
    },
    canvas(host){
      const cv = document.createElement('canvas');
      cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
      host.appendChild(cv);
      const g = cv.getContext('2d');
      let W=1, H=1; const cbs = [];
      const fit = () => {
        const r = host.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio||1);
        W = Math.max(1, r.width); H = Math.max(1, r.height);
        cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
        g.setTransform(dpr,0,0,dpr,0,0);
        cbs.forEach(f=>f(W,H));
      };
      fit();
      const ro = new ResizeObserver(fit); ro.observe(host);
      rafs.push(()=>ro.disconnect());
      return { cv, g, w:()=>W, h:()=>H, onResize(f){ cbs.push(f); f(W,H); } };
    },
    css(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }
  };

  const inst = SHIFT._e[S.gameKey].mount(root, ctx);
  S.live = { destroy(){ dead = true; rafs.forEach(f=>f()); timers.forEach(clearTimeout); if(SHIFT.feel) SHIFT.feel.detach();
                        try{ inst && inst.destroy && inst.destroy(); }catch(e){} } };
}

function teardown(){ if(S.live){ S.live.destroy(); S.live = null; } }

function finish(){
  teardown();
   
  S.session = (typeof SHIFT.saveSession === 'function') ? SHIFT.saveSession() : null;
  S.screen = 'report'; render();
}

function boot(){
  $('#projBtn').onclick = e => {
    S.proj = !S.proj;
    document.body.classList.toggle('proj', S.proj);
    e.currentTarget.classList.toggle('on', S.proj);
    if(S.proj && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(()=>{});
    else if(!S.proj && document.fullscreenElement && document.exitFullscreen)
      document.exitFullscreen().catch(()=>{});
    if(S.screen==='play'){ teardown(); render(); }
  };
  setSound(store.get('sound', true));
  $('#soundBtn').onclick = () => setSound(!S.sound);
  $('#homeBtn').onclick = () => { teardown(); S.screen='home'; render(); };
  document.querySelectorAll('#nav [data-go]').forEach(b => b.onclick = () => { teardown(); S.screen = b.dataset.go; render(); });
   
  (SHIFT.local ? SHIFT.local.ready : Promise.resolve()).then(render, render);
}

SHIFT.local = (function(){
  const DB = 'shift.local.v1', STORES = ['classes', 'sessions', 'prefs'], LS = 'shift.local.v1.';
  const mem = { classes: new Map(), sessions: new Map(), prefs: new Map() };
  let idb = null, backend = 'memory';

  function openIdb(){
    return new Promise((res, rej) => {
      try{
        if(typeof indexedDB === 'undefined') return rej(new Error('no indexedDB'));
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('open failed')); r.onblocked = () => rej(new Error('blocked'));
      }catch(e){ rej(e); }
    });
  }
  function tx(store, mode, fn){
    return new Promise((res, rej) => {
      const t = idb.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  function lsOk(){ try{ localStorage.setItem(LS + 'probe', '1'); localStorage.removeItem(LS + 'probe'); return true; }catch(e){ return false; } }
  function lsLoad(){ STORES.forEach(s => { try{ (JSON.parse(localStorage.getItem(LS + s) || '[]')).forEach(o => mem[s].set(o.id, o)); }catch(e){} }); }
  function lsSave(s){ try{ localStorage.setItem(LS + s, JSON.stringify([...mem[s].values()])); return true; }catch(e){ return false; } }

  async function init(){
    try{
      idb = await openIdb(); backend = 'idb';
      for(const s of STORES){ const all = await tx(s, 'readonly', st => st.getAll()); (all || []).forEach(o => mem[s].set(o.id, o)); }
    }catch(e){
      idb = null;
      if(typeof localStorage !== 'undefined' && lsOk()){ backend = 'localStorage'; lsLoad(); } else backend = 'memory';
    }
    return backend;
  }
  async function persist(store, obj, del){
    if(backend === 'idb'){
      try{ await tx(store, 'readwrite', st => del ? st.delete(obj.id) : st.put(obj)); return true; }
      catch(e){ backend = (typeof localStorage !== 'undefined' && lsOk()) ? 'localStorage' : 'memory'; }
    }
    if(backend === 'localStorage') return lsSave(store);
    return false;
  }
  const api = {
    ready: null,
    backend: () => backend,
    all(store){ return [...mem[store].values()]; },
    get(store, id){ return mem[store].get(id) || null; },

SHIFT.feel = (function(){
  const MOTION_ENGINES = ['match', 'matchIsl', 'timeline'];
  const AR = '٠١٢٣٤٥٦٧٨٩';
  const num = s => String(s).replace(/[0-9]/g, d => AR[+d]);
   
  const count = n => (Number(n) > 0 ? num(n) : '—');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stats = { flip:0, back:0, pop:0, shake:0, settle:0, press:0, hitstop:0, sfx:0, digits:0 };
  const cssMs = (name, d) => { const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); return isNaN(v) ? d : v; };

  let ac = null, bus = null, warmed = false; const buf = {}, onset = {};
  function context(){
    if(!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = 0.7; bus.connect(ac.destination); }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }
   
  function firstSound(b){
    const d = b.getChannelData(0);
    for(let i = 0; i < d.length; i++) if(Math.abs(d[i]) > 0.01) return Math.max(0, i - 32) / b.sampleRate;
    return 0;
  }
   
  function warm(){
    const bank = SHIFT.sfxBank; if(!bank || warmed) return; warmed = true;
    try{
      const c = context();
      Object.keys(bank).forEach(k => {
        const str = atob(bank[k].split(',')[1]), a = new Uint8Array(str.length);
        for(let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i);
        c.decodeAudioData(a.buffer, b => { buf[k] = b; onset[k] = firstSound(b); }, () => {});
      });
    }catch(e){ warmed = false; }
  }
   
  function play(kind){
    const bank = SHIFT.sfxBank;
    if(!bank || !Object.prototype.hasOwnProperty.call(bank, kind)) return false;
    try{
      const c = context();
      if(!buf[kind]){ warm(); return false; }
      const s = c.createBufferSource(); s.buffer = buf[kind]; s.connect(bus); s.start(0, onset[kind] || 0);
      stats.sfx++; return true;
    }catch(e){ return false; }
  }

  let root = null, mo = null, moNum = null, motion = false, pending = null, hold = 50, touched = [], prev = new Map();
  const keyOf = el => { for(const a of el.attributes){ if(a.name.indexOf('data-') === 0) return a.name + '=' + a.value; } return null; };
  const sigOf = el => (el.disabled ? 'd' : 'e') + '|' + (el.getAttribute('style') || '') + '|' + el.className.replace(/\s*feel-\S+/g, '');
  const flipper = el => el.querySelector(':scope > [style*="preserve-3d"]');    
  function anim(el, cls, n){
    if(!el || el.classList.contains(cls)) return;
    el.classList.add(cls); stats[n]++;
    el.addEventListener('animationend', () => el.classList.remove(cls), { once:true });
  }
   
  function scan(){
    if(!root) return;
    const cur = new Map(), changed = [];
    root.querySelectorAll('button').forEach(el => {
      const id = keyOf(el); if(!id) return;
      const s = sigOf(el); cur.set(id, { s, el });
      const p = prev.get(id);
      if(p && p.s !== s) changed.push({ el, id, wasOff: p.s[0] === 'd', nowOff: s[0] === 'd' });
    });
    prev = cur;
    const verdict = pending; pending = null;
    if(!motion) return;
    changed.forEach(c => {
      const f = flipper(c.el);
      if(f && !c.wasOff && c.nowOff) anim(f, 'feel-flip', 'flip');         
      else if(f && c.wasOff && !c.nowOff) anim(f, 'feel-back', 'back');    
      else if(!verdict) anim(c.el, 'feel-settle', 'settle');               
    });
    if(!verdict) return;
    const targets = new Map();    
    changed.forEach(c => targets.set(c.id, c));
    touched.forEach(id => { if(!targets.has(id) && cur.has(id)) targets.set(id, { el: cur.get(id).el, id }); });
    touched = [];
    if(verdict === 'good') targets.forEach(t => anim(t.el, 'feel-pop', 'pop'));
    else targets.forEach(t => {
       
      if(t.wasOff === false && t.nowOff && !flipper(t.el)) return;
      anim(t.el, 'feel-shake', 'shake');
    });
  }
   
  function verdict(kind){
    pending = kind;
    setTimeout(() => { pending = null; }, 0);    
    if(kind === 'good' && motion && root){
      root.classList.add('hitstop'); stats.hitstop++;
      setTimeout(() => { if(root) root.classList.remove('hitstop'); }, hold);
    }
  }
  const turn = () => { touched = []; };
   
  const sayClass = () => !motion ? '' : pending === 'good' ? ' feel-pop' : pending === 'bad' ? ' feel-shake' : '';

  document.addEventListener('pointerdown', e => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null; if(!b || b.disabled) return;
    if(!(root && root.contains(b)) && !b.classList.contains('card')) return;
    if(reduced()) return;
    b.classList.remove('feel-press'); void b.offsetWidth; b.classList.add('feel-press'); stats.press++;
    b.addEventListener('animationend', () => b.classList.remove('feel-press'), { once:true });
  }, true);
  document.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if(!b || !root || !root.contains(b)) return;
    const id = keyOf(b); if(!id) return;
    if(touched[touched.length - 1] !== id) touched.push(id);
    if(touched.length > 4) touched.shift();
  }, true);

  const SKIP = 'style,script,code,pre,input,textarea,[dir="ltr"],.latn';
  const skip = n => n.parentElement && n.parentElement.closest(SKIP);
  function fixText(t){ if(/[0-9]/.test(t.nodeValue) && !skip(t)){ t.nodeValue = num(t.nodeValue); stats.digits++; } }
  function digitsIn(el){ const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let t; while((t = w.nextNode())) fixText(t); }
  function onNum(recs){
    for(const r of recs){
      if(r.type === 'characterData') fixText(r.target);
      else r.addedNodes.forEach(n => { if(n.nodeType === 3) fixText(n); else if(n.nodeType === 1 && !n.matches(SKIP)) digitsIn(n); });
    }
  }

  function attach(playEl, sayEl, scoresEl, engineKey){
    detach();
    root = playEl; motion = MOTION_ENGINES.indexOf(engineKey) >= 0 && !reduced();
    hold = cssMs('--d-hold', 50); prev = new Map(); touched = []; pending = null;
    mo = new MutationObserver(scan);
    mo.observe(root, { childList:true, subtree:true, attributes:true, attributeFilter:['disabled', 'style'] });
    moNum = new MutationObserver(onNum);
    [root, sayEl, scoresEl].forEach(el => { if(el){ digitsIn(el); moNum.observe(el, { childList:true, subtree:true, characterData:true }); } });

(function () {
  const C = {};

  C.MAP = {
    quiz:     { needs: 'questions',  min: 4, round: 4, tags: ['رقم', 'اسم', 'مفهوم'], name: 'سباق المعرفة' },
    match:    { needs: 'pairs',      min: 4, round: 5, tags: ['زوج', 'مفهوم'],        name: 'مطابقة وذاكرة',
                lead: 'طابق المفهوم بتعريفه' },    
    timeline: { needs: 'sequences',  min: 1, minItems: 4, round: 4, tags: ['تسلسل'],  name: 'ترتيب' },
     
    catch:    { needs: 'categories', min: 1, minItems: 6, minGroups: 3, round: 6, tags: ['فئة'], name: 'امسك الصحيح' },
    map:      { needs: 'places',     min: 4, round: 4, tags: ['خريطة'], name: 'خريطة بلادي', blocked: true },
  };

  C.PLACE_KINDS = ['region', 'point'];
  C.GEO_KEY = /^[a-z][a-z0-9]*:[^\s:/]+\/[^\s:]+$/;    

  C.supply = (lesson, engineId) => {
    const r = C.MAP[engineId]; if (!r || !lesson) return 0;
    const arr = lesson[r.needs] || [];
    if (r.minItems) {                        
      const inner = arr.map(x => (x.order || x.items || []).length);
      return inner.length ? Math.max.apply(null, inner) : 0;
    }
    return arr.length;
  };

  C.eligible = (lesson, engineId) => {
    const r = C.MAP[engineId];
    if (!r) return { ok: false, why: 'محرّك غير معروف' };
    if (r.blocked) return { ok: false, why: 'المحرّك موقوف' };
    const n = C.supply(lesson, engineId);
    const need = r.minItems || r.min;
    if (n < need) return { ok: false, why: `يحتاج ${need} على الأقل، والدرس فيه ${n}` , have: n, need };
     
    if (r.minGroups) {
      const g = (lesson[r.needs] || []).length;
      if (g < r.minGroups)
        return { ok: false, why: `يحتاج ${r.minGroups} مجموعات على الأقل (جولة لكل فريق)، والدرس فيه ${g}`, have: n, need };
    }
    return { ok: true, have: n, need, rounds: Math.ceil(n / r.round) };
  };

  C.enginesFor = lesson => Object.keys(C.MAP)
    .map(id => Object.assign({ id, name: C.MAP[id].name }, C.eligible(lesson, id)))
    .filter(x => x.ok);

  C.rejectedFor = lesson => Object.keys(C.MAP)
    .map(id => Object.assign({ id, name: C.MAP[id].name }, C.eligible(lesson, id)))
    .filter(x => !x.ok);

  C.rounds = (lesson, engineId) => {
    const r = C.MAP[engineId]; if (!r) return [];
    const arr = (lesson[r.needs] || []).slice();
    if (r.minItems) return arr.map(x => [x]);         
    const out = [];
    for (let i = 0; i < arr.length; i += r.round) out.push(arr.slice(i, i + r.round));
    return out;
  };

  C.fairCount = (n, teams) => (teams > 0 ? Math.floor(n / teams) * teams : n);
  C.fairPlan = (n, teams) => {
    const play = C.fairCount(n, teams);
    return { play, perTeam: teams > 0 ? play / teams : play, left: n - play };
  };

  C.OPTION_MAX = 32;
   
  C.OBJ_SHORT_MAX = 34;

  const WORDNUM = { 'صفر': 0, 'واحد': 1, 'واحدة': 1, 'اثنان': 2, 'اثنين': 2, 'اثنتان': 2, 'ثلاث': 3, 'ثلاثة': 3,
    'أربع': 4, 'أربعة': 4, 'خمس': 5, 'خمسة': 5, 'ست': 6, 'ستة': 6, 'سبع': 7, 'سبعة': 7,
    'ثمان': 8, 'ثماني': 8, 'ثمانية': 8, 'تسع': 9, 'تسعة': 9, 'عشر': 10, 'عشرة': 10 };
  const digits = t => {
    const s0 = String(t).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const m = s0.match(/\d+(\.\d+)?/); if (m) return m;
    const w = String(t == null ? '' : t).replace(/[\u064B-\u0652]/g, '').trim().split(/[^\u0621-\u064A]+/)
      .map(x => x.replace(/^ال/, '')).find(x => WORDNUM[x] !== undefined);
    return w === undefined ? null : [String(WORDNUM[w])];
  };
  const norm = t => String(t == null ? '' : t).replace(/[\u064B-\u0652]/g, '').replace(/[٪%]/g, '').trim();
  const STOP = ['على', 'من', 'في', 'التي', 'الذي', 'هذا', 'هذه', 'أو', 'ما'];
  const words = t => norm(t).split(/[^\u0621-\u064A]+/).filter(w => w.length >= 3 && STOP.indexOf(w) < 0)
    .map(w => w.replace(/^ال/, ''));
   
  const shares = (a, vocabWords) => words(a).some(w => vocabWords.some(v => v.startsWith(w.slice(0, 3)) || w.startsWith(v.slice(0, 3))));

  C.OUTSIDE_TRUE = ['أكبر جزيرة في العالم'];

  C.ANTONYMS = [['أكبر', 'أصغر'], ['أكبر', 'أقل'], ['أكثر', 'أقل'], ['أكثر', 'أصغر'],
                ['كبير', 'صغير'], ['أطول', 'أقصر']];

  C.questionIssues = lesson => {
    const out = [];
    const facts = {}; (lesson.facts || []).forEach(f => { facts[f.id] = f; });
     
    const vocab = words([
      ...(lesson.facts || []).map(f => f.text),
      ...(lesson.pairs || []).flatMap(p => [p.a, p.b]),
      ...(lesson.sequences || []).flatMap(s => s.order || []),
    ].join(' · '));

    const seen = {};
    (lesson.questions || []).forEach((q, i) => {
      const at = `سؤال ${i + 1}`;
      if (!q.from) { out.push({ i, why: `${at}: بلا حقيقة مصدر (from)` }); return; }
      if (!facts[q.from]) { out.push({ i, why: `${at}: يشير إلى حقيقة غير موجودة (${q.from})` }); return; }
      if (seen[q.from] !== undefined) out.push({ i, why: `${at}: الحقيقة ${q.from} لها سؤال آخر (${seen[q.from] + 1})` });
      else seen[q.from] = i;

      const opts = q.options || [], right = opts[q.answer];
      opts.forEach((o, k) => {
        const len = String(o).length;
        if (len > C.OPTION_MAX)
          out.push({ i, why: `${at}: الخيار ${k + 1} طوله ${len} محرفاً والحدّ ${C.OPTION_MAX} — يلتفّ فيفيض عن الشاشة` });
      });
      const factText = norm(facts[q.from].text);
      if (right == null) { out.push({ i, why: `${at}: بلا جواب` }); return; }
       
      if (factText.indexOf(norm(right)) < 0)
        out.push({ i, why: `${at}: الجواب «${right}» ليس في نصّ حقيقته ${q.from} — فالسؤال لا يقيس الدرس` });
       
      const others = (lesson.questions || []).filter((_, j) => j !== i)
        .map(x => norm((x.q || '') + ' ' + ((x.options || [])[x.answer] || '')));
      (q.options || []).forEach((o, k) => {
        if (k === q.answer) return;
        if (words(o).length < 2) return;
        if (others.some(h => h.indexOf(norm(o)) >= 0))
          out.push({ i, why: `${at}: المشتّت «${o}» محورُ سؤال آخر — يكشف نفسه` });
      });

      const stemW = words(q.q || '');
      const hasStem = (list, w) => list.some(v => v.startsWith(w) || w.startsWith(v));
      opts.forEach((o, k) => {
        if (k === q.answer) return;
        const on = norm(o);
        const hit = C.OUTSIDE_TRUE.find(ph => on.indexOf(norm(ph)) >= 0);
        if (hit) out.push({ i, why: `${at}: المشتّت «${o}» عبارة صحيحة خارج الدرس — نفيها يعلّم خطأ` });
        const ow = words(o);
        for (const [a, b] of C.ANTONYMS) {
          const clash = (hasStem(stemW, a) && hasStem(ow, b)) || (hasStem(stemW, b) && hasStem(ow, a));
          if (!clash) continue;
           
          const shared = ow.some(w => w.startsWith(a.slice(0, 3)) || w.startsWith(b.slice(0, 3)) ? false
            : stemW.some(v => v.startsWith(w.slice(0, 3)) || w.startsWith(v.slice(0, 3))));
          if (shared) out.push({ i, why: `${at}: المشتّت «${o}» يناقض نصّ السؤال — يُستبعد بلا معرفة` });
        }
      });
      opts.forEach((o, k) => {
        if (k === q.answer) return;
        if (digits(o)) return;                  
         
        if (!shares(o, vocab))
          out.push({ i, why: `${at}: المشتّت «${o}» لا يشترك في كلمة واحدة مع مفردات الدرس — يُستبعد بمعرفة عامة` });
      });
       
      const rn = digits(right);
      if (rn) {
        const R = +rn[0];
        opts.forEach((o, k) => {
          if (k === q.answer) return;
          const dn = digits(o); if (!dn) return;
          const D = +dn[0], rel = Math.abs(D - R) / (R || 1);
          if (rel < 0.05 || rel > 0.40)
            out.push({ i, why: `${at}: المشتّت ${D} مسافته ${Math.round(rel * 100)}% من ${R} — المدى 5–40%` });
          if (R % 10 !== 0 && D % 10 === 0)
            out.push({ i, why: `${at}: المشتّت ${D} من مضاعفات العشرة والجواب ${R} ليس كذلك — يُستبعد بالشكل` });
        });
      }
    });
    return out;
  };

  C.objectiveIssues = lesson => {
    const out = [];
    (lesson.objectives || []).forEach((o, i) => {
      if (!o.short) out.push({ i, why: `الهدف ${o.code || i + 1}: بلا صيغة قصيرة (short)` });
      else if (o.short.length > C.OBJ_SHORT_MAX)
        out.push({ i, why: `الهدف ${o.code}: الصيغة القصيرة ${o.short.length} محرفاً والحدّ ${C.OBJ_SHORT_MAX}` });
    });
    return out;
  };

  C.POS_RUN_MAX = 2;

  C.rng = function (seed) {
    let a = (seed >>> 0);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  C.seedOf = function (str) {
    let h = 2166136261 >>> 0;
    const x = String(str || '');
    for (let i = 0; i < x.length; i++) { h ^= x.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  };

  C.shuffle = function (arr, rnd) {
    const a = (arr || []).slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };

  C.positionsOk = function (pos) {
    pos = pos || [];
    if (pos.length < 2) return true;
    let run = 1;
    for (let i = 1; i < pos.length; i++) {
      run = (pos[i] === pos[i - 1]) ? run + 1 : 1;
      if (run > C.POS_RUN_MAX) return false;
    }
    const count = {};
    pos.forEach(p => { count[p] = (count[p] || 0) + 1; });
    const half = Math.floor(pos.length / 2);
    return Object.keys(count).every(k => count[k] <= half);
  };

  C.orderQuestions = function (lesson, seed) {
    const qs = (lesson && lesson.questions) || [];
    const base = (seed === undefined || seed === null ? C.seedOf(lesson && lesson.lesson_id) : seed) >>> 0;
    let last = qs.slice();
    for (let attempt = 0; attempt < 400; attempt++) {
      const rnd = C.rng((base + attempt * 0x9E3779B1) >>> 0);
      last = qs.map(q => {
        const perm = C.shuffle((q.options || []).map((_, i) => i), rnd);
        return Object.assign({}, q, {
          options: perm.map(i => q.options[i]),
          answer: perm.indexOf(q.answer),
        });
      });
      if (C.positionsOk(last.map(q => q.answer))) return last;
    }
    return last;    
  };

  C.TEACHER_SOURCE = 'teacher';
  C.isCurriculum = q => !q || q.source !== C.TEACHER_SOURCE;

  C.objectivesOf = items => [...new Set((items || []).map(x => x && x.obj).filter(Boolean))];

  (typeof window !== 'undefined' ? window : globalThis).SHIFT =
    (typeof window !== 'undefined' ? window : globalThis).SHIFT || {};
  (typeof window !== 'undefined' ? window : globalThis).SHIFT.contract = C;
  if (typeof module !== 'undefined' && module.exports) module.exports = C;
})();
