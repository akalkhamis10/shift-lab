 الأرضية ملوّنة بمفتاح (يابسة/ماء)؛ جزر المالديف وجزر القمر في نشاط تحديد نوع المسطح","obj":"KW-SOC-G5-LOC-01-02","source":"موثّق"}],"pairs":[{"a":"المسطحات المائية","b":"أشكال المياه على الأرض","obj":"KW-SOC-G5-LOC-01-03","from":"f3"},{"a":"المحيط","b":"مسطح مائي كبير جداً","obj":"KW-SOC-G5-LOC-01-03","from":"f4a"},{"a":"البحر","b":"أصغر من المحيط","obj":"KW-SOC-G5-LOC-01-03","from":"f4b"},{"a":"الخليج","b":"جزء يمتدّ داخل اليابسة","obj":"KW-SOC-G5-LOC-01-03","from":"f4c"},{"a":"الأرض","b":"الكوكب الوحيد فيه حياة","obj":"KW-SOC-G5-LOC-01-01","from":"f1"},{"a":"الهادي","b":"أكبر المحيطات","obj":"KW-SOC-G5-LOC-01-02","from":"f5b"}],"questions":[{"q":"كم نسبة المسطحات المائية من سطح الأرض؟","options":["71%","61%","79%"],"answer":0,"obj":"KW-SOC-G5-LOC-01-01","from":"f2"},{"q":"ما المسطحات المائية؟","options":["أشكال المياه على سطح الأرض","أشكال اليابسة على سطح الأرض","أشكال المياه داخل القارات فقط"],"answer":0,"obj":"KW-SOC-G5-LOC-01-02","from":"f3"},{"q":"ما المسطح المائي الكبير جداً؟","options":["المحيط","البحر","الخليج"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4a"},{"q":"أيّ المسطحات أصغر من المحيط؟","options":["البحر","القارة","اليابسة"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4b"},{"q":"ما المسطح المائي الذي يمتدّ داخل اليابسة؟","options":["الخليج","المحيط","البحر"],"answer":0,"obj":"KW-SOC-G5-LOC-01-03","from":"f4c"},{"q":"ما أكبر المحيطات؟","options":["الهادي","الأطلسي","الهندي"],"answer":0,"obj":"KW-SOC-G5-LOC-01-02","from":"f5b"}],"sequences":[{"label":"رتّب من الأكبر إلى الأصغر","order":["المحيط","البحر","الخليج"],"obj":"KW-SOC-G5-LOC-01-03","from":"f4a"}],"categories":[{"label":"امسك المحيطات وحدها","items":[{"t":"المحيط الهادي","in":true,"why":"أحد المحيطات الخمسة، وأكبرها مساحةً"},{"t":"المحيط الأطلسي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط الهندي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط المتجمد الشمالي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"المحيط المتجمد الجنوبي","in":true,"why":"أحد المحيطات الخمسة"},{"t":"البحر المتوسط","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"},{"t":"بحر العرب","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"},{"t":"البحر الأحمر","in":false,"why":"بحر لا محيط — والبحر مسطح مائي أصغر من المحيط"}],"obj":"KW-SOC-G5-LOC-01-02","from":"f5a","source":"موثّق · ص ٢٠"}],"places":[],"note_questions":"سؤال واحد لكل حقيقة · ولا سؤال يُجاب بمعرفة عامة بلا هذا الدرس (كان «ما الكوكب الوحيد الذي توجد عليه الحياة؟» ومشتّتاته من خارج الدرس) · والمشتّت قريب من الصحيح ومن مفردات الدرس (كان 50% و90% مقابل 71% — قسمةَ منتصف ومبالغةً، فصارا 61% و79%). الثلاثة تُفحص آلياً في `questionIssues`.","note_facts":"الحقائق المركّبة فُصلت (‏f4 → f4a/b/c و f5 → f5a/b) — نقلٌ أمين: الكتاب يذكرها صراحةً في سطر واحد. والفصل يفتح ستّ حقائق قابلة للسؤال فتكتمل دورتان لثلاثة فِرَق.","note_pairs":"نصوص البطاقات مختصرة اختصاراً أميناً من الحقيقة نفسها — بطاقة المطابقة أضيق من سطر الخيار، والحدّ مقيس في `PAIR_MAX`.","note_objectives":"لكل هدف **صيغة قصيرة** تُعرض على شاشة النتيجة — النصّ المنهجي الكامل لا يُقرأ في عشر ثوانٍ من آخر الصفّ (قيس 15 سبتمبر: 53 محرفاً تفيض عن الشاشة).","note_sequences":"تسلسل واحد لا غير: «المحيط ← البحر ← الخليج» من تعريفات ص ٢٠ (‏f4a–f4c). والصفحات ١٨–٢١ **لا تحمل ترتيباً زمنياً ولا مرحلياً آخر**: الكتاب يذكر أنّ أكبر المحيطات هو الهادي ولا يرتّب الخمسة، فترتيبها بالمساحة تأليفٌ لا نقل. ولأن `timeline` يشترط أربعة عناصر فأكثر، يبقى هذا التسلسل الثلاثي دون حدّ المحرّك — نقصٌ في الكتاب لا في العقد.","note_categories":"تصنيف واحد من ص ٢٠: المحيطات الخمسة كما عدّها الكتاب نصّاً، ومقابلها البحار الثلاثة المكتوبة بأسمائها على خريطة العالم شكل (٣) — لا اسم من خارج الصفحتين. **صيغة النداء من عندنا** («امسك المحيطات وحدها») لأن الكتاب يكتب المهمّة بصيغة «حدّد نوع المسطح المائي»، أمّا كل عنصر وسببه فمن الكتاب. و**الخلجان بلا أعضاء**: الصفحات ١٨–٢١ تعرّف الخليج ولا تسمّي خليجاً واحداً، فلا يصحّ تصنيف ثالث. والنشاط الأول ص ٢١ تصنيفٌ بالصور لا بالأسماء، وأجوبته غير مطبوعة، فلم يُنقل منه شيء."},"KW-SOC-G5-LOC-02":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-02","unit_id":"KW-SOC-G5-LOC","title":"قارات الكرة الأرضية","grade":5,"subject":"SOC","pages":[22,23],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول حرفياً من الحقائق المستخرجة في صفحة المراجعة — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-02-01","text":"تعريف القارة","short":"تعريف القارة"},{"code":"KW-SOC-G5-LOC-02-02","text":"أسماء قارات العالم","short":"أسماء قارات العالم"},{"code":"KW-SOC-G5-LOC-02-03","text":"أكبر القارات وأصغرها مساحةً","short":"أكبر القارات وأصغرها"},{"code":"KW-SOC-G5-LOC-02-04","text":"القارة غير المأهولة بالسكان","short":"القارة غير المأهولة"},{"code":"KW-SOC-G5-LOC-02-05","text":"موقع وطني الكويت","short":"موقع وطني الكويت"}],"facts":[{"id":"f1","tag":"مفهوم","text":"القارة: مساحة كبيرة من اليابسة يحيط بها الماء","obj":"KW-SOC-G5-LOC-02-01","source":"موثّق · ص ٢٢ و٢٣"},{"id":"f2","tag":"رقم","text":"قارات العالم سبع قارات","obj":"KW-SOC-G5-LOC-02-02","source":"موثّق · ص ٢٢"},{"id":"f3","tag":"اسم","text":"قارات العالم هي: آسيا، أفريقيا، أوروبا، أمريكا الشمالية، أمريكا الجنوبية، أستراليا، القطبية الجنوبية","obj":"KW-SOC-G5-LOC-02-02","source":"موثّق · ص ٢٢"},{"id":"f4","tag":"اسم","text":"آسيا أكبر قارات العالم مساحةً وأكثرها في عدد السكان","obj":"KW-SOC-G5-LOC-02-03","source":"موثّق · ص ٢٢"},{"id":"f5","tag":"اسم","text":"أستراليا أصغر القارات من حيث المساحة","obj":"KW-SOC-G5-LOC-02-03","source":"موثّق · ص ٢٢"},{"id":"f6","tag":"اسم","text":"القارة القطبية الجنوبية قارة غير مأهولة بالسكان","obj":"KW-SOC-G5-LOC-02-04","source":"موثّق · ص ٢٢"},{"id":"f7","tag":"اسم","text":"يقع وطني الكويت في قارة آسيا","obj":"KW-SOC-G5-LOC-02-05","source":"موثّق · ص ٢٢ و٢٣"}],"pairs":[{"a":"القارة","b":"مساحة كبيرة من اليابسة","obj":"KW-SOC-G5-LOC-02-01","from":"f1"},{"a":"آسيا","b":"أكبر القارات مساحةً وسكاناً","obj":"KW-SOC-G5-LOC-02-03","from":"f4"},{"a":"أستراليا","b":"أصغر القارات مساحةً","obj":"KW-SOC-G5-LOC-02-03","from":"f5"},{"a":"القطبية الجنوبية","b":"قارة غير مأهولة بالسكان","obj":"KW-SOC-G5-LOC-02-04","from":"f6"},{"a":"الكويت","b":"تقع في قارة آسيا","obj":"KW-SOC-G5-LOC-02-05","from":"f7"}],"questions":[{"q":"ما القارة؟","options":["مساحة كبيرة من الماء","مساحة كبيرة من اليابسة","دولة كبيرة من اليابسة"],"answer":1,"obj":"KW-SOC-G5-LOC-02-01","from":"f1"},{"q":"كم عدد قارات العالم؟","options":["خمس قارات","ست قارات","سبع قارات"],"answer":2,"obj":"KW-SOC-G5-LOC-02-02","from":"f2"},{"q":"آسيا وأفريقيا وأوروبا ثلاث من قارات العالم، والرابعة منها:","options":["أمريكا الشمالية","أمريكا الشرقية","أمريكا الغربية"],"answer":0,"obj":"KW-SOC-G5-LOC-02-02","from":"f3"},{"q":"آسيا أكبر قارات العالم مساحةً، وهي أيضاً:","options":["أصغرها في عدد السكان","الثانية في عدد السكان","أكثرها في عدد السكان"],"answer":2,"obj":"KW-SOC-G5-LOC-02-03","from":"f4"},{"q":"أستراليا في قارات العالم هي:","options":["ثاني أصغر القارات بعد أوروبا","أصغر القارات","دولة لا قارة"],"answer":1,"obj":"KW-SOC-G5-LOC-02-03","from":"f5"},{"q":"أيّ القارات غير مأهولة بالسكان؟","options":["القطبية الجنوبية","أستراليا","أمريكا الجنوبية"],"answer":0,"obj":"KW-SOC-G5-LOC-02-04","from":"f6"},{"q":"في أيّ قارة يقع وطني الكويت؟","options":["أفريقيا","آسيا","أوروبا"],"answer":1,"obj":"KW-SOC-G5-LOC-02-05","from":"f7"}],"sequences":[],"categories":[{"label":"امسك القارات وحدها","items":[{"t":"آسيا","in":true,"why":"إحدى القارات السبع، وأكبرها مساحةً وأكثرها سكاناً"},{"t":"أفريقيا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أوروبا","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الشمالية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أمريكا الجنوبية","in":true,"why":"إحدى قارات العالم السبع"},{"t":"أستراليا","in":true,"why":"إحدى القارات السبع، وأصغرها مساحةً"},{"t":"القطبية الجنوبية","in":true,"why":"إحدى القارات السبع، وهي غير مأهولة بالسكان"},{"t":"المحيط الهادي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة، والقارة مساحة كبيرة من اليابسة"},{"t":"المحيط الأطلسي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط الهندي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الشمالي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"},{"t":"المحيط المتجمد الجنوبي","in":false,"why":"محيط على الخريطة نفسها — ماء لا يابسة"}],"obj":"KW-SOC-G5-LOC-02-02","from":"f3","source":"موثّق · ص ٢٢ و٢٣"}],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الدرس — لا اسم قارة خارج `f3`، **ولا مشتّت صحيح خارج الدرس ولا مناقض لنصّ سؤاله**. وسبب كل مشتّت:\n• «مساحة كبيرة من الماء» (f1): يقلب التعريف — الماء يحيط باليابسة لا العكس، وهو خلط القارة بالمحيط.\n• «دولة كبيرة من اليابسة» (f1): الخلط بين القارة والدولة — طفلة تعرف «الكويت» دولةً وتقيس عليها.\n• «خمس قارات» و«ست قارات» (f2): العدد الأقرب للصحيح لا رقم بعيد، فلا يُستبعد بالشكل.\n• «أمريكا الشرقية» و«أمريكا الغربية» (f3): **اسمان مركّبان لا وجود لهما** — القائمة تعرف الشمالية والجنوبية وحدهما. والسؤال يقيس معرفة القائمة لا حفظ ترتيبها: الخيارات الثلاثة «أمريكا + جهة»، فالتمييز بمعرفة أيّ جهة قارةٌ فعلاً.\n  (وهذا استثناء مُقرَّر من قاعدة «لا اسم قارة خارج f3»: المحظور اسمُ قارة **حقيقية** غائبة عن القائمة — نفيُها يعلّم خطأ؛ أمّا الاسم المركّب الذي لا وجود له فنفيُه تصحيح.)\n• «أصغرها في عدد السكان» (f4): **أخصب خطأ في الصفحة** — الكتاب يجمع الأكبر مساحةً والأكثر سكاناً في جملة واحدة، فقلب أحد الطرفين مغرٍ.\n• «الثانية في عدد السكان» (f4): من طرف السكان نفسه لا من حقيقة أخرى — خطأ ترتيب لا خطأ محور، فلا يكشف نفسه بسؤال آخر.\n• «ثاني أصغر القارات بعد أوروبا» (f5): ينسب «الأصغر» إلى أوروبا — وهي صغيرة فعلاً في ذهن الطفلة، والخطأ في الترتيب لا في الجنس.\n• «دولة لا قارة» (f5): عدّها دولة — اسمها اسم دولة أيضاً.\n• «أستراليا» (f6): نسبة «غير مأهولة» إليها بدل القطبية الجنوبية — قِلّة سكانها تُلبِس.\n• «أمريكا الجنوبية» (f6): تشترك مع الصحيح في كلمة «الجنوبية» وحدها.\n• «أفريقيا» و«أوروبا» (f7): أقرب قارتين إلى الكويت في ذهن الطفلة.","note_facts":"منقول من صفحتَي ٢٢–٢٣ (صفحتا الملف ٢٣–٢٤). **تحويلان مُقرَّان من المؤسّس:** (١) الكتاب يسرد المعلومة حواراً على لسان أمين المكتبة، ونُقلت جملاً خبرية لأن سطر الخيار لا يسع حواراً — المعنى كما هو والصياغة تغيّرت. (٢) نصّ الـPDF يخرج مشوّه الإملاء («األرضية» و«أسرتاليا» و«اوروبا» و«أوربا» في الصفحة نفسها)، فأُعيدت الحروف إلى صورتها الصحيحة. وسبع حقائق لا ستّ: الصفحتان تحملان سبعاً موثّقة، ولكل هدف من الخمسة حقيقة — و`f7` وحدها تخدم «موقع وطني الكويت».","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (٤–١٦ محرفاً) لأن بطاقة المطابقة أضيق من سطر الخيار.","note_objectives":"الأهداف الخمسة من «ماذا سنتعلم» ص ٢٢، وصيغها المختصرة ١٢–٢٧ محرفاً (الحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان ٢٢–٢٣ تذكران أكبر القارات (آسيا) وأصغرها (أستراليا) ولا ترتّبان السبع بينهما، ولا يرد في الدرس تاريخ ولا مراحل. فترتيب القارات بالمساحة أو بالسكان تأليفٌ من خارج الكتاب — تُرك فارغاً عمداً.","note_categories":"تصنيف واحد: القارات السبع كما عدّها الحوار ص ٢٢ ومفتاح الخريطة ص ٢٣، ومقابلها المحيطات الخمسة المكتوبة بأسمائها على شكل (٤) في الصفحة نفسها — الفرق بينهما هو التعريف المقرّر: القارة يابسة يحيط بها الماء. **صيغة النداء من عندنا** وكل عنصر وسببه من الكتاب. ولم يُكتب تصنيف «مأهولة / غير مأهولة» لأن الكتاب ينصّ على أن القطبية الجنوبية غير مأهولة ولا ينصّ على سكّان القارات الستّ الأخرى — فنسبته إليها استنتاج لا نقل."},"KW-SOC-G5-LOC-03":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-03","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الخليج العربية","grade":5,"subject":"SOC","pages":[24,25],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٤–٢٥ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-03-01","text":"موقع دول الخليج العربية بالنسبة للخليج العربي","short":"موقع دول الخليج العربية"},{"code":"KW-SOC-G5-LOC-03-02","text":"موقع وطني الكويت بالنسبة لشبه الجزيرة العربية","short":"موقع الكويت من شبه الجزيرة"},{"code":"KW-SOC-G5-LOC-03-03","text":"سبب تسمية دول الخليج العربية بهذا الاسم","short":"سبب تسمية دول الخليج"}],"facts":[{"id":"f1","tag":"مفهوم","text":"يقع وطني الكويت ودول الخليج العربية على مسطح مائي اسمه الخليج العربي","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤"},{"id":"f2","tag":"مفهوم","text":"سُمّيت دول الخليج العربية بهذا الاسم لأنها تقع على الخليج العربي","obj":"KW-SOC-G5-LOC-03-03","source":"موثّق · ص ٢٤"},{"id":"f3","tag":"اسم","text":"يقع وطني الكويت في جهة الشمال الغربي بالنسبة للخليج العربي","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤"},{"id":"f4","tag":"اسم","text":"يقع وطني الكويت في جهة الشمال الشرقي بالنسبة لشبه الجزيرة العربية","obj":"KW-SOC-G5-LOC-03-02","source":"موثّق · ص ٢٤"},{"id":"f5","tag":"اسم","text":"دول الخليج العربية على الخريطة: دولة الكويت والمملكة العربية السعودية ومملكة البحرين ودولة قطر ودولة الإمارات وسلطنة عُمان","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤ و٢٥ — شكل (٦) وخريطة النشاط الأول"},{"id":"f6","tag":"اسم","text":"تحمل خريطة دول الخليج العربية مسطحين مائيين: الخليج العربي وخليج عُمان","obj":"KW-SOC-G5-LOC-03-01","source":"موثّق · ص ٢٤ — شكل (٦)"}],"pairs":[{"a":"الخليج العربي","b":"المسطح الذي تقع عليه دول الخليج","obj":"KW-SOC-G5-LOC-03-01","from":"f1"},{"a":"وطني الكويت","b":"شمال غربي الخليج العربي","obj":"KW-SOC-G5-LOC-03-01","from":"f3"},{"a":"شبه الجزيرة","b":"الكويت في شمالها الشرقي","obj":"KW-SOC-G5-LOC-03-02","from":"f4"},{"a":"سلطنة عُمان","b":"إحدى دول الخليج العربية","obj":"KW-SOC-G5-LOC-03-01","from":"f5"},{"a":"خليج عُمان","b":"مسطح مائي على خريطة الدرس","obj":"KW-SOC-G5-LOC-03-01","from":"f6"}],"questions":[{"q":"على أي مسطح مائي تقع دول الخليج العربية؟","options":["الخليج العربي","خليج عُمان","الخليج الشمالي"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f1"},{"q":"في أي جهة يقع وطني الكويت بالنسبة للخليج العربي؟","options":["الجنوب الغربي","الشمال الغربي","الجنوب الشرقي"],"answer":1,"obj":"KW-SOC-G5-LOC-03-01","from":"f3"},{"q":"أين يقع وطني الكويت بالنسبة لشبه الجزيرة؟","options":["الجنوب الشرقي","الجنوب الغربي","الشمال الشرقي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-02","from":"f4"},{"q":"أيّ هذه من دول الخليج العربية؟","options":["سلطنة عُمان","خليج عُمان","شبه الجزيرة العربية"],"answer":0,"obj":"KW-SOC-G5-LOC-03-01","from":"f5"},{"q":"لماذا سُمّيت دول الخليج العربية بهذا الاسم؟","options":["لأنها تقع على خليج عُمان","لأنها تقع في شبه الجزيرة","لأنها تقع على الخليج العربي"],"answer":2,"obj":"KW-SOC-G5-LOC-03-03","from":"f2"}],"sequences":[],"categories":[],"places":[],"note_questions":"سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «خليج عُمان» (f1): المسطح الآخر المكتوب على الخريطة نفسها — أقرب خطأ ممكن.\n• «الخليج الشمالي» (f1): **اسم مركّب لا وجود له** — الطفلة تعرف «الخليج» و«الشمال» من الدرس فتركّبهما؛ نفيُه تصحيح لا تعليمُ خطأ.\n• «الجنوب الغربي» و«الجنوب الشرقي» (f3 وf4): قلبُ طرف واحد من الجهة المركّبة — أخصب خطأ في الصفحة لأن الدرس يجمع جهتين مركّبتين متشابهتين في سطرين متتاليين.\n• «خليج عُمان» (f5): الخلط بين المسطح والدولة — الاسم نفسه يتكرّر في «سلطنة عُمان».\n• «شبه الجزيرة العربية» (f5): الخلط بين الإقليم والدولة.\n• «لأنها تقع على خليج عُمان» و«لأنها تقع في شبه الجزيرة» (f2): سببان من مفردات الدرس نفسه، وكلاهما يصف موقعاً حقيقياً لكنه ليس سبب التسمية.","note_facts":"ستّ حقائق من صفحتَي الدرس: أربع من نصّ «الموضوع» ص ٢٤، وواحدة من أسماء الدول على شكل (٦) وخريطة النشاط الأول ص ٢٥، وواحدة من اسمَي المسطحين على شكل (٦). **والاسم كما كُتب في الكتاب**: «مملكة البحرين» على شكل (٦) و«البحرين» على خريطة ص ٢٥ — أُخذت الصيغة الأولى.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير لأن بطاقة المطابقة أضيق من سطر الخيار.","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٤ بصيغها المختصرة (٢٠–٢٦ محرفاً، والحدّ ٣٤).","note_sequences":"**وجدتُ تسلسلاً واحداً ولم أكتبه:** النشاط الأول ص ٢٥ يرقّم خطّ سير العربة من الكويت (١ الكويت ← ٢ السعودية ← ٣ البحرين ← ٤ قطر ← ٥ الإمارات ← ٦ عُمان). تسلسلٌ واحد يعطي المحرّك جولةً واحدة، وجولةٌ واحدة تُجلس فريقين متفرّجين (القرار ٣٣)، فتُرك الحقل فارغاً حتى يأتي في الوحدة ما يكمل ثلاثة. ولا ترتيب زمنيّ في الدرس أصلاً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «دول الخليج العربية الست مقابل المسطحين المائيين على الخريطة» — ستة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، والصفحتان لا تحملان غيره: شكل (٥) صندوقٌ بثمانية أسهم بلا أسماء جهات مكتوبة، فلا يصحّ منه تصنيف «أصلية/فرعية»."},"KW-SOC-G5-LOC-04":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-04","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول الوطن العربي","grade":5,"subject":"SOC","pages":[26,27],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٦–٢٧ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-04-01","text":"تعريف الوطن العربي","short":"تعريف الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-02","text":"مفهوم المضيق","short":"مفهوم المضيق"},{"code":"KW-SOC-G5-LOC-04-03","text":"موقع وطني الكويت بالنسبة للوطن العربي","short":"موقع الكويت من الوطن العربي"},{"code":"KW-SOC-G5-LOC-04-04","text":"السمات المشتركة بين دول الوطن العربي","short":"السمات المشتركة بين دوله"}],"facts":[{"id":"f1","tag":"مفهوم","text":"الوطن العربي: مجموعة من الدول تجمعها سمات مشتركة مثل الدين الإسلامي واللغة العربية والتراث والتاريخ","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f2","tag":"مفهوم","text":"المضيق: ممر مائي ضيق من الماء يفصل بين مسطحين مائيين","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f3","tag":"اسم","text":"الوطن العربي يقع في وسط العالم ويمتد بين قارتي آسيا وأفريقيا","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f4","tag":"اسم","text":"يفصل بين دول القارتين مسطح مائي هو البحر الأحمر","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f5","tag":"رقم","text":"عدد دول الوطن العربي ٢٢ دولة","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f6","tag":"اسم","text":"يقع وطني الكويت في الجهة الشرقية من الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","source":"موثّق · ص ٢٦"},{"id":"f7","tag":"مفهوم","text":"يطل الوطن العربي على العديد من المسطحات المائية","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦"},{"id":"f8","tag":"مفهوم","text":"الوطن العربي يشرف على العديد من المضائق المائية جعلت له أهمية كبيرة في الملاحة والتجارة العالمية","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦"},{"id":"f9","tag":"اسم","text":"تحمل خريطة الوطن العربي ثلاثة مضائق مائية هي مضيق جبل طارق ومضيق هرمز ومضيق باب المندب، وقناة مائية هي قناة السويس","obj":"KW-SOC-G5-LOC-04-02","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"id":"f10","tag":"اسم","text":"مسطحات مكتوبة على خريطة الوطن العربي: البحر المتوسط والبحر الأحمر والمحيط الأطلسي والمحيط الهندي وبحر العرب وخليج عدن","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f11","tag":"اسم","text":"دول مكتوبة على خريطة الوطن العربي: المغرب والجزائر وتونس وليبيا ومصر والسودان وموريتانيا والصومال والسعودية واليمن وعمان والعراق وسوريا، ومعها خارج لون الوطن العربي أسبانيا وإيران","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٦ — شكل (٧)"},{"id":"f12","tag":"مفهوم","text":"نشاط ص ٢٧: البحر الذي يفصل بين الجناح الأفريقي والجناح الآسيوي من الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","source":"موثّق · ص ٢٧ — النشاط الثالث"}],"pairs":[{"a":"المضيق","b":"ممر مائي ضيق بين مسطحين","obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"a":"البحر الأحمر","b":"يفصل بين دول القارتين","obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"a":"وطني الكويت","b":"شرق الوطن العربي","obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"a":"٢٢ دولة","b":"عدد دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"a":"قناة السويس","b":"قناة مائية على الخريطة","obj":"KW-SOC-G5-LOC-04-02","from":"f9"},{"a":"اللغة العربية","b":"سمة تجمع دول الوطن العربي","obj":"KW-SOC-G5-LOC-04-04","from":"f1"}],"questions":[{"q":"ما الوطن العربي؟","options":["مجموعة من الدول تجمعها سمات","مجموعة من القارات المتصلة","دولة واحدة كبيرة المساحة"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f1"},{"q":"ما المضيق؟","options":["ممر بري ضيق بين دولتين","ممر مائي ضيق من الماء","مسطح مائي واسع بين قارتين"],"answer":1,"obj":"KW-SOC-G5-LOC-04-02","from":"f2"},{"q":"بين أي قارتين يمتد الوطن العربي؟","options":["آسيا وأوروبا","أفريقيا وأوروبا","آسيا وأفريقيا"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f3"},{"q":"ما المسطح المائي الذي يفصل بين دول القارتين؟","options":["البحر الأحمر","البحر المتوسط","المحيط الهندي"],"answer":0,"obj":"KW-SOC-G5-LOC-04-01","from":"f4"},{"q":"كم عدد دول الوطن العربي؟","options":["١٨ دولة","٢٦ دولة","٢٢ دولة"],"answer":2,"obj":"KW-SOC-G5-LOC-04-01","from":"f5"},{"q":"في أي جهة يقع وطني الكويت من الوطن العربي؟","options":["الجهة الغربية","الجهة الشرقية","الجهة الشمالية"],"answer":1,"obj":"KW-SOC-G5-LOC-04-03","from":"f6"},{"q":"أيّ هذه قناة مائية لا مضيقاً؟","options":["مضيق هرمز","مضيق باب المندب","قناة السويس"],"answer":2,"obj":"KW-SOC-G5-LOC-04-02","from":"f9"}],"sequences":[],"categories":[{"label":"امسك المضائق والقنوات المائية وحدها","items":[{"t":"مضيق جبل طارق","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق هرمز","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"مضيق باب المندب","in":true,"why":"مضيق مائي على خريطة الدرس"},{"t":"قناة السويس","in":true,"why":"قناة مائية على خريطة الدرس"},{"t":"البحر الأحمر","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"البحر المتوسط","in":false,"why":"بحر لا ممر مائي ضيق"},{"t":"المحيط الهندي","in":false,"why":"محيط لا ممر مائي ضيق"},{"t":"بحر العرب","in":false,"why":"بحر لا ممر مائي ضيق"}],"obj":"KW-SOC-G5-LOC-04-02","from":"f9","source":"موثّق · ص ٢٦ — شكل (٧) ومفتاحه"},{"label":"امسك المسطحات المائية وحدها","items":[{"t":"البحر المتوسط","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"البحر الأحمر","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الأطلسي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"المحيط الهندي","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"بحر العرب","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"خليج عدن","in":true,"why":"مسطح مائي مكتوب على الخريطة"},{"t":"السودان","in":false,"why":"دولة لا مسطح مائي"},{"t":"أسبانيا","in":false,"why":"دولة لا مسطح مائي"},{"t":"إيران","in":false,"why":"دولة لا مسطح مائي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f10","source":"موثّق · ص ٢٦ — شكل (٧)"},{"label":"امسك دول الوطن العربي وحدها","items":[{"t":"المغرب","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الجزائر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"تونس","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"ليبيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"مصر","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السودان","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"موريتانيا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"الصومال","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"السعودية","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"اليمن","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"العراق","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"سوريا","in":true,"why":"مكتوبة داخل لون الوطن العربي"},{"t":"أسبانيا","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"},{"t":"إيران","in":false,"why":"مكتوبة على الخريطة خارج لون الوطن العربي"}],"obj":"KW-SOC-G5-LOC-04-01","from":"f11","source":"موثّق · ص ٢٦ — شكل (٧)"}],"places":[],"note_questions":"سبعة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «مجموعة من القارات المتصلة» و«دولة واحدة كبيرة المساحة» (f1): الخلط بين تجمّع دول وبين قارة أو دولة واحدة — وهو الخلط الذي يسبق مفهوم «الوطن العربي» عند الطفلة.\n• «ممر بري ضيق بين دولتين» (f2): يبدّل الماء بالبرّ ويبقي «الممر الضيق» — أقرب خطأ إلى التعريف.\n• «مسطح مائي واسع بين قارتين» (f2): يقلب الضيق سعةً، وهو وصف البحر لا المضيق.\n• «آسيا وأوروبا» و«أفريقيا وأوروبا» (f3): قارة صحيحة مع أخرى من خارج الامتداد — نصفُ الجواب صحيح فيغري.\n• «البحر المتوسط» و«المحيط الهندي» (f4): مسطحان مكتوبان على الخريطة نفسها ويلامسان الوطن العربي، لكنهما لا يفصلان بين جناحيه.\n• «١٨ دولة» و«٢٦ دولة» (f5): على بُعد ١٨٪ من الصحيح صعوداً وهبوطاً، وليسا من مضاعفات العشرة فلا يُستبعدان بالشكل.\n• «الجهة الغربية» و«الجهة الشمالية» (f6): الجهات الثلاث الأخرى من الرباعية نفسها.\n• «مضيق هرمز» و«مضيق باب المندب» (f9): مضيقان حقيقيان على الخريطة، والسؤال يسأل عن القناة — فنفيُهما تصحيحٌ لا تعليمُ خطأ.","note_facts":"اثنتا عشرة حقيقة: ثمانٍ من نصّ الدرس وفقاعاته ص ٢٦، وثلاث من أسماء شكل (٧) ومفتاحه — المضائق والقناة، والمسطحات، والدول. ونصّ الكتاب يكتب «أوربا» في درس لاحق و«أسبانيا» على هذه الخريطة، وأُبقيت الصيغتان كما طُبعتا. وحقيقةٌ من نشاط ص ٢٧ تسمّي جناحَي الوطن العربي: الأفريقي والآسيوي.","note_pairs":"ستة أزواج من ستّ حقائق، والوجه الأول اسمٌ قصير (٦–١٣ محرفاً).","note_objectives":"الأهداف الأربعة من «ماذا سنتعلم» ص ٢٦ (١٢–٢٧ محرفاً في صيغها المختصرة، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** الصفحتان لا تحملان ترتيباً زمنياً ولا مرحلياً: الخريطة تسمّي ولا ترتّب، والنشاطان تلوينٌ وتحويط. وترتيب المضائق من الغرب إلى الشرق قراءةٌ منّي للخريطة لا نصٌّ في الكتاب، فلم يُكتب.","note_categories":"ثلاثة تصنيفات، كلّها من شكل (٧) ومفتاحه في الصفحة نفسها: المضائق والقناة (٤ داخل الفئة و٤ خارجها) · المسطحات المائية (٦ و٣) · دول الوطن العربي (١٢ واثنتان خارج اللون). صيغة النداء من عندنا، وكل عنصر وسببه من الخريطة. وأسماء الدول المأخوذة هي المكتوبة بخطّ ظاهر على الخريطة؛ والأسماء الصغيرة جداً (لبنان، فلسطين، الأردن، جيبوتي، جزر القمر ودول الخليج) لم تُنقل لأن قراءتها من الصورة غير مؤكّدة."},"KW-SOC-G5-LOC-05":{"schema":"shift.lesson/1","lesson_id":"KW-SOC-G5-LOC-05","unit_id":"KW-SOC-G5-LOC","title":"وطني الكويت ودول العالم الإسلامي","grade":5,"subject":"SOC","pages":[28,29],"edition":"KW-SOC-G5-S1@2025-2026","source":"منقول من صفحتَي الدرس ٢٨–٢٩ — لا تأليف","objectives":[{"code":"KW-SOC-G5-LOC-05-01","text":"تعريف العالم الإسلامي","short":"تعريف العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-02","text":"مميزات موقع العالم الإسلامي","short":"مميزات موقع العالم الإسلامي"},{"code":"KW-SOC-G5-LOC-05-03","text":"موقع وطني الكويت بالنسبة للعالم الإسلامي","short":"موقع الكويت من العالم الإسلامي"}],"facts":[{"id":"f1","tag":"مفهوم","text":"العالم الإسلامي: مجموعة من الدول يكون فيها عدد المسلمين ٥٠٪ فأكثر من مجموع السكان","obj":"KW-SOC-G5-LOC-05-01","source":"موثّق · ص ٢٨"},{"id":"f2","tag":"مفهوم","text":"يشغل العالم الإسلامي مساحة واسعة شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f3","tag":"مفهوم","text":"يحتل العالم الإسلامي موقعاً متوسطاً بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f4","tag":"اسم","text":"يمتد العالم الإسلامي في أربع قارات هي آسيا وأفريقيا وأوربا وأمريكا الجنوبية","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨"},{"id":"f5","tag":"اسم","text":"يقع وطني الكويت في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","source":"موثّق · ص ٢٨"},{"id":"f6","tag":"اسم","text":"خريطة العالم الإسلامي شكل (٨) مكتوب عليها القارات: آسيا وأفريقيا وأستراليا وأمريكا الشمالية وأمريكا الجنوبية، والمحيطات الخمسة","obj":"KW-SOC-G5-LOC-05-02","source":"موثّق · ص ٢٨ — شكل (٨)"}],"pairs":[{"a":"العالم الإسلامي","b":"نصف السكان مسلمون فأكثر","obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"a":"أربع قارات","b":"آسيا وأفريقيا وأوربا وأمريكا","obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"a":"وطني الكويت","b":"في وسط العالم الإسلامي","obj":"KW-SOC-G5-LOC-05-03","from":"f5"},{"a":"موقع متوسط","b":"بين قارات العالم","obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"a":"مساحة واسعة","b":"شبه متصلة من اليابسة","obj":"KW-SOC-G5-LOC-05-02","from":"f2"}],"questions":[{"q":"ما نسبة المسلمين في دول العالم الإسلامي؟","options":["٤٠٪ فأكثر","٥٠٪ فأكثر","٦٥٪ فأكثر"],"answer":1,"obj":"KW-SOC-G5-LOC-05-01","from":"f1"},{"q":"ما مساحة العالم الإسلامي من اليابسة؟","options":["مساحة واسعة شبه متصلة","مساحة صغيرة متفرقة","مساحة متقطعة بين البحار"],"answer":0,"obj":"KW-SOC-G5-LOC-05-02","from":"f2"},{"q":"ما موقع العالم الإسلامي بين قارات العالم؟","options":["موقعاً طرفياً بعيداً","موقعاً في قارة واحدة","موقعاً متوسطاً"],"answer":2,"obj":"KW-SOC-G5-LOC-05-02","from":"f3"},{"q":"في كم قارة يمتد العالم الإسلامي؟","options":["ثلاث قارات","أربع قارات","خمس قارات"],"answer":1,"obj":"KW-SOC-G5-LOC-05-02","from":"f4"},{"q":"أين يقع وطني الكويت من العالم الإسلامي؟","options":["في شمال العالم الإسلامي","في غرب العالم الإسلامي","في وسط العالم الإسلامي"],"answer":2,"obj":"KW-SOC-G5-LOC-05-03","from":"f5"}],"sequences":[],"categories":[],"places":[],"note_questions":"خمسة أسئلة، سؤال لكل حقيقة، وكل خيار من مفردات الصفحتين.\n• «٤٠٪ فأكثر» و«٦٥٪ فأكثر» (f1): على بُعد ٢٠٪ و٣٠٪ من الصحيح — قريبان فلا يُستبعدان بالشكل، والنسبة هي بيت القصيد في التعريف.\n• «مساحة صغيرة متفرقة» و«مساحة متقطعة بين البحار» (f2): يقلبان «الواسعة شبه المتصلة» إلى ضدّها — وهو تصوّر شائع عند طفلة ترى الدول مبعثرة على الخريطة.\n• «موقعاً طرفياً بعيداً» و«موقعاً في قارة واحدة» (f3): الأول يقلب «المتوسط»، والثاني يخلط الموقع المتوسط بالانحصار في قارة — وهو الخطأ الذي يسبق الفكرة.\n• «ثلاث قارات» و«خمس قارات» (f4): العددان المجاوران للصحيح صعوداً وهبوطاً (٢٥٪ لكلٍّ).\n• «في شمال العالم الإسلامي» و«في غرب العالم الإسلامي» (f5): جهتان بدل «الوسط» — والكويت تقع شمال الخليج في الدرس الثالث، فالخلط بين الموقعين وارد.","note_facts":"ستّ حقائق: خمس من نصّ الدرس ص ٢٨، وواحدة من أسماء شكل (٨). ونصّ الكتاب يكتب «أوربا» في هذا الدرس و«أوروبا» في غيره — نُقلت كما طُبعت هنا.","note_pairs":"خمسة أزواج من خمس حقائق، والوجه الأول اسمٌ قصير (١٠–١٥ محرفاً).","note_objectives":"الأهداف الثلاثة من «ماذا سنتعلم» ص ٢٨ (٢١–٣٠ محرفاً، والحدّ ٣٤).","note_sequences":"**لا تسلسل في هذا الدرس.** لا تاريخ ولا مراحل ولا ترتيب في الصفحتين؛ القارات الأربع تُذكر عدّاً لا ترتيباً.","note_categories":"**وجدتُ تصنيفاً واحداً ولم أكتبه:** «القارات التي يمتد فيها العالم الإسلامي (آسيا · أفريقيا · أوربا · أمريكا الجنوبية) مقابل ما لم يُذكر منها على الخريطة (أستراليا · أمريكا الشمالية)» — أربعة أعضاء داخل الفئة واثنان خارجها. والحدّ ثلاثة تصنيفات لكل درس (القرار ٣٣)، ولا يحمل الدرس غيره: نشاط ص ٢٩ ثلاثة فراغات بلا أجوبة مطبوعة، وأشكال القارات فيه صُوَرٌ صمّاء بلا أسماء."}}};

SHIFT.go = function(screen){ teardown(); S.screen = screen; render(); };

  return `<p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}`;
}

function nowMs(){ return Number.isFinite(SHIFT.nowOverride) ? SHIFT.nowOverride : Date.now(); }
function todayIdx(){ const d = new Date(nowMs()).getDay(); return d >= 0 && d <= 4 ? d : 0; }    
function launch(cls, lessonId, gameId){
  S.cls = cls; S.lesson = SHIFT._l.find(l => l.id === lessonId) || { id: lessonId, title: lessonTitle(lessonId), unit: '', objectives: [], games: [] };
   
  registerTeacherGames();
   
  const tg = tgOf(gameId); S.gameAlias = null;
  if(tg && tg.kind === 'copy'){ S.gameAlias = tg.id; gameId = tg.source_game_id; }
  if(gameId){ S.gameKey = gameId; S.screen = 'setup'; } else S.screen = 'lesson';
  render();
}

function teacherGames(){ return SHIFT.local.pref('teacher_games') || []; }
function tgOf(id){ return id ? teacherGames().find(g => g.id === id) || null : null; }
 
function registerTeacherGames(){ teacherGames().forEach(g => {
  if(g.content) SHIFT.content(g.id, g.content);
  if(g.kind !== 'copy' && g.engine_id && SHIFT._e[g.engine_id] && !SHIFT._e[g.id]) SHIFT._e[g.id] = SHIFT._e[g.engine_id];
}); }
 
function gameInfo(id){
  const tg = tgOf(id);
  if(tg){
    const src = tg.kind === 'copy' ? gameInfo(tg.source_game_id) : null;
    return { id: tg.id, kind: tg.kind || 'bank', title: tg.title || (src && src.title) || tg.id, engine_id: tg.engine_id || 'quiz',
      engine_name: src ? src.engine_name : 'سباق المعرفة', lesson_id: tg.lesson_id, approval_state: tg.approval_state || 'unreviewed',
      motion: src ? src.motion : false, mins: src ? src.mins : 3, class_id: tg.class_id || null, school_year: tg.school_year || null,
      source_game_id: tg.source_game_id || null, remix_intent: tg.remix_intent || [], content: tg.content || (src && src.content) || null };
  }
  const g = (SHIFT.data.games || {})[id]; if(!g) return null;
  const E = (SHIFT.data.engines || {})[g.engine_id] || {};
  return { id, kind: 'shift', title: (SHIFT._c[id] || {}).title || E.name || id, engine_id: g.engine_id, engine_name: E.name || g.engine_id,
    lesson_id: g.lesson_id, approval_state: g.approval_state, motion: !!E.motion, mins: (SHIFT._e[id] || {}).mins || 3, content: SHIFT._c[id] || null };
}
async function saveTeacherGames(list, okNote){
  const ok = await SHIFT.local.pref('teacher_games', list);
  if(!ok) toast('لم تُحفظ على هذا الجهاز — تعمل الآن فقط.', 'warn'); else if(okNote) toast(okNote);
  return ok;
}
 
function wireCopyRemix(m){
  m.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { S.copy = { gameId: b.dataset.copy, classId: b.dataset.cls || (S.cls && S.cls.id) || null }; S.screen = 'copy'; render(); });
  m.querySelectorAll('[data-remix]').forEach(b => b.onclick = () => openRemix(b.dataset.remix, b.dataset.cls || (S.cls && S.cls.id) || null));
}
function openRemix(gameId, classId){
  const info = gameInfo(gameId); if(!info) return;
  const text = TEACH.toPasteText(info.content, info.engine_id);
  S.bank = { mode: 'remix', source: gameId, classId, text, title: 'نسخة معدّلة — ' + info.title, intent: [] };
  S.lib = S.lib || { grade: 4, unit: null, lesson: null }; S.lib.lesson = info.lesson_id || S.lib.lesson;
  S.screen = 'bank'; render();
}

  wireCopyRemix(m);

SHIFT.saveSession = function(){
  const E = SHIFT._e[S.gameKey] || {};
  const sess = { id: TEACH.newId('S'), class_id: S.cls ? S.cls.id : null, lesson_id: S.lesson ? S.lesson.id : null, game_id: S.gameAlias || S.gameKey, engine_id: E.id || S.gameKey,
    mode: S.mode, started_at: new Date(S.startedAt || Date.now()).toISOString(), ended_at: new Date().toISOString(), trust_level: 'offline',
    teams: S.teams.map(t => ({ name: t.name, score: t.score, right: t.right, wrong: t.wrong })), attempts: S.log.slice() };
  SHIFT.local.put('sessions', sess).then(ok => { if(!ok) toast('لم يُحفظ التقرير على هذا الجهاز — صدّر دليل التقييم الآن.', 'warn'); });
  return sess;
};
function sessList(){ return SHIFT.local.all('sessions').sort((a, b) => (b.started_at || '').localeCompare(a.started_at || '')); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('ar-KW-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); }    
function gameTitle(id){ const i = gameInfo(id); return i ? i.title : ((SHIFT._c[id] || {}).title || (SHIFT._e[id] || {}).name || id); }

function reportHTML(sess, opts = {}){
  const sm = TEACH.sessionSummary(sess); const cls = sess.class_id ? SHIFT.local.get('classes', sess.class_id) : null;
   
  const best = sm.teams.length ? Math.max.apply(null, sm.teams.map(x => x.score || 0)) : 0;
  const tops = sm.teams.filter(t => (t.score || 0) === best);
   
  const verdict = best <= 0 ? 'انتهت الحصة — لم تُسجَّل نقاط'
    : tops.length === 1 ? 'فاز ' + tops[0].name
    : (tops.length === sm.teams.length && sm.teams.length > 1) ? 'تعادل الجميع'
    : 'تعادل: ' + tops.map(t => t.name).join(' و');
  return `<div class="rep">
      <h3>نتائج الفرق</h3>
      <p class="verdict">${esc(verdict)}</p>
      ${(() => {  
        return sm.teams.map((t, i) => `<div class="rowbar"><span class="lab" style="color:${COLORS[i % 4]}">${best > 0 && t.score === best ? '🏆 ' : ''}${esc(t.name)}</span>
        <span class="track"><i class="fill" style="width:${best ? Math.round(t.score / best * 100) : 0}%;background:${COLORS[i % 4]}"></i></span><span class="val">${t.score}</span></div>`).join(''); })()}
      <h3>الإتقان حسب هدف التعلّم</h3>
      ${sm.byObj.length ? sm.byObj.map(o => `<div class="rowbar"><span class="lab">${esc(o.o)}</span><span class="track"><i class="fill${o.pct < 60 ? ' low' : ''}" style="width:${o.pct}%"></i></span><span class="val">${o.pct}%</span></div>`).join('') : '<p class="sub">لم تُسجَّل محاولات في هذه الجلسة.</p>'}
      ${sm.weakest && sm.weakest.pct < 100 ? `<div class="insight"><p><b>ما يحتاج مراجعة:</b> «${esc(sm.weakest.o)}» — ${sm.weakest.pct}% من المحاولات صحيحة (${sm.weakest.t} محاولات). راجعه في بداية الحصة القادمة.</p></div>` : (sm.total ? '<div class="insight"><p><b>ممتاز:</b> كل الأهداف أُتقنت في هذه الجلسة.</p></div>' : '')}
      ${sm.total ? `<h3 class="sub-sep">تفصيل المحاولات (<span class="part">${sm.right} من ${sm.total}</span><span class="sep">·</span><span class="part">${sm.pct}%</span><span class="sep">·</span><span class="part">من أول محاولة ${sm.firstTry.right} من ${sm.firstTry.total}</span>)</h3>
      <div class="qlist">${(sess.attempts || []).map((x, i, arr) => { const first = arr.findIndex(y => y.q === x.q) === i;
        return `<div class="qrow"><span class="st ${x.right ? 'y' : 'n'}">${x.right ? '✓' : '✕'}</span><span>${esc(x.q || '')}<br><span style="color:var(--muted);font-size:13px">${x.right ? 'صحيح' : 'الصحيح: ' + esc(x.correct || '—')} — ${esc(x.team)}${first ? ' · أول محاولة' : ''}</span></span></div>`; }).join('')}</div>` : ''}
      ${opts.evidence ? `<div class="sig"><span>توقيع المعلم: ______________</span><span>التاريخ: ${esc(fmtDate(sess.started_at))}</span><span>${esc(cls ? cls.name : '')}</span></div>` : ''}
    </div>`;
}

    const text = evText(), title = 'دليل تقييم تحصيلي — ' + lessonTitle(sess.lesson_id);

      catch(e){ if(e && e.name === 'AbortError') return; } }
    try{ await navigator.clipboard.writeText(text); evNote('المشاركة غير متاحة هنا — نُسخ النصّ، الصقه في أي تطبيق.'); }
    catch(e){ evNote('المشاركة والنسخ غير متاحين — صوّر الشاشة، الدليل كامل تحتها.', true); }
  };

    catch(e){ evNote('تعذّر النسخ — صوّر الشاشة، الدليل كامل تحتها.', true); }
  };
  $('#doPrint').onclick = () => { window.print(); };
  $('#backRep').onclick = () => { S.screen = 'report'; render(); };
});

SHIFT.engine('catch', {
  name:'امسك الصحيح', mins:4,
  mount(root, ctx){
     
    const fromContract = id => {
      const L = (SHIFT.data && SHIFT.data.contracts || {})[id];
      if (!L || !(L.categories || []).length) return null;
      const short = {}; (L.objectives || []).forEach(o => { short[o.code] = o.short || o.text || ''; });
      const rounds = (L.categories || []).map(c => {
        const inn = (c.items || []).filter(x => x.in), out = (c.items || []).filter(x => !x.in);
        return { rule: c.label || '', obj: short[c.obj] || c.obj || '',
          hint: 'داخل الفئة ' + inn.length + '، وما عداها ليس منها',
          recap: (c.label || '') + ' — ' + inn.map(x => x.t).join('، ') + '.',
          yes: inn.map(x => [x.t, x.why || '']), no: out.map(x => [x.t, x.why || '']) };
      }).filter(r => r.yes.length && r.no.length);
      return rounds.length ? { title: L.title || '', obj: L.title || '', rounds } : null;
    };
    const C    = (ctx.content && ctx.content.lesson_id && fromContract(ctx.content.lesson_id)) || ctx.content || {};
    const RS   = (C.rounds || []).slice();
     
    if (!RS.length) console.warn('SHIFT: «امسك الصحيح» بلا جولات — لا تصنيف في العقد ولا محتوى مكتوب');
    const GOAL = C.goal || 5, SECS = C.secs || 32;
    const OBJ  = C.obj  || 'التصنيف والتمييز';
    const F    = ctx.proj ? 1.35 : 1;
    const F14  = v => Math.max(14, Math.round(v)) + 'px';    
    const RM   = !!ctx.reduced;

    const P = ART.PAL.sea, FX = ART.PAL.fx;
    const a = ART.a, mix = ART.mix, rr = ART.rr, clamp = ART.clamp;
    const WOOD = P.hull, PANEL = P.sail;

    function realCol(c){
      c = String(c || '').trim();
      const m = c.match(/^var\(\s*(--[\w-]+)\s*\)$/);
      if (m){ const v = getComputedStyle(document.body).getPropertyValue(m[1]).trim(); return v || FX.gold; }
      return c || FX.gold;
    }
    let teamCol = FX.gold;

    const view = ctx.canvas(root), g = view.g;
    const W = () => view.w(), H = () => view.h();

    const px    = new ART.Particles(RM ? 70 : 300);
    const pops  = new ART.Pops();
    const shake = new ART.Shake();
    let rings = [];

    const mk = (tag, css, html) => { const e = document.createElement(tag);
      e.style.cssText = css || ''; if (html != null) e.innerHTML = html; return e; };

    const layer = mk('div','position:absolute;inset:0;direction:rtl;text-align:right;pointer-events:none;overflow:hidden');
    const field = mk('div','position:absolute;inset:0');
    const popL  = mk('div','position:absolute;inset:0;pointer-events:none');
    const hud   = mk('div','position:absolute;inset-block-start:0;inset-inline:0;display:flex;gap:10px;'+
                           'align-items:flex-start;justify-content:space-between;padding:10px 12px');
    layer.append(field, popL, hud); root.appendChild(layer);

    const GLASS = 'background:linear-gradient(180deg,rgba(255,253,246,.96),rgba(238,246,250,.92));'+
                  'border:1px solid rgba(7,63,99,.18);border-radius:16px;'+
                  'box-shadow:0 8px 22px rgba(4,38,63,.28),inset 0 1px 0 rgba(255,255,255,.9)';
    const card = mk('div', GLASS+';padding:'+Math.round(9*F)+'px '+Math.round(14*F)+'px;flex:0 1 auto;max-width:68%;min-width:0');
    const teamTag = mk('div','font-size:'+F14(12.5*F)+';font-weight:700;color:#0E6E96;margin-block-end:2px');
    const ruleTxt = mk('div','font-size:'+Math.round(16.5*F)+'px;font-weight:700;color:#07304A;line-height:1.3');
    const hintTxt = mk('div','font-size:'+F14(12*F)+';color:#4A6B7E;margin-block-start:2px');
    card.append(teamTag, ruleTxt, hintTxt);

    const RC = 2*Math.PI*19;
    const clock = mk('div', GLASS+';flex:0 0 auto;text-align:center;padding:'+Math.round(7*F)+'px '+Math.round(9*F)+'px');
    clock.innerHTML =
      '<div style="position:relative;width:'+Math.round(50*F)+'px;height:'+Math.round(50*F)+'px">'+
      '<svg viewBox="0 0 44 44" width="100%" height="100%" aria-hidden="true">'+
      '<circle cx="22" cy="22" r="19" fill="rgba(255,255,255,.85)" stroke="rgba(7,63,99,.16)" stroke-width="4"></circle>'+
      '<circle id="cx-arc" cx="22" cy="22" r="19" fill="none" stroke="#0E9E86" stroke-width="4" '+
      'stroke-linecap="round" transform="rotate(-90 22 22)" stroke-dasharray="'+RC.toFixed(1)+'" stroke-dashoffset="0"></circle>'+
      '</svg><div id="cx-num" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'+
       
      'font-size:'+Math.round(17*F)+'px;font-weight:700;color:#07304A">—</div></div>'+
      '<div id="cx-cnt" style="font-size:'+F14(12.5*F)+';font-weight:700;color:#0E6E96;margin-block-start:3px">— من —</div>';
    hud.append(card, clock);
    const arcEl = clock.querySelector('#cx-arc'), numEl = clock.querySelector('#cx-num'), cntEl = clock.querySelector('#cx-cnt');

    const BTN = 'min-height:'+(ctx.proj?64:52)+'px;padding:0 '+Math.round(24*F)+'px;border-radius:14px;'+
      'background:linear-gradient(180deg,#1FA8C4,#0E6E96);color:#FFFDF6;font-weight:700;font-size:'+Math.round(16*F)+'px;'+
      'font-family:inherit;border:0;cursor:pointer;pointer-events:auto;touch-action:manipulation;'+
      'box-shadow:0 6px 0 rgba(4,38,63,.35),0 10px 22px rgba(4,38,63,.30)';
    const over  = mk('div','position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto');
    const scrim = mk('div','position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,rgba(14,110,150,.72),rgba(4,38,63,.90))');
    const panel = mk('div','position:relative;max-width:'+(ctx.proj?720:420)+'px;width:100%;text-align:center;'+
      'background:linear-gradient(180deg,#FFFDF6,#F0E6D2);border:1px solid rgba(122,84,51,.35);border-radius:20px;'+
      'box-shadow:0 18px 46px rgba(4,38,63,.55),inset 0 2px 0 rgba(255,255,255,.9);padding:'+Math.round(20*F)+'px');
    over.append(scrim, panel); layer.appendChild(over);

    let items=[], gq=[], bq=[], tt=0;
    let ri=-1, cur=null, playing=false, tleft=0, caught=0, need=GOAL, missTaps=0, spawnIn=0, lastTick=99;
    let IR = 44, hudH = 74, sy = 0;

    function metrics(){
      const m = Math.min(W(), H());
      IR = Math.max(ctx.proj?42:38, Math.min(m*0.115, ctx.proj?84:66));
      hudH = hud.offsetHeight || 74;
      sy = Math.min(H()*0.46, Math.max(H() * (H() > W() ? 0.30 : 0.26), hudH + 44));
    }
    metrics();
    const bandTop = () => Math.max(sy + IR*0.30, hudH + IR*0.35);
    const bandBot = () => H() - IR*0.75;

    const clouds=[], gulls=[], glints=[], boats=[], islands=[];
    (function seedBg(){
      for (let i=0;i<5;i++) clouds.push({x:Math.random(), y:0.08+Math.random()*0.40, s:0.7+Math.random()*1.1, sp:0.004+Math.random()*0.006});
      for (let i=0;i<4;i++) gulls.push({x:Math.random(), y:0.10+Math.random()*0.34, s:0.55+Math.random()*0.75, sp:0.022+Math.random()*0.020, ph:Math.random()*6.28});
      for (let i=0;i<54;i++) glints.push({x:Math.random(), d:Math.random(), ph:Math.random()*6.28, s:0.4+Math.random()*0.9});
      boats.push({x:0.78, sp:0.017, s:0.62}, {x:0.30, sp:0.010, s:0.40});
       
      islands.push({x:0.36, w:0.26, h:0.030, far:true}, {x:0.86, w:0.34, h:0.024, far:true},
                   {x:0.16, w:0.30, h:0.058}, {x:0.66, w:0.44, h:0.042});
    })();

    view.onResize(() => {
      metrics();
      for (const it of items){ sizeEl(it); it.by = Math.min(Math.max(it.by, bandTop()), Math.max(bandTop(), bandBot())); }
    });

    function sizeEl(it){
      const w = Math.round(IR*2.05), h = Math.round(Math.max(50, IR*1.50));
      it.el.style.width = w+'px'; it.el.style.height = h+'px';
      it.el.style.padding = Math.round(IR*0.16)+'px';
      it.el.style.fontSize = Math.max(14, Math.min(IR*0.355, 23)*F) + 'px';
      it.ew = w; it.eh = h;
    }
    function spawn(){
      const wantGood = Math.random() < 0.5;
      const src = wantGood ? gq : bq;
      if (!src.length) return;
      const base = src.shift(); src.push(base);
       
      const top = bandTop(), bot = Math.max(top + 1, bandBot());
      const near = items.filter(o => o.x > W()-IR*3.0).map(o => o.by);
      let by = top + Math.random()*(bot-top), best = -1;
      for (let k=0; k<14; k++){
        const c = top + Math.random()*(bot-top);
        let d = 1e9; for (const o of near) d = Math.min(d, Math.abs(o-c));
        if (d > best){ best = d; by = c; }
        if (best > IR*1.7) break;
      }
      if (near.length && best < IR*1.05) return;
      const it = {
        t: base[0], n: base[1], good: wantGood,
        x: W()+IR*1.6, by, y: by, ph: Math.random()*6.28,
        f: 0.5 + Math.random()*0.5, amp: RM ? 0 : IR*(0.16+Math.random()*0.18),
        sp: (W()+IR*3.4) / ((RM ? 12 : 7 + Math.random()*5.5)),
        rot: 0, shake: 0, hit: false, dead: false, pop: 0, al: 1,
        hint: 0, spray: Math.random()*900, seed: Math.random()*10
      };
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = it.t;
      b.setAttribute('aria-label', it.t);
      b.style.cssText = 'position:absolute;left:0;top:0;display:flex;align-items:center;'+
        'justify-content:center;text-align:center;line-height:1.18;font-weight:700;font-family:inherit;'+
        'overflow:hidden;border-radius:10px;color:#3A2410;text-shadow:0 1px 0 rgba(255,255,255,.75);'+
        'background:none;border:0;pointer-events:auto;touch-action:manipulation;'+
        'will-change:transform;-webkit-tap-highlight-color:transparent';
      b.addEventListener('pointerdown', e => { e.preventDefault(); tap(it); });
      it.el = b; sizeEl(it); field.appendChild(b); items.push(it);
    }
    function kill(it){ if (it.el && it.el.parentNode) it.el.remove(); const i = items.indexOf(it); if (i>=0) items.splice(i,1); }

    function ringAt(x,y,col,r0){ rings.push({x,y,r:r0,age:0,life:0.6,col}); }

    const FRZ = 1000;
    let frozen = false, frzTok = 0;
    function freeze(){ frozen = true; const tok = ++frzTok; ctx.after(FRZ, () => { if (tok === frzTok) frozen = false; }); }
     
    function thaw(){ frozen = false; frzTok++; }

    function tap(it){
      if (!playing || it.dead || it.hit) return;
       
      if (frozen){ ringAt(it.x, it.y, P.foam, IR*0.34); return; }
      if (it.good){
        it.dead = true; it.el.style.pointerEvents = 'none';
        px.burst(it.x, it.y, RM?7:26, {col:FX.goldLt, sp0:.09, sp1:.42, up:.08, r0:2, r1:5.5, shape:'star'});
        px.burst(it.x, it.y+IR*0.5, RM?5:20, {col:P.foam, sp0:.06, sp1:.30, up:.05, r0:1.6, r1:4.6});
        ringAt(it.x, it.y, FX.goldLt, IR*0.8);
        pops.add(it.x, it.y - IR*0.6, '+10', FX.gold);
        shake.hit(3.5);
        ctx.beep('good');
        caught++;
        ctx.correct(10, {q: cur.rule, obj: cur.obj || OBJ, right: true, correct: it.t});
        ctx.sync(); updateHud();
        ctx.say('good', 'أحسنت! <b>'+ctx.esc(it.t)+'</b> — '+ctx.esc(it.n));
        if (caught >= need) ctx.after(340, () => endRound(true));
      } else {
         
        it.hit = true; it.shake = FRZ; it.el.style.pointerEvents = 'none';
        px.burst(it.x, it.y+IR*0.55, RM?6:22, {col:P.foam, sp0:.05, sp1:.26, up:.10, r0:1.8, r1:5.2});
        ringAt(it.x, it.y, P.foam, IR*0.7);
        shake.hit(RM?2:7);
        ctx.beep('soft');
        missTaps++;
        freeze();
        ctx.wrong({q: cur.rule, obj: cur.obj || OBJ, right: false, correct: it.t + ' — ' + it.n});
        ctx.sync();
         
        ctx.say('soft', 'خارج المطلوب: <b>'+ctx.esc(it.t)+'</b> — '+ctx.esc(it.n)+' · انتظر ثانية');
      }
    }

    const CNT = n => (Number(n) > 0 ? String(n) : '—');
    function updateHud(){
      const s = Math.max(0, Math.ceil(tleft));
      numEl.textContent = CNT(s);
      arcEl.setAttribute('stroke-dashoffset', (RC * (1 - Math.max(0, tleft)/SECS)).toFixed(1));
      arcEl.setAttribute('stroke', tleft <= 6 ? FX.warn : '#0E9E86');
      cntEl.textContent = CNT(caught) + ' من ' + CNT(need);
    }

    function clearField(){ for (const it of items.slice()) kill(it); items = []; rings = []; px.clear(); }

    function intro(){
      cur = RS[ri];
      need = Math.min(GOAL, cur.yes.length);
      gq = ctx.shuffle(cur.yes); bq = ctx.shuffle(cur.no);
      const tm = ctx.team ? ctx.team() : null;
      teamCol = realCol(tm ? tm.color : '');
      panel.innerHTML =
        '<div style="font-size:'+F14(13*F)+';font-weight:700;color:#8A5326">'+
          'الجولة '+(ri+1)+' من '+RS.length+'</div>'+
        '<div style="font-size:'+Math.round(15*F)+'px;font-weight:700;margin-block-start:6px;color:'+teamCol+'">'+
          ctx.esc(tm ? tm.name : 'الفريق')+'</div>'+
        '<div style="font-size:'+Math.round(24*F)+'px;font-weight:700;margin-block:12px 6px;color:#3A2410;line-height:1.35">'+
          ctx.esc(cur.rule)+'</div>'+
        '<div style="font-size:'+Math.round(14*F)+'px;color:#7A5433;margin-block-end:16px">'+
          ctx.esc(cur.hint)+' · امسك '+need+' عناصر قبل نفاد الوقت</div>';
      const b = mk('button', BTN); b.type='button'; b.textContent = 'ابدأ الجولة';
      b.addEventListener('click', begin); panel.appendChild(b);
      over.style.display = 'flex';
    }

    function begin(){
      over.style.display = 'none';
      clearField();
      const tm = ctx.team ? ctx.team() : null;
      teamCol = realCol(tm ? tm.color : '');
      teamTag.textContent = tm ? ('الدور: ' + tm.name) : 'الدور';
      teamTag.style.color = teamCol;
      ruleTxt.textContent = cur.rule;
      hintTxt.textContent = cur.hint;
      metrics();
      thaw();    
      caught = 0; missTaps = 0; tleft = SECS; spawnIn = 0.15; lastTick = 99; playing = true;
      updateHud();
      ctx.say('good', 'الشرط: <b>'+ctx.esc(cur.rule)+'</b>');
      ctx.beep('tick');
    }

    function endRound(win){
      if (!playing) return;
      playing = false; thaw();
      for (const it of items) it.el.style.pointerEvents = 'none';
      ctx.beep(win ? 'win' : 'soft');
      if (win && !RM) for (let i=0;i<5;i++)
        px.burst(W()*(0.2+i*0.15), H()*0.42, 16, {col:i%2?FX.goldLt:P.foam, sp0:.10, sp1:.46, up:.14, r0:2, r1:6, shape:'star'});
      const tm = ctx.team ? ctx.team() : null;
      const last = ri >= RS.length-1;
      panel.innerHTML =
        '<div style="font-size:'+Math.round(22*F)+'px;font-weight:700;color:'+(win?'#0E9E86':'#C2802A')+'">'+
          (win ? 'أحسنتم! اكتمل الصيد' : 'انتهى الوقت') + '</div>'+
        '<div style="font-size:'+Math.round(15*F)+'px;color:#3A2410;margin-block-start:8px">'+
          ctx.esc(tm ? tm.name : 'الفريق')+' أمسك '+caught+' من '+need+
          (missTaps ? ' · أخطاء: '+missTaps : '')+'</div>'+
        '<div style="font-size:'+Math.round(14.5*F)+'px;color:#5C3712;background:rgba(31,168,196,.14);'+
          'border:1px solid rgba(14,110,150,.20);border-radius:14px;padding:'+Math.round(12*F)+'px;'+
          'margin-block:14px;line-height:1.6">'+ctx.esc(cur.recap)+'</div>';
      const b = mk('button', BTN); b.type='button';
      b.textContent = last ? 'عرض التقرير' : 'الجولة التالية';
      b.addEventListener('click', () => { if (last) ctx.finish(); else { ri++; clearField(); intro(); } });
      panel.appendChild(b);
      over.style.display = 'flex';
      if (ctx.next) ctx.next();
      ctx.sync();
      ctx.after(600, () => { for (const it of items.slice()) it.dead = true; });
    }

    const sunX = () => W()*0.26, sunY = () => sy*0.44, sunR = () => Math.max(16, Math.min(W(),H())*0.055);

    function cloud(x,y,s,al){
      g.save(); g.globalAlpha = al;
      const gr = ART.rgrad(g,x,y-6*s,0,34*s,['rgba(255,255,255,.98)','rgba(255,255,255,.72)','rgba(255,255,255,0)']);
      g.fillStyle = gr;
      ART.ellipse(g,x,y,34*s,13*s,0); g.fill();
      g.fillStyle = 'rgba(255,255,255,.92)';
      ART.ellipse(g,x-11*s,y+1*s,13*s,8*s,0); g.fill();
      ART.ellipse(g,x+3*s,y-6*s,15*s,10*s,0); g.fill();
      ART.ellipse(g,x+16*s,y+1*s,11*s,7*s,0); g.fill();
      g.globalAlpha = al*0.5; g.fillStyle = a('#4FC3E8',.7);
      ART.ellipse(g,x+2*s,y+7*s,26*s,4.5*s,0); g.fill();
      g.restore();
    }
    function gull(x,y,s,ph){
      const flap = Math.sin(ph)*0.5;
      g.save(); g.translate(x,y); g.scale(s,s);
      g.fillStyle = '#FFFFFF'; g.strokeStyle = a('#073F63',.45); g.lineWidth = 1.1;
      g.beginPath();
      g.moveTo(-11,0);
      g.quadraticCurveTo(-6,-6-flap*4,0,-1.2);
      g.quadraticCurveTo(6,-6-flap*4,11,0);
      g.quadraticCurveTo(6,-2-flap*2,0,1.6);
      g.quadraticCurveTo(-6,-2-flap*2,-11,0);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = a('#073F63',.55); ART.ellipse(g,0,0.6,2.4,1.5,0); g.fill();
      g.restore();
    }

    function crest(yb, amp, speed, alpha, thick, seed, freq){
      const w = W(), T = RM ? 0 : tt;
      g.save(); g.globalAlpha = alpha; g.strokeStyle = P.foam;
      g.lineWidth = thick; g.lineCap = 'round';
      let x = -20;
      while (x < w+20){
        const r = ((Math.sin((x+seed)*0.0137+seed)*43758.5453) % 1 + 1) % 1;
        const len = 26 + r*130, gap = 16 + r*90;
        g.beginPath();
        for (let k=0;k<=len;k+=9){
          const xx = x+k;
          const yy = yb + Math.sin(xx*freq + T*speed + seed)*amp
                        + Math.sin(xx*freq*2.3 + T*speed*1.7)*amp*0.35;
          k===0?g.moveTo(xx,yy):g.lineTo(xx,yy);
        }
        g.stroke();
        x += len + gap;
      }
      g.restore();
    }

    function world(){
      const w = W(), h = H();
      g.clearRect(0,0,w,h);

      g.fillStyle = ART.vgrad(g,0,0,sy,[
        [0,'#1F9FDC'], [0.38,'#41C2EA'], [0.74,'#76DCEF'],
        [1, mix(P.surf,'#FFE9A8',.30)]]);
      g.fillRect(0,0,w,sy);
       
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.20;
      g.fillStyle = ART.rgrad(g, sunX(), sy*0.86, 0, Math.max(w*0.44, sy*1.25),
        [a(P.sunGlow,.75), a(P.sunGlow,.18), a(P.sunGlow,0)]);
      g.fillRect(0,0,w,sy); g.restore();

      const sX = sunX(), sY = sunY(), sR = sunR();
      ART.sunDisc(g, sX, sY, sR, P);
      if (!RM){ g.save(); g.globalCompositeOperation='lighter';
         
        const rayGrad = ART.rgrad(g, sX, sY, sR*0.6, sR*7,
          [a(P.sunGlow,.30), [0.45, a(P.sunGlow,.12)], a(P.sunGlow,0)]);
        for (let pass=0; pass<2; pass++){
          const off = pass ? (Math.PI/7) : 0, wob = pass ? 0.155 : 0.115;
          for (let i=0;i<7;i++){
            const A0 = tt*0.05 + i*(Math.PI*2/7) + off;
            g.globalAlpha = (pass?0.5:1) * (0.62 + 0.30*Math.sin(tt*0.9+i));
            g.fillStyle = rayGrad;
            g.beginPath(); g.moveTo(sX,sY);
            g.lineTo(sX+Math.cos(A0-wob)*sR*7, sY+Math.sin(A0-wob)*sR*7);
            g.lineTo(sX+Math.cos(A0)*sR*7.4,   sY+Math.sin(A0)*sR*7.4);
            g.lineTo(sX+Math.cos(A0+wob)*sR*7, sY+Math.sin(A0+wob)*sR*7);
            g.closePath(); g.fill();
          }
        } g.restore(); }

      for (const c of clouds) cloud(c.x*w, c.y*sy, c.s*(0.7+Math.min(w,h)/900), .78);

      for (const is of islands){
        const cx = is.x*w;
        const iw = is.w*w, ih = is.h*h, far = !!is.far;
        const body = far ? mix(P.water[1],'#FFFFFF',.62) : mix(P.water[1],'#FFFFFF',.40);
        g.save();
        g.globalAlpha = far ? .28 : .62;
        g.fillStyle = body;
        g.beginPath(); g.moveTo(cx-iw/2, sy);
        g.quadraticCurveTo(cx-iw*0.22, sy-ih*1.25, cx, sy-ih);
        g.quadraticCurveTo(cx+iw*0.26, sy-ih*1.5, cx+iw/2, sy);
        g.closePath(); g.fill();
         
        g.beginPath();
        g.moveTo(cx-iw/2, sy);
        g.quadraticCurveTo(cx-iw*0.22, sy-ih*1.25, cx, sy-ih);
        ART.rim(g, null, a(P.sun,.95), far?1.1:1.6, far?.35:.60);
         
        g.globalAlpha = far ? .10 : .18; g.fillStyle = '#FFFFFF';
        g.beginPath(); g.moveTo(cx-iw*0.06, sy);
        g.quadraticCurveTo(cx+iw*0.06, sy-ih*1.2, cx+iw*0.26, sy-ih*0.62);
        g.lineTo(cx+iw/2, sy); g.closePath(); g.fill();
        g.restore();
      }
       
      g.fillStyle = ART.vgrad(g,0,sy-Math.max(16,h*0.045),sy,[a(P.surf,0), a(P.surf,.30)]);
      g.fillRect(0,sy-Math.max(16,h*0.045),w,Math.max(16,h*0.045));

      for (const b of boats) ART.dhow(g, b.x*w, sy+2, b.s*(0.55+Math.min(w,h)/1100), P, tt*1000*(RM?0:1), P.sail);

      g.fillStyle = ART.vgrad(g, 0, sy, h, [
        [0,'#5FDCE8'], [0.10,'#2CBBD2'], [0.28,'#1897BE'],
        [0.55,'#12799F'], [0.80,'#0C5C83'], [1,'#073F63']]);
      g.fillRect(0, sy, w, h-sy);
       
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.45;
      g.fillStyle = ART.rgrad(g, sX, sy, 0, Math.max(w,h)*0.62,
        [a(P.sunGlow,.55), a(P.surf,.18), a(P.surf,0)]);
      g.fillRect(0, sy, w, h-sy); g.restore();
       
      g.save(); g.globalAlpha=.52;
      g.fillStyle = ART.vgrad(g, 0, sy+(h-sy)*0.42, h, [a('#073F63',0), a('#04263F',.82)]);
      g.fillRect(0, sy+(h-sy)*0.42, w, (h-sy)*0.58); g.restore();
       
      if (!RM){ g.save(); g.globalCompositeOperation='lighter';
        for (let i=0;i<38;i++){
          const sd = ((Math.sin(i*78.233)*43758.5453)%1+1)%1;
          const t2 = 0.18 + sd*0.80;
          const yy = sy + (h-sy)*t2;
          const xx = ((sd*1.7 + Math.sin(tt*0.30+i)*0.05)%1)*w;
          g.globalAlpha = (0.12 - t2*0.06) * (0.5+0.5*Math.sin(tt*1.3+i*1.9));
          g.fillStyle = P.surf;
          ART.ellipse(g, xx, yy, (16+sd*66)*(0.5+t2), 1.6+t2*2.4, 0); g.fill();
        } g.restore(); }
       
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.34;
      const hbH = Math.max(4, h*0.012);
      const sxn = clamp(sX/w, 0.02, 0.98);
      const hgr = g.createLinearGradient(0, sy, w, sy);
      hgr.addColorStop(0, a(P.foam,0));
      hgr.addColorStop(clamp(sxn-0.30,0.01,0.98), a(P.foam,.12));
      hgr.addColorStop(sxn, a(P.foam,.95));
      hgr.addColorStop(clamp(sxn+0.30,0.02,0.99), a(P.foam,.12));
      hgr.addColorStop(1, a(P.foam,0));
      g.fillStyle = hgr;
      g.fillRect(0, sy-1, w, hbH*0.55);
      g.globalAlpha = .16; g.fillRect(0, sy-1+hbH*0.55, w, hbH*0.45);
      g.restore();

      g.save(); g.globalCompositeOperation='lighter';
      const cols = 40;
      for (let i=0;i<cols;i++){
        const t2 = i/cols, yy = sy + (h-sy)*Math.pow(t2,1.6) + 3;
        const sd = (Math.sin(i*12.9898)*43758.5453) % 1, r1 = sd<0? sd+1 : sd;
        const wob = Math.sin(tt*(RM?0:1.5) + i*1.7)*(4+i*1.6);
        const ww = (sR*0.30 + i*sR*0.11) * (0.30+0.90*r1);
        g.globalAlpha = Math.max(0,(0.26 - t2*0.20)) * (0.55+0.45*Math.sin(tt*(RM?0:2.4)+i*2.1));
        g.fillStyle = i%3? P.sunGlow : P.foam;
        ART.ellipse(g, sX + wob + (r1-0.5)*sR*1.9, yy, ww, 1.0 + r1*2.0, 0);
        g.fill();
      }
      g.restore();

      g.save(); g.globalCompositeOperation='lighter';
      for (const q of glints){
        const yy = sy + (h-sy)*Math.pow(q.d,1.25);
        const tw = 0.5+0.5*Math.sin(tt*(RM?0:2.4)+q.ph);
        g.globalAlpha = 0.06 + 0.30*tw*(1-q.d*0.55);
        g.fillStyle = P.foam;
        const ww = (3+q.s*7)*(0.6+q.d*1.5);
        ART.ellipse(g, (q.x*w + Math.sin(tt*0.35+q.ph)*10 + w)%w, yy, ww, 1.1+q.d*1.4, 0); g.fill();
      }
      g.restore();

      const bands = [[0.05,2.0,0.26,.20,1.3,1.7,0.032],[0.13,3.0,0.36,.26,1.7,5.1,0.027],
                     [0.24,4.2,0.48,.30,2.1,9.4,0.022],[0.38,5.6,0.60,.32,2.5,2.3,0.018],
                     [0.55,7.2,0.74,.30,3.0,6.8,0.015],[0.75,9.0,0.90,.26,3.5,4.2,0.012]];
      for (const b of bands) crest(sy + (h-sy)*b[0], b[1], b[2], b[3], b[4], b[5], b[6]);
    }

    function foreWave(){
      const w = W(), h = H(), T = RM ? 0 : tt;
      const base = h - IR*0.16;
      g.save();
      g.beginPath(); g.moveTo(0,h);
      for (let x=0;x<=w;x+=12){
        const y = base + Math.sin(x*0.013 + T*1.1)*IR*0.16 + Math.sin(x*0.031 + T*1.7)*IR*0.07;
        g.lineTo(x,y);
      }
      g.lineTo(w,h); g.closePath();
      g.fillStyle = ART.vgrad(g,0,base-IR*0.4,h,[a(P.water[2],.85), P.water[3]]);
      g.fill();
      g.globalAlpha = .55; g.strokeStyle = P.foam; g.lineWidth = 2.4; g.lineCap='round';
      g.beginPath();
      for (let x=0;x<=w;x+=12){
        const y = base + Math.sin(x*0.013 + T*1.1)*IR*0.16 + Math.sin(x*0.031 + T*1.7)*IR*0.07;
        x===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      g.stroke(); g.restore();
    }

    function raft(hw, hh, it, flat){
       
      const grd = ART.vgrad(g, 0, -hh, hh, [
        [0, mix(WOOD[0],'#FFDCA6',.42)], [0.30, mix(WOOD[0],'#F0A758',.12)],
        [0.70, WOOD[1]], [1, mix(WOOD[2],'#3A1D06',.25)]]);
      rr(g, -hw, -hh, hw*2, hh*2, hh*0.30); g.fillStyle = grd; g.fill();
      if (!flat){
         
        g.save(); rr(g, -hw, -hh, hw*2, hh*2, hh*0.30); g.clip();
        g.globalAlpha = .30; g.strokeStyle = mix(WOOD[2],'#000',.35); g.lineWidth = Math.max(1, hw*0.035);
        for (let i=-2;i<=2;i++){ const bx = i*hw*0.42;
          g.beginPath(); g.moveTo(bx,-hh); g.lineTo(bx,hh); g.stroke(); }
         
        g.globalAlpha = .16; g.strokeStyle = '#FFFFFF'; g.lineWidth = Math.max(1, hw*0.02);
        for (let i=0;i<3;i++){ const yy = -hh*0.6 + i*hh*0.6;
          g.beginPath(); g.moveTo(-hw, yy + Math.sin(it.seed+i)*2);
          g.quadraticCurveTo(0, yy - 2.5, hw, yy + Math.cos(it.seed+i)*2); g.stroke(); }
        g.restore();
         
        g.fillStyle = a(mix(WOOD[2],'#000',.20), .55);
        rr(g, -hw*0.98, -hh*0.86, hw*1.96, hh*0.20, hh*0.09); g.fill();
        rr(g, -hw*0.98,  hh*0.66, hw*1.96, hh*0.20, hh*0.09); g.fill();
         
        const pw = hw*0.86, ph = hh*0.60;
        rr(g, -pw, -ph, pw*2, ph*2, ph*0.28);
        g.fillStyle = ART.vgrad(g, 0, -ph, ph, [mix(PANEL,'#FFFFFF',.65), mix(PANEL,'#E0BE86',.45)]);
        g.fill();
        g.save(); g.globalAlpha=.55; g.strokeStyle = mix(P.rope,'#000',.20);
        g.lineWidth = Math.max(1.4, hw*0.035); g.stroke(); g.restore();
         
        g.strokeStyle = a(P.rope,.85); g.lineWidth = Math.max(1.6, hw*0.05); g.lineCap='round';
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy2])=>{
          g.beginPath();
          g.moveTo(sx*hw*0.94, sy2*hh*0.30);
          g.lineTo(sx*hw*0.66, sy2*hh*0.90);
          g.stroke();
        });
         
        g.save(); rr(g, -hw, -hh, hw*2, hh*2, hh*0.30); g.clip();
        g.globalAlpha=.28; g.fillStyle='#000';
        rr(g,-hw, hh*0.42, hw*2, hh*0.7, 0); g.fill();
        g.restore();
         
        g.fillStyle = teamCol;
        rr(g, -hw*0.99, hh*0.60, hw*1.98, hh*0.24, hh*0.10); g.fill();
        g.save(); g.globalAlpha=.34; g.fillStyle='#FFFFFF';
        rr(g, -hw*0.99, hh*0.60, hw*1.98, hh*0.09, hh*0.045); g.fill(); g.restore();
        g.save(); g.globalAlpha=.30; g.fillStyle='#000';
        rr(g, -hw*0.99, hh*0.76, hw*1.98, hh*0.08, hh*0.04); g.fill(); g.restore();
        g.save(); g.globalAlpha=.85; g.strokeStyle=mix(WOOD[0],'#FFF6E0',.80);
        g.lineWidth=Math.max(1.8,hw*0.045); g.lineCap='round';
        g.beginPath(); g.moveTo(-hw*0.84,-hh*0.95); g.lineTo(hw*0.84,-hh*0.95); g.stroke();
        g.globalAlpha=.45;
        g.beginPath(); g.moveTo(-hw*0.96,-hh*0.55); g.lineTo(-hw*0.96,hh*0.35); g.stroke();
        g.restore();
      }
    }

    function drawItem(it){
      const sq  = RM ? 1 : 1 + Math.sin(tt*3 + it.ph)*0.045;
      const pop = it.dead ? clamp(it.pop,0,1) : 0;
      const sc  = it.dead ? 1 + ART.easeOut(pop)*0.55 : 1;
      const sx  = it.shake > 0 ? Math.sin(it.shake*0.055)*IR*0.14 : 0;
      const x = it.x + sx, y = it.y;
      const hw = IR*1.12, hh = IR*0.80;

      if (!RM && !it.dead){
        const NS = 4, top = y + hh*1.05, span = hh*1.12;
        for (let k=0;k<NS;k++){
          g.save();
          g.beginPath(); g.rect(x-hw*1.8, top + span*(k/NS), hw*3.6, span/NS + 1); g.clip();
          g.globalAlpha = (0.19 - k*0.035)*it.al;
          const off = Math.sin(tt*2.2 + k*1.3 + it.ph)*(2.5 + k*2.4);
          g.translate(x + off, top); g.scale(1,-0.55); g.translate(0,-hh);
          g.rotate(it.rot*0.5);
          raft(hw*0.96, hh, it, true);
          g.restore();
        }
      }
       
      ART.drop(g, x + hw*0.16, y + hh*1.02, hw*1.0, hh*0.42, '#04263F', .40*it.al);

      ART.glow(g, x, y, IR*2.1, P.sunGlow, .14*it.al);
       
      if (it.hint > 0) ART.glow(g, x, y, IR*1.9, FX.goldLt, .28*(it.hint/1200));
      if (it.dead) ART.glow(g, x, y, IR*(1.6+pop*1.8), FX.goldLt, .55*(1-pop));

      g.save(); g.globalAlpha = it.al;
      g.translate(x, y); g.rotate(it.rot); g.scale(sc, sc*sq);
      raft(hw, hh, it, false);
      if (it.hit){ g.globalAlpha = it.al*0.38; g.fillStyle = FX.warn;
        rr(g,-hw,-hh,hw*2,hh*2,hh*0.30); g.fill(); }
      if (it.dead){ g.globalCompositeOperation='lighter';
        g.globalAlpha = clamp(it.al*(0.35+0.75*(1-pop)),0,1); g.fillStyle = FX.goldLt;
        rr(g,-hw,-hh,hw*2,hh*2,hh*0.30); g.fill(); }
      g.restore();

      g.save(); g.globalAlpha = .80*it.al; g.strokeStyle = P.foam;
      g.lineWidth = Math.max(2.4, IR*0.10); g.lineCap='round';
      g.beginPath();
      for (let k=0;k<=10;k++){
        const px2 = x - hw*1.02 + (hw*2.04)*(k/10);
        const py2 = y + hh*0.92 + Math.sin(tt*4 + k*0.9 + it.ph)*IR*0.05;
        k===0?g.moveTo(px2,py2):g.lineTo(px2,py2);
      }
      g.stroke();
       
      g.globalAlpha = .55*it.al; g.lineWidth = Math.max(2, IR*0.07);
      g.beginPath();
      g.arc(x - hw*1.02, y + hh*0.86, IR*0.42, Math.PI*0.92, Math.PI*1.75);
      g.stroke();
      g.restore();
    }

    function drawRings(){
      for (const rg of rings){ const k = rg.age/rg.life, R = rg.r*(1+ART.easeOut(k)*2.1);
        g.save(); g.globalCompositeOperation='lighter';
        g.strokeStyle = rg.col;
        g.globalAlpha = Math.max(0, .30*(1-k)); g.lineWidth = Math.max(4, IR*0.34*(1-k));
        g.beginPath(); g.arc(rg.x, rg.y, R, 0, Math.PI*2); g.stroke();
        g.globalAlpha = Math.max(0, .75*(1-k)); g.lineWidth = Math.max(1.5, IR*0.08*(1-k));
        g.beginPath(); g.arc(rg.x, rg.y, R, 0, Math.PI*2); g.stroke();
        g.restore(); }
    }

    function draw(){
      g.save();
      shake.apply(g);
      world();
      for (const it of items) drawItem(it);
      px.draw(g);
      drawRings();
      foreWave();
      g.restore();
       
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.13;
      g.fillStyle = ART.rgrad(g, sunX(), sunY(), 0, Math.max(W(),H())*0.85, [a(P.sunGlow,.9), a(P.sunGlow,0)]);
      g.fillRect(0,0,W(),H()); g.restore();
      ART.vignette(g, W(), H(), .34);
    }

    let popCount = 0;
    function drawPops(){
      const list = pops.list();
      if (!list.length){ if (popCount){ popL.innerHTML=''; popCount=0; } return; }
      popL.innerHTML = list.map(p =>
        '<div style="position:absolute;left:'+(p.x).toFixed(0)+'px;top:'+(p.y).toFixed(0)+'px;'+
        'transform:translate(-50%,-50%);direction:ltr;opacity:'+p.op.toFixed(2)+';font-weight:800;'+
        'font-size:'+Math.round(30*F)+'px;color:'+p.col+';-webkit-text-stroke:'+(1.6*F).toFixed(1)+'px rgba(58,36,16,.85);'+
        'letter-spacing:.5px;text-shadow:0 3px 10px rgba(4,38,63,.7),0 0 18px '+a(FX.goldLt,.9)+'">'+p.txt+'</div>').join('');
      popCount = list.length;
    }

    ctx.raf((dtMs) => {
      const dm = Math.min(dtMs, 60), d = dm/1000; tt += d;

      if (playing){
        tleft -= d;
        const s = Math.max(0, Math.ceil(tleft));
        if (s !== lastTick){ lastTick = s; updateHud(); if (s <= 5 && s > 0) ctx.beep('tick'); }
        spawnIn -= d;
        const maxOn = ctx.proj ? 6 : (H() > W() ? 4 : 5);
        if (spawnIn <= 0 && items.length < maxOn){ spawn(); spawnIn = 0.75 + Math.random()*0.75; }
        if (tleft <= 0) endRound(false);
      }

      if (!RM){
        for (const c of clouds){ c.x -= c.sp*d*0.06; if (c.x < -0.20) { c.x = 1.20; c.y = 0.08+Math.random()*0.40; } }
        for (const q of gulls){ q.x -= q.sp*d*0.12; q.ph += d*6; if (q.x < -0.10){ q.x = 1.12; q.y = 0.10+Math.random()*0.34; } }
        for (const b of boats){ b.x -= b.sp*d*0.05; if (b.x < -0.15) b.x = 1.18; }
      }

      for (const it of items.slice()){
        it.x -= it.sp * d;
        it.y  = it.by + (RM ? 0 : Math.sin(tt*it.f + it.ph) * it.amp);
        it.rot = RM ? 0 : Math.sin(tt*it.f*0.8 + it.ph) * 0.11;
        if (it.shake > 0) it.shake -= dm;
        if (it.hint > 0) it.hint -= dm;
        if (it.dead){ it.pop += d*3.2; it.al = Math.max(0, (it.hit ? 0.45 : 1) - it.pop*1.45); }
        else if (it.hit) it.al = 0.45;
         
        if (!RM && !it.dead && it.x > 0 && it.x < W()){
          it.spray -= dm;
          if (it.spray <= 0){ it.spray = 500 + Math.random()*900;
            px.burst(it.x - IR*0.9, it.y + IR*0.78, 3, {col:P.foam, sp0:.02, sp1:.10, up:.06, r0:1, r1:2.6, g:0.00030}); }
        }
        if (it.pop >= 1 || it.x < -IR*1.8){ kill(it); continue; }
        const sx = it.shake > 0 ? Math.sin(it.shake*0.055)*IR*0.14 : 0;
        const sc = it.dead ? 1 + it.pop*0.55 : 1;
        it.el.style.transform = 'translate('+(it.x+sx-it.ew/2).toFixed(1)+'px,'+(it.y-it.eh/2).toFixed(1)+'px) '+
                                'rotate('+it.rot.toFixed(3)+'rad) scale('+sc.toFixed(3)+')';
        it.el.style.opacity = it.al.toFixed(2);
      }

      px.step(dm); pops.step(dm); shake.step(dm);
      for (const rg of rings.slice()){ rg.age += d; if (rg.age >= rg.life) rings.splice(rings.indexOf(rg),1); }

      draw();
       
      if (!RM) for (const q of gulls) gull(q.x*W(), q.y*sy, q.s*(0.7+Math.min(W(),H())/900), q.ph);
      drawPops();
    });

    if (!RS.length){
      panel.innerHTML = '<div style="font-size:'+Math.round(18*F)+'px;color:#3A2410">لا يوجد محتوى لهذه اللعبة.</div>';
      const b = mk('button', BTN); b.type='button'; b.textContent = 'عرض التقرير';
      b.addEventListener('click', () => ctx.finish()); panel.appendChild(b);
      over.style.display = 'flex';
    } else { ri = 0; intro(); }

    return { destroy(){
      playing = false; thaw();
      for (const it of items.slice()) { if (it.el && it.el.parentNode) it.el.remove(); }
      items = []; rings = []; px.clear();
      if (layer.parentNode) layer.remove();
    } };
  }
});

SHIFT.engine('dive', {
  name:'رحلة الغوص على اللؤلؤ', mins:4,
  mount(root, ctx){
    const C = ctx.content || {};

    function hex(c){

      if (c.charAt(0)==='#'){
        let x=c.slice(1); if (x.length===3) x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
        return '#'+x.slice(0,6);
      }
      const m = c.match(/(\d+(?:\.\d+)?)/g);
      if (!m || m.length<3) return '#000000';
      return '#'+[0,1,2].map(function(i){ return Math.round(+m[i]).toString(16).padStart(2,'0'); }).join('');
    }
    function mix(c1,c2,t){ return hex(ART.mix(hex(c1), hex(c2), t)); }
    function al(c,v){ return ART.a(hex(c), v); }
     
    const CORAL = [ mix(DES.mid,'#FF7E6B',.62), mix(FX.warn,'#FF9E70',.50),
                    mix(SEA.surf,'#6FD8C0',.55), mix(DES.far,'#FF9BB0',.58) ];

    function teamColor(){
      const tm = ctx.team ? ctx.team() : null;

      const i = ctx.teams ? ctx.teams.indexOf(tm) : 0;
      if (i >= 0) return TEAMC[i % TEAMC.length];
      const m = /var\(\s*(--[\w-]+)\s*\)/.exec(tm.color || '');

      return TEAMC[0];

    function el(tag, css, txt){ const d = document.createElement(tag); d.style.cssText = css||''; if (txt!=null) d.textContent = txt; return d; }
    const ui = el('div','position:absolute;inset:0;z-index:2;pointer-events:none;direction:rtl;text-align:right;font-family:inherit');
     
    const INK   = mix(SEA.water[3],'#000',.20);

    const chip = el('div','display:flex;align-items:center;gap:6px;background:'+al(SEA.shell[1],.42)+';color:'+INK+';border:2px solid '+al(SEA.foam,.7)+';border-radius:999px;padding:'+(PJ?'5px 12px':'4px 10px')+';font-size:'+(PJ?18:14)+'px;font-weight:700;white-space:nowrap');
    const dot  = el('span','width:'+(PJ?12:9)+'px;height:'+(PJ?12:9)+'px;border-radius:50%;background:#8aa;flex:none');

    const oxFl = el('div','height:100%;width:100%;background:linear-gradient(90deg,#2ED47A,#9BF5C4);border-radius:999px;box-shadow:0 0 10px rgba(46,212,122,.65)');
    oxTr.appendChild(oxFl);
    const cnt  = el('div','color:'+INK2+';font-size:'+(PJ?17:14)+'px;font-weight:600;white-space:nowrap','');
    meta.appendChild(chip); meta.appendChild(oxLab); meta.appendChild(oxTr); meta.appendChild(cnt);
    head.appendChild(qEl); head.appendChild(meta);
    const lay  = el('div','position:absolute;inset:0;font-size:'+(PJ?22:14.5)+'px');
    const popL = el('div','position:absolute;inset:0;pointer-events:none');
    const hint = el('div','position:absolute;inset-inline:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;transition:opacity .5s;opacity:1');
    const hintP= el('span','display:inline-block;background:rgba(6,40,64,.72);color:#EAFBFF;border:1px solid rgba(159,240,255,.5);'
      + 'backdrop-filter:blur(6px);border-radius:999px;padding:'+(PJ?'8px 16px':'6px 12px')+';font-size:'+(PJ?19:14)+'px;'
      + 'font-weight:600;box-shadow:0 6px 18px rgba(2,18,30,.45)','اسحب بإصبعك لتوجيه الغوّاص نحو المحارة الصحيحة');
    hint.appendChild(hintP);
    ui.appendChild(head); ui.appendChild(lay); ui.appendChild(popL); ui.appendChild(hint);
    root.appendChild(ui);

    const frame = root.parentNode && root.parentNode.parentNode;    
    const skin  = document.createElement('style');
    skin.textContent =
      '#main.sea-frame{'
      + '--ground:'   + mix(SEA.water[3],'#000',.34) + ';'

      + '--raised:'   + mix(SEA.water[3],'#0F5A80',.44) + ';'
      + '--line:'     + al(SEA.foam,.20) + ';'
      + '--ink:'      + SEA.foam + ';'
      + '--muted:'    + mix(SEA.foam,SEA.water[1],.50) + ';'
      + 'background:linear-gradient(180deg,' + mix(SEA.water[2],'#02141F',.62) + ' 0%,'
                                             + mix(SEA.water[3],'#000',.38) + ' 100%);'
      + 'border-radius:16px}'
      + '#main.sea-frame .tm{box-shadow:0 6px 16px rgba(2,20,32,.40)}'
