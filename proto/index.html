      + 'box-shadow:0 18px 44px rgba(2,20,32,.55)}';
    document.head.appendChild(skin);
    if (frame) frame.classList.add('sea-frame');
     
    const tmEls = frame ? frame.querySelectorAll('.tm') : [];
    const keepTm = [];
    for (let i=0;i<tmEls.length;i++){
      keepTm.push(tmEls[i].style.color);
      tmEls[i].style.color = TEAMC[i % TEAMC.length];
    }
    function unframe(){
      if (frame) frame.classList.remove('sea-frame');
      for (let i=0;i<tmEls.length;i++) tmEls[i].style.color = keepTm[i] || '';
      if (skin.parentNode) skin.parentNode.removeChild(skin);
    }

    const LBL = 'position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;'
      + 'background:linear-gradient(180deg,'+SEA.shell[0]+' 0%,'+SEA.shell[1]+' 100%);color:'+INK+';'
      + 'border:2px solid '+al(SEA.foam,.5)+';border-radius:999px;'
      + 'padding:.34em .82em;font-size:1em;font-weight:700;line-height:1.25;'
      + 'box-shadow:2px 6px 12px rgba(2,32,47,.45),inset 0 1px 0 '+al(SEA.foam,.85)+';'
      + 'pointer-events:none;transition:background .3s,color .3s,border-color .3s,opacity .3s,box-shadow .3s';

    let oys = [];                         
    let SURF=90, BED=300, S=1;
    let rocks=[], corals=[], weeds=[], fishes=[], snow=[], school=null, school2=null, jellies=[], amb=null;

    function seedScene(){
      const W=w(), H=h(), D=Math.max(40,BED-SURF);
      let s=987654321;
      const rn=function(){ s=(s*1103515245+12345)>>>0; return s/4294967296; };
      rocks=[]; corals=[]; weeds=[]; fishes=[]; snow=[]; jellies=[];
      const nr = Math.max(4, Math.round(W/150));
      for (let i=0;i<nr;i++) rocks.push({x:rn()*W, r:(10+rn()*18)*S, f:0.55+rn()*0.4, d:rn()<0.5?-1:1});
      const nc = Math.max(5, Math.round(W/105));
      for (let i=0;i<nc;i++) corals.push({x:rn()*W, s:(1.0+rn()*1.1), c:CORAL[(rn()*CORAL.length)|0], ph:rn()*6.283, k:rn()<0.45?1:0});
      const nw = Math.max(6, Math.round(W/85));
      for (let i=0;i<nw;i++) weeds.push({x:rn()*W, hh:(22+rn()*40)*S, ph:rn()*6.283, c:WEED[(rn()*2)|0]});
      const nf = Math.max(3, Math.round(W/210));
      for (let i=0;i<nf;i++) fishes.push({b:rn()*W, y:SURF+D*(0.18+rn()*0.62), s:(0.62+rn()*0.85)*S,
        c:[SEA.foam, FX.gold, CORAL[1], SEA.surf][(rn()*4)|0], sp:0.55+rn()*1.1, ph:rn()*6.283, d:rn()<0.5?-1:1});
       
      const ns = R ? Math.max(26, Math.round(W*D/5200)) : 8;
      for (let i=0;i<ns;i++) snow.push({x:rn()*W, y:SURF+rn()*D, r:(0.8+rn()*1.9)*S, sp:0.10+rn()*0.30, ph:rn()*6.283});
       
      const sc=[]; for (let i=0;i<16;i++) sc.push({dx:(rn()-0.5)*76, dy:(rn()-0.5)*34, ph:rn()*6.283});
      school = {f:sc, y:SURF+D*0.30, sp:0.55+rn()*0.3, b:rn()*W};
       
      const nj = Math.max(4, Math.round(W*D/13000));
      for (let i=0;i<nj;i++) jellies.push({x:rn()*(W+160), yf:0.20+rn()*0.54, s:0.72+rn()*0.95,
        ph:rn()*6.283, sp:0.45+rn()*0.85, d:rn()<0.5?-1:1});
      const s2=[]; for (let i=0;i<28;i++) s2.push({dx:(rn()-0.5)*120, dy:(rn()-0.5)*48, ph:rn()*6.283});
      school2 = {f:s2, yf:0.50+rn()*0.16, sp:0.35+rn()*0.30, b:rn()*W};
       
      const tall = H > 1.6*W;
      amb = new ART.Bubbles(R ? (tall?58:32) : (tall?14:8), W, H);
    }

    function layout(){
      const W=w(), H=h();
      S = Math.max(0.72, Math.min(1.55, Math.min(W,H)/520));
      const hb  = head.offsetTop + head.offsetHeight;      
      const top = hb + 10;                                 
      BED  = H - Math.max(H*0.06, 24);
      SURF = Math.max(top, Math.min(H*0.45, hb + 56*S));   
      if (BED - SURF < 118) SURF = Math.max(top, Math.min(SURF, BED - 118));
      if (BED - SURF < 84)  BED  = Math.min(H - 8, SURF + 84);
       
      if (BED - SURF < 60){ BED = Math.max(60, H - 8); SURF = Math.max(40, BED - 60); }
       
      lay.style.fontSize = (PJ ? Math.max(15, Math.min(23, W/34))
                             : Math.max(14, Math.min(15.5, W/26))) + 'px';
      oys.forEach(function(o){ if (o.el) o.lw = o.el.offsetWidth/2 + 4; });
      seedScene();
    }
    if (cvs.onResize) cvs.onResize(layout);

    const dv = {x:0,y:0,vx:0,vy:0,sq:1};
    let idx=-1, item=null, parts=[], pearl=null, rise=null;
    let phase='wait', pT=0, oxy=1, oxyMs=17000, cur=0, curV=0, splash=0, got=0;
    let tx=null, ty=null, drag=false, bubT=0, teamHex=TEAMC[0], face=1, dead=false;
    let oxW='', oxC='';                   
    let winFlash=0;
    const fxp   = new ART.Particles(240);
    const shake = new ART.Shake();

    function shipX(){ return w()*0.5; }
    function waveY(x,t){ return SURF + (Math.sin(x*0.013 + t*0.0016)*3.4 + Math.sin(x*0.006 - t*0.0011)*2.4)*S*R
      + (splash>0 ? Math.sin(x*0.05 - splash*0.02)*splash*0.06*S : 0); }

    function pop(x,y,txt,col){
      const d = el('div','position:absolute;left:0;top:0;transform:translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px);'
        + 'font-weight:900;font-size:'+(PJ?38:26)+'px;color:'+col+';-webkit-text-stroke:1px rgba(90,55,0,.45);'
        + 'text-shadow:0 3px 12px rgba(2,18,30,.85),0 0 22px '+col+',0 0 44px '+col+';'
        + 'pointer-events:none;opacity:1;transition:transform .95s cubic-bezier(.18,.85,.3,1),opacity .95s ease-out', txt);
      popL.appendChild(d);
      requestAnimationFrame(function(){
        d.style.transform = 'translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+(y-72*S).toFixed(1)+'px) scale(1.3)';
        d.style.opacity = '0';
      });
      ctx.after(1050, function(){ if (d.parentNode) d.parentNode.removeChild(d); });
    }

    function newDive(){
      idx++;
      if (idx >= ITEMS.length){ finishAll(); return; }
      item = ITEMS[idx];
      const opts = (item.a||[]).map(function(txt,i){ return {txt:txt, ok:(i===item.c)}; });
      const sh = ctx.shuffle ? ctx.shuffle(opts) : opts;
      while (lay.firstChild) lay.removeChild(lay.firstChild);
      oys = sh.map(function(o,i){
        const d = el('div', LBL, o.txt); lay.appendChild(d);
        return {txt:o.txt, ok:o.ok, i:i, ph:Math.random()*6.283, sp:0.65+Math.random()*0.8,
                open:0, want:0, bad:false, glow:0, x:0, y:0, el:d};
      });
      qEl.textContent = item.q || '';
      cnt.textContent = 'غوصة ' + (idx+1) + ' من ' + ITEMS.length;
      const tm = ctx.team ? ctx.team() : null;
      teamHex = teamColor();
      chipT.textContent = tm && tm.name ? tm.name : 'الفريق';
      dot.style.background = teamHex; chip.style.borderColor = teamHex;
      oxyMs = Math.max(11000, (R?17000:24000) - idx*350);
      oxy = 1; parts.length = 0; pearl = null; rise = null; splash = 0;
      layout();
      oys.forEach(function(o){ o.lw = o.el.offsetWidth/2 + 4; });
      if (idx > 0) hint.style.opacity = '0';             
      dv.x = shipX(); dv.y = SURF + 16*S; dv.vx = 0; dv.vy = 0.6; dv.sq = 1;
      tx = null; ty = null;
      phase = 'dive'; pT = 0;
    }

    function dim(chosen){
      oys.forEach(function(o){
        if (o.ok){
          o.el.style.background = 'linear-gradient(180deg,#7CF0B4 0%,#22B268 100%)';
          o.el.style.color = '#04241A';
          o.el.style.borderColor = 'rgba(255,255,255,.95)';
          o.el.style.boxShadow = '0 0 0 5px rgba(46,212,122,.32),0 10px 22px rgba(2,20,32,.5)';
        } else if (o===chosen){
          o.el.style.background = 'linear-gradient(180deg,#FFE7B0 0%,#F3B43C 100%)';
          o.el.style.color = '#3A2606';
          o.el.style.borderColor = 'rgba(255,255,255,.9)';
        } else {
          o.el.style.opacity = '.30';
        }
      });
    }
    function hit(o){
      if (phase!=='dive') return;
      o.want = 1;
      const right = item.a[item.c];
      if (o.ok){
        got++;
        dv.sq = 0.62; dv.vy *= -0.3;
        pearl = {x:o.x, y:o.y-4*S, t:0};
        phase = 'pearl'; pT = 0;
        burst(o.x, o.y-4*S, 10, 'spark');
        dim(o);
        const pts = 10 + Math.round(oxy*5);
        pop(o.x, o.y - 52*S, '+' + pts, FX.goldLt);
        winFlash = 1;
        ctx.correct(pts, {q:item.q, obj:item.obj||OBJ, right:true, correct:right});
        if (ctx.beep) ctx.beep('good');
        if (ctx.say) ctx.say('good','لؤلؤة! الإجابة الصحيحة: ' + ctx.esc(right));
      } else {
        o.bad = true;
        dv.sq = 0.7;
        dv.vx += (dv.x - o.x)*0.06 + (dv.x >= o.x ? 1.2 : -1.2); dv.vy = -1.8;
        burst(o.x, o.y, 12, 'sand');
        if (R) shake.hit(9*S);
        const ok = oys.filter(function(z){ return z.ok; })[0];
        if (ok){ ok.want = 1; ok.glow = 1; rise = {x:ok.x, y:ok.y-6*S, a:1}; }
        dim(o);
        ctx.wrong({q:item.q, obj:item.obj||OBJ, right:false, correct:right});
        if (ctx.beep) ctx.beep('soft');
        if (ctx.say) ctx.say('soft','لا بأس — المحارة الصحيحة كانت: ' + ctx.esc(right));
        phase = 'miss'; pT = 0;
      }
      ctx.next(); ctx.sync();
    }
    function timeout(){
      const right = item.a[item.c];
      const ok = oys.filter(function(z){ return z.ok; })[0];
      if (ok){ ok.want = 1; ok.glow = 1; rise = {x:ok.x, y:ok.y-6*S, a:1}; }
      dim(null);
      ctx.wrong({q:item.q, obj:item.obj||OBJ, right:false, correct:right});
      if (ctx.beep) ctx.beep('soft');
      if (ctx.say) ctx.say('soft','نفد الأكسجين فصعد الغيص — الإجابة الصحيحة: ' + ctx.esc(right));
      ctx.next(); ctx.sync();
      phase = 'miss'; pT = 0;
    }
    function finishAll(){
      phase = 'end';
      oys = []; rise = null; pearl = null;
      while (lay.firstChild) lay.removeChild(lay.firstChild);
      qEl.textContent = 'رجعت السفينة بالمحصول — انتهت رحلة الغوص!';
      cnt.textContent = 'لآلئ: ' + got;
      hint.style.opacity = '0';
      if (R) fxp.burst(shipX(), SURF, 60, {col:FX.goldLt, sp0:0.10, sp1:0.45, up:0.18, r0:2, r1:6, shape:'star', g:0.00030});
      if (ctx.beep) ctx.beep('win');
      ctx.sync();
      ctx.after(650, function(){ ctx.finish(); });
    }

    function burst(x,y,n,kind){
      if (kind==='spark'){
        if (!R){ fxp.burst(x,y,3,{col:FX.goldLt, sp0:0.05, sp1:0.14, r0:1.6, r1:3.4, g:0}); return; }
        fxp.burst(x,y,Math.round(n*1.6),{col:FX.goldLt, sp0:0.06, sp1:0.32, r0:1.6, r1:5.2, g:-0.00010, shape:'star'});
        fxp.burst(x,y,Math.round(n*1.2),{col:SEA.foam, sp0:0.04, sp1:0.20, r0:1.2, r1:3.2, g:-0.00006});
        return;
      }
      if (kind==='sand' && R) fxp.burst(x,y,10,{col:SEA.sand, sp0:0.03, sp1:0.13, r0:3, r1:8, g:0.00006});
      if (!R) n = Math.min(n,3);
      for (let i=0;i<n && parts.length<110;i++){
        const a = Math.random()*6.283, s = (0.6+Math.random()*1.8)*S;
        parts.push({k:kind, x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - (kind==='sand'?0.2:0),
                    r:(kind==='sand'?3.2:2.2)*S*(0.6+Math.random()), l:1});
      }
    }
    function bubble(x,y){
      if (parts.length>110) return;
      parts.push({k:'bub', x:x+(Math.random()-0.5)*8*S, y:y, vx:0, vy:-(0.5+Math.random()*0.7)*S,
                  r:(1.2+Math.random()*2.2)*S, l:1, ph:Math.random()*6.283});
    }
    function stepParts(d){
      for (let i=parts.length-1;i>=0;i--){
        const p = parts[i];
        if (p.k==='bub'){ p.y += p.vy*d; p.x += Math.sin(p.y*0.05+p.ph)*0.5*R*d; p.l -= 0.004*d;
          if (p.y < SURF+2){ p.l = 0; } }
        else if (p.k==='sand'){ p.x += p.vx*d; p.y += p.vy*d; p.vy += 0.03*d; p.vx *= 0.96; p.l -= 0.016*d; }
        else if (p.k==='drop'){ p.x += p.vx*d; p.y += p.vy*d; p.vy += 0.09*d; p.l -= 0.014*d; }
        else { p.x += p.vx*d; p.y += p.vy*d; p.vx *= 0.93; p.vy *= 0.93; p.l -= 0.03*d; }
        if (p.l <= 0) parts.splice(i,1);
      }
    }

    function at(e){ const r = cv.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; }
    function onDown(e){ drag = true; at(e); hint.style.opacity = '0';
      if (cv.setPointerCapture && e.pointerId!=null){ try{ cv.setPointerCapture(e.pointerId); }catch(_){} }
      e.preventDefault(); }
    function onMove(e){ if (drag){ at(e); e.preventDefault(); } }
    function onUp(){ drag = false; }
    cv.addEventListener('pointerdown', onDown, {passive:false});
    cv.addEventListener('pointermove', onMove, {passive:false});
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    window.addEventListener('pointerup', onUp);

    let SUNX=0, SUNY=0;
    function drawSkyBand(t){
      const W=w();
      const top = Math.max(2, SURF+10*S);
      g.fillStyle = ART.vgrad(g,0,0,top,[SEA.sky[2], SEA.sky[1], SEA.sky[0]]);
      g.fillRect(0,0,W,top);
       
      const gh = Math.min(SURF, 54*S);
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.55;
      g.fillStyle = ART.vgrad(g,0,SURF-gh,SURF+2,[al(SEA.sunGlow,0), al(SEA.sunGlow,.50)]);
      g.fillRect(0,SURF-gh,W,gh+3); g.restore();
       
      SUNX = W*0.76; SUNY = Math.max(9*S, SURF - 28*S);
      ART.sunDisc(g, SUNX, SUNY, Math.max(7, 11*S), SEA);
       
      if (SURF > 46*S){
        g.save(); g.globalAlpha = .34;
        ART.dune(g, W, SURF-3*S, 6*S, 1.4, mix(DES.dune[1], SEA.sky[0], .52), false);
        g.restore();
      }
       
      if (SURF > 34*S){
        g.save(); g.globalAlpha=.30; g.fillStyle = mix('#0C3A54', SEA.sky[0], .30);
        for (let i=0;i<2;i++){
          const bx = W*(0.14+0.20*i) + Math.sin(t*0.00013+i*2)*W*0.03*R, by = SURF-2*S, sc=(5+i*2)*S;
          g.beginPath(); g.moveTo(bx,by-3.2*sc); g.lineTo(bx+1.5*sc,by-0.3*sc); g.lineTo(bx-1.2*sc,by-0.3*sc); g.closePath(); g.fill();
          g.beginPath(); ART.rr(g,bx-2.2*sc,by-0.4*sc,4.4*sc,0.9*sc,0.4*sc); g.fill();
        }
        g.restore();
      }
       
      if (SURF > 40*S && R){
        g.save(); g.strokeStyle = al('#0F3A54',.48); g.lineWidth = 1.6*S; g.lineCap='round';
        for (let i=0;i<3;i++){
          const bx = ((W*0.30 + i*40*S - t*0.012) % (W+70)) - 35;
          const by = Math.max(6*S, SURF - (22 + i*9)*S + Math.sin(t*0.001 + i)*3*S);
          g.beginPath(); g.moveTo(bx-5*S,by); g.quadraticCurveTo(bx-2*S,by-3.4*S,bx,by);
          g.quadraticCurveTo(bx+2*S,by-3.4*S,bx+5*S,by); g.stroke();
        }
        g.restore();
      }
    }

    function seaPath(t,W,H){
      g.beginPath(); g.moveTo(-4, waveY(-4,t));
      for (let x=-4;x<=W+8;x+=8) g.lineTo(x, waveY(x,t));
      g.lineTo(W+8,H+4); g.lineTo(-4,H+4); g.closePath();
    }

    function drawWater(t){
      const W=w(), H=h();
      const gy1 = Math.max(SURF+50, BED + 26*S);
      g.fillStyle = ART.vgrad(g,0,SURF-4*S,gy1,
        [[0,SEA.water[0]],[0.30,SEA.water[1]],[0.68,SEA.water[2]],[1,SEA.water[3]]]);
      g.fillRect(-4,SURF-14*S,W+8,H-SURF+20*S);
       
      const lh = Math.min(120*S, (BED-SURF)*0.55);
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.42;
      g.fillStyle = ART.vgrad(g,0,SURF-2*S,SURF+lh,[al(SEA.surf,.85), al(SEA.surf,0)]);
      g.fillRect(-4,SURF-2*S,W+8,lh+4); g.restore();
       
      ART.sunRays(g, W, SURF-6*S, BED+18*S, SEA, t);
      ART.sunRays(g, W, SURF-6*S, BED*0.72+18*S, SEA, t*0.6+900);
       
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.16;
      g.fillStyle = ART.vgrad(g,0,SURF,BED,[al(SEA.ray,.85), al(SEA.ray,0)]);
      const sw0 = 24*S, sw1 = 96*S, sxx = SUNX + Math.sin(t*0.0003)*10*S*R;
      g.beginPath(); g.moveTo(sxx-sw0,SURF); g.lineTo(sxx+sw0,SURF);
      g.lineTo(sxx+sw1,BED); g.lineTo(sxx-sw1,BED); g.closePath(); g.fill();
      g.restore();
       
      if (R){
        g.save(); g.globalCompositeOperation='lighter'; g.strokeStyle=SEA.ray; g.lineCap='round';
        for (let i=0;i<4;i++){
          g.globalAlpha = .07 + 0.03*Math.sin(t*0.0016+i);
          g.lineWidth = (2.6 - i*0.4)*S;
          const yy = SURF + (10 + i*15)*S;
          g.beginPath();
          for (let x=-10;x<=W+10;x+=12){
            const y = yy + Math.sin(x*0.034 + t*0.0022 + i*1.7)*4.6*S;
            x===-10 ? g.moveTo(x,y) : g.lineTo(x,y);
          }
          g.stroke();
        }
        g.restore();
      }
    }

    function drawJelly(x,y,sc,ph,t,A){
      const bell = 13*sc, bh = 9.5*sc;
      const pulse = 1 + Math.sin(t*0.0022 + ph)*0.08*R;
      g.save(); g.translate(x,y);
       
      g.globalAlpha = A*0.72; g.strokeStyle = SEA.water[2];
      g.lineWidth = Math.max(1, 1.7*sc); g.lineCap='round';
      for (let k=-2;k<=2;k++){
        const bx = k*bell*0.30, sw = Math.sin(t*0.0016 + ph + k*0.8)*3.4*sc*R;
        g.beginPath(); g.moveTo(bx, bh*0.45);
        g.quadraticCurveTo(bx+sw, bh*1.9, bx+sw*1.7, bh*3.2);
        g.stroke();
      }
       
      g.globalAlpha = A;
      g.beginPath();
      g.ellipse(0,0,bell*pulse,bh/pulse,0,Math.PI,Math.PI*2);
      g.quadraticCurveTo(0, bh*0.95/pulse, -bell*pulse, 0);
      g.closePath();
      g.fillStyle = SEA.water[2]; g.fill();
       
      g.globalAlpha = A*0.85; g.strokeStyle = SEA.foam; g.lineWidth = Math.max(.8, 1.1*sc);
      g.beginPath(); g.ellipse(0,0,bell*pulse,bh/pulse,0,Math.PI*1.12,Math.PI*1.92); g.stroke();
      g.restore();
    }
     
    function drawMid(t){
      const W=w(), D=Math.max(50,BED-SURF);
      if (school2){
        const span = W+240;
        const bx = ((school2.b + t*0.009*school2.sp*R + cur*0.2) % span + span) % span - 120;
        g.save(); g.fillStyle = al(SEA.water[3], .25);
        for (let i=0;i<school2.f.length;i++){
          const q = school2.f[i];
          const x = bx + q.dx*S, y = SURF + D*school2.yf + q.dy*S + Math.sin(t*0.0015 + q.ph)*2.6*S*R;
          g.beginPath(); g.ellipse(x, y, 3.6*S, 1.6*S, 0, 0, 6.283); g.fill();
          g.beginPath(); g.moveTo(x-3*S,y); g.lineTo(x-6*S,y-1.7*S); g.lineTo(x-6*S,y+1.7*S); g.closePath(); g.fill();
        }
        g.restore();
      }
      for (let i=0;i<jellies.length;i++){
        const q = jellies[i], span = W+170;
        const x = ((q.x + t*0.0055*q.sp*R*q.d + cur*0.35) % span + span) % span - 85;
        const y = SURF + D*q.yf + Math.sin(t*0.0009 + q.ph)*11*S*R;
        drawJelly(x, y, q.s*S, q.ph, t, 0.20);
      }
    }

    function ridge(y0, amp, freq, ph, col, alpha){
      const W=w(), H=h();
      g.save(); g.globalAlpha = alpha;
      g.beginPath(); g.moveTo(-6,H+4);
      for (let x=-6;x<=W+20;x+=18){
        const y = y0 - Math.sin(x*freq+ph)*amp - Math.sin(x*freq*2.4+ph*1.8)*amp*0.38;
        g.lineTo(x,y);
      }
      g.lineTo(W+20,H+4); g.closePath();
      g.fillStyle = col; g.fill(); g.restore();
    }
    function drawDepth(t){
      const D = Math.max(50, BED-SURF);
      const c = ART.clamp;
      ridge(BED - c(D*0.40, 74*S, 250*S), c(D*0.10,20*S,52*S), 0.0048, cur*0.010,
            mix(SEA.water[1], SEA.foam, .22), .38);
      ridge(BED - c(D*0.26, 50*S, 165*S), c(D*0.075,16*S,40*S), 0.0068, 2.1 + cur*0.020,
            mix(SEA.water[2], SEA.rock, .34), .56);
      ridge(BED - c(D*0.14, 26*S, 92*S), c(D*0.05,12*S,28*S), 0.0096, 4.4 + cur*0.032,
            mix(SEA.water[3], SEA.rock, .20), .78);
    }

    function bedY(x){ return BED + Math.sin(x*0.021)*3.2*S; }
    function drawBed(t){
      const W=w(), H=h();
       
      g.beginPath(); g.moveTo(-6,H+4);
      for (let x=-6;x<=W+18;x+=14) g.lineTo(x, bedY(x));
      g.lineTo(W+18,H+4); g.closePath();
      g.fillStyle = ART.vgrad(g,0,BED-8*S,H,[SEA.sand, SEA.sandDark]); g.fill();
       
      g.save(); g.globalAlpha=.30; g.fillStyle = ART.vgrad(g,0,BED-8*S,H,[al(SEA.water[2],.15), al(SEA.water[3],.85)]);
      g.beginPath(); g.moveTo(-6,H+4);
      for (let x=-6;x<=W+18;x+=14) g.lineTo(x, bedY(x));
      g.lineTo(W+18,H+4); g.closePath(); g.fill(); g.restore();
       
      g.save(); g.globalAlpha=.45; g.strokeStyle = mix(SEA.sand,'#fff',.5); g.lineWidth=2*S;
      g.beginPath();
      for (let x=-6;x<=W+18;x+=14){ const y=bedY(x); x===-6?g.moveTo(x,y):g.lineTo(x,y); }
      g.stroke(); g.restore();
       
      if (R){
        g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.10;
        g.strokeStyle=SEA.ray; g.lineWidth=3*S; g.lineCap='round';
        for (let i=0;i<3;i++){
          g.beginPath();
          for (let x=-10;x<=W+10;x+=16){
            const y = bedY(x) + (6+i*7)*S + Math.sin(x*0.028 + t*0.0013 + i)*3*S;
            x===-10?g.moveTo(x,y):g.lineTo(x,y);
          }
          g.stroke();
        }
        g.restore();
      }
       
      for (let i=0;i<rocks.length;i++){
        const q = rocks[i], bx = q.x, by = bedY(bx)+2*S, rx = q.r, ry = q.r*q.f;
        ART.drop(g, bx+3*S, by+2*S, rx*1.25, ry*0.45, '#02202F', .40);
        g.beginPath();
        g.moveTo(bx-rx, by);
        g.quadraticCurveTo(bx-rx*0.75, by-ry*1.5, bx-rx*0.12*q.d, by-ry*1.42);
        g.quadraticCurveTo(bx+rx*0.62, by-ry*1.25, bx+rx, by);
        g.closePath();
        g.fillStyle = ART.vgrad(g,0,by-ry*1.5,by,[mix(SEA.rock,SEA.foam,.52), mix(SEA.rock,'#0A3348',.30)]);
        g.fill();
        g.save(); g.globalAlpha=.55; g.strokeStyle = mix(SEA.rock,'#F0FBFF',.80); g.lineWidth=1.8*S;
        g.beginPath(); g.moveTo(bx-rx*0.86, by-ry*0.30);
        g.quadraticCurveTo(bx-rx*0.62, by-ry*1.38, bx-rx*0.10*q.d, by-ry*1.34); g.stroke(); g.restore();
      }
       
      for (let i=0;i<weeds.length;i++){
        const q = weeds[i], bx=q.x, by=bedY(bx)+2*S;
        for (let k=-1;k<=1;k++){
          const hh = q.hh*(k===0?1:0.68), lean = k*5*S;
          const sw = Math.sin(t*0.0017 + q.ph + k)*9*S*R + lean;
          const wdt = 3.6*S*(k===0?1:0.75);
          g.save(); g.globalAlpha=.90;
          g.beginPath();
          g.moveTo(bx-wdt, by);
          g.quadraticCurveTo(bx+sw*0.45-wdt*0.4, by-hh*0.55, bx+sw, by-hh);
          g.quadraticCurveTo(bx+sw*0.45+wdt*0.6, by-hh*0.52, bx+wdt, by);
          g.closePath();
          g.fillStyle = ART.vgrad(g,0,by-hh,by,[mix(q.c,'#EAFBFF',.42), mix(q.c,'#08384A',.30)]);
          g.fill();
          g.globalAlpha=.42; g.strokeStyle = mix(q.c,'#FFFFFF',.65); g.lineWidth=1.1*S; g.lineCap='round';
          g.beginPath(); g.moveTo(bx-wdt*0.5, by-2*S);
          g.quadraticCurveTo(bx+sw*0.45-wdt*0.3, by-hh*0.55, bx+sw-wdt*0.15, by-hh*0.94); g.stroke();
          g.restore();
        }
      }
       
      for (let i=0;i<corals.length;i++){
        const q = corals[i], bx=q.x, by=bedY(bx)+2*S, cs=q.s*S;
        ART.drop(g, bx+2*S, by+2*S, 16*cs, 5*cs, '#02202F', .34);
        if (q.k){
           
          const sway = Math.sin(t*0.0012+q.ph)*0.10*R;
          for (let k=0;k<5;k++){
            const a = -Math.PI/2 + (k-2)*0.33 + sway;
            g.strokeStyle = k%2 ? q.c : mix(q.c,'#fff',.38);
            g.lineWidth = 4.0*cs; g.lineCap='round';
            g.beginPath(); g.moveTo(bx, by);
            g.quadraticCurveTo(bx+Math.cos(a)*11*cs, by-13*cs, bx+Math.cos(a)*21*cs, by+Math.sin(a)*21*cs-1*cs);
            g.stroke();
          }
          g.fillStyle = mix(q.c,'#fff',.62);
          for (let k=0;k<3;k++){ g.beginPath(); g.arc(bx+(k-1)*8*cs, by-21*cs+Math.abs(k-1)*4*cs, 2.4*cs, 0, 6.283); g.fill(); }
        } else {
           
          for (let k=0;k<3;k++){
            const ox = (k-1)*9*cs, oy = -(5+ (k===1?8:2))*cs, rr0 = (8 - Math.abs(k-1)*1.6)*cs;
            g.beginPath(); g.arc(bx+ox, by+oy, rr0, 0, 6.283);
            g.fillStyle = ART.vgrad(g,0,by+oy-rr0,by+oy+rr0,[mix(q.c,'#fff',.55), mix(q.c,'#164055',.22)]);
            g.fill();
            g.save(); g.globalAlpha=.70; g.fillStyle = mix(q.c,'#fff',.85);
            g.beginPath(); g.arc(bx+ox-rr0*0.32, by+oy-rr0*0.38, rr0*0.32, 0, 6.283); g.fill(); g.restore();
          }
        }
      }
    }

    function drawSnow(t){
      const W=w();
      g.save(); g.globalCompositeOperation='lighter';
      for (let i=0;i<snow.length;i++){
        const q = snow[i];
        const y = SURF + (((q.y - SURF) + t*0.004*q.sp*R) % Math.max(1,(BED-SURF)));
        const x = q.x + Math.sin(t*0.0007 + q.ph)*9*S*R;
        g.globalAlpha = .16 + 0.10*Math.sin(t*0.002 + q.ph);
        g.fillStyle = SEA.foam;
        g.beginPath(); g.arc(x, y, q.r, 0, 6.283); g.fill();
      }
      g.restore();
    }

    function drawSchool(t){
      if (!school) return;
      const W=w(), span=W+180;
      const bx = ((school.b + t*0.016*school.sp*R) % span + span) % span - 90;
      g.save(); g.globalAlpha=.20; g.fillStyle = mix(SEA.water[1], SEA.foam, .55);
      for (let i=0;i<school.f.length;i++){
        const q = school.f[i];
        const x = bx + q.dx*S, y = school.y + q.dy*S + Math.sin(t*0.0022 + q.ph)*3.4*S*R;
        g.beginPath(); g.ellipse(x, y, 4.4*S, 2.0*S, 0, 0, 6.283); g.fill();
        g.beginPath(); g.moveTo(x-3.6*S,y); g.lineTo(x-7*S,y-2*S); g.lineTo(x-7*S,y+2*S); g.closePath(); g.fill();
      }
      g.restore();
    }

    function drawFish(t){
      const W=w();
      for (let i=0;i<fishes.length;i++){
        const q = fishes[i];
        const span = W + 120;
        const x = ((q.b + t*0.022*q.sp*R*q.d) % span + span) % span - 60;
        const y = q.y + Math.sin(t*0.0018 + q.ph)*7*S*R;
        const fs = q.s, dir = q.d;
        g.save(); g.globalAlpha=.82; g.translate(x,y); g.scale(dir*fs, fs);
        const wag = Math.sin(t*0.012 + q.ph)*R;
        g.fillStyle = mix(q.c,'#08303F',.35);
        g.beginPath(); g.moveTo(-6,0); g.lineTo(-13,-5-wag*1.8); g.lineTo(-13,5-wag*1.8); g.closePath(); g.fill();
        g.beginPath(); g.ellipse(0,0,9,5.2,0,0,6.283);
        g.fillStyle = ART.vgrad(g,0,-6,6,[mix(q.c,'#fff',.42), mix(q.c,'#0B4A63',.30)]); g.fill();
        g.save(); g.globalAlpha=.55; g.fillStyle = mix(q.c,'#fff',.8);
        g.beginPath(); g.moveTo(1,-1.6); g.lineTo(-3.5,-7-wag); g.lineTo(4,-2); g.closePath(); g.fill(); g.restore();
        g.fillStyle='#0B1620'; g.beginPath(); g.arc(5,-1.2,1.3,0,6.283); g.fill();
        g.fillStyle='#fff'; g.beginPath(); g.arc(5.4,-1.7,.5,0,6.283); g.fill();
        g.restore();
      }
      g.globalAlpha=1;
    }

    function shellPath(x,y,r,ry,upper){
      g.beginPath();
      if (upper) g.ellipse(x,y,r,ry,0,Math.PI,Math.PI*2);
      else       g.ellipse(x,y,r,ry,0,0,Math.PI);
      g.closePath();
    }
    function drawOyster(o,t){
      const r = 25*S, ry = r*0.64, op = o.open;
       
      if (o.lx != null && Math.abs(o.lx - o.x) > 3){
        g.save(); g.globalAlpha=.55; g.strokeStyle=SEA.foam; g.lineWidth=1.2*S;
        g.setLineDash([4*S,4*S]);
        g.beginPath(); g.moveTo(o.lx, o.y - 30*S); g.lineTo(o.x, o.y - 16*S); g.stroke(); g.restore();
      }
      const lift = Math.max(0, BED - o.y);
      ART.drop(g, o.x + lift*0.06, bedY(o.x) + 3*S, r*(1.0 + lift/(260*S)), r*0.26, '#02202F',
               .42 * Math.max(0.25, 1 - lift/(120*S)));
      if (o.glow>0) ART.glow(g, o.x, o.y, r*(1.5 + (1-o.glow)*1.6), FX.goldLt, .55*o.glow);

      shellPath(o.x,o.y,r,ry,false);
      g.fillStyle = ART.vgrad(g,0,o.y,o.y+ry,[SEA.shell[1], mix(SEA.shell[1],'#7A5B33',.55)]); g.fill();
      g.save(); g.globalAlpha=.35; g.strokeStyle = mix(SEA.shell[0],'#fff',.6); g.lineWidth=1.6*S;
      shellPath(o.x,o.y,r*0.94,ry*0.9,false); g.stroke(); g.restore();
       
      g.save(); g.globalAlpha=.55; g.fillStyle = mix(SEA.shell[0],'#E7B9A6',.55);
      g.beginPath(); g.ellipse(o.x,o.y+ry*0.18,r*0.72,ry*0.48,0,0,Math.PI); g.fill(); g.restore();

      if (op>0.22){
        if (o.ok){
          const pr = 7.4*S;
          ART.glow(g, o.x, o.y+ry*0.28, pr*3.4, SEA.pearlGlow, .55*Math.min(1,op*1.6));
          g.beginPath(); g.arc(o.x, o.y+ry*0.28, pr, 0, 6.283);
          g.fillStyle = ART.rgrad(g, o.x-pr*0.35, o.y+ry*0.28-pr*0.4, pr*0.1, pr*1.25,
                                  [SEA.pearl, mix(SEA.pearl,'#D9C79A',.55)]);
          g.fill();
          g.save(); g.globalAlpha=.9; g.fillStyle='#fff';
          g.beginPath(); g.arc(o.x-pr*0.34, o.y+ry*0.28-pr*0.40, pr*0.26, 0, 6.283); g.fill(); g.restore();
        } else {
          const pr = 4.6*S;
          g.beginPath(); g.arc(o.x, o.y+ry*0.30, pr, 0, 6.283);
          g.fillStyle = ART.vgrad(g,0,o.y+ry*0.30-pr,o.y+ry*0.30+pr,[mix(SEA.rock,'#fff',.35), SEA.rock]);
          g.fill();
        }
      }

      g.save();
      g.translate(o.x - r, o.y); g.rotate(-op*1.05); g.translate(-(o.x - r), -o.y);
      shellPath(o.x,o.y,r,ry,true);
      g.fillStyle = ART.vgrad(g,0,o.y-ry,o.y,[mix(SEA.shell[0],'#fff',.40), SEA.shell[1]]); g.fill();
       
      g.save(); g.globalAlpha=.28; g.strokeStyle = mix(SEA.shell[1],'#6B4E2C',.6); g.lineWidth=1.3*S;
      for (let i=1;i<=4;i++){
        const a = Math.PI + i*(Math.PI/5);
        g.beginPath(); g.moveTo(o.x - r, o.y);
        g.lineTo(o.x + Math.cos(a)*r*0.97, o.y + Math.sin(a)*ry*0.97); g.stroke();
      }
      g.restore();
       
      g.save(); g.globalAlpha=.72; g.strokeStyle = mix(SEA.shell[0],'#FFFFFF',.75); g.lineWidth=2.1*S;
      g.beginPath(); g.ellipse(o.x,o.y,r*0.97,ry*0.95,0,Math.PI*1.08,Math.PI*1.78); g.stroke(); g.restore();
       
      g.save(); g.globalAlpha=.30; g.fillStyle='#3A2A14';
      g.beginPath(); g.ellipse(o.x - r*0.55, o.y - ry*0.10, r*0.34, ry*0.30, 0, Math.PI, Math.PI*2); g.fill(); g.restore();
       
      g.save(); g.globalAlpha = .55*(1-op); g.strokeStyle = mix(SEA.shell[1],'#5E421F',.7);
      g.lineWidth = 1.7*S; g.lineCap='round';
      g.beginPath(); g.moveTo(o.x - r*0.99, o.y); g.lineTo(o.x + r*0.99, o.y); g.stroke();
      g.globalAlpha = .45*(1-op); g.strokeStyle = mix(SEA.shell[0],'#FFFFFF',.8); g.lineWidth = 1.1*S;
      g.beginPath(); g.moveTo(o.x - r*0.95, o.y-1.4*S); g.lineTo(o.x + r*0.95, o.y-1.4*S); g.stroke();
      g.restore();
      g.restore();
      g.globalAlpha=1;
    }

    const BASK = [[0,3],[-3.2,2.2],[3.2,2.2],[-1.7,-0.8],[1.7,-0.8],[0,-3.6]];
    function drawDiver(t){
      const tilt = Math.max(-0.55, Math.min(0.55, dv.vx*0.07));
      if (dv.vx > 0.7) face = -1; else if (dv.vx < -0.7) face = 1;
      const DS = 1.34*S, sq = ART.clamp(dv.sq, 0.5, 1.4);
      g.save();
      g.translate(dv.x, dv.y);
      g.rotate(tilt*face);
      g.scale(face*DS/Math.sqrt(sq), DS*sq);

      ART.glow(g, 0, -4, 34, SEA.ray, .16);

      if (phase==='dive'){
        g.strokeStyle = al(SEA.rope,.9); g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(5,6); g.lineTo(11,20); g.stroke();
        ART.ellipse(g, 11.5, 25, 6.6, 5.0, 0.28);
        g.fillStyle = ART.vgrad(g,0,20,30,[mix(SEA.rock,'#DFF6FF',.42), mix(SEA.rock,'#08222F',.35)]);
        g.fill();
        g.save(); g.globalAlpha=.5; g.fillStyle='#EAFBFF';
        ART.ellipse(g, 9.6, 23.2, 2.2, 1.3, 0.3); g.fill(); g.restore();
      }

      ART.diver(g, 0, 0, 1, SEA, t, 1);

      g.fillStyle = teamHex; ART.rr(g, -8.6, -3.5, 17.2, 3.6, 1.7); g.fill();
      g.save(); g.globalAlpha=.5; g.fillStyle = mix(teamHex,'#fff',.6);
      ART.rr(g, -8.6, -3.5, 17.2, 1.4, .7); g.fill(); g.restore();

      g.save();
      g.strokeStyle = al(SEA.rope,.9); g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(-5,-13); g.lineTo(-12.5,-2); g.stroke();
      g.beginPath();
      g.moveTo(-19,-2); g.quadraticCurveTo(-12.5,13,-6,-2); g.closePath();
      g.fillStyle = ART.vgrad(g,0,-3,12,[mix(SEA.rope,'#fff',.30), mix(SEA.rope,'#5A3C14',.55)]); g.fill();
      g.globalAlpha=.35; g.strokeStyle='#4A2F10'; g.lineWidth=.8;
      for (let i=1;i<4;i++){ g.beginPath(); g.moveTo(-19+i*3.3,-2); g.lineTo(-12.5+ (i-2)*1.4, 10); g.stroke(); }
      g.globalAlpha=1;
      g.restore();
      if (got>0){
        const np = Math.min(6, got);
        for (let i=0;i<np;i++){
          const b = BASK[i];
          g.fillStyle = SEA.pearl;
          g.beginPath(); g.arc(-12.5 + b[0], 2 + b[1], 2.1, 0, 6.283); g.fill();
          g.save(); g.globalAlpha=.8; g.fillStyle='#fff';
          g.beginPath(); g.arc(-13.2 + b[0], 1.3 + b[1], .8, 0, 6.283); g.fill(); g.restore();
        }
      }
      g.restore();
      g.globalAlpha=1;
    }

    function drawShip(t){
      const DSH = 1.30*S;
      const sx = shipX(), wy = waveY(sx,t);
      const sy = wy - 3*S;
      const tilt = (waveY(sx+34*S,t) - waveY(sx-34*S,t)) / (68*S);
      const bob = Math.sin(t*0.0016)*2.2*DSH;
       
      g.save(); g.globalAlpha=.34; g.fillStyle = SEA.foam;
      ART.ellipse(g, sx, wy+2*S, 42*DSH, 4.4*DSH, 0); g.fill(); g.restore();
       
      ART.glow(g, sx+18*DSH, sy-26*DSH, 70*DSH, SEA.sunGlow, .22);
      g.save(); g.translate(sx, sy); g.rotate(tilt*0.55);
      ART.dhow(g, 0, 0, DSH, SEA, t, mix(SEA.sail, '#FFFFFF', .35));
       
      g.save(); g.scale(DSH,DSH);
      const bob2 = Math.sin(t*0.0016)*2.2; g.translate(0,bob2); g.rotate(Math.sin(t*0.0013)*0.035);
      g.globalAlpha=.75; g.strokeStyle = mix(SEA.sail,'#FFF6DA',.6); g.lineWidth=1.9; g.lineCap='round';
      g.beginPath(); g.moveTo(4,-54); g.quadraticCurveTo(-26-(6+Math.sin(t*0.0021)*2.4),-34,-20,-8); g.stroke();
      g.globalAlpha=.85; g.strokeStyle = mix(SEA.hull[0],'#FFE2A8',.62); g.lineWidth=2.0;
      g.beginPath(); g.moveTo(-34,-8); g.lineTo(34,-8); g.stroke();
      g.globalAlpha=.55; g.strokeStyle = al('#FFF1C8',.9); g.lineWidth=1.4;
      g.beginPath(); g.moveTo(34,-8); g.quadraticCurveTo(40,2,24,9); g.stroke();
       
      g.globalAlpha=1; g.fillStyle = teamHex; ART.rr(g,-30,-5.5,60,3.0,1.4); g.fill();
      g.restore();
      g.restore();
       
      if (R && Math.random()<0.05) fxp.burst(sx + ART.rnd(-34,34)*DSH, wy, 1,
        {col:SEA.foam, sp0:0.02, sp1:0.07, up:0.05, r0:1, r1:2.2, g:0.00030});
      return [sx - 12*DSH, sy + 7*DSH + bob];
    }

    function drawRope(ax, ay, t){
       
      const sag = Math.min(70*S, Math.abs(dv.x-ax)*0.34 + 8*S);
      const mx = (ax+dv.x)/2 + Math.sin(t*0.004 + dv.y*0.02)*6*S*R;
      const my = (ay+dv.y)/2 + sag;
      g.save();
      g.lineCap='round';
      g.globalAlpha=.32; g.strokeStyle='#04202F'; g.lineWidth=3.0*S;
      g.beginPath(); g.moveTo(ax,ay+1.2*S); g.quadraticCurveTo(mx,my+1.2*S,dv.x,dv.y); g.stroke();
      g.globalAlpha=.85; g.strokeStyle=mix(SEA.rope,'#8A6A34',.35); g.lineWidth=1.7*S;
      g.beginPath(); g.moveTo(ax,ay); g.quadraticCurveTo(mx,my,dv.x,dv.y); g.stroke();
      g.globalAlpha=.40; g.strokeStyle=mix(SEA.rope,'#fff',.6); g.lineWidth=.7*S;
      g.beginPath(); g.moveTo(ax,ay-.8*S); g.quadraticCurveTo(mx,my-.8*S,dv.x,dv.y-.5*S); g.stroke();
      g.restore();
    }

    function drawSurface(t){
      const W=w();
      g.save();
       
      g.globalAlpha=.55; g.strokeStyle = SEA.foam; g.lineWidth = 2.6*S; g.lineCap='round';
      g.beginPath();
      for (let x=-4;x<=W+8;x+=8){ const y=waveY(x,t); x===-4?g.moveTo(x,y):g.lineTo(x,y); }
      g.stroke();
      g.restore();
      ART.waves(g, W, SURF+5*S, SEA, t, 3.2*S*R+0.6, 0.0022, .30, 1.8*S);
      ART.waves(g, W, SURF+12*S, SEA, t, 2.4*S*R+0.4, -0.0016, .18, 1.3*S);
       
      g.save(); g.globalCompositeOperation='lighter';
      for (let i=0;i<7;i++){
        const yy = SURF + (3 + i*4.6)*S;
        const ww = (30 - i*2.6)*S*(1 + 0.35*Math.sin(t*0.003 + i*1.3));
        g.globalAlpha = (0.30 - i*0.033) * (0.7 + 0.3*Math.sin(t*0.004 + i));
        g.fillStyle = SEA.sunGlow;
        ART.ellipse(g, SUNX + Math.sin(t*0.0016+i)*4*S, yy, Math.max(3,ww), Math.max(0.9,1.5*S), 0); g.fill();
      }
      g.restore();
    }

    function drawParts(){
      g.save();
      for (let i=0;i<parts.length;i++){
        const p = parts[i];
        if (p.k==='bub'){ g.globalAlpha=0.55*p.l; g.strokeStyle=SEA.foam; g.lineWidth=1.2*S;
          g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.stroke();
          g.globalAlpha=0.35*p.l; g.fillStyle='#fff';
          g.beginPath(); g.arc(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.28,0,6.283); g.fill(); }
        else if (p.k==='sand'){ g.globalAlpha=0.75*p.l; g.fillStyle=SEA.sand;
          g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.fill(); }
        else if (p.k==='drop'){ g.globalAlpha=0.85*p.l; g.fillStyle=SEA.foam;
          g.beginPath(); g.arc(p.x,p.y,p.r*0.8,0,6.283); g.fill(); }
        else { g.globalAlpha=p.l; g.fillStyle=FX.goldLt;
          g.beginPath(); g.arc(p.x,p.y,p.r*p.l,0,6.283); g.fill(); }
      }
      g.restore();
    }

    function drawPearl(o,t){
      const pr = 8*S;
      ART.glow(g, o.x, o.y, pr*4.6, SEA.pearlGlow, .70);
      g.beginPath(); g.arc(o.x,o.y,pr,0,6.283);
      g.fillStyle = ART.rgrad(g, o.x-pr*0.36, o.y-pr*0.42, pr*0.08, pr*1.3,
                              [SEA.pearl, mix(SEA.pearl,'#CFB88B',.6)]);
      g.fill();
      g.save(); g.globalAlpha=.95; g.fillStyle='#fff';
      g.beginPath(); g.arc(o.x-pr*0.34,o.y-pr*0.40,pr*0.28,0,6.283); g.fill(); g.restore();
      g.save(); g.globalAlpha=.35; g.fillStyle=SEA.surf;
      g.beginPath(); g.arc(o.x+pr*0.30,o.y+pr*0.34,pr*0.30,0,6.283); g.fill(); g.restore();
    }

    ctx.raf(function(dtMs, t){
      if (dead) return;
      const d = Math.min(dtMs, 42)/16.667;
      const W = w(), H = h();

      cur  = (Math.sin(t*0.00022)*W*0.035 + Math.sin(t*0.00051)*W*0.012) * R;
      curV = (Math.cos(t*0.00022)*0.9 + Math.cos(t*0.00051)*0.4) * R;
      if (splash>0) splash = Math.max(0, splash - d*1.6);
      if (winFlash>0) winFlash = Math.max(0, winFlash - d*0.035);

      for (let i=0;i<oys.length;i++){
        const o = oys[i], n = oys.length;
        const base = (i+0.5)*W/n;
        const amp  = Math.min(W/(n*2.6), 74*S);
        o.x = base + Math.sin(t*0.00052*o.sp + o.ph)*amp*R + cur*0.6;
        o.x = Math.max(26*S, Math.min(W-26*S, o.x));
        o.y = BED - ((i%2) ? 66*S : 8*S) - Math.sin(t*0.0013 + o.ph)*4*S*R;
        o.open += (o.want - o.open) * Math.min(1, 0.12*d);
        if (o.glow>0) o.glow = Math.max(0, o.glow - 0.006*d);
        if (o.el){
          const lw = o.lw || 40;
          const lx = Math.max(lw, Math.min(W - lw, o.x));
          o.lx = lx;
          o.el.style.transform = 'translate(-50%,-50%) translate(' + lx.toFixed(1) + 'px,' + (o.y - 40*S).toFixed(1) + 'px)';
        }
      }

      if (phase==='dive' || phase==='pearl' || phase==='miss'){
        if (phase==='dive' && tx!=null){
          dv.vx += (tx - dv.x)*0.0045*d;
          dv.vy += (ty - dv.y)*0.0045*d;
        }
        dv.vy += 0.05*d;                        
        dv.vx += curV*0.35*d;                   
        const dp = Math.pow(0.87, d);
        dv.vx *= dp; dv.vy *= dp;
        dv.x += dv.vx*d; dv.y += dv.vy*d;
        dv.x = Math.max(20*S, Math.min(W-20*S, dv.x));
        dv.y = Math.max(SURF+10*S, Math.min(BED-4*S, dv.y));
      } else if (phase==='up'){
        const ay = SURF + 4*S;
        dv.vy += (ay - dv.y)*0.010*d;
        dv.vx += (shipX() - dv.x)*0.004*d;
        const dp = Math.pow(0.90, d);
        dv.vx *= dp; dv.vy *= dp;
        dv.x += dv.vx*d; dv.y += dv.vy*d;
        if (R && Math.random()<0.4*d) bubble(dv.x, dv.y);
        if (dv.y <= SURF + 8*S){
          splash = 26; burst(dv.x, SURF, R?12:3, 'drop');
          if (R) fxp.burst(dv.x, SURF, 14, {col:SEA.foam, sp0:0.05, sp1:0.26, up:0.20, r0:1.4, r1:4, g:0.00075});
          phase = 'done'; pT = 0;
        }
      }
      dv.sq += (1 - dv.sq)*Math.min(1, 0.10*d);

      if (phase==='dive'){
        oxy -= dtMs/oxyMs;
        bubT += dtMs;
        if (R && bubT > 150){ bubT = 0; bubble(dv.x - 12*S, dv.y - 6*S); }
        if (oxy <= 0){ oxy = 0; timeout(); }
        else if (tx != null){                  
          for (let i=0;i<oys.length;i++){
            const o = oys[i];
            const hw = Math.max(34, 32*S), hh = Math.max(36, 36*S);    
            const ex = (dv.x - o.x)/hw, ey = (dv.y - (o.y - 10*S))/hh;
            if (ex*ex + ey*ey < 1){ hit(o); break; }
          }
        }
      }
      const nw = Math.max(0, Math.round(oxy*100)) + '%';
      const nc = oxy < 0.3 ? 'linear-gradient(90deg,#F0930F,#FFD98A)' : 'linear-gradient(90deg,#2ED47A,#9BF5C4)';
      if (nw !== oxW){ oxW = nw; oxFl.style.width = nw; }
      if (nc !== oxC){ oxC = nc; oxFl.style.background = nc;
        oxFl.style.boxShadow = oxy<0.3 ? '0 0 10px rgba(255,176,32,.7)' : '0 0 10px rgba(46,212,122,.65)'; }

      pT += dtMs;
      if (phase==='pearl' && pearl){
        pearl.t = Math.min(1, pearl.t + d*0.035);
        const e = pearl.t*pearl.t;
        pearl.x += (dv.x - pearl.x)*e*0.28*d;
        pearl.y += ((dv.y+4*S) - pearl.y)*e*0.28*d;
        if (R && Math.random()<0.55*d) fxp.burst(pearl.x, pearl.y, 1,
          {col:FX.goldLt, sp0:0.01, sp1:0.05, r0:1.2, r1:3.2, g:0});
        if (Math.hypot(pearl.x-dv.x, pearl.y-dv.y) < 10*S || pT > 1500){
          burst(dv.x, dv.y, R?12:4, 'spark'); pearl = null; dv.sq = 0.72;
          phase = 'up'; pT = 0;
        }
      }
      if (phase==='miss'){
        if (rise){ rise.y -= 0.9*S*d; rise.a = Math.max(0, rise.a - 0.004*d); if (rise.y < SURF) rise = null; }
        if (pT > 1500){ phase='up'; pT = 0; }
      }
      if (phase==='done' && pT > 620){ newDive(); }

      stepParts(d);
      fxp.step(Math.min(dtMs,42));
      shake.step(dtMs);
      if (amb) amb.step(Math.min(dtMs,42)*(R?1:0.25), W, H, SURF+4*S);

      g.clearRect(0,0,W,H);
      g.save();
      shake.apply(g);

      drawSkyBand(t);

      g.save();
      seaPath(t,W,H);
      g.clip();
      drawWater(t);
      drawSchool(t);
      drawMid(t);
      drawDepth(t);
      drawBed(t);
      drawFish(t);
      drawSnow(t);
      if (amb) amb.draw(g);
      for (let i=0;i<oys.length;i++) if (i%2===1) drawOyster(oys[i],t);
      for (let i=0;i<oys.length;i++) if (i%2===0) drawOyster(oys[i],t);
      if (rise){ g.globalAlpha = rise.a; drawPearl(rise,t); g.globalAlpha = 1; }
      g.restore();

      drawSurface(t);
      const anchor = drawShip(t);
      if (phase!=='end'){
        drawRope(anchor[0], anchor[1], t);
        drawDiver(t);
      }
      if (pearl) drawPearl(pearl,t);
      drawParts();
      fxp.draw(g);
      if (splash>0){
        g.save(); g.globalAlpha=0.55*(splash/26); g.strokeStyle=SEA.foam; g.lineWidth=2.6*S;
        g.beginPath(); g.ellipse(dv.x, SURF, (26-splash)*2.4*S+6*S, ((26-splash)*0.7*S+3*S), 0, 0, 6.283);
        g.stroke(); g.restore();
      }
       
      if (winFlash>0){
        g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=0.18*winFlash;
        g.fillStyle=FX.goldLt; g.fillRect(0,0,W,H); g.restore();
      }
      ART.vignette(g, W, H, 0.34);
      g.restore();
    });

    if (!ITEMS.length){
      qEl.textContent = 'لا يوجد محتوى لهذه اللعبة.';
      ctx.after(400, function(){ ctx.finish(); });
    } else {
      layout();
      newDive();
      ctx.after(7000, function(){ hint.style.opacity = '0'; });
    }

    return { destroy(){
      dead = true;
      cv.removeEventListener('pointerdown', onDown);
      cv.removeEventListener('pointermove', onMove);
      cv.removeEventListener('pointerup', onUp);
      cv.removeEventListener('pointercancel', onUp);
      window.removeEventListener('pointerup', onUp);
      oys = []; parts = []; pearl = null; rise = null;
      rocks = []; corals = []; weeds = []; fishes = []; snow = []; school = null; school2 = null; jellies = []; amb = null;
      unframe();
      fxp.clear();
      ui.remove();
    } };
  }
});

SHIFT.content('map', { title:'أين تقع المحافظة؟', obj:'المحافظات',
  how:'يُذكر اسم المحافظة، وعلى الفريق أن يضغط موقعها على الخريطة.',
  order:['العاصمة','حولي','الفروانية','مبارك الكبير','الأحمدي','الجهراء'] });

const MAP_BLOCKED = true;

SHIFT.engine('map', {
  name:'خريطة بلادي', mins:2,
  mount(root, ctx){
    if(MAP_BLOCKED){
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center';

      </div>`;
      root.appendChild(box);
      return { destroy(){ box.remove(); } };
    }
    const C = ctx.content;
    const GOVS = {
      'الجهراء':      {d:'M30,70 L250,45 L268,96 L232,118 L196,146 L104,148 L52,214 Z', lx:112, ly:104},
      'العاصمة':      {d:'M232,118 L268,96 L288,146 L252,168 L208,156 L196,146 Z',       lx:246, ly:138},
      'حولي':         {d:'M252,168 L288,146 L295,206 L258,216 L234,192 Z',               lx:266, ly:186},
      'الفروانية':    {d:'M196,146 L208,156 L234,192 L258,216 L208,236 L162,206 L152,162 Z', lx:203, ly:192},
      'مبارك الكبير': {d:'M208,236 L258,216 L266,256 L218,270 Z',                        lx:236, ly:246},
      'الأحمدي':      {d:'M52,214 L104,148 L152,162 L162,206 L208,236 L218,270 L266,256 L292,292 L250,364 L64,362 Z', lx:158, ly:298}
    };
    const ISL = ['M276,52 L302,58 L306,96 L282,100 Z','M282,30 L300,32 L299,48 L283,46 Z','M300,120 L317,124 L313,138 L298,134 Z'];
    const order = ctx.shuffle(C.order);
    let idx = 0, locked = false;
    const state = {};

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0;padding:clamp(10px,2vw,18px);display:flex;gap:14px;overflow:auto;align-items:stretch';
    root.appendChild(wrap);

    function layout(){
      const wide = root.clientWidth > 700;
      wrap.style.flexDirection = wide ? 'row' : 'column';
      const mapBox = wrap.querySelector('#mapbox'), ask = wrap.querySelector('#askbox');
      if(mapBox && ask){
        mapBox.style.flex = wide ? '1.2' : '1';
        ask.style.flex = wide ? '.8' : '0 0 auto';
      }
    }

    function draw(){
      const target = order[idx];
      wrap.innerHTML = `
        <div id="mapbox" style="display:flex;flex-direction:column;min-width:0;min-height:0">
          <svg viewBox="0 0 340 390" style="width:100%;height:100%;max-height:100%;display:block;flex:1;min-height:180px" role="img" aria-label="خريطة تخطيطية لمحافظات الكويت">
            ${ISL.map(d=>`<path d="${d}" fill="var(--line-soft)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
            ${Object.entries(GOVS).map(([n,g])=>{
              const st = state[n];
              const fill = st==='ok' ? 'var(--pine)' : st==='no' ? 'var(--amber)' : 'var(--raised)';
              return `<path d="${g.d}" fill="${fill}" stroke="var(--surface)" stroke-width="2.5"
                data-gov="${ctx.esc(n)}" style="cursor:${st?'default':'pointer'};transition:fill .28s"/>`;}).join('')}
            ${Object.entries(GOVS).map(([n,g])=> state[n]
              ? `<text x="${g.lx}" y="${g.ly}" text-anchor="middle" font-size="11" font-weight="600"
                   fill="var(--surface)" font-family="Cairo,sans-serif" style="pointer-events:none">${ctx.esc(n)}</text>` : '').join('')}
          </svg>
          <p style="font-size:11.5px;color:var(--faint);margin:6px 0 0;line-height:1.55">خريطة تخطيطية للعرض التجريبي — تُستبدل بالخريطة الرسمية المعتمدة.</p>
        </div>
        <div id="askbox" style="background:var(--ground);border:1px solid var(--line);border-radius:11px;padding:clamp(14px,2.4vw,22px);display:flex;flex-direction:column;gap:8px;min-width:0">
          <div style="font-size:12.5px;color:var(--muted)">${idx+1} من ${order.length} · دور: <b>${ctx.esc(ctx.team().name)}</b></div>
          <p style="font-family:var(--font-display);font-size:clamp(19px,3vw,${ctx.proj?36:27}px);line-height:1.45;margin:0">
            أين تقع محافظة<br><b style="color:var(--accent-ink)">${ctx.esc(target)}</b>؟</p>
        </div>`;
      layout();
      wrap.querySelectorAll('[data-gov]').forEach(p => {
        if(state[p.dataset.gov]) return;
        p.onclick = () => hit(p.dataset.gov, target);
      });
    }

    function hit(picked, target){
      if(locked) return; locked = true;
      const ok = picked === target;
      state[target] = ok ? 'ok' : 'no';
      if(!ok) state[picked] = state[picked] || 'no';
      if(ok){ ctx.correct(10, {q:`موقع محافظة ${target}`, obj:C.obj, correct:target}); ctx.beep('good');
              ctx.say('good', `صحيح — <b>+10</b> لفريق ${ctx.esc(ctx.team().name.replace(/^فريق\s+/, ''))}`); }
      else  { ctx.wrong({q:`موقع محافظة ${target}`, obj:C.obj, correct:target}); ctx.beep('soft');
              ctx.say('soft', `هذه <b>${ctx.esc(picked)}</b> — ${ctx.esc(target)} مضاءة الآن على الخريطة`); }
      draw();
      ctx.after(1700, () => {
        locked = false; ctx.clearSay(); ctx.next(); idx++;
        if(idx >= order.length) ctx.finish(); else draw();
      });
    }

    const ro = new ResizeObserver(layout); ro.observe(root);
    draw();
    return { destroy(){ ro.disconnect(); wrap.remove(); } };
  }
});

(function(){
  const def = {
    name:'مطابقة وذاكرة', mins:2,
    mount(root, ctx){
      const C = ctx.content;
      const cards = [];
      C.pairs.forEach((p,i)=>{ cards.push({t:p[0],p:i},{t:p[1],p:i}); });
      const deck = ctx.shuffle(cards).map((c,i)=>({...c,id:i,up:false,done:false}));
      let first = null, locked = false;

      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;padding:clamp(12px,2.4vw,24px);display:grid;gap:10px;align-content:center;overflow:auto';
      root.appendChild(wrap);

      function cols(){
        const w = root.clientWidth;
        return w < 480 ? 2 : w < 820 ? 3 : 5;
      }
      function draw(){
        wrap.style.gridTemplateColumns = `repeat(${cols()},1fr)`;
        wrap.innerHTML = deck.map(c => `
          <button data-id="${c.id}" ${c.done||c.up?'disabled':''}
            style="perspective:700px;background:none;border:0;padding:0;min-height:${ctx.proj?110:82}px;aspect-ratio:1.3">
            <span style="display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;
              transition:transform var(--d-settle) var(--ease-settle);
              transform:rotateY(${c.up||c.done?'180deg':'0'})">
              <span style="position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--line);
                border-radius:11px;background:var(--raised);display:grid;place-items:center;
                font-family:var(--font-display);font-size:26px;color:var(--faint)">؟</span>
              <span style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);
                border:2px solid ${c.done?'var(--pine)':'var(--pine)'};border-radius:11px;
                background:${c.done?'var(--pine-soft)':'var(--surface)'};color:${c.done?'var(--pine-ink)':'var(--ink)'};
                display:grid;place-items:center;padding:9px;text-align:center;line-height:1.45;
                font-size:clamp(14px,1.8vw,${ctx.proj?20:15}px);font-weight:${c.done?'600':'400'}">${ctx.esc(c.t)}</span>
            </span></button>`).join('');
        wrap.querySelectorAll('button:not(:disabled)').forEach(b => b.onclick = () => pick(+b.dataset.id));
      }

      function pick(id){
        if(locked) return;
        const c = deck.find(x=>x.id===id); c.up = true; ctx.beep('pop'); draw();
        if(first === null){ first = id; return; }
        const f = deck.find(x=>x.id===first);
        locked = true;
        const ok = f.p === c.p;
        if(ok){
          f.done = c.done = true;
          ctx.correct(10, {q:`مطابقة: ${f.t}`, obj:C.obj, correct:C.pairs[f.p][1]});
          ctx.beep('good');
          ctx.say('good', `مطابقة صحيحة — <b>+10</b> لفريق ${ctx.esc(ctx.team().name.replace(/^فريق\s+/, ''))}`);    
        } else {
          ctx.wrong({q:`مطابقة: ${f.t}`, obj:C.obj, correct:C.pairs[f.p][1]});
          ctx.beep('soft');
          ctx.say('soft', `غير متطابقتين — تذكّروا مواضعهما، الدور ينتقل`);
        }
        draw();
        ctx.after(1450, () => {
          deck.forEach(x => { if(!x.done) x.up = false; });
          first = null; locked = false; ctx.clearSay();
          if(!ok) ctx.next();
          if(deck.every(x=>x.done)) ctx.finish(); else draw();
        });
      }

      const ro = new ResizeObserver(()=>{ wrap.style.gridTemplateColumns = `repeat(${cols()},1fr)`; });
      ro.observe(root);
      draw();
      return { destroy(){ ro.disconnect(); wrap.remove(); } };
    }
  };
  SHIFT.engine('match', def);
  SHIFT.engine('matchIsl', def);
})();

(function(){
  const def = {
    name:'سباق المعرفة', mins:3, motion:false,
    mount(root, ctx){
      const keys = ['أ','ب','ج','د'];
       
      const fromContract = id => {
        const L = (SHIFT.data && SHIFT.data.contracts || {})[id];
        if (!L) return null;
        const short = {}; (L.objectives || []).forEach(o => { short[o.code] = o.short || o.text || ''; });
         
        const CT = (typeof window !== 'undefined' && window.SHIFT && window.SHIFT.contract) || SHIFT.contract || null;
        const seed = CT && CT.seedOf ? CT.seedOf(id + ':' + Date.now()) : 0;
        const qs = CT && CT.orderQuestions ? CT.orderQuestions(L, seed) : (L.questions || []);
        return { title: L.title || '', obj: L.title || '',
          items: qs.map(q => ({ q: q.q, a: q.options || [], c: q.answer,
            obj: short[q.obj] || q.obj || '' })) };
      };
       
      const own = !!(ctx.content && Array.isArray(ctx.content.items) && ctx.content.items.length);
      const C = (!own && ctx.content && ctx.content.lesson_id && fromContract(ctx.content.lesson_id)) || ctx.content;
      let idx = 0, locked = false, left = 20, tHandle = null;

      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:clamp(14px,2.6vw,26px);overflow:auto';
      root.appendChild(wrap);

      function draw(){
        const it = C.items[idx];
        wrap.innerHTML = `
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)">
            <span>سؤال ${idx+1} من ${C.items.length}</span><span>·</span><span>${ctx.esc(it.obj)}</span>
            <span>·</span><span>دور: <b>${ctx.esc(ctx.team().name)}</b></span></div>
          <div style="height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden">
            <i id="tb" style="display:block;height:100%;background:var(--pine);width:100%;transition:width 1s linear"></i></div>
          <p style="font-family:var(--font-display);font-size:clamp(20px,3.4vw,${ctx.proj?42:31}px);line-height:1.5;margin:0;font-weight:500">${ctx.esc(it.q)}</p>
          <div id="ans" style="display:grid;gap:10px;grid-template-columns:1fr">${
            it.a.map((t,i)=>`<button data-i="${i}" style="padding:15px 17px;border:2px solid var(--line);background:var(--ground);border-radius:10px;font-size:clamp(15px,2.2vw,${ctx.proj?26:19}px);text-align:right;line-height:1.5;min-height:${ctx.proj?76:60}px;display:flex;align-items:center;gap:11px;color:var(--ink)">
              <span style="width:26px;height:26px;border-radius:6px;background:var(--raised);color:var(--muted);display:grid;place-items:center;font-size:14px;font-weight:600;flex:0 0 auto">${keys[i]}</span>${ctx.esc(t)}</button>`).join('')}
          </div>`;
        if(wrap.clientWidth > 600) wrap.querySelector('#ans').style.gridTemplateColumns = '1fr 1fr';

        left = 20;
        const bar = wrap.querySelector('#tb');
        clearInterval(tHandle);
        tHandle = setInterval(()=>{
          left--; if(bar){ bar.style.width = Math.max(0,left/20*100)+'%';
            if(left<=6) bar.style.background = 'var(--amber)'; }
          if(left<=0){ clearInterval(tHandle); answer(-1); }
        }, 1000);

        wrap.querySelectorAll('[data-i]').forEach(b => b.onclick = () => answer(+b.dataset.i));
      }

      function answer(chosen){
        if(locked) return; locked = true; clearInterval(tHandle);
        const it = C.items[idx], ok = chosen === it.c;
        const pts = ok ? 10 + Math.round(left/20*5) : 0;
        if(ok){ ctx.correct(pts, {q:it.q, obj:it.obj, correct:it.a[it.c]}); ctx.beep('good');
                ctx.say('good', `إجابة صحيحة — <b>+${pts}</b> نقطة لفريق ${ctx.esc(ctx.team().name.replace(/^فريق\s+/, ''))}`); }
        else  { ctx.wrong({q:it.q, obj:it.obj, correct:it.a[it.c]}); ctx.beep('soft');
                ctx.say('soft', `الإجابة الصحيحة: <b>${ctx.esc(it.a[it.c])}</b> — نكمل، الفرصة القادمة لكم`); }
        wrap.querySelectorAll('[data-i]').forEach(b => {
          b.disabled = true; const i = +b.dataset.i;
          if(i === it.c){ b.style.borderColor = 'var(--pine)'; b.style.background = 'var(--pine-soft)'; }
          else if(i === chosen){ b.style.borderColor = 'var(--amber)'; b.style.background = 'var(--amber-soft)'; }
        });
        ctx.after(1800, () => {
          locked = false; ctx.clearSay(); ctx.next(); idx++;
          if(idx >= C.items.length) ctx.finish(); else draw();
        });
      }

      draw();
      return { destroy(){ clearInterval(tHandle); wrap.remove(); } };
    }
  };
  SHIFT.engine('quiz', def);
  SHIFT.engine('quizGov', def);
  SHIFT.engine('quizIsl', def);
})();
