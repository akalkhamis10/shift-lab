        g.quadraticCurveTo(x0 + sc*(6 + rnd(i*3.3)*10), y0 + sc*(5 + rnd(i*5.1)*7),
                           x0 + sc*(14 + rnd(i*9.9)*16), y0 + sc*(2 + rnd(i*7.4)*14));
        g.stroke();
      }
      g.restore();
       
      g.globalAlpha = .16; g.fillStyle = LAND_D;
      for (let i=0;i<110;i++){

        g.fillRect(px, py, Math.max(1.1, sc*0.22), Math.max(1.1, sc*0.22));

      g.globalAlpha = .22; g.fillStyle = '#FFFFFF';
      for (let i=0;i<70;i++){
        const px = mx(-8 + rnd(i*4.7)*70), py = my(-2 + rnd(i*9.3)*106);
        g.fillRect(px, py, Math.max(1, sc*0.18), Math.max(1, sc*0.18));

    function mudHouse(x, baseY, w2, h2, seed){
      ART.drop(g, x + w2*0.55, baseY + h2*0.04, w2*0.95, h2*0.22, '#3A2410', .45);
       
      if (rnd(seed*5.1) > 0.45){
        const bw = w2*0.30, bh = h2*0.42, bx2 = x + w2*0.14;
        g.fillStyle = ART.vgrad(g, 0, baseY-h2-bh, baseY-h2, ['#F0D6AE','#C79A66']);
        ART.rr(g, bx2, baseY-h2-bh, bw, bh, Math.max(1, bw*0.14)); g.fill();
        g.fillStyle = A('#5C3D1C', .35);
        ART.rr(g, bx2, baseY-h2-bh, bw, bh*0.22, Math.max(1, bw*0.14)); g.fill();
      }
       
      const hr = Math.max(1.5, w2*0.09);
      g.fillStyle = ART.vgrad(g, 0, baseY-h2, baseY, ['#F2DCB8','#C79A66','#A87B4E']);
      ART.rr(g, x, baseY-h2, w2, h2, hr); g.fill();
       
      ART.rr(g, x, baseY-h2, w2, h2, hr);
      ART.shade(g, baseY-h2*0.55, baseY, A('#5A3A16',0), A('#43290F',.42));
       
      g.save(); ART.rr(g, x, baseY-h2, w2, h2, hr); g.clip();
      g.translate(-w2*0.07, -h2*0.06); ART.rr(g, x, baseY-h2, w2, h2, hr);
      ART.rim(g, null, A(CREAM,.55), Math.max(1.2, w2*0.11), .80); g.restore();
       
      g.fillStyle = A('#FFF6E2', .70);
      ART.rr(g, x, baseY-h2, w2, Math.max(1.6, h2*0.13), Math.max(1, w2*0.07)); g.fill();
       
      g.fillStyle = A('#7A5225', .22);
      ART.rr(g, x + w2*0.72, baseY-h2, w2*0.28, h2, Math.max(1.5, w2*0.09)); g.fill();
       
      g.fillStyle = A('#6B4622', .55);
      ART.rr(g, x + w2*0.16, baseY - h2*0.45, w2*0.20, h2*0.45, Math.max(1, w2*0.06)); g.fill();
      g.fillStyle = A('#FFDD9E', .92);
      ART.rr(g, x + w2*0.50, baseY - h2*0.62, w2*0.17, h2*0.20, Math.max(1, w2*0.05)); g.fill();
      ART.glow(g, x + w2*0.585, baseY - h2*0.52, Math.max(4, w2*0.42), '#FFDD9E', .22);
    }

    function decor(t){
      const wind = RED ? 0 : 0.20 + 0.16*Math.sin(t*0.0011);
       
      HOUSES.forEach((hs, i) => {
        const bx = mx(hs[0]), by = my(hs[1]);

          g.fillRect(-0.20*ts, -hgt-2.4*ts, 0.40*ts, 2.4*ts);

      PALMS.forEach((p, i) => {

    function port(t){
      const x = mx(C.port.x), y = my(C.port.y);
      const r = Math.max(4, sc*0.7);
      ART.glow(g, x, y, r*7, FX.goldLt, .30 + (RED?0:0.10*Math.sin(t*0.003)));
       
      g.save();
      g.fillStyle = ART.vgrad(g, 0, y-r, y+r*1.6, [MIX(DES.trunk,'#fff',.30), DES.trunk]);
      ART.rr(g, x - r*3.4, y - r*0.55, r*4.6, r*1.1, r*0.5); g.fill();
      g.fillStyle = A('#2B1B0C', .35);
      for (let i=0;i<4;i++) g.fillRect(x - r*3.0 + i*r*1.05, y - r*0.5, Math.max(1, r*0.16), r*1.0);
      g.restore();
       
      const ps = Math.max(0.15, sc*0.032);
      [[-2.70,-0.05,-0.08], [-1.45,0.10,0.12]].forEach((q2, i) => {
        const fx2 = x + r*q2[0], fy2 = y + r*q2[1];

        ART.person(g, fx2, fy2, ps, i ? CREW_B : CREW_A, {lean:q2[2]});
      });
       
      g.fillStyle = ART.rgrad(g, x, y, 0, r*1.9, [FX.goldLt, GOLD]);
      g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
      g.strokeStyle = A(CREAM,.75); g.lineWidth = Math.max(1, r*0.22); g.stroke();
      if (!RED){
        const pl = (t*0.00055) % 1;
        g.save(); g.globalAlpha = (1-pl)*0.45; g.strokeStyle = FX.goldLt;
        g.lineWidth = Math.max(1.4, r*0.35);
        g.beginPath(); g.arc(x, y, r + pl*r*5, 0, 6.2832); g.stroke(); g.restore();
      }
    }

    const rad = is => Math.max(is.r*sc, PRJ ? 15 : 11);
     
    function blob(is, k){
      const cx = mx(is.x), cy = my(is.y), r = rad(is);
      const P = [];
      for (let i=0;i<NB;i++){
        const a = i/NB*6.2832, rr = r*is._b[i];
        P.push([cx + Math.cos(a)*rr*is.sx*k, cy + Math.sin(a)*rr*is.sy*k]);
      }
      g.beginPath();
      g.moveTo((P[NB-1][0]+P[0][0])/2, (P[NB-1][1]+P[0][1])/2);
      for (let i=0;i<NB;i++){
        const n = P[(i+1)%NB];
        g.quadraticCurveTo(P[i][0], P[i][1], (P[i][0]+n[0])/2, (P[i][1]+n[1])/2);
      }
      g.closePath();
      return {cx, cy, r};
    }
    function islandArt(is, q, t){
      const u = Math.max(q.r*0.42, 6);
      const wind = RED ? 0 : 0.18 + 0.16*Math.sin(t*0.0012 + is.seed);
      if (is.art === 'palms'){
        const n = q.r > 24 ? 6 : 3;
        const list = [];
        for (let i=0;i<n;i++){
          const ang = (i/n)*6.2832 + is.seed*0.7;
          const spread = 0.34 + rnd(is.seed+i*4.4)*0.30;
          list.push({
            x: q.cx + Math.cos(ang)*q.r*is.sx*spread*1.25,
            y: q.cy + Math.sin(ang)*q.r*is.sy*spread*0.85 + q.r*0.20,
            s: Math.min(0.60, Math.max(0.26, q.r*0.021)) * (0.82 + rnd(is.seed+i*2.7)*0.40)
          });
        }
        list.sort((a2,b2)=>a2.y-b2.y).forEach(pl => {
          ART.drop(g, pl.x + pl.s*6, pl.y + pl.s*1.6, pl.s*11, pl.s*3.6, '#3A2410', .40);
          ART.palm(g, pl.x, pl.y, pl.s, PALPAL, wind);
        });
      } else if (is.art === 'ruins'){
         
        const base = q.cy + u*0.55;
        g.save();
        g.fillStyle = A('#3A2410', .30);
        ART.rr(g, q.cx-u*1.5, base-u*0.16, u*3.0, u*0.42, u*0.2); g.fill();
        for (let i=0;i<4;i++){
          const bx = q.cx + (i-1.5)*u*0.78;
          const hgt = u*(0.85 + 0.5*rnd(is.seed+i));
          ART.drop(g, bx + u*0.28, base, u*0.55, u*0.18, '#3A2410', .5);
          g.fillStyle = ART.vgrad(g, 0, base-hgt, base, ['#EFE3CB','#A98F6B']);
          ART.rr(g, bx-u*0.20, base-hgt, u*0.40, hgt, u*0.10); g.fill();
          g.fillStyle = A('#FFFFFF',.55);
          ART.rr(g, bx-u*0.20, base-hgt, u*0.13, hgt, u*0.07); g.fill();
          g.fillStyle = ART.vgrad(g, 0, base-hgt-u*0.22, base-hgt, ['#F7EFDD','#C9B492']);
          ART.rr(g, bx-u*0.32, base-hgt-u*0.22, u*0.64, u*0.24, u*0.08); g.fill();
        }
         
        g.fillStyle = ART.vgrad(g, 0, base-u*0.16, base+u*0.16, ['#E8D9BE','#9E8462']);
        ART.rr(g, q.cx-u*1.55, base-u*0.10, u*3.1, u*0.30, u*0.12); g.fill();
        g.restore();
      } else {
         
        for (let i=0;i<3;i++){
          const rx = q.cx + (rnd(is.seed+i*3.1)-0.5)*q.r*0.85;
          const ry = q.cy + (rnd(is.seed+i*5.9)-0.5)*q.r*0.55;
          const rr2 = q.r*(0.20 + rnd(is.seed+i*7.7)*0.20);
          ART.drop(g, rx + rr2*0.55, ry + rr2*0.62, rr2*1.35, rr2*0.55, '#3A2410', .55);
          ART.ellipse(g, rx, ry, rr2, rr2*0.82, 0);
          g.fillStyle = ART.vgrad(g, 0, ry-rr2, ry+rr2*0.9,
            [MIX(SEA.rock,'#EAF2F5',.60), SEA.rock, MIX(SEA.rock,'#1B2A33',.55)]); g.fill();
          ART.ellipse(g, rx - rr2*0.30, ry - rr2*0.32, rr2*0.46, rr2*0.26, -0.5);
          g.fillStyle = A('#F2F8FA', .55); g.fill();
        }
         
        const s = Math.max(0.26, q.r*0.034);
        ART.palm(g, q.cx - q.r*0.28, q.cy + q.r*0.36, s, PALPAL, wind);
      }
    }
    function island(is, t){
      const q = blob(is, 1);
      const ry = q.r*is.sy;
       
      g.save();
      for (let i=4;i>=1;i--){
        blob(is, 1 + i*0.13);
        g.fillStyle = A(SEA.surf, .085);
        g.fill();
      }
       
      blob(is, 1.06);
      g.lineWidth = Math.max(1.6, sc*0.34); g.strokeStyle = A(SEA.foam, .55); g.stroke();
       
      g.save(); g.translate(sc*0.45, sc*0.7);
      blob(is, 1); g.fillStyle = A('#02121F', .40); g.fill(); g.restore();
       
      blob(is, 1);
      g.fillStyle = ART.vgrad(g, 0, q.cy - ry, q.cy + ry,
        [is._flash > 0 ? MIX(LAND_L, FX.goldLt, Math.min(1,is._flash)) : LAND_L, SEA.sand, LAND_D]);
      g.fill();
       
      const ig = g.createLinearGradient(q.cx - q.r*is.sx, q.cy - ry, q.cx + q.r*is.sx, q.cy + ry);
      ig.addColorStop(0,   A(CREAM, .95));
      ig.addColorStop(.50, A(MIX(SEA.sand,'#FFFFFF',.62), .60));
      ig.addColorStop(1,   A(LAND_D, .34));
      blob(is, 1);
      g.lineWidth = Math.max(2, sc*0.45); g.strokeStyle = ig; g.stroke();
       
      g.save(); blob(is, 1); g.clip();
      g.translate(q.r*is.sx*0.20, ry*0.18); blob(is, 0.99);
      ART.shade(g, q.cy - ry*0.35, q.cy + ry*1.05, A('#8A6234',0), A('#5E3E16',.46));
      g.restore();
       
      g.save(); blob(is, 1); g.clip();
      g.translate(-q.r*is.sx*0.09, -ry*0.10); blob(is, 0.995);
      ART.rim(g, null, A(CREAM, .55), Math.max(1.6, sc*0.58), .88);
      g.restore();
       
      g.save(); blob(is, 1); g.clip();
      g.fillStyle = ART.rgrad(g, q.cx - q.r*0.35, q.cy - ry*0.42, q.r*0.10, q.r*1.7,
        [A('#FFF3D6',.50), A('#FFF3D6',0)]);
      g.fillRect(q.cx-q.r*2.5, q.cy-ry*2.5, q.r*5, ry*5);
      g.fillStyle = ART.rgrad(g, q.cx + q.r*0.45, q.cy + ry*0.50, q.r*0.10, q.r*1.5,
        [A('#8A6234',.32), A('#8A6234',0)]);
      g.fillRect(q.cx-q.r*2.5, q.cy-ry*2.5, q.r*5, ry*5);
      g.restore();
      g.restore();

      g.save(); blob(is, 1.02); g.clip(); islandArt(is, q, t); g.restore();

      if (is._glow > 0){
        g.save();
        ART.glow(g, q.cx, q.cy, q.r*3.2, FX.goldLt, is._glow*0.55);
        g.strokeStyle = GOLD; g.lineWidth = Math.max(2, sc*0.5);
        for (let i=0;i<3;i++){
          const p = Math.min(1, (1 - is._glow) * 1.4 + i*0.22);
          if (p <= 0 || p >= 1) continue;
          g.globalAlpha = (1-p) * 0.65;
          const rr2 = q.r + p*q.r*2.4;
          g.beginPath(); g.ellipse(q.cx, q.cy, rr2*is.sx, rr2*is.sy, 0, 0, 6.2832); g.stroke();
        }
        g.restore();
      }
       
      if (is._found){
        const s = Math.max(1.4, sc*0.30), fx = q.cx + q.r*is.sx*0.34, fy = q.cy - ry*0.34;
        g.save();
        g.strokeStyle = MIX(DES.trunk,'#fff',.2); g.lineWidth = Math.max(1.2, s*0.55);
        g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx, fy - s*7); g.stroke();
        g.fillStyle = GOLD;
        g.beginPath(); g.moveTo(fx, fy - s*7); g.lineTo(fx + s*4.6, fy - s*5.6);
        g.lineTo(fx, fy - s*4.2); g.closePath(); g.fill();
        g.restore();
      }
       
      if (state === 'aim' && !is._found){
        const pl  = RED ? 0.5 : 0.5 + 0.5*Math.sin(t*0.0034 + is.seed);
        const fav = Math.cos(Math.atan2(is.y-ship.y, is.x-ship.x) - windA) > 0.3;
        const col = fav ? GOLD : SEA.pearlGlow;
        ART.glow(g, q.cx, q.cy, q.r*(2.3 + pl*0.6), col, (fav?0.30:0.16) + pl*0.12);
        const rr2 = q.r + Math.max(5, sc*1.1) + pl*Math.max(4, sc*1.3);
        g.save();
        g.globalAlpha = (fav ? 0.55 : 0.32) * (0.55 + (1-pl)*0.45);
        g.strokeStyle = col; g.lineWidth = Math.max(1.8, sc*(fav?0.45:0.33));
        g.setLineDash([Math.max(4, sc*1.1), Math.max(4, sc*1.1)]);
        g.lineDashOffset = -t*0.012;
        g.beginPath(); g.ellipse(q.cx, q.cy, rr2*is.sx, rr2*is.sy, 0, 0, 6.2832); g.stroke();
        g.setLineDash([]);
        g.restore();
      }
    }

    function drawTrails(){
      g.save(); g.lineCap='round'; g.lineJoin='round';
      trails.forEach((tr, i) => {
        if (tr.length < 2) return;
        const cur = (i === trails.length-1);
        g.globalAlpha = cur ? .55 : .22;
        g.strokeStyle = cur ? FX.goldLt : A(SEA.foam, .8);
        g.lineWidth = Math.max(1.4, sc*(cur ? 0.30 : 0.20));
        g.beginPath();
        tr.forEach((p,j) => j ? g.lineTo(mx(p.x), my(p.y)) : g.moveTo(mx(p.x), my(p.y)));
        g.stroke();
      });
      g.restore();
    }
    function drawPlan(t){
      if (!path || (state !== 'sail' && state !== 'plot')) return;
      g.save(); g.globalAlpha = .55; g.strokeStyle = A(CREAM,.9);
      g.lineWidth = Math.max(1.6, sc*0.28); g.lineCap='round';
      g.setLineDash([Math.max(5, sc*1.3), Math.max(5, sc*1.3)]);
      g.lineDashOffset = -t*0.02;
      g.beginPath();
      let started = false;
      for (let i=0;i<path.length;i++){
        if (path[i].d < pathD) continue;
        const px = mx(path[i].x), py = my(path[i].y);
        started ? g.lineTo(px,py) : (g.moveTo(px,py), started = true);
      }
      g.stroke(); g.setLineDash([]); g.restore();
    }

    const BOOM_PIVOT_X = 190, BOOM_PIVOT_Y = 215;       
    const BOOM_W = 400, BOOM_H = 240, BOOM_VIS = 183;   
    let faceLeft = false;    
    const DHOW_VIS = 80, DHOW_KEEL = 9;                 
    function drawBoom(t){
      const s  = Math.max(sc*0.200, PRJ ? 0.78 : 0.56);
      const x  = mx(ship.x), y = my(ship.y);
      const L  = 34*s;
       
      if (!RED && (state === 'sail')){
        g.save(); g.globalAlpha = .5; g.fillStyle = SEA.foam;
        for (let i=0;i<3;i++){
          const k = 1 - i*0.28;
          ART.ellipse(g, x - Math.cos(ship.a)*L*0.5*i*0.5, y - Math.sin(ship.a)*L*0.5*i*0.5,
                      L*0.85*k, L*0.30*k, ship.a);
          g.globalAlpha = .18*k; g.fill();
        }
        g.restore();
      }
       
      ART.drop(g, x + sc*0.4, y + L*0.28, L*0.95, L*0.34, '#02121F', .42);
       
      const img = window.SHIFT && SHIFT.art && SHIFT.art.boom;
      if (img && img.complete && img.naturalWidth){
         
        const ca = Math.cos(ship.a);
        if (ca < -0.15) faceLeft = true; else if (ca > 0.15) faceLeft = false;
        g.save();
        g.translate(x, y);
        if (faceLeft) g.scale(-1, 1);                       
        g.rotate((faceLeft ? -1 : 1) * ship.heel * 0.10);
        g.scale(1, Math.max(0.80, 1 - Math.abs(ship.heel)*0.18));
         
        if (!RED){ g.translate(0, Math.sin(t*0.0016)*2.2*s); g.rotate(Math.sin(t*0.0013)*0.035); }
        const k = (DHOW_VIS * s) / BOOM_VIS;
        g.translate(0, DHOW_KEEL * s);                      
        g.drawImage(img, -BOOM_PIVOT_X*k, -BOOM_PIVOT_Y*k, BOOM_W*k, BOOM_H*k);
        g.restore();
      }
       
      if (state === 'arrive' || state === 'end'){
        const p = Math.min(1, stateT/520);
        g.save();
        g.globalAlpha = 1 - p*0.4; g.strokeStyle = A(CREAM,.8);
        g.lineWidth = Math.max(1.6, s*2.0); g.lineCap='round';
        const axp = mx(ship.x), ayp = my(ship.y) + ease(p)*L*0.9;
        g.beginPath(); g.moveTo(mx(ship.x), my(ship.y)); g.lineTo(axp, ayp); g.stroke();
        g.strokeStyle = GOLD;
        g.beginPath(); g.arc(axp, ayp + s*5, s*5.5, 0.25, Math.PI - 0.25); g.stroke();
        g.beginPath(); g.moveTo(axp - s*5, ayp); g.lineTo(axp + s*5, ayp); g.stroke();
        g.restore();
      }
    }

    function drawBirds(t, dt){
      if (RED) return;
      const bL = chL - 4, bR = chL + chW/sc + 4;
      birds.forEach(b => {
        b.x += b.d * b.s * dt * 0.0055;
        if (b.x > bR) b.x = bL; if (b.x < bL) b.x = bR;
        const fl = Math.sin(t*0.006 + b.ph) * 0.55;
        const px = mx(b.x), py = my(b.y + Math.sin(t*0.0011 + b.ph)*1.2);
        const u  = Math.max(4.6, sc*0.95) * b.s;
        g.save();
        g.globalAlpha = .16; g.fillStyle = '#02121F';
        ART.ellipse(g, px + u*0.5, py + u*1.7, u*0.9, u*0.28, 0); g.fill();
        g.globalAlpha = .95;
        g.fillStyle = CREAM;
        g.beginPath();
        g.moveTo(px - u*1.5, py + fl*u*0.9);
        g.quadraticCurveTo(px - u*0.6, py - u*0.55, px, py);
        g.quadraticCurveTo(px + u*0.6, py - u*0.55, px + u*1.5, py + fl*u*0.9);
        g.quadraticCurveTo(px + u*0.6, py - u*0.15, px, py + u*0.30);
        g.quadraticCurveTo(px - u*0.6, py - u*0.15, px - u*1.5, py + fl*u*0.9);
        g.closePath(); g.fill();
        g.globalAlpha = .55; g.fillStyle = '#8FA6B2';
        g.beginPath();
        g.moveTo(px, py + u*0.28); g.quadraticCurveTo(px + u*0.7, py + u*0.05, px + u*1.45, py + fl*u*0.88);
        g.quadraticCurveTo(px + u*0.6, py - u*0.05, px, py + u*0.28); g.closePath(); g.fill();
        g.restore();
      });
    }

    function drawFx(dt){
      g.save();
      for (let i=wake.length-1;i>=0;i--){
        const p = wake[i]; p.l -= dt*0.0011; p.r += dt*0.006;
        if (p.l <= 0){ wake.splice(i,1); continue; }
        g.globalAlpha = p.l*0.42; g.strokeStyle = SEA.foam;
        g.lineWidth = Math.max(1.2, sc*0.22);
        g.beginPath(); g.arc(mx(p.x), my(p.y), Math.max(2, p.r*sc*0.3), 0, 6.2832); g.stroke();
      }
      for (let i=ripples.length-1;i>=0;i--){
        const p = ripples[i]; p.l -= dt*0.0022;
        if (p.l <= 0){ ripples.splice(i,1); continue; }
        g.globalAlpha = p.l*0.55; g.strokeStyle = SEA.foam;
        g.lineWidth = Math.max(1.4, sc*0.26);
        g.beginPath(); g.arc(mx(p.x), my(p.y), (1-p.l)*Math.max(24, sc*9), 0, 6.2832); g.stroke();
      }
      g.restore();
    }

    function drawRose(t){
      const R = rose();
      ART.drop(g, R.x, R.y + R.r*0.55, R.r*1.25, R.r*0.45, '#02121F', .5);
       
      g.save();
      g.fillStyle = ART.rgrad(g, R.x - R.r*0.35, R.y - R.r*0.42, R.r*0.06, R.r*1.25,
        ['#FFF8E4', '#F0D9A6', '#C9A05A']);
      g.beginPath(); g.arc(R.x, R.y, R.r, 0, 6.2832); g.fill();
      g.strokeStyle = A('#6E4A1C', .55); g.lineWidth = Math.max(1.4, R.r*0.07); g.stroke();
      g.strokeStyle = A('#FFFFFF', .6); g.lineWidth = Math.max(1, R.r*0.04);
      g.beginPath(); g.arc(R.x, R.y, R.r*0.86, 0, 6.2832); g.stroke();
       
      for (let i=0;i<8;i++){
        const a2 = i*0.7854, lng = (i%2===0) ? R.r*0.78 : R.r*0.50;
        const px = R.x + Math.cos(a2)*lng, py = R.y + Math.sin(a2)*lng;
        const nx = -Math.sin(a2)*R.r*0.11, ny = Math.cos(a2)*R.r*0.11;
        g.beginPath(); g.moveTo(px, py);
        g.lineTo(R.x + nx, R.y + ny); g.lineTo(R.x - nx, R.y - ny); g.closePath();
        g.fillStyle = (i%2===0) ? A(FRAME,.80) : A('#8A6A38',.55); g.fill();
      }
       
      const ax = Math.cos(windA), ay = Math.sin(windA);
      g.save(); g.globalCompositeOperation='source-over';
      g.strokeStyle = '#B4342B'; g.lineWidth = Math.max(2.2, R.r*0.11); g.lineCap='round';
      g.beginPath(); g.moveTo(R.x - ax*R.r*0.60, R.y - ay*R.r*0.60);
      g.lineTo(R.x + ax*R.r*0.42, R.y + ay*R.r*0.42); g.stroke();
      const px2 = -ay, py2 = ax;
      g.fillStyle = '#D6483A';
      g.beginPath();
      g.moveTo(R.x + ax*R.r*0.84, R.y + ay*R.r*0.84);
      g.lineTo(R.x + (ax*0.36 + px2*0.24)*R.r, R.y + (ay*0.36 + py2*0.24)*R.r);
      g.lineTo(R.x + (ax*0.36 - px2*0.24)*R.r, R.y + (ay*0.36 - py2*0.24)*R.r);
      g.closePath(); g.fill();
      g.restore();
      g.fillStyle = '#5C3D17'; g.beginPath(); g.arc(R.x, R.y, R.r*0.09, 0, 6.2832); g.fill();
      g.restore();
      ART.glow(g, R.x, R.y, R.r*1.7, FX.goldLt, .16);
    }

    function frame(){
      const c = chart();
      g.save();
      chartPath(); g.lineWidth = Math.max(6, sc*0.9);
      g.strokeStyle = ART.vgrad(g, 0, c.y, c.y+c.h, [MIX(FRAME,'#FFFFFF',.18), FRAME]); g.stroke();
      chartPath(); g.lineWidth = Math.max(1.4, sc*0.16); g.strokeStyle = A(GOLD,.60); g.stroke();
      chartPath(Math.max(5, sc*0.75)); g.lineWidth = Math.max(1, sc*0.10);
      g.strokeStyle = A(GOLD,.30); g.stroke();
       
      const k = Math.max(9, sc*1.5);
      [[c.x,c.y,1,1],[c.x+c.w,c.y,-1,1],[c.x,c.y+c.h,1,-1],[c.x+c.w,c.y+c.h,-1,-1]].forEach(([qx,qy,dx,dy])=>{
        g.save(); g.translate(qx,qy); g.globalAlpha=.75;
        g.strokeStyle = GOLD; g.lineWidth = Math.max(1.4, sc*0.18); g.lineCap='round';
        g.beginPath(); g.moveTo(dx*k*0.55, dy*k*1.8); g.lineTo(dx*k*0.55, dy*k*0.55);
        g.lineTo(dx*k*1.8, dy*k*0.55); g.stroke();
        g.restore();
      });
      g.restore();
    }

    updateLog();
    newRound();
    ctx.sync();
    let lastA = ship.a;

    ctx.raf((dt, t) => {
      dt = Math.min(dt, 48);
      stateT += dt;
      if (!RED) windA += dt*0.00016 + Math.sin(t*0.00013)*dt*0.00012;

      C.items.forEach(is => {
        if (is._glow > 0) is._glow = Math.max(0, is._glow - dt*0.0011);
        if (is._flash > 0) is._flash = Math.max(0, is._flash - dt*0.0007);
      });

      if (state === 'plot'){
        let d = ship.aim - ship.a;
        while (d > Math.PI) d -= 6.2832; while (d < -Math.PI) d += 6.2832;
        ship.a += d * Math.min(1, dt*0.009);
        ship.heel = Math.max(-1, Math.min(1, d*0.8));
        if (stateT > (RED ? 60 : 480)){ state='sail'; stateT=0; lastA = ship.a; }
      }

      if (state === 'sail'){
        const spd = Math.max(9, Math.min(34, pathLen/2.2)) * (ship.wind || 1) * (RED ? 3.2 : 1);
         
        const stop = Math.max(pathLen*0.50, pathLen - moorGap(ship.dest));
        pathD = Math.min(stop, pathD + spd*dt*0.001);
        const p = atDist(pathD);
        ship.x = p.x; ship.y = p.y;
        let d = p.a - lastA;
        while (d > Math.PI) d -= 6.2832; while (d < -Math.PI) d += 6.2832;
        ship.a = p.a; lastA = p.a;
        ship.heel = Math.max(-1, Math.min(1, ship.heel*0.88 + d*7));
        if (!curTrail.length || Math.hypot(p.x-curTrail[curTrail.length-1].x, p.y-curTrail[curTrail.length-1].y) > 1.2)
          curTrail.push({x:p.x, y:p.y});
        if (!RED && Math.random() < 0.65)
          wake.push({x:p.x - Math.cos(p.a)*1.4 + (Math.random()-0.5), y:p.y - Math.sin(p.a)*1.4 + (Math.random()-0.5), l:1, r:1});
        if (!RED && Math.random() < 0.55)
          spray.burst(mx(p.x - Math.cos(p.a)*1.6), my(p.y - Math.sin(p.a)*1.6), 2,
            {col:SEA.foam, sp0:0.01, sp1:0.06, r0:1, r1:2.6, g:0.00004});
        if (pathD >= stop - 0.001){
          curTrail.push({x:ship.x, y:ship.y});
          ship.heel = 0;
          if (showTo){ reveal(showTo); state='arrive'; stateT=0; showTo=null; }
          else resolve();
        }
      }
      else if (state === 'arrive'){
        ship.heel *= 0.9;
        if (stateT > (RED ? 500 : 1250)){
          if (ship.pending){ const nx = ship.pending; ship.pending = null; launch(nx, false); }
          else newRound();
        }
      }
      else if (state === 'end' && !finished && stateT > (RED ? 500 : 1400)){
        finished = true; ctx.finish();
      }
      else if (state === 'aim'){
        ship.heel = RED ? 0 : Math.sin(t*0.0016)*0.10;
      }

      if (!RED){ spray.step(dt); shake.step(dt); }
      pops.step(dt);

      const W = w(), H = h();
      g.clearRect(0,0,W,H);
      backdrop(W, H, t);

      g.save();
      if (!RED) shake.apply(g);

      g.save(); chartPath(); g.clip();
      sea(t);
      drawTrails();
      coastline(t);
      decor(t);
      port(t);
      drawFx(dt);
      drawBoom(t);                                   
      C.items.forEach(is => island(is, t));
      drawPlan(t);
      drawBirds(t, dt);
      if (!RED) spray.draw(g);
       
      const c = chart(), cR = Math.max(c.w, c.h);
      g.save(); g.globalAlpha = .20;
      g.fillStyle = ART.rgrad(g, c.x + c.w*0.40, c.y + c.h*0.34, cR*0.40, cR*0.92,
        ['rgba(0,0,0,0)','rgba(1,14,26,.85)']);
      g.fillRect(c.x, c.y, c.w, c.h); g.restore();
      g.restore();

      frame();
      drawRose(t);
      g.restore();

      ART.vignette(g, W, H, .16);
      renderPops();
    });

    onResize(layout);                     

    return {
      destroy(){
        cv.removeEventListener('pointerdown', onDown);
        pick.removeEventListener('click', onPick);
        layer.remove();
      }
    };
  }
});
