SHIFT.engine('wall', {
  name:'بناء سور الكويت', mins:2,
  mount(root, ctx){
    const C = ctx.content, ITEMS = C.items, GATES = C.gates || [];
    const OBJ = C.obj || 'السور والحماية';
    
    const GATE_ROWS = GATES.map((_,k)=> Math.min(ITEMS.length-1,
                        Math.round((k+1) * ITEMS.length / GATES.length) - 1));
    const R = !!ctx.reduced, P = !!ctx.proj, N = 3;
    const cvw = ctx.canvas(root), g = cvw.g, w = cvw.w, h = cvw.h;

    const PAL  = ART.PAL.desert, FX = ART.PAL.fx;
    const ROPE = '#E4C089';
    const WOOD = ['#CE9553','#8B5A28','#553213'];
    const STONE= { lt:'#E0BC88', mid:'#A87B4E', dk:'#63421F', rim:'#FFE7B4' };
     
    const SHADE  = ART.mix(PAL.shade, '#3A2210', .5);
    const SHADED = ART.mix(PAL.shade, '#241608', .45);
    const SADU = ['#C2352E','#F3E4CB','#1F6E5A','#F3E4CB','#D98A1F','#F3E4CB','#3C4E96'];
    const ROCKR= [1.00,0.90,1.05,0.87,1.00,0.93,1.07,0.89,0.97];

    const TEAM_HEX = { '--t1':'#F2624A', '--t2':'#22C08A', '--t3':'#FFC24D', '--t4':'#8E7BF0' };
    function teamHex(c){
      const s = String(c||''), m = /--t\d/.exec(s);
      if (m && TEAM_HEX[m[0]]) return TEAM_HEX[m[0]];
      try{
        const v = getComputedStyle(document.body).getPropertyValue(s.replace(/^var\(\s*|\s*\)$/g,'')).trim();
        if (v) return v;
      }catch(e){}
      return FX.gold;
    }

    const parts = new ART.Particles(220);
    const pops  = new ART.Pops();
    const shake = new ART.Shake();

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0;direction:rtl;text-align:center;'+
      'pointer-events:none;font-family:inherit;overflow:hidden';

    const head = document.createElement('div');
    head.style.cssText = 'position:absolute;inset-inline:0;inset-block-start:0;'+
      'padding:8px 10px 0;display:flex;flex-direction:column;align-items:center;gap:5px';

    const turn = document.createElement('div');
    const turnB = document.createElement('b');
    turnB.style.fontStyle = 'normal';
    turn.style.cssText = 'background:var(--raised);border:1px solid var(--line);border-radius:999px;'+
      'padding:2px 12px;color:var(--ink);font-weight:600;white-space:nowrap;'+
      'box-shadow:0 6px 18px rgba(60,28,8,.28)';

    const ask = document.createElement('div');
    ask.setAttribute('role','status');
    ask.style.cssText = 'background:var(--surface);border:1px solid var(--line);border-radius:14px;'+
      'padding:9px 16px;max-width:min(94%,760px);line-height:1.45;font-weight:700;'+
      'color:var(--ink);box-shadow:0 10px 30px rgba(60,28,8,.30);pointer-events:auto';

    const gateBar = document.createElement('div');
    gateBar.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;justify-content:center';
    const chips = GATES.map(n=>{
      const c = document.createElement('span');
      c.textContent = n;
      c.style.cssText = 'border:1px dashed var(--line);border-radius:999px;padding:2px 9px;'+
        'background:var(--surface);color:var(--muted);font-weight:600;white-space:nowrap;opacity:.8;'+
        'transition:background .3s ease,color .3s ease,box-shadow .3s ease';
      gateBar.appendChild(c); return c;
    });
    head.append(turn, ask, gateBar);

    const track = document.createElement('div');
    track.style.cssText = 'position:absolute;overflow:hidden;direction:rtl';
    const labels = [];
    for (let i=0;i<N;i++){
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;top:0;left:0;'+
        'display:flex;align-items:center;justify-content:center;text-align:center;'+
        'padding:4px 6px;font-weight:800;color:#FFF3DC;line-height:1.25;will-change:transform;'+
        'text-shadow:0 2px 0 rgba(34,16,2,.80),0 0 10px rgba(20,8,0,.45)';
      track.appendChild(el);
      labels.push(el);
    }

    const popLayer = document.createElement('div');
    popLayer.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden';
    const popEls = [];
    for (let i=0;i<6;i++){
      const e = document.createElement('div');
      e.style.cssText = 'position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;opacity:0;'+
        'text-shadow:0 2px 8px rgba(40,16,0,.55);will-change:transform,opacity';
      popLayer.appendChild(e); popEls.push(e);
    }

    const toast = document.createElement('div');
    toast.style.cssText = 'position:absolute;inset-inline:0;text-align:center;opacity:0;'+
      'transition:opacity .3s ease;font-weight:800;color:#FFF3C4;'+
      'text-shadow:0 2px 10px rgba(40,16,0,.65)';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'أَسقِط الحجر';
    btn.setAttribute('aria-label','أسقط الحجر على الموضع الصحيح');
    btn.style.cssText = 'position:absolute;inset-inline:0;margin-inline:auto;pointer-events:auto;'+
      'background:linear-gradient(180deg,#FFC24D,#E0761F);color:#3A1B05;border:0;border-radius:999px;'+
      'font-weight:800;font-family:inherit;width:max-content;'+
      'box-shadow:0 10px 26px rgba(60,24,0,.42),inset 0 -3px 0 rgba(120,50,0,.35),inset 0 2px 0 rgba(255,255,255,.45)';

    wrap.append(head, track, popLayer, toast, btn);
    root.appendChild(wrap);

    const L = {};
    function layout(){
      if (S && S.dead) return;
      const W = w(), H = h();
      L.W = W; L.H = H;
      L.short   = H < 520;
      L.tall    = H > W*1.25;                 
      L.wallW   = Math.min(W*0.94, P ? 900 : 620);
      L.wallX   = (W - L.wallW)/2;
      L.rowH    = Math.max(16, Math.min(L.wallW/14, H*0.055));
      L.slotH   = Math.max(42, Math.min(H*0.115, P ? 86 : 66));
      L.anchor  = Math.round(H * (L.short ? 0.68 : L.tall ? 0.575 : 0.60));
      
      L.hz      = L.tall ? 0.20 : 0.16;
      L.slotY   = L.anchor - L.slotH - Math.max(2, H*0.006);
      
      L.margin  = L.wallW * 0.11;
      L.pitch   = (L.wallW - 2*L.margin) / N;
      L.gap     = Math.max(6, L.wallW*0.018);
      L.slotW   = L.pitch - L.gap;
      L.half    = (N*L.pitch - L.gap) / 2;             
      L.cx      = L.wallX + L.margin + L.half;         
      L.stoneR  = Math.max(12, Math.min(L.rowH*0.85, L.wallW/16));
      L.base    = P ? 21 : Math.max(12, Math.min(17, Math.min(W/26, H/24)));
      styleDom();
      
      const hd = (head.offsetHeight || H*0.22) + L.stoneR*0.9 + Math.max(10, H*0.022);
      L.pivotY  = Math.max(L.stoneR, Math.min(hd, L.slotY - L.stoneR - 52));
      
      const avail = Math.max(20, L.slotY - L.pivotY - L.stoneR);
      const want  = L.short ? Math.max(22, H*0.06) : Math.max(40, H*0.10);
      L.rope    = Math.max(24, avail - Math.min(want, avail*0.34));
      
      L.span    = Math.max(10, Math.min(L.wallW/2 - L.stoneR - 2, L.half));
      L.maxAng  = Math.min(1.05, Math.asin(Math.min(1, L.span/L.rope)));
      L.reach   = L.rope * Math.sin(L.maxAng);
      L.trolley = Math.max(0, L.span - L.reach);
      if (S && S.rows) S.camT = wallTop();   
    }

    function styleDom(){
      const b = L.base;
       
      const F14 = v => Math.max(14, v) + 'px';
      turn.style.fontSize = F14(b*0.84);
      ask.style.fontSize  = F14(b);
      gateBar.style.fontSize = F14(b*0.72);
      toast.style.fontSize = F14(b*1.15);
      toast.style.insetBlockStart = Math.round(Math.max(0, L.slotY - L.slotH*0.9))+'px';
      
      const clear = Math.max(6, L.H*0.012);
      const gbBot = Math.max(8, L.H*0.03);
      
      const room = Math.max(0, (L.H - gbBot) - (L.slotY + L.slotH));
      let gateLow = false;
      if (L.short){
        if (gateBar.parentNode !== wrap) wrap.appendChild(gateBar);
        gateBar.style.position = 'absolute';
        gateBar.style.insetBlockEnd = gbBot+'px';
        gateBar.style.insetInlineStart = '10px';
        gateBar.style.maxWidth = '46%';
        gateBar.style.maxHeight = room+'px';
        gateBar.style.justifyContent = 'flex-start';
        
        gateLow = gateBar.scrollHeight <= room;
      }
      if (!gateLow){
        if (gateBar.parentNode !== head) head.appendChild(gateBar);
        gateBar.style.position = 'static';
        gateBar.style.maxWidth = '';
        gateBar.style.maxHeight = '';
        gateBar.style.justifyContent = 'center';
      }
      
      const headCap = L.slotY - clear;
      head.style.maxHeight = Math.round(Math.max(0, (L.short && !gateLow) ? headCap
                                                  : Math.min(L.H*0.34, headCap)))+'px';
      head.style.overflow  = 'hidden';
      btn.style.blockSize = (P?68:52)+'px';
      btn.style.padding = '0 '+(P?34:24)+'px';
      btn.style.fontSize = (P?24:17)+'px';
      btn.style.insetBlockEnd = Math.max(10, L.H*0.03)+'px';
      if (L.short){
        btn.style.insetInline = 'auto';
        btn.style.insetInlineEnd = '12px';
        btn.style.marginInline = '0';
      } else {
        btn.style.insetInline = '0';
        btn.style.marginInline = 'auto';
      }
      track.style.left = L.wallX+'px';
      track.style.top  = L.slotY+'px';
      track.style.width  = L.wallW+'px';
      track.style.height = L.slotH+'px';
      const fs = Math.max(14, Math.min(P?28:19, L.slotW/6.4));    
      for (const el of labels){
        el.style.width    = L.slotW+'px';
        el.style.height   = L.slotH+'px';
        el.style.fontSize = fs+'px';
      }
    }

    const S = {
      idx:0, phase:'swing', tSwing:0, tBelt:0, tPhase:0, t:0,
      rows:[], cam:0, camT:0, rings:[],
      order:[0,1,2], reveal:-1, revealT:9e9, miss:0, done:false,
      stone:{x:0, y:0, vy:0, acc:0, sq:0, rot:0}
    };
    layout();
    cvw.onResize(layout);

    function drive(){
      const per = R ? 3600 : Math.max(1500, 2400 - S.idx*70);
      return Math.sin(S.tSwing * 2*Math.PI / per);
    }
    function swingX(s){ return L.cx + L.trolley*s + L.rope*Math.sin(L.maxAng*s); }
    function swingY(s){ return L.pivotY + L.rope*Math.cos(L.maxAng*s); }
    function beltOff(){
      if (R) return 0;
      const per = Math.max(2600, 4200 - S.idx*200);
      return L.margin * Math.sin(S.tBelt * 2*Math.PI / per);
    }
    function slotX(i){ return L.wallX + L.margin + i*L.pitch + beltOff(); }

    function rowH(i){ return S.rows[i].gate >= 0 ? L.rowH*1.8 : L.rowH; }
    function rowTop(i){ let y = 0; for (let k=0;k<=i;k++) y -= rowH(k); return y; }
    function wallTop(){ let y = 0; for (let k=0;k<S.rows.length;k++) y -= rowH(k); return y; }

    function startRound(){
      S.order = ctx.shuffle([0,1,2]);
      S.phase = 'swing'; S.tPhase = 0; S.reveal = -1; S.revealT = 9e9; S.miss = 0;
      const it = ITEMS[S.idx], t = ctx.team();
      turn.textContent = 'دور فريق ';
      turnB.textContent = t.name; turnB.style.color = t.color;
      turn.appendChild(turnB);
      turn.appendChild(document.createTextNode(' · الصفّ '+(S.idx+1)+' من '+ITEMS.length));
      ask.textContent = it.q;
      for (let i=0;i<N;i++){
        labels[i].textContent = it.a[S.order[i]];
        labels[i].style.display = 'flex';
      }
      layout();
    }

    function drop(){
      if (S.phase !== 'swing' || S.done) return;
      const s = drive();
      S.stone.x = swingX(s); S.stone.y = swingY(s);
      const D = Math.max(20, L.slotY - S.stone.y), T = R ? 700 : 520;
      S.stone.acc = 2*D/(T*T); S.stone.vy = 0;
      S.phase = 'fall'; S.tPhase = 0;
      ctx.beep('tick');
    }

    function land(){
      const sx = S.stone.x;
      let hit = -1;
      for (let i=0;i<N;i++){
        const x = slotX(i);
        if (sx >= x && sx <= x + L.slotW) hit = i;
      }
      
      burst(sx, L.slotY + L.slotH*0.35, hit >= 0 ? 34 : 22, { col:PAL.dust, sp1:0.42, up:0.05 });
      burst(sx, L.slotY + L.slotH*0.55, hit >= 0 ? 14 : 8,
            { col:ART.mix(PAL.dust,'#FFFFFF',.5), sp0:0.10, sp1:0.30, r0:L.stoneR*0.2, r1:L.stoneR*0.6 });
      S.rings.push({ x:sx, y:L.slotY + L.slotH*0.5, t:0, col:PAL.dust });
      if (!R) shake.hit(hit >= 0 ? L.stoneR*0.85 : L.stoneR*0.42);
      if (hit < 0){
        S.miss++;
        if (S.miss < 3){
          S.phase = 'return'; S.tPhase = 0;
          ctx.say('soft','زلَّ الحجر بين موضعين — أعِد الكرّة، لا يُحتسب عليك.');
          ctx.beep('soft');
          return;
        }
        
        hit = 0;
        let best = Infinity;
        for (let i=0;i<N;i++){
          const d = Math.abs(S.stone.x - (slotX(i) + L.slotW/2));
          if (d < best){ best = d; hit = i; }
        }
      }
      resolve(hit);
    }

    function resolve(hit){
      const it = ITEMS[S.idx];
      const ok = S.order[hit] === it.c;
      const rightIdx = S.order.indexOf(it.c);
      S.reveal = rightIdx; S.revealT = 0;
      S.phase = 'settle'; S.tPhase = 0;

      const gate = GATE_ROWS.indexOf(S.idx);
      const tint = teamHex(ctx.team().color);
      S.rows.push({ ok:ok, gate:gate, t:0, tint:tint, fx:(S.idx*0.37)%1 });
      S.camT = wallTop();

      if (gate >= 0 && chips[gate]){
        const c = chips[gate];
        c.style.borderStyle = 'solid';
        c.style.borderColor = 'var(--pine)';
        c.style.fontWeight = '700';
        c.style.background = 'var(--pine-soft)';
        c.style.color = 'var(--pine)';
        c.style.opacity = '1';
        c.style.boxShadow = '0 0 14px rgba(255,201,77,.55)';
        toast.textContent = 'اكتملت ' + GATES[gate];
        toast.style.opacity = '1';
        ctx.after(1500, ()=>{ toast.style.opacity = '0'; });
      }

      const log = { q: it.q, obj: OBJ, right: ok, correct: it.a[it.c] };
      if (ok){
        const cx = slotX(rightIdx) + L.slotW/2;
        const precise = Math.abs(S.stone.x - cx) < L.slotW*0.24;
        const pts = precise ? 15 : 10;
        ctx.correct(pts, log);
        ctx.beep('good');
        ctx.say('good','<b>ثبَتَ الحجر!</b> ' + ctx.esc(it.a[it.c]) +
                (precise ? ' — إصابة في منتصف الموضع.' : ''));
        pops.add(S.stone.x, L.slotY - L.slotH*0.2, '+'+pts, precise ? FX.goldLt : FX.gold);
        burst(cx, L.slotY + L.slotH*0.4, R?4:26,
              { col:FX.goldLt, shape:'star', sp0:0.10, sp1:0.42, up:0.10,
                r0:L.stoneR*0.16, r1:L.stoneR*0.44, g:0.00030 });
        S.rings.push({ x:cx, y:L.slotY + L.slotH*0.5, t:0, col:FX.gold });
      } else {
        ctx.wrong(log);
        ctx.beep('soft');
        ctx.say('soft','قريب. الموضع الصحيح كان <b>' + ctx.esc(it.a[it.c]) +
                '</b> — أكمل البنّاؤون الصفّ عنك.');
        if (!R) shake.hit(L.stoneR*0.5);
      }
      ctx.next(); ctx.sync();

      ctx.after(R ? 1000 : 1600, ()=>{
        S.idx++;
        if (S.idx >= ITEMS.length) finishUp(); else startRound();
      });
    }

    function finishUp(){
      if (S.done) return;
      S.done = true; S.phase = 'done';
      ask.textContent = 'اكتمل السور وبواباته — أحسنتم!';
      turn.textContent = 'سور الكويت الثالث ١٩٢٠';
      for (const el of labels) el.style.display = 'none';
      btn.style.display = 'none';
      if (!R){
        for (let i=0;i<7;i++){
          const x = L.wallX + L.wallW*(0.08 + 0.84*Math.random());
          burst(x, sy(wallTop()) + 6, 14,
                { col: i%2 ? FX.goldLt : FX.warnGlow, shape:'star', sp0:0.12, sp1:0.46,
                  up:0.16, g:0.00026, r0:L.stoneR*0.18, r1:L.stoneR*0.5 });
        }
        shake.hit(L.stoneR*0.5);
      }
      ctx.beep('win');
      ctx.after(1900, ()=>ctx.finish());
    }

    function burst(x, y, n, opt){
      opt = opt || {};
      const lim = R ? Math.min(5, n) : n;
      parts.burst(x, y, lim, {
        col:   opt.col   || PAL.dust,
        shape: opt.shape || 'dot',
        ang:   opt.ang !== undefined ? opt.ang : -Math.PI/2,
        sp0:   opt.sp0 !== undefined ? opt.sp0 : 0.05,
        sp1:   opt.sp1 !== undefined ? opt.sp1 : 0.30,
        up:    opt.up  !== undefined ? opt.up  : 0.03,
        g:     opt.g   !== undefined ? opt.g   : 0.00058,
        r0:    opt.r0  !== undefined ? opt.r0  : L.stoneR*0.14,
        r1:    opt.r1  !== undefined ? opt.r1  : L.stoneR*0.40
      });
    }

    function sy(worldY){ return L.anchor + (worldY - S.cam); }
    
    function parY(f){ return L.anchor - L.H*L.hz*(1-f) + (0 - S.cam)*f; }

    function sunPos(){
      return { x: L.W*0.17,
               y: ART.clamp(parY(0.10) - L.H*0.22, L.H*0.10, L.H*0.58),
               r: Math.max(13, L.H*0.040) };
    }

    function drawSky(){
      ART.sky(g, L.W, L.H, PAL, L.H*0.95);
      
      g.save();
      g.fillStyle = ART.vgrad(g, 0, 0, L.H*0.52,
        [ART.a('#6B4278',.42), ART.a('#B44A46',.34), ART.a('#E0723C',.16), ART.a('#E0723C',0)]);
      g.fillRect(0, 0, L.W, L.H*0.52); g.restore();
      const sun = sunPos();
      
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.24;
      g.fillStyle = ART.rgrad(g, sun.x, sun.y, 0, Math.max(L.W,L.H)*0.30,
                              [ART.a(PAL.sunGlow,.42), ART.a(PAL.sunGlow,.10), ART.a(PAL.sunGlow,0)]);
      g.fillRect(0,0,L.W,L.H); g.restore();
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.42;
      g.fillStyle = ART.rgrad(g, sun.x, sun.y, sun.r*0.7, sun.r*7.0,
                              [ART.a(PAL.sunGlow,.75), ART.a(PAL.sunGlow,.18), ART.a(PAL.sunGlow,0)]);
      g.beginPath(); g.arc(sun.x, sun.y, sun.r*7.0, 0, 7); g.fill(); g.restore();
      ART.sunDisc(g, sun.x, sun.y, sun.r, PAL);
      
      const CB = [[0.10, 0.55, 0.36, 1.00],[0.30, 0.30, 0.30, 0.72],
                  [0.72, 0.16, 0.42, 0.86],[0.55, 0.46, 0.26, 0.60]];
      for (let i=0;i<CB.length;i++){
        const [fx, fy, fw, sc] = CB[i];
        const drift = R ? 0 : (S.t*0.0055*(0.35+i*0.22));
        const cx = ((fx*L.W + drift) % (L.W*1.55)) - L.W*0.28;
        const cy = L.H*0.05 + fy*L.H*0.26 + (0-S.cam)*0.06;
        const cw = L.W*fw, chh = L.H*0.052*sc;
        if (cy > L.H*0.72) continue;
        g.save();
        g.globalAlpha = .52;
        
        g.beginPath();
        for (let k=0;k<6;k++){
          const kx = cx + cw*(0.08 + k*0.17), ky = cy + Math.sin(k*1.9+i)*chh*0.32;
          g.ellipse(kx, ky, cw*(0.13+0.05*Math.sin(k*2.3+i)), chh*(0.55+0.30*Math.sin(k*1.4)), 0, 0, 7);
        }
        g.fillStyle = ART.vgrad(g, 0, cy-chh, cy+chh,
                                [ART.mix('#F9B98C','#C25A38',.30), ART.mix('#FFD9A0','#FF9F5E',.35)]);
        g.fill();
        
        g.globalCompositeOperation='lighter'; g.globalAlpha=.30;
        g.fillStyle = ART.rgrad(g, sun.x, sun.y, 0, Math.max(L.W,L.H)*0.55,
                                [ART.a('#FFE7B4',.85), ART.a('#FFE7B4',0)]);
        g.fill();
        g.restore();
      }
      
      if (!R){
        g.save(); g.lineCap='round';
        const FL = [[0.42, 0.16, 4, 0.012], [0.62, 0.30, 3, 0.0074]];
        for (let f=0;f<FL.length;f++){
          const [fx0, fy0, n, spd] = FL[f];
          g.globalAlpha = f ? .26 : .38;
          g.strokeStyle = ART.mix(PAL.shade, '#7A4630', .45);
          g.lineWidth = Math.max(1, L.H*0.0032*(f?0.8:1));
          for (let i=0;i<n;i++){
            const bx = (L.W*fx0 + i*38 + S.t*spd) % (L.W+80) - 40;
            const by = sun.y - L.H*fy0 + Math.sin(S.t*0.0012+i+f)*4 + i*9;
            const bs = Math.max(3, L.H*0.011*(f?0.75:1));
            g.beginPath();
            g.moveTo(bx-bs, by); g.quadraticCurveTo(bx-bs*0.4, by-bs*0.7, bx, by);
            g.quadraticCurveTo(bx+bs*0.4, by-bs*0.7, bx+bs, by); g.stroke();
          }
        }
        g.restore();
      }
      
      if (!R){
        g.save(); g.globalCompositeOperation='lighter'; g.fillStyle = PAL.sun;
        for (let i=0;i<30;i++){
          const f = i/30;
          const mx = ((f*1.71 + S.t*0.000042*(0.45+f)) % 1) * (L.W*1.12) - L.W*0.06;
          const my = (0.04 + 0.66*((f*7.3)%1)) * L.H + Math.sin(S.t*0.0009 + i*1.7)*L.H*0.013;
          const mr = Math.max(0.8, L.H*0.0024*(0.55 + (i%3)*0.42));
          const d  = Math.abs(mx - sun.x)/(L.W*0.85);
          g.globalAlpha = 0.10 + 0.30*Math.max(0, 1-d);
          g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
        }
        g.restore();
      }
    }

    function drawBack(){
      const wind = Math.sin(S.t*0.0006)*0.5;
      const farY = parY(0.16), midY = parY(0.42), townY = parY(0.55), palmY = parY(0.72);

      if (farY < L.H + L.H*0.2)
        ART.dune(g, L.W, farY, L.H*0.055, 1.7, ART.mix(PAL.far, PAL.haze, .38), false,
                 { haze:0.30, hazeCol:PAL.sky[1] });
      
      if (farY < L.H + 40){
        g.save(); g.globalAlpha=.55;
        ART.drop(g, L.W*0.26, farY+3, L.H*0.030, L.H*0.008, PAL.shade, .30, L.H*0.022);
        ART.drop(g, L.W*0.72, farY+4, L.H*0.026, L.H*0.007, PAL.shade, .28, L.H*0.020);
        ART.palm(g, L.W*0.26, farY+2, Math.max(0.9, L.H/620), PAL, wind*0.6);
        ART.palm(g, L.W*0.72, farY+3, Math.max(0.8, L.H/720), PAL, wind*0.6);
        g.restore();
      }
      
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.30;
      g.fillStyle = ART.vgrad(g, 0, farY-L.H*0.11, farY,
                              [ART.a(PAL.sun,0), ART.a(PAL.sun,.85)]);
      g.fillRect(0, farY-L.H*0.11, L.W, L.H*0.11); g.restore();
      
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.22;
      g.fillStyle = ART.vgrad(g, 0, farY-L.H*0.07, farY+L.H*0.03,
                              [ART.a(PAL.dust,0), ART.a(PAL.dust,.9)]);
      g.fillRect(0, farY-L.H*0.07, L.W, L.H*0.10); g.restore();

      if (midY < L.H + L.H*0.2)
        ART.dune(g, L.W, midY, L.H*0.05, 4.2, ART.mix(PAL.mid, '#8A4326', .34), true,
                 { haze:0.14, hazeCol:PAL.sky[1] });

      if (townY < L.H + 30 && townY > -80){
        const lit = S.rows.some(r=>r.gate>=0);
        const base = Math.min(L.wallX - L.wallW*0.06, -L.W*0.02);
        const span = Math.max(L.wallW*1.12, L.W*1.06);
        const hs = [0.42,0.66,0.50,0.80,0.54,0.72,0.46,0.60,0.74,0.48,0.64,0.52];
        
        const TP = { city:[ART.mix(PAL.city[0], PAL.haze, .38), ART.mix(PAL.city[1], PAL.haze, .30)],
                     window:PAL.window, sun:PAL.sun, shade:PAL.shade };
        
        if (!R){
          const DP = { hull:[ART.mix('#B5763C',PAL.haze,.58), ART.mix('#8A5326',PAL.haze,.52),
                             ART.mix('#6B3E1B',PAL.haze,.48)],
                       sail: ART.mix('#FBF3E2', PAL.haze,.26), rope: ART.mix(PAL.dust,PAL.haze,.45) };
          const dx = (((S.t*0.018) + L.W*0.55) % (L.W*1.5)) - L.W*0.25;
          g.save(); g.globalAlpha=.46;
          ART.dhow(g, dx, townY - L.rowH*2.1, ART.clamp(L.H*0.00075, 0.24, 0.68), DP, S.t, DP.sail);
          g.restore();
        }
        g.save(); g.globalAlpha=.95;
        for (let i=0;i<hs.length;i++){
          const bw = span/hs.length*0.88, bx = base + i*span/hs.length;
          const bhh = L.rowH*hs[i]*2.5;
          ART.oldHouse(g, bx, townY+2, bw, bhh, TP, lit, { haze:0.15, hazeCol:PAL.sky[1] });
        }
        g.restore();
        
        g.save(); g.globalAlpha=.24; g.fillStyle=SHADE;
        g.fillRect(base + L.rowH*0.9, townY, span, Math.max(3, L.H*0.010)); g.restore();
      }

      if (palmY < L.H + 60 && palmY > -60){
        ART.drop(g, L.W*0.07, palmY+3, L.H*0.075, L.H*0.016, PAL.shade, .34, L.H*0.055);
        ART.drop(g, L.W*0.94, palmY+7, L.H*0.065, L.H*0.014, PAL.shade, .32, L.H*0.048);
        ART.palm(g, L.W*0.07, palmY, Math.max(1.5, L.H/250), PAL, wind);
        ART.palm(g, L.W*0.94, palmY+4, Math.max(1.3, L.H/300), PAL, wind*0.8);
      }
    }

    function drawGround(){
      const gy = sy(0);
      if (gy > L.H + 6) return;
      g.fillStyle = ART.vgrad(g, 0, gy, L.H,
        [ART.mix(PAL.ground[0], '#A9651F', .48), ART.mix(PAL.ground[1], '#6B3D14', .68)]);
      g.fillRect(0, gy, L.W, L.H - gy + 8);
      
      g.save(); g.globalAlpha=.55; g.fillStyle = ART.mix(PAL.dune[0], '#FFFFFF', .35);
      g.fillRect(0, gy, L.W, Math.max(2, L.H*0.006)); g.restore();
      
      g.save();
      const wash = g.createLinearGradient(0, 0, L.W, 0);
      wash.addColorStop(0, ART.a(PAL.sun,.16));
      wash.addColorStop(0.40, ART.a(PAL.sun,.03));
      wash.addColorStop(1, ART.a(PAL.shade,.30));
      g.fillStyle = wash; g.fillRect(0, gy, L.W, L.H-gy+8); g.restore();
      
      g.save();
      const gh = Math.max(2, L.H - gy);          
      const SW = [[0.16,0.30,0.34],[0.52,0.55,0.30],[0.83,0.24,0.26],[0.36,0.80,0.22],[0.70,0.92,0.20]];
      for (const [sx0, sf, sa] of SW){
        const cy0 = gy + gh*sf;
        g.globalAlpha = sa*0.5;
        g.fillStyle = ART.rgrad(g, L.W*sx0, cy0, 0, L.W*0.26,
                                [ART.a(PAL.dune[0],.55), ART.a(PAL.dune[0],0)]);
        ART.ellipse(g, L.W*sx0, cy0, L.W*0.24, gh*0.16, 0); g.fill();
        g.globalAlpha = sa*0.55;
        g.fillStyle = ART.rgrad(g, L.W*sx0 + L.W*0.10, cy0 + gh*0.05, 0, L.W*0.20,
                                [ART.a(PAL.shade,.50), ART.a(PAL.shade,0)]);
        ART.ellipse(g, L.W*sx0 + L.W*0.10, cy0 + gh*0.05, L.W*0.18, gh*0.10, 0); g.fill();
      }
      g.restore();
      
      g.save(); g.lineWidth = Math.max(1, L.H*0.003);
      for (let i=1;i<=10;i++){
        const f = i/11, yy = gy + gh*f;
        g.globalAlpha = .16 + .30*f;
        g.strokeStyle = ART.mix(SHADE, '#7A4A1E', .55);
        g.beginPath();
        for (let x=0;x<=L.W;x+=18)
          g.lineTo(x, yy + Math.sin(x*0.012 + i*1.9)*Math.max(1.5,L.H*0.006*(0.4+f))
                      + Math.sin(x*0.031 + i)*Math.max(1,L.H*0.0022));
        g.stroke();
        g.globalAlpha = .14 + .20*f; g.strokeStyle = ART.a(PAL.dune[0],.9);
        g.beginPath();
        for (let x=0;x<=L.W;x+=18)
          g.lineTo(x, yy - Math.max(1.2,L.H*0.0032) + Math.sin(x*0.012 + i*1.9)*Math.max(1.5,L.H*0.006*(0.4+f))
                      + Math.sin(x*0.031 + i)*Math.max(1,L.H*0.0022));
        g.stroke();
      }
      g.restore();
      
      const TUF = [[0.05,0.34],[0.21,0.62],[0.78,0.55],[0.94,0.40],[0.36,0.86],[0.63,0.92],
                   [0.12,0.20],[0.48,0.44],[0.69,0.30],[0.88,0.74],[0.28,0.28],[0.56,0.68]];
      for (const [fx, fy] of TUF){
        const tx0 = L.W*fx, ty0 = gy + (L.H-gy)*fy;
        if (ty0 > L.H+10) continue;
        const ts = Math.max(4, L.H*0.016)*(0.6+fy*0.8);
        ART.drop(g, tx0, ty0+ts*0.18, ts*1.9, ts*0.42, PAL.shade, .34, ts*1.10);
        g.save(); g.strokeStyle = ART.mix('#7E8C3E','#46532A', fy); g.lineCap='round';
        g.lineWidth = Math.max(1.2, ts*0.20);
        for (let k=0;k<6;k++){
          const ang = -Math.PI/2 + (k-2.5)*0.34;
          g.beginPath(); g.moveTo(tx0, ty0);
          g.quadraticCurveTo(tx0+Math.cos(ang)*ts*0.6, ty0+Math.sin(ang)*ts*0.9,
                             tx0+Math.cos(ang)*ts*1.05, ty0+Math.sin(ang)*ts*1.25);
          g.stroke();
        }
        g.restore();
      }
      
      if (S.rows.length){
        const hgt = Math.min(L.H*0.9, -wallTop());
        g.save(); g.globalAlpha=.34; g.fillStyle = SHADE;
        g.beginPath();
        g.moveTo(L.wallX, gy);
        g.lineTo(L.wallX + L.wallW, gy);
        g.lineTo(L.wallX + L.wallW + hgt*0.55, gy + Math.min(L.H*0.10, hgt*0.16));
        g.lineTo(L.wallX + hgt*0.55, gy + Math.min(L.H*0.10, hgt*0.16));
        g.closePath(); g.fill(); g.restore();
      }
    }

    function drawSite(){
      const gy = sy(0);
      if (gy > L.H + 30 || gy < -40) return;
      
      const s0 = ART.clamp(Math.min(L.H*0.100, L.W*0.200)/64, 0.75, 3.0);
      const bw = Math.max(7, L.rowH*0.46), bh = Math.max(4, L.rowH*0.24);

      function pile(px, py, rows, per){
        for (let r0=0;r0<rows;r0++){
          for (let c0=0;c0<per-r0;c0++){
            const bx = px + c0*(bw+2) + r0*(bw+2)/2, by = py - (r0+1)*(bh+2);
            g.fillStyle = ART.vgrad(g, 0, by, by+bh, [PAL.wall[0], PAL.wall[2]]);
            ART.rr(g, bx, by, bw, bh, 1.5); g.fill();
            g.save(); g.globalAlpha=.45; g.fillStyle=ART.a('#FFE9BE',.9);
            g.fillRect(bx, by, bw, Math.max(1, bh*0.22)); g.restore();
            g.save(); g.globalAlpha=.30; g.fillStyle='#4A2C12';
            g.fillRect(bx+bw-Math.max(1.2,bw*0.14), by, Math.max(1.2,bw*0.14), bh); g.restore();
          }
        }
      }

      const mx = Math.max(L.W*0.055, L.wallX - L.wallW*0.16), my = gy + L.H*0.055;
      if (mx > -40){
        ART.drop(g, mx, my+2, bw*2.6, bw*0.9, PAL.shade, .26, bw*1.5);
        g.beginPath(); g.ellipse(mx, my, bw*2.4, bw*0.9, 0, 0, 7);
        g.fillStyle = ART.vgrad(g, 0, my-bw, my+bw,
          [ART.mix(PAL.mortar,'#FFFFFF',.42), ART.mix(PAL.mortar,'#7A5228',.55)]); g.fill();
        g.save(); g.globalAlpha=.5; g.strokeStyle=ART.a(PAL.sun,.9); g.lineWidth=Math.max(1.4,bw*0.20);
        g.beginPath(); g.ellipse(mx, my-bw*0.10, bw*2.2, bw*0.78, 0, Math.PI*0.95, Math.PI*1.9); g.stroke(); g.restore();
      }

      const pA = Math.max(L.W*0.015, L.wallX - L.wallW*0.13);
      const pB = Math.min(L.W - bw*5, L.wallX + L.wallW*1.02);
      ART.drop(g, pA + bw*2.4, gy + L.H*0.030, bw*4.2, bw*1.0, PAL.shade, .40, bw*2.4);
      ART.drop(g, pB + bw*1.8, gy + L.H*0.022, bw*3.2, bw*0.8, PAL.shade, .38, bw*2.0);
      pile(pA, gy + L.H*0.028, 3, 4);
      pile(pB, gy + L.H*0.020, 2, 3);

      const SHP = { skin:ART.mix(PAL.skin, PAL.shade,.30), skinDark:ART.mix(PAL.skinDark, PAL.shade,.30),
                    thobe:ART.mix(PAL.thobe, PAL.shade,.26), thobeSh:ART.mix(PAL.thobeSh, PAL.shade,.30),
                    ghutra:ART.mix(PAL.ghutra, PAL.shade,.24), shade:PAL.shade };
      const wk = [[Math.max(L.W*0.11, L.wallX - L.wallW*0.13), gy + L.H*0.062, 1.06, 0.8],
                  [Math.min(L.W*0.89, L.wallX + L.wallW*1.12), gy + L.H*0.044, 0.94, -0.7]];
      for (let i=0;i<wk.length;i++){
        const [px, py, sc, ln] = wk[i];
        if (px < -60 || px > L.W+60) continue;
        const S1 = s0*sc;
        const ph = R ? 0 : Math.sin(S.t*0.0022 + i*2.1)*0.55;
        const pose = { run: ph, lean: ln*0.25 };
        
        ART.drop(g, px, py + 3*S1, 24*S1, 6.5*S1, PAL.shade, .42, 22*S1);
        ART.person(g, px, py, S1, PAL, pose);
        
        g.save();
        g.beginPath(); g.rect(px + 1.5*S1, py - 76*S1, 36*S1, 84*S1); g.clip();
        ART.person(g, px, py, S1, SHP, { run: ph, lean: ln*0.25, noShadow: true });
        g.restore();
        
        g.save();
        const hx = px + (ln>0 ? -9*S1 : 9*S1), hy = py - 44*S1;
        g.fillStyle = ART.vgrad(g, 0, hy-4*S1, hy+4*S1, ['#C08A4E','#6B4519']);
        ART.rr(g, hx-9*S1, hy-4*S1, 18*S1, 8*S1, 1.5*S1); g.fill();
        g.globalAlpha=.35; g.fillStyle='#FFE9BE';
        g.fillRect(hx-9*S1, hy-4*S1, 18*S1, 1.6*S1);
        g.restore();
        
        g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.46;
        g.fillStyle = ART.rgrad(g, px - 9*S1, py - 36*S1, 0, 30*S1,
                                [ART.a(PAL.sun,.95), ART.a(PAL.sun,0)]);
        g.beginPath(); g.arc(px - 9*S1, py - 36*S1, 30*S1, 0, 7); g.fill(); g.restore();
      }
    }

    function drawFore(){
      
      const fy = L.H - L.H*0.120 + ART.clamp((0 - S.cam)*0.55, 0, L.H*0.05);
      g.save();
      g.beginPath(); g.moveTo(-6, L.H+6); g.lineTo(-6, fy+L.H*0.02);
      for (let x=-6;x<=L.W+30;x+=Math.max(18,L.W/16))
        g.lineTo(x, fy + Math.sin(x*0.0075+2.2)*L.H*0.022 + Math.sin(x*0.019)*L.H*0.008);
      g.lineTo(L.W+30, L.H+6); g.closePath();
      
      g.fillStyle = ART.vgrad(g, 0, fy-L.H*0.03, L.H,
        [ART.mix(PAL.dune[2], PAL.shade, .36), ART.mix(PAL.shade, '#3A2712', .50)]);
      g.fill();
      g.save(); g.clip();
      
      g.globalAlpha=.34;
      g.fillStyle = ART.vgrad(g, 0, fy-L.H*0.035, fy+L.H*0.055,
        [ART.a(ART.mix(PAL.dune[0],'#FFFFFF',.30),.95),
         ART.a(ART.mix(PAL.dune[0],'#FFE9BE',.35),.35),
         ART.a(PAL.dune[0],0)]);
      g.fillRect(0, fy-L.H*0.05, L.W, L.H*0.14);
      g.restore();
      g.restore();
      
      for (const fx of [0.03, 0.17, 0.83, 0.97, 0.58]){
        const tx0 = L.W*fx;
        const ty0 = fy + Math.sin(tx0*0.0075+2.2)*L.H*0.022 + Math.sin(tx0*0.019)*L.H*0.008 + L.H*0.012;
        const ts  = Math.max(6, L.H*0.030);
        g.save(); g.strokeStyle = '#3E2712'; g.lineCap='round';
        g.lineWidth = Math.max(1.6, ts*0.17);
        for (let k=0;k<7;k++){
          const ang = -Math.PI/2 + (k-3)*0.30;
          g.beginPath(); g.moveTo(tx0, ty0);
          g.quadraticCurveTo(tx0+Math.cos(ang)*ts*0.55, ty0+Math.sin(ang)*ts*0.95,
                             tx0+Math.cos(ang)*ts*1.0, ty0+Math.sin(ang)*ts*1.35);
          g.stroke();
        }
        g.globalAlpha=.35; g.strokeStyle='#7A5A2E';
        for (let k=0;k<3;k++){
          const ang = -Math.PI/2 + (k-1)*0.36;
          g.beginPath(); g.moveTo(tx0, ty0);
          g.quadraticCurveTo(tx0+Math.cos(ang)*ts*0.5, ty0+Math.sin(ang)*ts*0.9,
                             tx0+Math.cos(ang)*ts*0.92, ty0+Math.sin(ang)*ts*1.25);
          g.stroke();
        }
        g.restore();
      }
      
      const rocks = [[0.06,0.9],[0.13,0.6],[0.87,0.8],[0.95,0.55],[0.44,0.5]];
      for (const [fx,sc] of rocks){
        const rx = L.W*fx, ry = fy + L.H*0.03 + Math.sin(fx*19)*L.H*0.012, rr0 = Math.max(4, L.H*0.016*sc);
        ART.drop(g, rx, ry+rr0*0.7, rr0*1.9, rr0*0.5, PAL.shade, .42, rr0*1.2);
        g.beginPath(); g.ellipse(rx, ry, rr0*1.25, rr0, 0.3, 0, 7);
        g.fillStyle = ART.vgrad(g, 0, ry-rr0, ry+rr0, [ART.mix(STONE.lt,'#8B5E30',.35), STONE.dk]); g.fill();
        g.save(); g.globalAlpha=.5; g.strokeStyle=ART.a(STONE.rim,.8); g.lineWidth=Math.max(1,rr0*0.18);
        g.beginPath(); g.ellipse(rx-rr0*0.15, ry-rr0*0.2, rr0*1.0, rr0*0.72, 0.3, Math.PI*0.9, Math.PI*1.75);
        g.stroke(); g.restore();
      }
      
      const frondC = ART.mix(ART.mix(PAL.palm, PAL.shade, .58), '#241A0A', .22);
      const frondL = ART.mix(ART.mix(PAL.palm, PAL.shade, .42), '#33260F', .14);
      [[-L.W*0.035, L.H*1.03, 1], [L.W*1.035, L.H*1.05, -1]].forEach(([ox, oy, dir], ci)=>{
        const FL = Math.max(58, Math.min(L.H*0.34, L.W*0.24));
        g.save(); g.globalAlpha = .62;
        for (let k=0;k<7;k++){
          const ang = dir>0 ? (-Math.PI*0.46 + k*0.135) : (-Math.PI*0.54 - k*0.135);
          const sway = R ? 0 : Math.sin(S.t*0.0007 + k + ci)*0.035;
          const A = ang + sway, Lk = FL*(0.74 + (k%2)*0.24);
          const ex = ox + Math.cos(A)*Lk, ey = oy + Math.sin(A)*Lk;
          g.beginPath(); g.moveTo(ox, oy);
          g.quadraticCurveTo(ox + Math.cos(A)*Lk*0.55 - dir*Lk*0.10,
                             oy + Math.sin(A)*Lk*0.55 - Lk*0.16, ex, ey);
          g.quadraticCurveTo(ox + Math.cos(A)*Lk*0.58 + dir*Lk*0.06,
                             oy + Math.sin(A)*Lk*0.58 + Lk*0.03, ox, oy);
          g.closePath();
          g.fillStyle = k%2 ? frondC : frondL; g.fill();
          
          g.save(); g.globalAlpha=.16; g.strokeStyle = ART.a(PAL.sun,.8);
          g.lineWidth = Math.max(1.2, L.H*0.003); g.stroke(); g.restore();
          g.save(); g.globalAlpha=.22; g.strokeStyle = ART.a(PAL.palmLt,.9);
          g.lineWidth = Math.max(1, L.H*0.0022); g.lineCap='round';
          g.beginPath(); g.moveTo(ox, oy); g.lineTo(ex, ey); g.stroke();
          
          g.globalAlpha=.26; g.lineWidth = Math.max(0.9, L.H*0.0017);
          const nx2 = Math.cos(A + Math.PI/2), ny2 = Math.sin(A + Math.PI/2);
          for (let q=1;q<=6;q++){
            const tq = q/7, bxq = ox + (ex-ox)*tq, byq = oy + (ey-oy)*tq;
            const lq = Lk*0.16*Math.sin(tq*Math.PI);
            g.beginPath(); g.moveTo(bxq, byq);
            g.lineTo(bxq + nx2*lq - Math.cos(A)*lq*0.5, byq + ny2*lq - Math.sin(A)*lq*0.5);
            g.moveTo(bxq, byq);
            g.lineTo(bxq - nx2*lq - Math.cos(A)*lq*0.5, byq - ny2*lq - Math.sin(A)*lq*0.5);
            g.stroke();
          }
          g.restore();
        }
        g.restore();
      });
    }

    function drawWall(){
      const x = L.wallX, wd = L.wallW;
      
      if (S.rows.length){
        const hgt0 = Math.min(L.H*1.1, -wallTop());
        ART.drop(g, x + wd*0.5, sy(0) + L.H*0.012, wd*0.62, L.H*0.030,
                 PAL.shade, .38, hgt0*0.60);
      }
      if (S.rows.length === 0){
        
        const gy = sy(0);
        g.save(); g.globalAlpha=.55; g.fillStyle = PAL.groundDark;
        ART.rr(g, x-6, gy-Math.max(4,L.rowH*0.22), wd+12, Math.max(7,L.rowH*0.30), 4); g.fill();
        g.globalAlpha=.45; g.setLineDash([9,8]); g.lineWidth=Math.max(2,L.H*0.004);
        g.strokeStyle = ART.a(FX.goldLt,.9);
        g.beginPath(); g.moveTo(x, gy-L.rowH*0.06); g.lineTo(x+wd, gy-L.rowH*0.06); g.stroke();
        g.setLineDash([]); g.restore();
        return;
      }
      for (let i=0;i<S.rows.length;i++){
        const r = S.rows[i], rh = rowH(i);
        const k = R ? 1 : Math.min(1, (r.t||0)/380);
        const rise = (1 - ART.easeOut(k)) * rh * 1.05;
        const top = sy(rowTop(i)) - rise;
        if (top > L.H + rh || top + rh < -rh) continue;
        g.save();
        g.globalAlpha = R ? 1 : ART.clamp(k*1.6, 0, 1);
        
        ART.mudWall(g, x, top, wd, rh, PAL, i);
        
        drawCourses(x, top, wd, rh, i);
        
        g.fillStyle = ART.vgrad(g, 0, top, top+rh, [ART.a(PAL.sun,.50), ART.a(PAL.sun,.08)]);
        g.fillRect(x, top, Math.max(3, wd*0.012), rh);
        g.fillStyle = ART.a(SHADE, .38);
        g.fillRect(x+wd-Math.max(3, wd*0.016), top, Math.max(3, wd*0.016), rh);
        g.restore();

        if (r.ok){
          g.save();
          g.beginPath(); ART.rr(g, x, top, wd, rh, 3); g.clip();
          g.globalCompositeOperation = 'overlay';
          g.globalAlpha = (R ? 1 : ART.clamp(k*1.6,0,1)) * .18;
          g.fillStyle = ART.vgrad(g, 0, top, top + rh*0.25,
                                  [ART.a(r.tint,.35), ART.a(r.tint,0)]);
          g.fillRect(x, top, wd, rh*0.25);
          g.restore();
        }

        if (r.ok && k > 0.5){
          const px = x + wd*(0.14 + r.fx*0.7);
          drawPennant(px, top, Math.max(9, rh*0.85), r.tint);
        }

        if (r.gate >= 0) drawGate(x, top, wd, rh, r, k);
      }
      
      drawTower(x - L.wallW*0.055, true);
      drawTower(x + wd - L.wallW*0.005, false);
      
      const wtop = sy(wallTop()), wbot = sy(0);
      if (wbot > 0 && wtop < L.H){
        const gr = g.createLinearGradient(x, 0, x+wd, 0);
        gr.addColorStop(0, ART.a(PAL.sun,.20));
        gr.addColorStop(0.42, ART.a(PAL.sun,.04));
        gr.addColorStop(1, ART.a(PAL.shade,.30));
        g.save(); g.fillStyle=gr; g.fillRect(x, Math.max(-4,wtop), wd, Math.min(L.H+8, wbot)-Math.max(-4,wtop));
        g.restore();
      }
      
      const capY = sy(wallTop());
      if (capY > -10 && capY < L.H){
        g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.16;
        g.fillStyle = PAL.sun; g.fillRect(x, capY-1, wd, Math.max(2, L.rowH*0.07)); g.restore();
      }
    }

    function drawCourses(x, top, wd, rh, row){
      const courses = Math.max(1, Math.round(rh / L.rowH));
      const ch = rh / courses;
      const bw = Math.max(26, wd/13);
      const gap = Math.max(2.2, ch*0.10);
      g.save();
      g.beginPath(); ART.rr(g, x, top, wd, rh, 3); g.clip();
      
      g.fillStyle = ART.vgrad(g, 0, top, top+rh, ['#4A2C10','#2A1808']);
      g.fillRect(x, top, wd, rh);
      for (let c=0;c<courses;c++){
        const cy = top + c*ch, off = ((row+c)%2) ? bw/2 : 0;
        for (let bx = x - off; bx < x + wd; bx += bw){
          const x0 = Math.max(x, bx), x1 = Math.min(x+wd, bx+bw-gap);
          if (x1 - x0 < 3) continue;
          const nn = Math.sin((bx*0.37 + cy*0.113 + row*2.7))*43758.5453;
          const v  = ((nn % 1)+1)%1;
          const c0 = ART.mix('#A66C2E', '#D6A063', v);
          const c1 = ART.mix('#573410', '#8A5620', v);
          const by = cy+gap*0.5, bhh = ch-gap;
          g.fillStyle = ART.vgrad(g, 0, by, by+bhh, [c0, c1]);
          ART.rr(g, x0, by, x1-x0, bhh, 1.6); g.fill();
          
          g.save(); g.globalAlpha=.26; g.fillStyle='#FFF1D0';
          g.fillRect(x0+1, by+0.6, x1-x0-2, Math.max(1, bhh*0.11)); g.restore();
          
          g.save(); g.globalAlpha=.42; g.fillStyle='#4A2B10';
          g.fillRect(x0+1, by+bhh-Math.max(1.2,bhh*0.20), x1-x0-2, Math.max(1.2, bhh*0.20)); g.restore();
          
          g.save(); g.globalAlpha=.28; g.fillStyle=SHADE;
          g.fillRect(x1-Math.max(1.2,(x1-x0)*0.07), by, Math.max(1.2,(x1-x0)*0.07), bhh); g.restore();
        }
      }
      g.restore();
    }

    function drawTower(tx, leftSide){
      if (!S.rows.length) return;
      const tw = L.wallW*0.060;
      const gy = sy(0), tp = sy(wallTop()) - L.rowH*0.55;
      if (tp > L.H || gy < -10) return;
      const hgt = gy - tp;
      g.save();
      
      ART.drop(g, tx + tw/2, gy + L.H*0.012, tw*1.9, L.H*0.016, PAL.shade, .42, hgt*0.55);
      
      g.fillStyle = ART.vgrad(g, 0, tp, gy, ['#C89154','#7E4E1E']);
      ART.rr(g, tx, tp, tw, hgt, 3); g.fill();
      
      g.save(); g.beginPath(); ART.rr(g, tx, tp, tw, hgt, 3); g.clip();
      const ch = L.rowH*0.62;
      for (let yy = tp + ch; yy < gy; yy += ch){
        g.globalAlpha=.42; g.fillStyle='#3A230C'; g.fillRect(tx, yy, tw, Math.max(1.6, ch*0.13));
        g.globalAlpha=.22; g.fillStyle='#FFE9BE'; g.fillRect(tx, yy+Math.max(1.6,ch*0.13), tw, Math.max(1, ch*0.08));
      }
      g.restore();
      
      g.fillStyle = ART.vgrad(g, 0, tp, gy, [ART.a(PAL.sun,.30), ART.a(PAL.sun,.04)]);
      g.fillRect(tx, tp, Math.max(2.5, tw*0.16), hgt);
      g.fillStyle = ART.a(PAL.shade,.32);
      g.fillRect(tx + tw - Math.max(2.5, tw*0.18), tp, Math.max(2.5, tw*0.18), hgt);
      
      const mw = tw/5;
      for (let m=0;m<3;m++){
        const mx = tx + m*2*mw;
        g.fillStyle = ART.vgrad(g, 0, tp - L.rowH*0.42, tp, ['#D8A366','#8E5C28']);
        ART.rr(g, mx, tp - L.rowH*0.42, mw*1.05, L.rowH*0.46, 2); g.fill();
        g.save(); g.globalAlpha=.30; g.fillStyle='#FFF1D0';
        g.fillRect(mx, tp - L.rowH*0.42, mw*1.05, Math.max(1.2, L.rowH*0.06)); g.restore();
      }
      
      g.fillStyle = ART.a('#2A1608',.85);
      ART.rr(g, tx + tw*0.40, tp + L.rowH*0.55, tw*0.20, L.rowH*0.75, 2); g.fill();
      g.restore();
    }

    function drawPennant(px, top, hgt, tint){
      g.save();
      g.strokeStyle = WOOD[2]; g.lineWidth = Math.max(1.6, hgt*0.11); g.lineCap='round';
      g.beginPath(); g.moveTo(px, top+2); g.lineTo(px, top-hgt); g.stroke();
      const fl = R?0:Math.sin(S.t*0.005 + px)*hgt*0.10;
      g.beginPath(); g.moveTo(px, top-hgt);
      g.quadraticCurveTo(px+hgt*0.55, top-hgt+fl, px+hgt*1.05, top-hgt+hgt*0.22);
      g.quadraticCurveTo(px+hgt*0.55, top-hgt+hgt*0.30+fl, px, top-hgt+hgt*0.48);
      g.closePath();
      g.fillStyle = ART.vgrad(g, 0, top-hgt, top-hgt*0.5, [ART.mix(tint,'#FFFFFF',.35), tint]);
      g.fill();
      g.globalAlpha=.35; g.fillStyle='#000';
      g.beginPath(); g.moveTo(px, top-hgt+hgt*0.28);
      g.quadraticCurveTo(px+hgt*0.4, top-hgt+hgt*0.34, px+hgt*0.72, top-hgt+hgt*0.30);
      g.lineTo(px, top-hgt+hgt*0.48); g.closePath(); g.fill();
      g.restore();
    }

    function drawGate(x, top, wd, rh, r, k){
      const ahF = rh*0.74, aw = Math.min(wd*0.23, ahF*1.05);
      const kk = R ? 1 : Math.min(1, (r.t||0)/520);
      const ah = aw/2 + (ahF - aw/2)*ART.easeOut(kk);
      const ax = x + wd/2 - aw/2, ay = top + rh - ah;
      const cx = ax + aw/2, spring = ay + aw*0.52;

      g.save();
      g.beginPath();
      g.moveTo(ax - aw*0.13, top + rh);
      g.lineTo(ax - aw*0.13, spring);
      g.quadraticCurveTo(ax - aw*0.10, ay - aw*0.20, cx, ay - aw*0.22);
      g.quadraticCurveTo(ax + aw*1.10, ay - aw*0.20, ax + aw*1.13, spring);
      g.lineTo(ax + aw*1.13, top + rh);
      g.closePath();
      g.fillStyle = ART.vgrad(g, 0, ay-aw*0.2, top+rh, ['#F0D3A2', '#B0854E']);
      g.fill();
      g.save(); g.globalAlpha=.45; g.strokeStyle='#4A2B10'; g.lineWidth=Math.max(1.4, rh*0.030);
      g.stroke(); g.restore();
      g.restore();

      g.save();
      g.beginPath();
      g.moveTo(ax, top + rh);
      g.lineTo(ax, spring);
      g.quadraticCurveTo(ax + aw*0.04, ay + aw*0.06, cx, ay);
      g.quadraticCurveTo(ax + aw*0.96, ay + aw*0.06, ax + aw, spring);
      g.lineTo(ax + aw, top + rh);
      g.closePath();
      g.save(); g.clip();
      const lit = kk > 0.6;
      g.fillStyle = ART.vgrad(g, 0, ay, top+rh,
        lit ? ['#3A1E0C', ART.mix(PAL.window,'#8A4A12',.45)] : ['#2A1608','#40260F']);
      g.fillRect(ax-2, ay-2, aw+4, ah+4);
      if (lit){
        g.save(); g.globalCompositeOperation='lighter';
        const pulse = R?1:(0.86+0.14*Math.sin(S.t*0.003 + r.fx*6));
        g.globalAlpha = .55*pulse;
        g.fillStyle = ART.rgrad(g, cx, top+rh, 0, ah*1.1,
                                [ART.a(PAL.window,.95), ART.a(PAL.window,.35), ART.a(PAL.window,0)]);
        g.fillRect(ax-2, ay-2, aw+4, ah+4);
        g.restore();
        
        g.save();
        const dw = aw*0.31, dy0 = spring - aw*0.05, dh = (top + rh) - dy0;
        [[ax + aw*0.02, 1], [ax + aw*0.98 - dw, -1]].forEach(([dx, sgn])=>{
          g.fillStyle = ART.vgrad(g, 0, dy0, dy0+dh,
            [ART.mix(WOOD[1], sgn>0 ? '#E3AE63' : ART.mix(PAL.shade,'#2A1808',.5), .42), WOOD[2]]);
          ART.rr(g, dx, dy0, dw, dh, aw*0.05); g.fill();
          g.save(); g.globalAlpha=.34; g.strokeStyle=ART.a('#FFE9BE',.9);
          g.lineWidth=Math.max(1, aw*0.022);
          for (let k2=1;k2<4;k2++){
            g.beginPath(); g.moveTo(dx+dw*k2/4, dy0+2); g.lineTo(dx+dw*k2/4, dy0+dh-2); g.stroke();
          }
          g.restore();
          g.save(); g.globalAlpha=.60; g.fillStyle=ART.a(FX.gold,.95);
          g.beginPath(); g.arc(dx + dw*(sgn>0 ? 0.84 : 0.16), dy0 + dh*0.5,
                               Math.max(1.4, aw*0.035), 0, 7); g.fill(); g.restore();
        });
        
        g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.45;
        g.fillStyle = ART.rgrad(g, cx, top+rh, 0, aw*0.75,
                                [ART.a(PAL.window,.85), ART.a(PAL.window,0)]);
        g.beginPath(); g.ellipse(cx, top+rh, aw*0.42, ah*0.30, 0, 0, 7); g.fill(); g.restore();
        g.restore();
      }
      g.restore();
      
      g.strokeStyle = ART.a('#FFE9BE',.55); g.lineWidth = Math.max(1.4, rh*0.035);
      g.stroke();
      g.restore();

      const bh = Math.max(6, rh*0.21), by = top + rh*0.085;
      g.save();
      g.globalAlpha = R ? 1 : ART.clamp(k*1.4,0,1);
      g.fillStyle = ART.a(SHADE,.40);
      ART.rr(g, ax - aw*0.30, by-2, aw*1.6, bh+5, 3); g.fill();
      g.save();
      g.beginPath(); g.rect(ax - aw*0.28, by, aw*1.56, bh); g.clip();
      ART.saduBand(g, ax - aw*0.28, by, aw*1.56, bh, SADU);
      g.restore();
      g.globalAlpha *= .5; g.fillStyle = ART.a('#FFFFFF',.5);
      g.fillRect(ax - aw*0.28, by, aw*1.56, Math.max(1, bh*0.16));
      g.restore();

      if (kk > 0.6) [ax - aw*0.24, ax + aw*1.24].forEach((lx,ii)=>{
        const ly = spring - rh*0.05;
        ART.glow(g, lx, ly, Math.max(10, rh*0.42), PAL.window, R?.4:.45+0.10*Math.sin(S.t*0.004+ii));
        g.save();
        g.fillStyle = WOOD[2];
        ART.rr(g, lx-Math.max(2,rh*0.05), ly-rh*0.22, Math.max(4,rh*0.10), rh*0.10, 1); g.fill();
        g.fillStyle = ART.vgrad(g, 0, ly-rh*0.22, ly+rh*0.14, [PAL.sun, '#E08A25']);
        ART.rr(g, lx-Math.max(4,rh*0.10), ly-rh*0.20, Math.max(8,rh*0.20), rh*0.34, 3); g.fill();
        g.save(); g.globalAlpha=.55; g.fillStyle='#FFF6D8';
        ART.rr(g, lx-Math.max(2,rh*0.05), ly-rh*0.16, Math.max(4,rh*0.06), rh*0.22, 2); g.fill(); g.restore();
        g.restore();
      });
    }

    function drawSlots(){
      if (S.done) return;                       
      const y = L.slotY, ht = L.slotH, lit = S.revealT < 1500, crest = y + ht;

      g.save();
      g.beginPath(); g.rect(L.wallX - 4, y - ht*0.7, L.wallW + 8, ht*2.4); g.clip();
      for (let i=0;i<N;i++){
        const px = slotX(i), on = lit && S.reveal === i;
        const rad = Math.max(2, Math.min(4, ht*0.05));
        const v = 0.60 + 0.30*(((i*7 + S.idx*3) % 5)/4);     
        
        g.save();
        const ph2 = Math.max(3, ht*0.10);
        g.fillStyle = ART.vgrad(g, 0, crest, crest+ph2,
          [ART.mix('#C08A45','#E8C287',.30), ART.mix('#4E2F0E','#7E4B1A',.5)]);
        ART.rr(g, px - L.slotW*0.045, crest, L.slotW*1.09, ph2, 1.5); g.fill();
        g.globalAlpha=.34; g.fillStyle='#FFF1D0';
        g.fillRect(px - L.slotW*0.045, crest, L.slotW*1.09, Math.max(1.1, ph2*0.24));
        g.restore();
        
        ART.drop(g, px + L.slotW*0.5, crest + Math.max(3, ht*0.06),
                 L.slotW*0.52, Math.max(3, ht*0.085), SHADE, .50, ht*0.22);
        if (on) ART.glow(g, px + L.slotW/2, y + ht/2, L.slotW*0.62, FX.goodGlow, .55);
        
        const c0 = on ? ART.mix(FX.good,'#FFFFFF',.46) : ART.mix('#A66C2E','#D6A063', v);
        const c1 = on ? '#128A57'                      : ART.mix('#573410','#8A5620', v);
        g.fillStyle = ART.vgrad(g, 0, y, y+ht, [c0, c1]);
        ART.rr(g, px, y, L.slotW, ht, rad); g.fill();
        g.save();
        ART.rr(g, px, y, L.slotW, ht, rad); g.clip();
        
        g.globalAlpha=.26; g.fillStyle='#FFF1D0';
        g.fillRect(px, y, L.slotW, Math.max(1.4, ht*0.09));
        g.globalAlpha=.42; g.fillStyle='#4A2B10';
        g.fillRect(px, y + ht - Math.max(1.6, ht*0.13), L.slotW, Math.max(1.6, ht*0.13));
        
        g.globalAlpha=1;
        g.fillStyle = ART.a(PAL.sun,.20);
        g.fillRect(px, y, Math.max(2, L.slotW*0.06), ht);
        g.fillStyle = ART.a(PAL.shade,.28);
        g.fillRect(px + L.slotW - Math.max(2, L.slotW*0.08), y, Math.max(2, L.slotW*0.08), ht);
        
        for (let k=0;k<9;k++){
          const nx = px + L.slotW*(0.06 + ((k*0.2837 + i*0.11) % 0.88));
          const ny = y  + ht*(0.10 + ((k*0.4139 + i*0.23) % 0.80));
          const nr = Math.max(0.8, ht*(0.012 + 0.016*((k*0.17)%1)));
          g.globalAlpha = .16; g.fillStyle = k%2 ? '#3A2108' : '#FFE9BE';
          g.beginPath(); g.ellipse(nx, ny, nr*1.7, nr, 0.4, 0, 7); g.fill();
        }
        g.globalAlpha=.20; g.strokeStyle='#FFF1D0'; g.lineWidth=Math.max(1, ht*0.012);
        for (let k=0;k<4;k++){
          const cx2 = px + L.slotW*(0.10 + k*0.26);
          g.beginPath(); g.moveTo(cx2, y + ht*0.14);
          g.lineTo(cx2 + ht*0.07, y + ht*0.24); g.stroke();
        }
        
        const iw = L.slotW*0.86, ih = ht*0.46;
        const ix = px + (L.slotW - iw)/2, iy = y + (ht - ih)/2;
        const bev = Math.max(1.4, ih*0.12);
        
        g.globalAlpha=.40; g.fillStyle='#FFE9BE';
        ART.rr(g, ix, iy + bev, iw, ih, ih*0.20); g.fill();
        
        g.globalAlpha= on ? .22 : .34; g.fillStyle='#2A1708';
        ART.rr(g, ix, iy, iw, ih, ih*0.20); g.fill();
        g.globalAlpha=.30; g.fillStyle='#150C03';
        ART.rr(g, ix, iy, iw, Math.max(1.6, ih*0.20), ih*0.20); g.fill();
        g.restore();
        
        if (on){
          g.save(); g.globalAlpha=.85; g.strokeStyle = FX.white;
          g.lineWidth = Math.max(2, 2.5 + Math.sin(S.revealT/110)*2.5);
          ART.rr(g, px+1, y+1, L.slotW-2, ht-2, rad); g.stroke(); g.restore();
        }
      }
      g.restore();
    }

    function drawCrane(s){
      const py = L.pivotY, tx = L.cx + L.trolley*s;
      const beamY = py - L.stoneR*0.72, bh = Math.max(6, L.stoneR*0.44);
      
      const hdH = Math.max(5, L.stoneR*0.34), hdY = Math.max(3, L.H*0.010);
      g.save();
      ART.drop(g, L.W*0.5, hdY + hdH + 3, L.W*0.42, hdH*0.5, PAL.shade, .22, hdH*1.6);
      g.fillStyle = ART.vgrad(g, 0, hdY, hdY+hdH, [WOOD[0], WOOD[2]]);
      ART.rr(g, -12, hdY, L.W + 24, hdH, hdH*0.3); g.fill();
      g.globalAlpha=.42; g.fillStyle=ART.a('#FFE9BE',.95);
      g.fillRect(-12, hdY, L.W + 24, Math.max(1.2, hdH*0.18));
      g.restore();
      g.save();
      
      g.strokeStyle = ROPE; g.lineWidth = Math.max(3, L.stoneR*0.20); g.lineCap='round';
      [0.08, 0.92].forEach((f,ii)=>{
        const lx = L.wallX + L.wallW*f, sw = R?0:Math.sin(S.t*0.0009+ii)*L.stoneR*0.14;
        g.beginPath(); g.moveTo(lx+sw*0.6, hdY + hdH*0.5);
        g.quadraticCurveTo(lx+sw, beamY*0.55, lx, beamY+2); g.stroke();
      });
      
      [0.08, 0.92].forEach(f=>{ const lx = L.wallX + L.wallW*f;
        g.save(); g.strokeStyle = ART.a('#F0D6A0',.95); g.lineWidth = Math.max(1.2, hdH*0.16);
        for (let k2=0;k2<3;k2++){
          g.beginPath(); g.moveTo(lx - hdH*0.55, hdY + hdH*0.18 + k2*hdH*0.28);
          g.lineTo(lx + hdH*0.55, hdY + hdH*0.12 + k2*hdH*0.28); g.stroke();
        }
        g.restore(); });
      
      ART.drop(g, (L.wallX+L.wallW/2), beamY + bh + 4, L.wallW*0.45, bh*0.5, PAL.shade, .30, bh*1.2);
      g.fillStyle = ART.vgrad(g, 0, beamY, beamY+bh, [WOOD[0], WOOD[2]]);
      ART.rr(g, L.wallX - 10, beamY, L.wallW + 20, bh, bh*0.34); g.fill();
      g.globalAlpha=.45; g.fillStyle=ART.a('#FFE9BE',.95);
      g.fillRect(L.wallX - 10, beamY, L.wallW + 20, Math.max(1.5, bh*0.16));
      g.globalAlpha=.28; g.strokeStyle='#3A1E0C'; g.lineWidth=Math.max(1, bh*0.10);
      for (let bx=L.wallX; bx<L.wallX+L.wallW; bx+=Math.max(30, L.wallW/9)){
        g.beginPath(); g.moveTo(bx, beamY+bh*0.25); g.lineTo(bx+bh*0.5, beamY+bh*0.8); g.stroke();
      }
      g.globalAlpha=1;
      
      [L.wallX + L.wallW*0.08, L.wallX + L.wallW*0.92].forEach(lx=>{
        g.strokeStyle=ROPE; g.lineWidth=Math.max(1.6, bh*0.16);
        for (let k2=0;k2<3;k2++){
          g.beginPath();
          g.moveTo(lx-bh*0.55, beamY+bh*0.18+k2*bh*0.26);
          g.lineTo(lx+bh*0.55, beamY+bh*0.10+k2*bh*0.26); g.stroke();
        }
      });
      
      g.fillStyle = ART.vgrad(g, 0, beamY+bh, beamY+bh+L.stoneR*0.5, [WOOD[0], WOOD[2]]);
      ART.rr(g, tx - L.stoneR*0.42, beamY + bh - 1, L.stoneR*0.84, L.stoneR*0.42, 3); g.fill();
      const pr = L.stoneR*0.30, pyy = beamY + bh + L.stoneR*0.42;
      g.beginPath(); g.arc(tx, pyy, pr, 0, 7);
      g.fillStyle = ART.vgrad(g, 0, pyy-pr, pyy+pr, [ART.mix(WOOD[0],'#FFFFFF',.3), WOOD[2]]); g.fill();
      g.strokeStyle = ART.a('#3A1E0C',.6); g.lineWidth=Math.max(1, pr*0.22); g.stroke();
      g.fillStyle = ART.a('#FFE9BE',.85);
      g.beginPath(); g.arc(tx, pyy, pr*0.28, 0, 7); g.fill();
      g.restore();

      g.save();
      g.strokeStyle = ROPE; g.lineWidth = Math.max(1.8, L.stoneR*0.13); g.lineCap='round';
      if (S.phase === 'swing' || S.phase === 'return'){
        g.beginPath(); g.moveTo(tx, pyy);
        g.lineTo(S.stone.x, S.stone.y - L.stoneR*0.45); g.stroke();
        g.globalAlpha=.35; g.strokeStyle=ART.a('#FFF3C4',.9); g.lineWidth=Math.max(1,L.stoneR*0.05);
        g.beginPath(); g.moveTo(tx, pyy); g.lineTo(S.stone.x, S.stone.y - L.stoneR*0.45); g.stroke();
      } else {
        const sw = R?0:Math.sin(S.t*0.004)*L.stoneR*0.3;
        g.beginPath(); g.moveTo(tx, pyy);
        g.quadraticCurveTo(tx+sw*0.5, pyy+L.stoneR*0.9, tx+sw, pyy+L.stoneR*1.7); g.stroke();
      }
      g.restore();
    }

    function drawPlumb(){
      if (S.phase !== 'swing' || S.done) return;
      const x0 = S.stone.x;
      g.save();
      g.globalAlpha=.32; g.strokeStyle=ART.a(SHADE,.9);
      g.setLineDash([5,9]); g.lineWidth=Math.max(1.5, L.H*0.003);
      g.beginPath(); g.moveTo(x0, S.stone.y + L.stoneR*0.9); g.lineTo(x0, L.slotY - 12); g.stroke();
      g.setLineDash([]); g.restore();
      
      const t = Math.max(7, L.stoneR*0.40);
      ART.glow(g, x0, L.slotY - t*0.6, t*2.6, FX.goldLt, .45);
      g.save();
      g.beginPath();
      g.moveTo(x0, L.slotY - 2); g.lineTo(x0 - t, L.slotY - 2 - t*1.55); g.lineTo(x0 + t, L.slotY - 2 - t*1.55);
      g.closePath();
      g.fillStyle = ART.vgrad(g, 0, L.slotY-2-t*1.55, L.slotY-2, [FX.goldLt, '#E08A25']); g.fill();
      g.globalAlpha=.7; g.strokeStyle=ART.a('#FFFFFF',.9); g.lineWidth=Math.max(1,t*0.14);
      g.beginPath(); g.moveTo(x0 - t*0.8, L.slotY - 3 - t*1.35); g.lineTo(x0, L.slotY - 3 - t*1.55); g.stroke();
      g.restore();
    }

    function rockPath(r){
      const n = ROCKR.length;
      g.beginPath();
      for (let i=0;i<n;i++){
        const a1 = i/n*Math.PI*2, a2 = (i+1)/n*Math.PI*2;
        const r1 = r*ROCKR[i], r2 = r*ROCKR[(i+1)%n];
        const x1 = Math.cos(a1)*r1, y1 = Math.sin(a1)*r1*0.94;
        const x2 = Math.cos(a2)*r2, y2 = Math.sin(a2)*r2*0.94;
        if (i===0) g.moveTo(x1,y1);
        g.quadraticCurveTo((x1+x2)*0.56, (y1+y2)*0.56, x2, y2);
      }
      g.closePath();
    }

    function drawStone(){
      if (S.done) return;
      const sq = S.stone.sq, r = L.stoneR;
      
      const shY = S.phase==='fall' ? L.slotY + L.slotH*0.55 : L.slotY + L.slotH*0.55;
      const fall = ART.clamp(1 - (shY - S.stone.y)/(L.H*0.5), 0.18, 1);
      ART.drop(g, S.stone.x, shY, r*1.7*fall, r*0.45*fall, PAL.shade, .34*fall, r*0.9*fall);

      g.save();
      g.translate(S.stone.x, S.stone.y);
      g.rotate(S.stone.rot);
      g.scale(1 + sq*0.32, 1 - sq*0.38);
      
      rockPath(r);
      g.fillStyle = ART.vgrad(g, 0, -r, r, [STONE.lt, STONE.mid, STONE.dk]);
      g.fill();
      
      g.save(); rockPath(r); g.clip();
      g.fillStyle = ART.a('#2E1A08',.42);
      g.beginPath(); g.moveTo(r*0.12,-r*1.2); g.lineTo(r*1.3,-r*0.6);
      g.lineTo(r*1.3, r*1.3); g.lineTo(-r*0.2, r*1.3); g.closePath(); g.fill();
      
      g.globalAlpha=.35; g.strokeStyle='#3F2711'; g.lineWidth=Math.max(1, r*0.07);
      g.beginPath(); g.moveTo(-r*0.55,-r*0.15); g.lineTo(-r*0.05, r*0.10); g.lineTo(r*0.35,-r*0.05); g.stroke();
      g.globalAlpha=.28; g.fillStyle='#3F2711';
      g.beginPath(); g.arc(-r*0.2, r*0.42, r*0.13, 0, 7); g.fill();
      g.beginPath(); g.arc(r*0.42, r*0.30, r*0.09, 0, 7); g.fill();
      g.restore();
      
      g.save(); g.globalAlpha=.85; g.strokeStyle=ART.a(STONE.rim,.95);
      g.lineWidth=Math.max(1.6, r*0.14); g.lineJoin='round';
      g.beginPath();
      g.arc(0, 0, r*0.92, Math.PI*0.72, Math.PI*1.62);
      g.stroke(); g.restore();
      
      g.save(); g.globalAlpha=.5; g.fillStyle='#FFF6E0';
      g.beginPath(); g.ellipse(-r*0.34, -r*0.42, r*0.22, r*0.13, -0.5, 0, 7); g.fill(); g.restore();
      
      g.strokeStyle = ROPE; g.lineWidth = Math.max(1.5, r*0.13);
      g.beginPath(); g.arc(0, -r*0.86, r*0.20, Math.PI*1.15, Math.PI*1.85); g.stroke();
      g.restore();
    }

    function drawRings(){
      for (const q of S.rings){
        const k = q.t/620; if (k>1) continue;
        g.save(); g.globalAlpha = (1-k)*0.5;
        g.strokeStyle = q.col; g.lineWidth = Math.max(1.5, L.stoneR*0.18*(1-k));
        g.beginPath(); g.ellipse(q.x, q.y, L.stoneR*(0.6+k*4.2), L.stoneR*(0.18+k*1.15), 0, 0, 7);
        g.stroke(); g.restore();
      }
    }

    function frame(dtRaw){
      const dt = Math.min(48, dtRaw || 16);
      S.t += dt; S.tPhase += dt; S.revealT += dt;
      if (S.phase === 'swing') S.tSwing += dt;
      
      if (S.phase === 'swing' || S.phase === 'return') S.tBelt += dt;

      const s = drive();
      if (S.phase === 'swing'){
        S.stone.x = swingX(s); S.stone.y = swingY(s);
        S.stone.rot = -s*0.22;
      } else if (S.phase === 'fall'){
        S.stone.vy += S.stone.acc*dt;
        S.stone.y  += S.stone.vy*dt;
        S.stone.rot *= Math.pow(0.96, dt/16);
        if (S.stone.y >= L.slotY){ S.stone.y = L.slotY; land(); }
      } else if (S.phase === 'return'){
        const k = Math.min(1, S.tPhase/420), e = 1 - Math.pow(1-k, 3);
        S.stone.y += (swingY(s) - S.stone.y)*e*0.5;
        S.stone.x += (swingX(s) - S.stone.x)*e*0.5;
        if (k >= 1){ S.phase = 'swing'; S.tPhase = 0; }
      } else if (S.phase === 'settle'){
        const k = Math.min(1, S.tPhase/380);
        S.stone.sq = Math.sin(k*Math.PI)*0.55*(1 - k*0.5);
        S.stone.y  = L.slotY - Math.sin(k*Math.PI)*L.stoneR*0.35;
        S.stone.rot *= Math.pow(0.90, dt/16);
        if (k >= 1) S.stone.sq = 0;
      }

      S.cam += (S.camT - S.cam) * Math.min(1, dt/(R?60:170));
      shake.step(dt);
      parts.step(dt);
      pops.step(dt);
      for (const r of S.rows) r.t += dt;
      for (let i=S.rings.length-1;i>=0;i--){ S.rings[i].t += dt; if (S.rings[i].t > 620) S.rings.splice(i,1); }

      if (!S.done){
        for (let i=0;i<N;i++)
          labels[i].style.transform = 'translate('+Math.round(slotX(i) - L.wallX)+'px,0)';
      }

      const pl = pops.list();
      for (let i=0;i<popEls.length;i++){
        const p = pl[i], el = popEls[i];
        if (!p){ if (el.style.opacity !== '0') el.style.opacity = '0'; continue; }
        el.textContent = p.txt; el.style.color = p.col; el.style.opacity = String(p.op);
        el.style.fontSize = Math.round(L.base*1.45)+'px';
        el.style.transform = 'translate('+Math.round(p.x)+'px,'+Math.round(p.y)+'px) translate(-50%,-50%)';
      }

      g.clearRect(0, 0, L.W, L.H);
      g.save();
      shake.apply(g);
      drawSky();
      drawBack();
      drawGround();
      drawWall();
      drawSite();
      drawFore();
      drawSlots();
      drawPlumb();
      drawCrane(s);
      drawRings();
      drawStone();
      parts.draw(g);
      g.restore();
      
      const sun = sunPos();
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.07;
      g.fillStyle = ART.rgrad(g, sun.x, sun.y, 0, Math.max(L.W,L.H)*0.60,
                              [ART.a(PAL.sun,.55), ART.a(PAL.sunGlow,.10), ART.a(PAL.sunGlow,0)]);
      g.fillRect(0,0,L.W,L.H); g.restore();
      
      g.save(); g.globalCompositeOperation='multiply'; g.globalAlpha=.22;
      g.fillStyle = ART.vgrad(g, 0, 0, L.H,
        [ART.mix('#FFF0DA', PAL.haze, .34), '#FFEBCF', ART.mix('#C9A0CE', PAL.shade, .32)]);
      g.fillRect(0,0,L.W,L.H); g.restore();
      g.save(); g.globalAlpha=.20;
      g.fillStyle = ART.rgrad(g, L.W*0.5, L.H*0.44, Math.min(L.W,L.H)*0.28, Math.max(L.W,L.H)*0.78,
                              [ART.a(PAL.shade,0), ART.a(ART.mix(PAL.shade,'#2E1204',.42),.95)]);
      g.fillRect(0,0,L.W,L.H); g.restore();
      ART.vignette(g, L.W, L.H, 0.28);
    }

    function onTap(e){
      
      if (e && (e.target === btn || ask.contains(e.target))) return;
      drop();
    }
    function onBtn(e){ e.preventDefault(); drop(); }
    root.addEventListener('pointerdown', onTap);
    btn.addEventListener('click', onBtn);

    startRound();
    ctx.sync();
    ctx.say('good','الحجر يتأرجح فوق السور — اضغط في اللحظة المناسبة ليسقط على الموضع الصحيح.');
    ctx.raf(frame);

    return { destroy(){
      root.removeEventListener('pointerdown', onTap);
      btn.removeEventListener('click', onBtn);
      S.dead = true; S.phase = 'done';
      wrap.remove();
      if (cvw.cv && cvw.cv.parentNode) cvw.cv.parentNode.removeChild(cvw.cv);
      parts.clear();
      S.rings.length = 0;
      S.rows.length = 0;
    }};
  }
});

boot();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js')
    .catch(e => console.warn('SHIFT: تعذّر تجهيز العمل بلا شبكة —', e && e.message));
});
</script>
