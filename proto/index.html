    const COOL   = '#4A3E78';
     
    const DUSK   = { zenith:'#1B2650', sky:['#31417B','#6B5C93','#C4795E'],
                     sun:'#FFE0A6', sunGlow:'#FF9C5E' };
     
    const far    = c => mix(lt(c, .16), PH.wall[0], .34);

    const parts = new ART.Particles(260);
    const pops  = new ART.Pops();
    const SHK   = new ART.Shake();

    const ui = document.createElement('div');
    ui.style.cssText = 'position:absolute;inset:0;direction:rtl;pointer-events:none';
    root.appendChild(ui);

    const PILL = 'background:var(--surface);border:1px solid var(--line);border-radius:999px;' +
      'box-shadow:0 4px 14px rgba(0,0,0,.22)';

    const strip = document.createElement('div');
    strip.style.cssText = 'position:absolute;inset-inline:0;inset-block-start:0;height:' + STRIP + 'px;' +
      'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;box-sizing:border-box';
    const turn = document.createElement('div');
    turn.style.cssText = 'display:flex;align-items:center;gap:7px;min-width:0;font-size:' + (proj ? 19 : 14) +
      'px;font-weight:700;color:var(--ink);padding:' + (proj ? '9px 15px' : '6px 11px') + ';' + PILL;
    const dot = document.createElement('span');
    dot.style.cssText = 'flex:0 0 auto;width:' + (proj ? 16 : 12) + 'px;height:' + (proj ? 16 : 12) +
      'px;border-radius:50%;display:inline-block;background:var(--muted);box-shadow:0 0 0 3px rgba(255,255,255,.35)';
    const turnName = document.createElement('span');
    turnName.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    turn.append(dot, turnName);
    const rowN = document.createElement('div');
    rowN.style.cssText = 'flex:0 0 auto;font-size:' + (proj ? 17 : 14) + 'px;font-weight:700;letter-spacing:.04em;' +
      'color:var(--muted);padding:' + (proj ? '8px 14px' : '5px 10px') + ';' + PILL;
    const endBtn = document.createElement('button');
    endBtn.textContent = 'إنهاء';
    endBtn.style.cssText = 'flex:0 0 auto;pointer-events:auto;min-width:' + (proj ? 88 : 66) + 'px;min-height:' +
      (proj ? 64 : 48) + 'px;font:inherit;font-size:' + (proj ? 18 : 14) + 'px;font-weight:700;color:var(--muted);' +
      'background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;direction:rtl;' +
      'box-shadow:0 4px 14px rgba(0,0,0,.22)';
    strip.append(turn, rowN, endBtn);

    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute;inset-inline:0;inset-block-start:' + STRIP + 'px;padding:0 12px;' +
      'box-sizing:border-box;text-align:center';
    const card = document.createElement('div');
    card.style.cssText = 'display:inline-block;box-sizing:border-box;max-width:100%;text-align:center;' +
      'background:var(--surface);border:1px solid var(--line);border-radius:' + (proj ? 20 : 16) + 'px;' +
      'padding:' + (proj ? '13px 22px' : '9px 15px') + ';box-shadow:0 10px 26px rgba(0,0,0,.26)';
    const qEl = document.createElement('div');
    qEl.style.cssText = 'font-size:' + (proj ? 27 : 16) + 'px;font-weight:700;line-height:1.35;color:var(--ink);' +
      'max-width:46ch;margin:0 auto';
    const tipEl = document.createElement('div');
    tipEl.style.cssText = 'font-size:' + (proj ? 17 : 14) + 'px;color:var(--muted);margin-block-start:3px';
    card.append(qEl, tipEl);
    bar.appendChild(card);

    const dropEl = document.createElement('div');
    dropEl.textContent = 'أفلِت الخيط هنا';
    dropEl.style.cssText = 'position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .16s;' +
      'font-size:' + (proj ? 18 : 14) + 'px;font-weight:800;color:var(--pine);background:var(--pine-soft);' +
      'padding:6px 13px;border-radius:999px;white-space:nowrap;box-shadow:0 5px 16px rgba(0,0,0,.28)';

    const labWrap = document.createElement('div');
    labWrap.style.cssText = 'position:absolute;inset:0';
    const popWrap = document.createElement('div');
    popWrap.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    ui.append(strip, bar, labWrap, popWrap, dropEl);

    const popEls = [];
    function paintPops(){
      const list = pops.list();
      while (popEls.length < list.length){
        const d = document.createElement('div');
        d.style.cssText = 'position:absolute;transform:translate(-50%,-50%);font-weight:800;white-space:nowrap;' +
          'font-size:' + (proj ? 32 : 22) + 'px;text-shadow:0 3px 10px rgba(0,0,0,.45)';
        popWrap.appendChild(d); popEls.push(d);
      }
      for (let i = 0; i < popEls.length; i++){
        const e = popEls[i];
        if (i < list.length){
          const p = list[i];
          e.textContent = p.txt; e.style.color = p.col;
          e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
          e.style.opacity = p.op; e.style.display = 'block';
        } else e.style.display = 'none';
      }
    }

    let teamCol = FX.gold;
    function resolveTeam(){
      const t = (ctx.team && ctx.team()) || null;
      let c = (t && t.color) || '';
      const m = /var\((--[\w-]+)\)/.exec(c);
      if (m) c = (getComputedStyle(document.body).getPropertyValue(m[1]) || '').trim();
      teamCol = isHex(c) ? c : FX.gold;
    }

    let L = { W:0, H:0, r:24, rowH:12, loomX:0, loomW:10, span:10, railY:0, top:0, bot:0 };
    function layout(){
      const W = w(), H = h(), prev = L;
      const pad = Math.max(10, Math.min(W, H) * 0.045);
      const r = Math.max(proj ? 30 : 24, Math.min(proj ? 54 : 40, Math.min(W, H) * 0.075));
      tipEl.style.display = (!proj && H < 430) ? 'none' : '';        
      const head = Math.max(proj ? 116 : 88, STRIP + bar.offsetHeight + 8);
      const loomW = Math.min(W - pad * 2, proj ? 940 : 660, Math.max(340, W * 0.755));
      const loomX = (W - loomW) / 2;
      const railY = head + r + 4;
      const gap = Math.min(proj ? 58 : 46, Math.max(30, H * 0.09));   
      const top = railY + r + gap;
      const bot = H - pad - (proj ? 16 : 10);
      const inner = Math.max(70, bot - top);
      const n = Math.max(1, ITEMS.length);
      const rowH = Math.max(7, Math.min(proj ? 34 : 25, inner / (n + 4.3)));
      const loA = Math.max(2, loomX - r), loB = Math.min(W - 2, loomX + loomW + r);  
      L = { W, H, pad, r, head, loomW, loomX, railY, top, bot, rowH, loA, loB, span: Math.max(60, loB - loA) };
       
      L.vTop = Math.max(top, bot - Math.max((ITEMS.length + 5) * rowH, (bot - top) * 0.55));
      L.floorY = Math.max(head + 10, Math.min(L.vTop - 18, L.vTop - (L.vTop - head) * 0.46));
       
      L.preH = L.rowH * 3;
      L.fellB = L.bot - L.preH;                       
       
      { const gl = loomX, yT = Math.max(10, head * 0.52);
        const big = gl >= (proj ? 150 : 104);
        const dw = big ? Math.min(gl * 0.34, proj ? 132 : 100) : Math.min(gl * 0.62, 74);
        const dh = big ? Math.min(L.floorY - yT, H * 0.46) : Math.min(L.floorY - yT - 10, 96);
        L.door = (gl >= 46 && L.floorY - yT >= 56 && dw >= 32 && dh >= 46)
               ? { x: Math.max(7, gl * 0.045), y: L.floorY - dh, w: dw, h: dh } : null;
        L.doorX0 = L.door ? L.door.x - 10 : -999;
        L.doorX1 = L.door ? L.door.x + dw + 10 : -999; }
      L.gapR = W - (loomX + loomW);
      L.wide = L.gapR > (proj ? 156 : 108);
      L.lx = L.wide ? (loomX + loomW) + L.gapR * 0.52 : W * 0.88;
      L.ly = L.wide ? Math.max(head + (proj ? 62 : 46), L.floorY - (proj ? 116 : 78)) : head * 0.40;
       
      L.wy = H - Math.max(16, H * 0.052);
      L.ws = Math.max(0.60, Math.min(proj ? 3.0 : 2.3,
             Math.min(L.gapR / 27, (L.wy - head) / 74)));
      L.wx = loomX + loomW + L.gapR * 0.35;
      L.wOn = L.gapR > (proj ? 86 : 62) && (L.wy - head) > 96;
      L.wFar = false;
      if (!L.wOn){                                    
        const band = L.vTop - L.floorY;
        if (band > 34 && W > 300){
          L.wOn = true; L.wFar = true;
          L.ws = Math.max(0.55, Math.min(1.15, band / 68));
          L.wy = L.floorY + band * 0.94;
          L.wx = W * 0.80;
        }
      }
       
      if (prev && prev.span > 1 && Math.abs(prev.span - L.span) > 1)
        for (let i = 0; i < opts.length; i++)
          opts[i].x = L.loA + ((opts[i].x - prev.loA) / prev.span) * L.span;
      const mw = Math.max(78, L.span / Math.max(1, opts.length || 3) - 10);
      for (let i = 0; i < opts.length; i++) opts[i].el.style.maxWidth = mw + 'px';
    }

    let idx = 0, phase = 'play', answered = false, dead = false;
    let opts = [], rows = [], hold = null, weave = null, fly = null;
    let optA = 0, warp = 0, glow = 0, roundT = 0, flash = 0, flashY = 0, flashC = THREAD[0];
    let wRe = null;                                       

    resolveTeam(); layout();
    onResize(() => layout());

    const rowTop = k => (L.fellB || L.bot) - (k + 1) * L.rowH;
    const col = i => THREAD[i % THREAD.length];

    function makeLabel(){
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;transform:translate(-50%,0);text-align:center;line-height:1.25;' +
        'font-size:' + (proj ? 19 : 14) + 'px;font-weight:700;color:var(--ink);background:var(--surface);' +
        'padding:' + (proj ? '6px 13px' : '5px 11px') + ';border-radius:999px;border:2px solid var(--line);' +
        'box-sizing:border-box;box-shadow:0 6px 16px rgba(0,0,0,.26)';
      labWrap.appendChild(d);
      return d;
    }

    function syncTurn(){
      const t = (ctx.team && ctx.team()) || null;
      turnName.textContent = t ? ('دور ' + t.name) : '';
      if (t && t.color) dot.style.background = t.color;
      resolveTeam();
    }

    function newRound(){
      const it = ITEMS[idx];
      if (!it){ finish(); return; }
      const pool = ctx.shuffle(it.a.map((t, i) => ({ t, ok: i === it.c })));
      labWrap.textContent = '';
      opts = pool.map((o, i) => {
        const el = makeLabel();
        el.textContent = o.t;
        el.style.borderColor = EDGE[i % EDGE.length];
        return { t:o.t, ok:o.ok, ci:i % THREAD.length, el,
                 x: L.loA + (i + 0.5) * (L.span / pool.length),
                 dx:0, dy:0, vx:0, vy:0, sq:{ s:0, ang:0 } };
      });
      qEl.textContent = it.q;
      tipEl.textContent = idx < 2 ? 'اسحب بكرة الخيط الصحيحة وأفلتها على السطر المضيء'
                                  : 'وصف النقش — أيّ خيط يناسب هذا السطر؟';
      rowN.textContent = 'السطر ' + (idx + 1) + ' من ' + ITEMS.length;
      syncTurn();
      answered = false; phase = 'play'; roundT = 0; optA = 0; fly = null; hold = null;
      ctx.after(0, () => { if (!dead) layout(); });
      layout();
    }

    function burst(x, y, ci, n){
      if (red) return;
      const c = col(ci);
      parts.burst(x, y, n, { col:c, sp0:0.05, sp1:0.30, r0:1.5, r1:4.4, up:0.05, g:0.00034 });
      parts.burst(x, y, Math.round(n * 0.45), { col:CREAM, sp0:0.04, sp1:0.22, r0:1.2, r1:3.4, up:0.07, g:0.00018 });
    }

    function startWeave(ci, good){
      weave = { p:0, ci, motif: idx % 4, good };
      optA = 0; wRe = { good: !!good, t:0 };              
      if (!red){ SHK.hit(good ? 7 : 3.4); warp = 1; }
      burst(L.loomX + L.loomW * 0.85, rowTop(rows.length) + L.rowH / 2, ci, good ? 26 : 10);
      if (good && !red)
        parts.burst(L.loomX + L.loomW * 0.85, rowTop(rows.length) + L.rowH / 2, 14,
          { col:FX.goldLt, shape:'star', sp0:0.09, sp1:0.36, r0:2.2, r1:5.6, up:0.09, g:0.00022 });
    }

    function commit(i){
      if (answered) return;
      answered = true; phase = 'resolve'; hold = null;
      const it = ITEMS[idx], o = opts[i];
      const base = { q: it.q, obj: it.obj || C.obj || 'التراث', correct: it.a[it.c] };
      if (o.ok){
        const fast = roundT < 9000;
        const pts = fast ? 14 : 10;
        ctx.correct(pts, Object.assign({ right:true }, base));
        ctx.beep('good');
        ctx.say('good', '<b>شُدَّ الخيط وثبت في النقش.</b> ' + ctx.esc(it.note || '') +
          (fast ? ' <b>+٤ لسرعة الشدّ</b>' : ''));
        pops.add(o.x + o.dx, L.railY + o.dy - L.r, '+' + pts, isHex(teamCol) ? teamCol : FX.gold);
        startWeave(o.ci, true);
      } else {
        ctx.wrong(Object.assign({ right:false }, base));
        ctx.beep('soft');
        ctx.say('soft', 'الخيط لم يثبت — والصحيح: <b>' + ctx.esc(it.a[it.c]) + '</b>. ' + ctx.esc(it.note || ''));
        const ci = opts.findIndex(x => x.ok);
        if (ci >= 0){
          const o2 = opts[ci];
          o2.el.style.borderWidth = '3px';
          fly = { i:ci, t:0, d: red ? 140 : 480,
                  sx:o2.x + o2.dx, sy:L.railY + o2.dy,
                  tx:L.loomX + L.loomW * 0.5, ty:rowTop(rows.length) + L.rowH / 2 };
        } else startWeave(0, false);
      }
      ctx.next(); ctx.sync(); syncTurn();
    }

    function advance(){
      flash = 1; flashY = rowTop(rows.length) + L.rowH / 2; flashC = col(weave.ci);
      rows.push({ ci: weave.ci, motif: weave.motif });
      weave = null; idx++;
      if (idx >= ITEMS.length){
        phase = 'done'; opts = []; labWrap.textContent = '';
        qEl.textContent = 'اكتمل النقش — نُسِج ' + ITEMS.length + ' سطراً على النول.';
        tipEl.textContent = 'أحسنتم، هذه قطعة السدو الّتي نسجتموها.';
        rowN.textContent = 'تمّ النول';
        glow = 1; ctx.beep('win');
        if (!red){
          SHK.hit(8);
          for (let k = 0; k < 5; k++)
            parts.burst(L.loomX + L.loomW * (0.15 + k * 0.18), rowTop(rows.length - 1) + L.rowH * 0.5, 14,
              { col:FX.goldLt, shape:'star', sp0:0.06, sp1:0.30, r0:2.4, r1:6, up:0.10, g:0.00020 });
        }
        ctx.after(red ? 800 : 1800, finish);
      } else {
        ctx.after(red ? 200 : 430, () => { if (!dead) newRound(); });
      }
    }

    function finish(){ if (dead) return; dead = true; ctx.finish(); }
    endBtn.onclick = finish;

    const pt = e => { const b = cv.getBoundingClientRect(); return { x:e.clientX - b.left, y:e.clientY - b.top }; };
    function hit(o, p){
      const ox = o.x + o.dx, oy = L.railY + o.dy;
      if ((p.x - ox) * (p.x - ox) + (p.y - oy) * (p.y - oy) < (L.r * 1.3) * (L.r * 1.3)) return true;
      const pw = o.el.offsetWidth || 90, ph = o.el.offsetHeight || 30, ly = oy + L.r + 8;
      const lx = Math.max(pw / 2 + 4, Math.min(L.W - pw / 2 - 4, ox));   
      return p.x > lx - pw / 2 - 8 && p.x < lx + pw / 2 + 8 && p.y > ly - 8 && p.y < ly + ph + 8;
    }
    function inShed(x, y){
      const ry = rowTop(rows.length), m = Math.max(38, L.rowH * 2.2);
      return x > L.loomX - 26 && x < L.loomX + L.loomW + 26 && y > ry - m && y < ry + L.rowH + m;
    }
    function onDown(e){
      if (phase !== 'play' || answered) return;
      const p = pt(e);
      for (let i = opts.length - 1; i >= 0; i--){
        if (hit(opts[i], p)){
          hold = { i, px:p.x, py:p.y };
          opts[i].el.style.borderWidth = '3px';
          try { cv.setPointerCapture(e.pointerId); } catch (_){}
          ctx.beep('tick');
          e.preventDefault();
          return;
        }
      }
    }
    function onMove(e){ if (hold){ const p = pt(e); hold.px = p.x; hold.py = p.y; e.preventDefault(); } }
    function onUp(e){
      if (!hold) return;
      const i = hold.i, o = opts[i];
      const x = o.x + o.dx, y = L.railY + o.dy;
      o.el.style.borderWidth = '2px';
      hold = null; dropEl.style.opacity = '0';
      if (inShed(x, y)) commit(i);
      e.preventDefault();
    }
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);

    function room(t){
      const W = L.W, H = L.H, fy = L.floorY;

      g.fillStyle = ART.vgrad(g, 0, 0, fy,
        [mix(PH.wall[0], COOL, .34), mix(PH.wall[0], COOL, .15), PH.wall[1]]);
      g.fillRect(0, 0, W, fy + 1);

      const bh = Math.max(24, H * 0.048), bw = Math.max(58, W * 0.13);
      g.save();
      for (let ry = 0, row = 0; ry < fy; ry += bh, row++){        
        const off = (row % 2) ? bw / 2 : 0;
        let c = 0;
        for (let bx = -off; bx < W + bw; bx += bw, c++){
          const k = ((row * 7 + c * 13) % 5) / 5;
          g.globalAlpha = .16 + k * 0.13;
          g.fillStyle = (row + c) % 2 ? '#FFFFFF' : '#7A4E22';
          g.fillRect(bx + 2, ry + 2, bw - 4, Math.min(fy - ry, bh) - 4);
        }
      }
      g.globalAlpha = .40; g.strokeStyle = aa('#7A4E22', .55); g.lineWidth = 1.4;
      for (let ry = 0, row = 0; ry < fy; ry += bh, row++){
        g.beginPath(); g.moveTo(0, ry + .5); g.lineTo(W, ry + .5); g.stroke();
        const off = (row % 2) ? bw / 2 : 0;
        for (let bx = -off; bx < W + bw; bx += bw){
          g.beginPath(); g.moveTo(bx + .5, ry); g.lineTo(bx + .5, Math.min(fy, ry + bh)); g.stroke();
        }
      }
      g.globalAlpha = 1;
      g.fillStyle = ART.vgrad(g, 0, 0, fy * 0.42, [aa('#5A3A16', .40), aa('#5A3A16', 0)]);
      g.fillRect(0, 0, W, fy * 0.42);                              
      g.restore();

      g.save(); g.globalAlpha = .09;                       
      for (let i = 0; i < 9; i++){
        g.fillStyle = i % 2 ? '#FFFFFF' : '#7A4E22';
        ell(g, ((i * 137) % 100) / 100 * W, ((i * 61) % 100) / 100 * fy, W * 0.19, fy * 0.20, 0); g.fill();
      }
      g.restore();

      const lampR = L.lx > W * 0.5;
      const cw = g.createLinearGradient(0, 0, W, 0);
      cw.addColorStop(0,   aa(COOL, lampR ? .46 : .03));
      cw.addColorStop(.50, aa(COOL, .17));
      cw.addColorStop(1,   aa(COOL, lampR ? .03 : .46));
      g.save(); g.fillStyle = cw; g.fillRect(0, 0, W, fy + 1); g.restore();

      farLayer(fy);                                       

      g.fillStyle = ART.vgrad(g, 0, fy, H, [lt(PH.floor[0], .14), PH.floor[0], PH.floor[1]]);
      g.fillRect(0, fy, W, H - fy);
      g.fillStyle = ART.vgrad(g, 0, fy, fy + Math.max(18, H * 0.055),
        [aa('#3A210C', .50), aa('#3A210C', 0)]);           
      g.fillRect(0, fy, W, Math.max(18, H * 0.055));

      const ry0 = fy + Math.max(12, H * 0.030);
      g.fillStyle = ART.vgrad(g, 0, ry0, H, [lt(RUG, .14), RUG, RUGD]);
      g.fillRect(0, ry0, W, H - ry0);
      g.save(); g.globalAlpha = .10; g.fillStyle = '#3A140E';       
      for (let x = 0; x < W; x += 7) g.fillRect(x, ry0, 3, H - ry0);
      g.restore();
      const roomBand = L.vTop - ry0;
      if (roomBand > 62) rugBorder(ry0 + 3);
      else { g.fillStyle = aa('#FFE0AE', .22); g.fillRect(0, ry0, W, 2);
             g.fillStyle = aa('#2A0F0A', .30); g.fillRect(0, ry0 + 2, W, 3); }
      if (H - L.bot > 40) rugBorder(H - Math.max(26, H * 0.045));

      opening(fy);                                        

      if (L.wide && L.loomX > (proj ? 156 : 108))
        wallHang(L.loomX * 0.42, Math.max(L.head + 14, fy - Math.min(190, fy * 0.62)),
                 L.loomX * 0.46, Math.min(190, fy * 0.62) - 12);
      props();

      if (L.wide){
        const gl = L.loomX, gr = L.gapR;
        if (gl > (proj ? 156 : 108)){
          cushion(gl * 0.52, H - Math.max(26, H * 0.10), Math.min(52, gl * 0.30), THREAD[0]);
          yarnPile(gl * 0.82, H - Math.max(14, H * 0.05), Math.min(17, gl * 0.11));
        }
        cushion(L.wx + Math.min(30, gr * 0.16), H - Math.max(22, H * 0.075),
                Math.min(46, gr * 0.26), THREAD[3]);      
      }
    }

    function farLayer(fy){
      const W = L.W;
      const shY = fy - Math.max(3, fy * 0.015);              
      const hangTop = Math.max(6, L.head * 0.30);
      const hangBot = Math.min(fy - 30, L.railY - L.r * 0.58);
      const dx0 = L.doorX0 === undefined ? -1 : L.doorX0, dx1 = L.doorX1 === undefined ? -1 : L.doorX1;

      g.save();
       
      if (hangBot - hangTop > 34){
        const cols = [[far(CREAM), far(THREAD[0]), far(INKY)],
                      [far(THREAD[0]), far(CREAM), far(THREAD[3])],
                      [far(THREAD[3]), far(CREAM), far(THREAD[0])]];
        const ht = hangBot - hangTop;
        for (let i = 0; i < 7; i++){
          const cx = W * (0.045 + i * 0.156);
          if (cx > W * 0.33 && cx < W * 0.67) continue;    
          const wd = Math.max(24, Math.min(70, W * 0.062)), hh = ht * (0.70 + (i % 3) * 0.13);
          if (cx + wd / 2 > dx0 - 8 && cx - wd / 2 < dx1 + 8) continue;   
          const bg = i % 2 ? far(THREAD[3]) : far(RUG);    
          g.fillStyle = ART.vgrad(g, 0, hangTop, hangTop + hh, [lt(bg, .16), bg, mix(bg, '#4A2C14', .26)]);
          rr(g, cx - wd / 2, hangTop, wd, hh, 3); g.fill();
          const nb = Math.max(3, Math.floor(hh / 15));
          for (let k = 0; k < nb; k++)
            ART.saduBand(g, cx - wd / 2 + 3, hangTop + 7 + k * (hh - 14) / nb,
              wd - 6, (hh - 14) / nb * 0.78, cols[i % 3]);
          g.fillStyle = aa('#150B04', .26); g.fillRect(cx - wd / 2, hangTop, wd * 0.30, hh);
          g.fillStyle = aa('#150B04', .34);                 
          for (let f = 0; f < 5; f++) g.fillRect(cx - wd / 2 + 4 + f * (wd - 8) / 5, hangTop + hh, 2, 5);
          g.fillStyle = far(PH.woodLt); rr(g, cx - wd / 2 - 6, hangTop - 7, wd + 12, 6, 3); g.fill();
        }
      }
       
      if (shY > hangBot + 10){
        const sh = Math.max(5, L.r * 0.16);
        g.fillStyle = ART.vgrad(g, 0, shY, shY + sh, [far(lt(PH.woodLt, .30)), far(PH.wood[1])]);
        rr(g, W * 0.04, shY, W * 0.92, sh, 2); g.fill();
        g.fillStyle = aa('#150B04', .26); g.fillRect(W * 0.04, shY + sh - 1.5, W * 0.92, 1.8);
        const sk = [THREAD[0], THREAD[2], THREAD[3], THREAD[1], THREAD[0], THREAD[2], THREAD[3]];
        const rr0 = Math.max(6, Math.min(L.r * 0.42, (shY - hangBot) * 0.42));
        for (let i = 0; i < 7; i++){
          const cx = W * (0.10 + i * 0.132), c = far(sk[i]);
          if (cx > dx0 - rr0 && cx < dx1 + rr0) continue;
          g.fillStyle = ART.rgrad(g, cx - rr0 * 0.3, shY - rr0 * 1.3, rr0 * 0.1, rr0 * 2.0,
            [lt(c, .30), c, mix(c, '#4A2C14', .30)]);
          ell(g, cx, shY - rr0 * 0.86, rr0 * 1.05, rr0 * 0.9, 0); g.fill();
          g.save(); g.globalAlpha = .26; g.strokeStyle = mix(c, '#3A2010', .40);
          g.lineWidth = Math.max(1, rr0 * 0.13);
          for (let k = -1; k <= 1; k++){
            g.beginPath(); g.ellipse(cx, shY - rr0 * 0.86, rr0 * 0.86, rr0 * 0.34, k * 0.7, 0, 7); g.stroke();
          }
          g.restore();
        }
      }
       
      {
        const rx = W - Math.max(22, W * 0.045);
        const rh = Math.min(fy - hangTop, Math.max(46, (fy - hangBot) * 1.7)), rw = Math.max(13, W * 0.026);
        const c = far(RUG);
        g.fillStyle = ART.vgrad(g, 0, fy - rh, fy, [lt(c, .26), c, mix(c, '#3A1208', .30)]);
        rr(g, rx - rw / 2, fy - rh, rw, rh, rw * 0.5); g.fill();
        g.fillStyle = far(CREAM); ell(g, rx, fy - rh + rw * 0.16, rw * 0.48, rw * 0.20, 0); g.fill();
        g.fillStyle = aa('#150B04', .26); g.fillRect(rx - rw / 2, fy - rh, rw * 0.34, rh);
      }
       
      g.globalAlpha = .13; g.fillStyle = PH.wall[0]; g.fillRect(0, 0, W, fy);
      g.restore();
    }

    function opening(fy){
      if (!L.door) return;
      const W = L.W, wd = L.door.w, ht = L.door.h, x = L.door.x, y = L.door.y;
      const arc = Math.min(wd * 0.48, 26);

      g.fillStyle = ART.vgrad(g, 0, y - 10, y + ht, [lt(PH.woodLt, .26), PH.wood[0], PH.wood[2]]);
      rr(g, x - 8, y - 10, wd + 16, ht + 12, 7); g.fill();
      ART.rim(g, null, aa('#FFE9C0', .40), 2, .45);

      g.save();
      g.beginPath(); g.moveTo(x, y + ht); g.lineTo(x, y + arc);
      g.quadraticCurveTo(x, y, x + arc, y); g.lineTo(x + wd - arc, y);
      g.quadraticCurveTo(x + wd, y, x + wd, y + arc); g.lineTo(x + wd, y + ht); g.closePath();
      g.clip();
       
      g.save(); g.translate(x, y); ART.sky(g, W, ht, DUSK, ht * 0.80); g.restore();
      for (let i = 0; i < 5; i++){                       
        g.fillStyle = aa('#FFF6D8', .30 + (i % 3) * 0.18);
        g.beginPath(); g.arc(x + wd * (0.16 + i * 0.17), y + ht * (0.10 + (i % 3) * 0.08),
          Math.max(.8, wd * 0.011), 0, 7); g.fill();
      }
      ART.sunDisc(g, x + wd * 0.66, y + ht * 0.76, Math.max(3, wd * 0.055), DUSK);
       
      g.save(); g.globalAlpha = .92;
      ART.dune(g, W, y + ht * 0.82, Math.max(4, ht * 0.035), 1.4, '#5B5084', false, { haze:.16, hazeCol:'#8E86C0' });
      g.restore();
      g.fillStyle = aa('#2B2450', .92);
      rr(g, x + wd * 0.08, y + ht * 0.70, wd * 0.26, ht * 0.16, 2); g.fill();
      g.fillStyle = aa('#FFD98A', .90);
      g.beginPath(); g.arc(x + wd * 0.16, y + ht * 0.76, Math.max(1.2, wd * 0.022), 0, 7); g.fill();
      g.fillStyle = aa('#1E1838', .95); g.fillRect(x, y + ht * 0.86, wd, ht * 0.14);
       
      g.fillStyle = ART.rgrad(g, x + wd / 2, y + ht * 0.55, wd * 0.16, wd * 0.90,
        [aa('#1A1330', 0), aa('#1A1330', .55)]);
      g.fillRect(x, y, wd, ht);
      g.restore();

      if (fy < L.H){
        g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .22;
        g.fillStyle = ART.vgrad(g, 0, fy, L.H, [aa('#8FA8EE', .62), aa('#6E8ADC', 0)]);
        g.beginPath(); g.moveTo(x, fy); g.lineTo(x + wd, fy);
        g.lineTo(x + wd * 1.9, L.H); g.lineTo(x - wd * 0.7, L.H); g.closePath(); g.fill();
        g.restore();
      }
       
      g.save(); g.globalAlpha = .40; g.strokeStyle = aa('#A9BEF5', .85); g.lineWidth = 2;
      g.beginPath(); g.moveTo(x + wd + 1, y + arc); g.lineTo(x + wd + 1, y + ht); g.stroke();
      g.restore();
    }

    function rugBorder(y){                                   
      const W = L.W, bh = Math.max(6, Math.min(15, L.H * 0.010));
      g.fillStyle = dk(RUG, .42); g.fillRect(0, y, W, bh * 2.6);
      g.fillStyle = aa('#FFE0AE', .30); g.fillRect(0, y, W, 1.6);
      g.fillStyle = aa('#2A0F0A', .40); g.fillRect(0, y + bh * 2.6 - 1.6, W, 1.6);
      ART.saduBand(g, 0, y + bh * 0.55, W, bh, [CREAM, THREAD[0], INKY, CREAM, PH.woodLt]);
      g.save(); g.globalAlpha = .55; g.fillStyle = CREAM;
      for (let x = 0; x < W; x += bh * 1.4) g.fillRect(x, y + bh * 1.95, bh * 0.7, bh * 0.34);
      g.restore();
    }

    function props(){
      const band = L.vTop - L.floorY;
      if (band < 54 || L.W < 420) return;
      const s = Math.max(16, Math.min(band * 0.40, L.W * 0.085));
      const baseY = L.floorY + band * 0.74;
      const lx = Math.max(s * 1.3, L.loomX * 0.52);
      foldedStack(lx, baseY, s);
      yarnPile(lx + s * 1.9, baseY + s * 0.10, s * 0.40);
      const rx = Math.min(L.W - s * 1.6, L.W - L.loomX * 0.46);
      dallah(rx, baseY - s * 0.05, s * 1.10);
      cup(rx - s * 0.95, baseY + s * 0.02, s * 0.20);
      cup(rx - s * 1.32, baseY + s * 0.06, s * 0.20);
      cushion(rx - s * 2.3, baseY + s * 0.16, s * 0.72, THREAD[0]);
    }

    function foldedStack(x, y, s){                           
      ART.drop(g, x + s * 0.14, y + s * 0.16, s * 1.15, s * 0.24, '#2A1206', .42);
      const cs = [THREAD[3], THREAD[0], INKY];
      for (let i = 0; i < 3; i++){
        const hh = s * 0.26, yy = y - i * (hh * 0.92), c = cs[i];
        const ww = s * (1.9 - i * 0.14);
        g.fillStyle = ART.vgrad(g, 0, yy - hh, yy, [lt(c, .28), c, dk(c, .28)]);
        rr(g, x - ww / 2, yy - hh, ww, hh, hh * 0.30); g.fill();
        ART.rim(g, null, aa('#FFE9C0', .40), 1.2, .45);
        ART.saduBand(g, x - ww / 2 + 3, yy - hh * 0.80, ww - 6, hh * 0.46,
          i % 2 ? [CREAM, INKY, THREAD[0]] : [THREAD[0], CREAM, PH.woodLt]);
      }
    }

    function dallah(x, y, s){                                
      const bD = '#7A5C1E', bL = '#F6E3AC';
      const body = g.createLinearGradient(x - s * 0.55, 0, x + s * 0.55, 0);
      body.addColorStop(0, bD); body.addColorStop(.34, '#C9A24B');
      body.addColorStop(.64, bL); body.addColorStop(1, '#8A6A26');
      ART.drop(g, x + s * 0.16, y + s * 0.10, s * 0.72, s * 0.20, '#2A1206', .44);
      g.fillStyle = body; rr(g, x - s * 0.34, y - s * 0.18, s * 0.68, s * 0.18, s * 0.06); g.fill();
      g.beginPath();
      g.moveTo(x - s * 0.30, y - s * 0.14);
      g.quadraticCurveTo(x - s * 0.58, y - s * 0.54, x - s * 0.25, y - s * 0.88);
      g.lineTo(x + s * 0.25, y - s * 0.88);
      g.quadraticCurveTo(x + s * 0.58, y - s * 0.54, x + s * 0.30, y - s * 0.14);
      g.closePath(); g.fillStyle = body; g.fill();
      ART.rim(g, null, aa('#FFF3D8', .60), Math.max(1.2, s * 0.05), .55);
      g.fillStyle = body; rr(g, x - s * 0.15, y - s * 1.10, s * 0.30, s * 0.26, s * 0.06); g.fill();
      g.beginPath(); g.moveTo(x - s * 0.24, y - s * 1.06); g.lineTo(x, y - s * 1.44);
      g.lineTo(x + s * 0.24, y - s * 1.06); g.closePath(); g.fillStyle = body; g.fill();
      ART.rim(g, null, aa('#FFF3D8', .5), 1.1, .5);
      g.fillStyle = bL; g.beginPath(); g.arc(x, y - s * 1.48, s * 0.07, 0, 7); g.fill();
      g.strokeStyle = body; g.lineWidth = Math.max(2, s * 0.11); g.lineCap = 'round';
      g.beginPath(); g.moveTo(x - s * 0.25, y - s * 0.84);
      g.quadraticCurveTo(x - s * 0.68, y - s * 0.94, x - s * 0.60, y - s * 1.28); g.stroke();
      g.beginPath(); g.moveTo(x + s * 0.24, y - s * 0.90);
      g.quadraticCurveTo(x + s * 0.66, y - s * 1.00, x + s * 0.28, y - s * 1.20); g.stroke();
      ART.glow(g, x + s * 0.18, y - s * 0.60, s * 0.9, '#FFE9A8', .18);
    }

    function cup(x, y, s){                                   
      if (s < 4) return;
      ART.drop(g, x, y + s * 0.30, s * 0.90, s * 0.28, '#2A1206', .36);
      g.fillStyle = ART.vgrad(g, 0, y - s, y, [lt(CREAM, .25), CREAM, mix(CREAM, '#8A5A2A', .35)]);
      g.beginPath(); g.moveTo(x - s * 0.62, y - s);
      g.quadraticCurveTo(x - s * 0.44, y + s * 0.22, x, y + s * 0.24);
      g.quadraticCurveTo(x + s * 0.44, y + s * 0.22, x + s * 0.62, y - s);
      g.closePath(); g.fill();
      g.fillStyle = mix('#4A2A12', '#000', .1); ell(g, x, y - s, s * 0.62, s * 0.20, 0); g.fill();
      ART.rim(g, null, aa('#FFF3D8', .5), 1, .5);
    }

    function wallHang(x, y, wd, ht){
      if (wd < 40 || ht < 40) return;
      ART.drop(g, x + wd * 0.5 - 10, y + ht + 8, wd * 0.55, 9, '#2A1206', .34);
      g.fillStyle = ART.vgrad(g, 0, y, y + ht, [lt(INKY, .16), INKY]);
      rr(g, x, y, wd, ht, 3); g.fill();
      const n = 6, bhh = (ht - 14) / n;
      for (let i = 0; i < n; i++)
        ART.saduBand(g, x + 5, y + 7 + i * bhh, wd - 10, bhh * 0.74,
          i % 2 ? [CREAM, THREAD[0], CREAM] : [THREAD[0], CREAM, PH.woodLt]);
      g.save(); g.globalAlpha = .30; g.fillStyle = '#000';
      g.fillRect(x, y, wd * 0.30, ht); g.restore();                 
      g.fillStyle = ART.vgrad(g, 0, y - 8, y - 1, [lt(PH.woodLt, .30), PH.wood[1]]);
      rr(g, x - 7, y - 8, wd + 14, 7, 3.5); g.fill();
    }

    function cushion(x, y, s, c){
      if (s < 18) return;
      ART.drop(g, x + s * 0.16, y + s * 0.46, s * 1.20, s * 0.32, '#1A0B03', .52);
      g.fillStyle = ART.vgrad(g, 0, y - s * 0.58, y + s * 0.42, [lt(c, .30), c, dk(c, .34)]);
      rr(g, x - s, y - s * 0.58, s * 2, s * 1.0, s * 0.36); g.fill();
       
      rr(g, x - s, y - s * 0.58, s * 2, s * 1.0, s * 0.36);
      ART.shade(g, y - s * 0.58, y + s * 0.42, aa(dk(c, .30), .00), aa(dk(c, .62), .68));
      g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .22; g.fillStyle = c;
      rr(g, x - s, y - s * 0.58, s * 2, s * 1.0, s * 0.36); g.fill(); g.restore();
      ART.rim(g, null, aa('#FFE9C0', .55), Math.max(1.2, s * 0.05), .55);
      ART.saduBand(g, x - s * 0.82, y - s * 0.16, s * 1.64, s * 0.24, [CREAM, INKY, THREAD[0]]);
    }

    function yarnPile(x, y, s){
      if (s < 8) return;
      [[-s * 1.05, 0, THREAD[0]], [s * 0.95, s * 0.10, THREAD[2]], [0, -s * 0.85, THREAD[3]]].forEach(b => {
        const bx = x + b[0], by = y + b[1], c = b[2];
        ART.drop(g, bx, by + s * 0.85, s * 1.0, s * 0.30, '#2A1206', .34);
        g.fillStyle = ART.rgrad(g, bx - s * 0.32, by - s * 0.36, s * 0.10, s * 1.25,
          [lt(c, .40), c, dk(c, .34)]);
        g.beginPath(); g.arc(bx, by, s, 0, 7); g.fill();
        g.beginPath(); g.arc(bx, by, s, 0, 7);          
        ART.shade(g, by - s, by + s, aa(dk(c, .25), .00), aa(dk(c, .62), .70));
        g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .20; g.fillStyle = c;
        g.beginPath(); g.arc(bx, by, s, 0, 7); g.fill(); g.restore();
        g.save(); g.globalAlpha = .34; g.strokeStyle = dk(c, .45); g.lineWidth = Math.max(1, s * 0.10);
        for (let i = -2; i <= 2; i++){
          g.beginPath(); g.ellipse(bx, by, s * 0.86, s * 0.34, i * 0.62, 0, 7); g.stroke();
        }
        g.restore();
      });
    }

    function lamp(t){
      const s = Math.max(15, Math.min(proj ? 40 : 30, L.r * 0.66));
      const x = L.lx, y = L.ly;
      const pulse = red ? 1 : 1 + 0.045 * Math.sin(t * 0.0021);

      g.strokeStyle = dk(PH.shade, .40); g.lineWidth = Math.max(1.6, s * 0.10);
      g.beginPath(); g.moveTo(x, -6); g.lineTo(x, y - s * 1.02); g.stroke();

      ART.glow(g, x, y + s * 0.3, s * 7.5 * pulse, PH.lamp, .30);
      ART.glow(g, x, y + s * 0.3, s * 2.7 * pulse, '#FFF6DC', .55);

      g.beginPath();                                              
      g.moveTo(x - s, y + s * 0.52); g.lineTo(x - s * 0.34, y - s * 0.95);
      g.lineTo(x + s * 0.34, y - s * 0.95); g.lineTo(x + s, y + s * 0.52); g.closePath();
      g.fillStyle = ART.vgrad(g, 0, y - s, y + s * 0.55,
        [lt(PH.shade, .48), PH.shade, dk(PH.shade, .34)]); g.fill();
      ART.rim(g, null, aa('#FFE9C0', .7), Math.max(1.3, s * 0.09), .6);
      g.save(); g.globalAlpha = .28; g.fillStyle = '#FFFFFF';
      g.beginPath(); g.moveTo(x - s * 0.86, y + s * 0.5); g.lineTo(x - s * 0.28, y - s * 0.9);
      g.lineTo(x - s * 0.06, y - s * 0.9); g.lineTo(x - s * 0.5, y + s * 0.5); g.closePath(); g.fill();
      g.restore();

      g.fillStyle = PH.lamp; ell(g, x, y + s * 0.60, s * 0.56, s * 0.44, 0); g.fill();
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .8;
      g.fillStyle = '#FFFAE6'; ell(g, x, y + s * 0.54, s * 0.30, s * 0.24, 0); g.fill(); g.restore();
      g.fillStyle = dk(PH.shade, .20); rr(g, x - s * 0.40, y - s * 1.12, s * 0.80, s * 0.20, s * 0.09); g.fill();

      if (!red){
        g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .11;
        g.fillStyle = ART.vgrad(g, 0, y, L.H, [aa('#FFE3A8', .70), aa('#FFE3A8', 0)]);
        g.beginPath(); g.moveTo(x - s * 0.9, y + s * 0.4); g.lineTo(x + s * 0.9, y + s * 0.4);
        g.lineTo(x + s * 5.2, L.H); g.lineTo(x - s * 5.2, L.H); g.closePath(); g.fill();
        g.restore();
      }
    }

    function lightWash(t){
      const pulse = red ? 1 : 1 + 0.035 * Math.sin(t * 0.0016);
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .20;
      g.fillStyle = ART.rgrad(g, L.lx, L.ly, 0, Math.max(L.W, L.H) * 0.80 * pulse,
        [aa(PH.lamp, .60), aa(PH.lamp, .16), aa(PH.lamp, 0)]);
      g.fillRect(0, 0, L.W, L.H);
      g.restore();
    }

    function grainH(x, y, wd, ht){
      g.save(); rr(g, x, y, wd, ht, Math.min(ht / 2, 7)); g.clip();
      g.globalAlpha = .24; g.strokeStyle = WOODD; g.lineWidth = Math.max(1, ht * 0.055);
      for (let i = 1; i < 5; i++){
        const yy = y + ht * i / 5;
        g.beginPath();
        for (let xx = x; xx <= x + wd; xx += 12) g.lineTo(xx, yy + Math.sin(xx * 0.045 + i * 2.1) * ht * 0.07);
        g.stroke();
      }
      g.globalAlpha = .26; g.fillStyle = '#FFF1D4'; g.fillRect(x, y, wd, ht * 0.20);
      g.globalAlpha = .30; g.fillStyle = '#2A1206'; g.fillRect(x, y + ht * 0.80, wd, ht * 0.20);
      g.restore();
    }
    function grainV(x, y, wd, ht){
      g.save(); rr(g, x, y, wd, ht, Math.min(wd / 2, 6)); g.clip();
      g.globalAlpha = .24; g.strokeStyle = WOODD; g.lineWidth = Math.max(1, wd * 0.10);
      for (let i = 1; i < 4; i++){
        const xx = x + wd * i / 4;
        g.beginPath();
        for (let yy = y; yy <= y + ht; yy += 14) g.lineTo(xx + Math.sin(yy * 0.03 + i * 2.4) * wd * 0.10, yy);
        g.stroke();
      }
      g.globalAlpha = .30; g.fillStyle = '#FFF1D4'; g.fillRect(x + wd * 0.62, y, wd * 0.38, ht);
      g.globalAlpha = .34; g.fillStyle = '#2A1206'; g.fillRect(x, y, wd * 0.26, ht);
      g.restore();
    }
    function beamH(x, y, wd, ht){
      ART.drop(g, x + wd * 0.5 - 8, y + ht + Math.max(4, ht * 0.5), wd * 0.52, ht * 0.85, '#2A1206', .34);
      g.fillStyle = ART.vgrad(g, 0, y, y + ht,
        [lt(PH.woodLt, .38), PH.woodLt, PH.wood[0], PH.wood[1], PH.wood[2]]);
      rr(g, x, y, wd, ht, Math.min(ht / 2, 7)); g.fill();
      ART.rim(g, null, aa('#FFE9C0', .55), Math.max(1, ht * 0.10), .5);
      grainH(x, y, wd, ht);
    }
    function beamV(x, y, wd, ht){
      ART.drop(g, x - wd * 0.6, y + ht * 0.5, wd * 1.1, ht * 0.46, '#2A1206', .26);
      const gr = g.createLinearGradient(x, 0, x + wd, 0);
      gr.addColorStop(0, PH.wood[2]); gr.addColorStop(0.24, PH.wood[1]);
      gr.addColorStop(0.60, PH.wood[0]); gr.addColorStop(0.84, PH.woodLt);
      gr.addColorStop(1, lt(PH.woodLt, .22));
      g.fillStyle = gr; rr(g, x, y, wd, ht, Math.min(wd / 2, 6)); g.fill();
      ART.rim(g, null, aa('#FFE9C0', .45), Math.max(1, wd * 0.12), .45);
      grainV(x, y, wd, ht);
    }
    function lash(x, y, wd, ht){                                   
      const rp = '#E3C48F';
      g.save();
      for (let i = 0; i < 4; i++){
        const t0 = i / 4;
        g.strokeStyle = i % 2 ? rp : mix(rp, '#8A5A2A', .45);
        g.lineWidth = Math.max(1.6, ht * 0.16); g.lineCap = 'round';
        g.beginPath();
        g.moveTo(x + wd * 0.10, y + ht * (0.16 + t0 * 0.68));
        g.lineTo(x + wd * 0.90, y + ht * (0.08 + t0 * 0.68));
        g.stroke();
      }
      g.restore();
    }

    function loomBed(){
      const x = L.loomX, y = L.vTop - 3, wd = L.loomW, ht = (L.bot - L.vTop) + 6;
      ART.drop(g, x + wd * 0.5 - 10, L.bot + Math.max(8, L.rowH * 0.8), wd * 0.56,
               Math.max(10, L.rowH * 1.0), '#2A1206', .42);
      const bg = g.createLinearGradient(0, y, 0, y + ht);
      bg.addColorStop(0, '#1C0F06'); bg.addColorStop(.30, '#331C0C');
      bg.addColorStop(.72, '#5A3416'); bg.addColorStop(1, '#42250F');
      g.fillStyle = bg; rr(g, x, y, wd, ht, 5); g.fill();
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .16;   
      g.fillStyle = ART.rgrad(g, L.lx, L.ly, 0, Math.max(L.W, L.H) * 0.72,
        [aa(PH.lamp, .70), aa(PH.lamp, .18), aa(PH.lamp, 0)]);
      rr(g, x, y, wd, ht, 5); g.fill(); g.restore();
    }

    function rod(y, ht){
      const x = L.loomX - 8, wd = L.loomW + 16;
      g.save(); g.globalAlpha = .40; g.fillStyle = '#150B04';
      g.fillRect(L.loomX, y + ht * 0.9, L.loomW, ht * 1.1); g.restore();
      g.fillStyle = ART.vgrad(g, 0, y, y + ht,
        [lt(PH.woodLt, .42), PH.woodLt, PH.wood[0], PH.wood[1]]);
      rr(g, x, y, wd, ht, ht / 2); g.fill();
      ART.rim(g, null, aa('#FFEFD2', .60), Math.max(1, ht * 0.16), .55);
      g.save(); g.globalAlpha = .22; g.strokeStyle = WOODD; g.lineWidth = Math.max(1, ht * 0.10);
      for (let i = 1; i < 3; i++){
        const yy = y + ht * i / 3;
        g.beginPath();
        for (let xx = x; xx <= x + wd; xx += 14) g.lineTo(xx, yy + Math.sin(xx * 0.05 + i) * ht * 0.10);
        g.stroke();
      }
      g.restore();
    }
    function beamRoll(){                                    
      const bh = Math.max(9, Math.min(proj ? 24 : 17, L.r * 0.44)), by = L.vTop - 3;
      ART.drop(g, L.loomX + L.loomW * 0.5, by + bh + 4, L.loomW * 0.5, bh * 0.5, '#150B04', .40);
      g.fillStyle = ART.vgrad(g, 0, by, by + bh,
        [lt(PH.warp, .28), PH.warp, mix(PH.warp, '#6B4A24', .55)]);
      rr(g, L.loomX - 5, by, L.loomW + 10, bh, bh * 0.36); g.fill();
      g.save(); rr(g, L.loomX - 5, by, L.loomW + 10, bh, bh * 0.36); g.clip();
      g.globalAlpha = .30; g.lineWidth = Math.max(1.1, bh * 0.13);
      for (let x = L.loomX - bh * 2; x < L.loomX + L.loomW + bh * 2; x += bh * 0.62){
        g.strokeStyle = '#8A6838';
        g.beginPath(); g.moveTo(x, by - 2); g.lineTo(x + bh * 0.7, by + bh + 2); g.stroke();
      }
      g.globalAlpha = .26; g.fillStyle = '#150B04'; g.fillRect(L.loomX - 5, by + bh * .70, L.loomW + 10, bh * .30);
      g.restore();
      ART.rim(g, null, aa('#FFF6E2', .5), 1.2, .5);
    }

    function fellLight(t){                                  
      const y = rowTop(rows.length) + L.rowH / 2;
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .19;
      g.fillStyle = ART.rgrad(g, L.loomX + L.loomW * 0.56, y - L.rowH * 2.4, 0,
        Math.max(90, L.loomW * 0.78), [aa('#FFDFA0', .50), aa('#FFC978', .14), aa('#FFC978', 0)]);
      g.fillRect(L.loomX, L.vTop, L.loomW, L.bot - L.vTop);
      g.restore();
      if (rows.length){                                     
        const cy = rowTop(rows.length - 1);
        g.fillStyle = ART.vgrad(g, 0, cy - Math.max(8, L.rowH * 0.7), cy,
          [aa('#150B04', 0), aa('#150B04', .45)]);
        g.fillRect(L.loomX, cy - Math.max(8, L.rowH * 0.7), L.loomW, Math.max(8, L.rowH * 0.7));
      }
    }

    function motes(t){                                      
      if (red) return;
      const span = Math.max(60, L.H - L.head);
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 24; i++){
        const sx = ((i * 97) % 100) / 100, sy = ((i * 61) % 100) / 100;
        const x = L.lx + (sx - 0.62) * L.W * 1.05 + Math.sin(t * 0.0004 + i) * 16;
        const y = L.head + ((sy * span + t * 0.011 * (0.4 + sx)) % span);
        g.globalAlpha = 0.05 + 0.11 * (0.5 + 0.5 * Math.sin(t * 0.001 + i * 1.7));
        g.fillStyle = '#FFE9B8';
        g.beginPath(); g.arc(x, y, 1.1 + sx * 1.9, 0, 7); g.fill();
      }
      g.restore();
    }

    function loomGear(){
      beamRoll();
      const freeTop = L.bot - L.rowH * Math.max(1, ITEMS.length);
      const space = freeTop - L.vTop;
      if (space < 52) return;
      const ht = Math.max(6, Math.min(proj ? 15 : 11, L.r * 0.28));
      const y1 = L.vTop + Math.min(space * 0.14, 24);
      const y2 = y1 + Math.max(22, Math.min(56, space * 0.30));
      rod(y1, ht * 0.8);
      rod(y2, ht);
      const nw = Math.max(12, Math.min(46, Math.round(L.loomW / 15)));
      const step = L.loomW / nw, lp = Math.max(7, Math.min(15, space * 0.09));
      g.save(); g.strokeStyle = aa('#EFE2CB', .80); g.lineWidth = Math.max(1, step * 0.16);
      for (let i = 1; i <= nw; i += 2){
        const xx = L.loomX + (i / nw) * L.loomW;
        g.beginPath(); g.moveTo(xx - step * 0.22, y2 + ht);
        g.quadraticCurveTo(xx, y2 + ht + lp * 1.5, xx + step * 0.22, y2 + ht);
        g.stroke();
      }
      g.restore();
    }

    function warpThreads(t){
      const nw = Math.max(12, Math.min(46, Math.round(L.loomW / 15)));
      const step = L.loomW / nw, lw = Math.max(2.2, step * 0.56);   
      const fb = L.fellB;

      g.save();
      g.beginPath(); g.rect(L.loomX, L.vTop, L.loomW, fb - L.vTop); g.clip();
      g.fillStyle = ART.vgrad(g, 0, L.vTop, fb,
        [mix(PH.warp, '#8A6A3C', .26), mix(PH.warp, '#6B4B26', .58), mix(PH.warp, '#4E3316', .74)]);
      g.fillRect(L.loomX, L.vTop, L.loomW, fb - L.vTop);
       
      g.globalAlpha = .16; g.strokeStyle = '#3A2410'; g.lineWidth = 1;
      for (let yy = L.vTop; yy < fb; yy += 5){
        g.beginPath(); g.moveTo(L.loomX, yy + .5); g.lineTo(L.loomX + L.loomW, yy + .5); g.stroke();
      }
      g.globalAlpha = .10; g.strokeStyle = '#FFF0CE';
      for (let yy = L.vTop + 2.5; yy < fb; yy += 5){
        g.beginPath(); g.moveTo(L.loomX, yy); g.lineTo(L.loomX + L.loomW, yy); g.stroke();
      }
       
      g.globalAlpha = .26; g.globalCompositeOperation = 'lighter';
      g.fillStyle = ART.rgrad(g, L.lx, L.ly, 0, Math.max(L.W, L.H) * 0.64,
        [aa(PH.lamp, .62), aa(PH.lamp, .16), aa(PH.lamp, 0)]);
      g.fillRect(L.loomX, L.vTop, L.loomW, fb - L.vTop);
      g.restore();

      const grad = st => { const q = g.createLinearGradient(0, L.vTop, 0, L.bot);
        st.forEach(v => q.addColorStop(v[0], v[1])); return q; };
      const gSh   = grad([[0, aa('#140A03', .92)], [.40, aa('#231406', .90)], [1, aa('#2A1808', .86)]]);
       
      const gMain = grad([[0, '#F2DDB2'], [.42, '#C8AC7A'], [1, '#9A7E50']]);
      const gMain2= grad([[0, '#E1CCA1'], [.42, '#B69A6A'], [1, '#8A7045']]);
      const gMain3= grad([[0, '#FAEBC8'], [.42, '#D8BE8C'], [1, '#A68B58']]);
      const gHi   = grad([[0, aa('#FFF8E6', .50)], [.55, aa('#FFE9BE', .22)], [1, aa('#FFDFA6', .10)]]);
      for (let i = 0; i <= nw; i++){
        const x = L.loomX + (i / nw) * L.loomW;
         
        const kk = (i * 37) % 5;
        const tw = lw * (0.78 + kk * 0.13);
        const bow = ((i * 53) % 7 - 3) * 0.42;
        const wob = (warp > 0.01 && !red);
        const path = dx => {
          g.beginPath();
          const y0 = L.vTop, y1 = L.bot, sp = y1 - y0;
          for (let y = y0; y <= y1; y += 10){
            const sag = Math.sin(((y - y0) / sp) * Math.PI) * bow;
            const wb = wob ? Math.sin(y * 0.06 + t * 0.02 + i) * warp * 2.6 : 0;
            g.lineTo(x + dx + sag + wb, y);
          }
        };
        g.lineCap = 'butt';
        g.lineWidth = tw * 0.46; g.strokeStyle = gSh; path(tw * 0.66); g.stroke();
        g.lineWidth = tw; g.strokeStyle = kk === 0 ? gMain3 : (i % 2 ? gMain : gMain2); path(0); g.stroke();
        g.lineWidth = Math.max(.8, tw * 0.22); g.strokeStyle = gHi; path(-tw * 0.30); g.stroke();
      }

      g.save();
      g.beginPath(); g.rect(L.loomX, L.vTop, L.loomW, fb - L.vTop); g.clip();
      const rp = Math.max(4, step * 0.78);
      for (let yy = L.vTop, r2 = 0; yy < fb; yy += rp, r2++){
        for (let i = (r2 % 2); i <= nw; i += 2){
          const x = L.loomX + (i / nw) * L.loomW;
          g.globalAlpha = .22; g.fillStyle = '#2A1808';
          g.fillRect(x - step * 0.32, yy, step * 0.64, rp * 0.56);
          g.globalAlpha = .13; g.fillStyle = '#FFEBC4';
          g.fillRect(x - step * 0.32, yy + rp * 0.56, step * 0.64, rp * 0.24);
        }
      }
      g.restore();
    }

    const PRE = [{ c:THREAD[0], m:0 }, { c:THREAD[2], m:2 }, { c:THREAD[1], m:1 }];
    function preCloth(t){
      const bh = L.preH / PRE.length;
       
      ART.drop(g, L.loomX + L.loomW * 0.5, L.bot + Math.max(5, bh * 0.55),
               L.loomW * 0.54, Math.max(6, bh * 0.60), '#150B04', .55);
      for (let k = 0; k < PRE.length; k++)
        drawRow(L.bot - (k + 1) * bh, PRE[k].c, PRE[k].m, 1, t, bh);
       
      g.save(); g.globalAlpha = .22; g.fillStyle = '#150B04';
      g.fillRect(L.loomX, L.fellB, L.loomW, Math.max(1.5, L.rowH * 0.10)); g.restore();
    }

    function drawRow(y, c, motif, p, t, rhIn){
      const x0 = L.loomX, wd = L.loomW, rh = rhIn || L.rowH;
      const light = lum(c) > 0.58;
      const acc1 = light ? INKY : CREAM;
      const acc2 = light ? THREAD[0] : (c === THREAD[0] ? CREAM : THREAD[0]);
      g.save();
      g.beginPath(); g.rect(x0 + wd * (1 - p) - 1, y - 1, wd * p + 2, rh + 2); g.clip();

      g.fillStyle = ART.vgrad(g, 0, y, y + rh, [lt(c, .22), c, dk(c, .30)]);
      g.fillRect(x0, y, wd, rh);

      const pd = Math.max(1, rh * 0.15), ih = rh - pd * 2, unit = Math.max(13, rh * 1.6);
      if (motif === 0){
        ART.saduBand(g, x0, y + pd, wd, ih, [acc1, acc2, acc1, dk(c, .45)]);
      } else if (motif === 1){                                     
        const n = Math.ceil(wd / unit) + 1;
        for (let i = 0; i < n; i++){
          const cx = x0 + i * unit, mid = y + rh / 2;
          g.fillStyle = i % 2 ? acc1 : acc2;
          g.beginPath(); g.moveTo(cx + unit / 2, y + pd); g.lineTo(cx + unit - 1.5, mid);
          g.lineTo(cx + unit / 2, y + rh - pd); g.lineTo(cx + 1.5, mid); g.closePath(); g.fill();
          g.fillStyle = i % 2 ? acc2 : acc1;
          g.beginPath(); g.arc(cx + unit / 2, mid, Math.max(1.1, rh * 0.13), 0, 7); g.fill();
        }
      } else if (motif === 2){                                     
        g.strokeStyle = acc1; g.lineWidth = Math.max(1.6, rh * 0.20); g.lineJoin = 'round';
        g.beginPath();
        for (let cx = x0 - unit; cx <= x0 + wd + unit; cx += unit){
          g.lineTo(cx, y + rh - pd); g.lineTo(cx + unit / 2, y + pd);
        }
        g.stroke();
        g.strokeStyle = acc2; g.lineWidth = Math.max(1, rh * 0.10);
        g.beginPath();
        for (let cx = x0 - unit; cx <= x0 + wd + unit; cx += unit){
          g.lineTo(cx, y + rh - pd * 1.6); g.lineTo(cx + unit / 2, y + pd * 1.6);
        }
        g.stroke();
      } else {                                                     
        const n = Math.ceil(wd / unit) + 1;
        for (let i = 0; i < n; i++){
          const cx = x0 + i * unit;
          g.fillStyle = acc1; g.fillRect(cx + 1.5, y + pd, unit * 0.38, ih);
          g.fillStyle = acc2; g.fillRect(cx + unit * 0.54, y + rh * 0.30, unit * 0.32, rh * 0.40);
        }
      }

      g.save(); g.globalAlpha = .16; g.strokeStyle = '#000'; g.lineWidth = 1;   
      for (let cx = x0; cx < x0 + wd; cx += 4){ g.beginPath(); g.moveTo(cx + .5, y); g.lineTo(cx + .5, y + rh); g.stroke(); }
      g.restore();

      g.fillStyle = aa('#FFFFFF', .30); g.fillRect(x0, y, wd, Math.max(1, rh * 0.10));
      g.fillStyle = aa('#150B04', .34); g.fillRect(x0, y + rh - Math.max(1, rh * 0.13), wd, Math.max(1, rh * 0.13));
      g.restore();

      if (p < 1){                                                  
        const fx = x0 + wd * (1 - p), cy = y + rh / 2;
        ART.glow(g, fx, cy, Math.max(16, rh * 2.2), lt(c, .45), .5);
        g.save(); g.translate(fx, cy); g.rotate(red ? 0 : Math.sin(t * 0.018) * 0.16);
        const sw = Math.max(9, rh * 1.05), sh2 = Math.max(4, rh * 0.42);
        g.fillStyle = ART.vgrad(g, 0, -sh2, sh2, [lt(PH.woodLt, .35), PH.wood[0], PH.wood[2]]);
        g.beginPath(); g.moveTo(-sw, 0); g.quadraticCurveTo(0, -sh2 * 1.5, sw, 0);
        g.quadraticCurveTo(0, sh2 * 1.5, -sw, 0); g.closePath(); g.fill();
        ART.rim(g, null, aa('#FFE9C0', .7), 1.3, .6);
        g.fillStyle = c; ell(g, 0, 0, sw * 0.36, sh2 * 0.52, 0); g.fill();
        g.restore();
        if (!red && Math.random() < 0.55)
          parts.burst(fx, cy, 2, { col: Math.random() < .5 ? CREAM : lt(c, .3),
            sp0:0.02, sp1:0.11, r0:1.0, r1:2.6, up:0.05, g:0.00012 });
      }
    }

    const WPAL = { skin:'#C98A55', skinDark:'#A66C3E',
                   thobe:'#8E2F2A', thobeSh:'#511518',      
                   ghutra:'#2B1D16', shade:'#2A1206' };     

    function weaver(t){
      if (!L.wOn) return;
      const s = L.ws, x = L.wx, base = L.wy;
      const D = red ? 260 : 880;
      const k = wRe ? Math.min(1, wRe.t / D) : 0;
      const good = !!(wRe && wRe.good), bad = !!(wRe && !wRe.good);
      const idle = red ? 0 : Math.sin(t * 0.0013) * 0.16;      
      const lean = good ? idle * 0.30 - Math.sin(k * Math.PI) * 1.05   
                 : bad  ? 0.30 * (1 - k)                              
                 : idle;
      const run  = good ? k * Math.PI * 1.6
                 : bad  ? 0
                 : (red ? 0 : Math.sin(t * 0.0011) * 0.30);

      ART.drop(g, x + s * 5, base + s * 2.4, s * 20, s * 5.2, '#140A03', .52);
      ART.person(g, x, base - s * 9, s, WPAL, { lean, run, noShadow:true });
      lapCloth(x, base, s);
      if (good && !L.wFar) handPass(k, s);
    }

    function lapCloth(x, y, s){                           
      const wd = s * 15, ht = s * 9;
      g.save();
      g.beginPath();
      g.moveTo(x - wd, y + s * 1.4);
      g.quadraticCurveTo(x - wd * 1.02, y - ht * 0.72, x - wd * 0.42, y - ht);
      g.lineTo(x + wd * 0.42, y - ht);
      g.quadraticCurveTo(x + wd * 1.02, y - ht * 0.72, x + wd, y + s * 1.4);
      g.closePath();
      g.fillStyle = ART.vgrad(g, 0, y - ht, y + s * 1.4,
        [lt(THREAD[3], .26), THREAD[3], dk(THREAD[3], .42)]);
      g.fill();
      ART.shade(g, y - ht, y + s * 1.6, aa('#FFE9C0', .10), aa('#160A03', .58));
      ART.rim(g, null, aa('#FFE9C0', .50), Math.max(1.1, s * 0.5), .5);
      ART.saduBand(g, x - wd * 0.86, y - ht * 0.54, wd * 1.72, Math.max(3, ht * 0.26),
        [CREAM, THREAD[0], INKY, CREAM]);
      g.restore();
    }

    function handPass(k, s){                              
      const e = ART.easeInOut(Math.min(1, k * 1.15));
      const ry = rowTop(rows.length) + L.rowH / 2;
      const sx = L.wx - s * 8, sy = L.wy - s * 9 - s * 36;
      const hx = ART.lerp(L.loomX + L.loomW + s * 3, L.loomX + L.loomW * 0.16, e);
      const hy = ry - Math.sin(e * Math.PI) * L.rowH * 0.9;
      const mx = (sx + hx) / 2, my = (sy + hy) / 2 + s * 5;
      g.save(); g.lineCap = 'round';
      g.strokeStyle = aa('#150B04', .32); g.lineWidth = Math.max(3.2, s * 4.8);
      g.beginPath(); g.moveTo(sx + 2, sy + 3); g.quadraticCurveTo(mx, my + 3, hx + 2, hy + 3); g.stroke();
      g.strokeStyle = WPAL.thobe; g.lineWidth = Math.max(3, s * 4.2);
      g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(mx, my, hx, hy); g.stroke();
      g.strokeStyle = aa('#FFE9C0', .38); g.lineWidth = Math.max(1, s * 1.1);
      g.beginPath(); g.moveTo(sx, sy - s * 1.2); g.quadraticCurveTo(mx, my - s * 1.2, hx, hy - s * 1.0); g.stroke();
      g.fillStyle = WPAL.skin; g.beginPath(); g.arc(hx, hy, Math.max(2.6, s * 2.5), 0, 7); g.fill();
      g.fillStyle = mix(WPAL.skin, '#2A1206', .28);
      g.beginPath(); g.arc(hx, hy + s * 0.9, Math.max(1.6, s * 1.5), 0, 7); g.fill();
      g.restore();
      ART.glow(g, hx, hy, Math.max(12, s * 9), FX.goldLt, .22);
    }

    function railDraw(){
      const ht = Math.max(6, L.r * 0.22), x = L.loA - 10, wd = (L.loB - L.loA) + 20, y = L.railY - ht / 2;
      ART.drop(g, x + wd * 0.5 - 6, y + ht + 6, wd * 0.48, ht * 1.0, '#2A1206', .30);
      g.fillStyle = ART.vgrad(g, 0, y, y + ht, [lt(PH.woodLt, .40), PH.woodLt, PH.wood[0], PH.wood[1]]);
      rr(g, x, y, wd, ht, ht / 2); g.fill();
      ART.rim(g, null, aa('#FFEFD2', .65), Math.max(1.1, ht * 0.16), .55);
    }

    function spool(x, y, r, c, sq, a, hot){
      g.save(); g.globalAlpha = a;
      ART.drop(g, x - r * 0.20, y + r * 1.12, r * 1.00, r * 0.34, '#2A1206', .42 * a);
      if (hot) ART.glow(g, x, y, r * 2.4, isHex(teamCol) ? teamCol : FX.gold, .45 * a);
      g.translate(x, y); g.rotate(sq.ang); g.scale(1 + sq.s, 1 - sq.s * 0.7);

      const bw = r * 0.74, bh = r * 0.94;
      g.fillStyle = ART.vgrad(g, 0, -bh, bh, [lt(c, .36), c, dk(c, .36)]);
      rr(g, -bw, -bh, bw * 2, bh * 2, r * 0.30); g.fill();

      g.save(); rr(g, -bw, -bh, bw * 2, bh * 2, r * 0.30); g.clip();      
      g.lineWidth = Math.max(1.1, r * 0.11);
      for (let i = -8; i <= 8; i++){
        g.globalAlpha = a * 0.42; g.strokeStyle = lt(c, .48);
        g.beginPath(); g.moveTo(-bw + i * r * 0.24, -bh * 1.2); g.lineTo(-bw + i * r * 0.24 + r * 0.42, bh * 1.2); g.stroke();
        g.globalAlpha = a * 0.28; g.strokeStyle = dk(c, .48);
        g.beginPath(); g.moveTo(-bw + i * r * 0.24 + r * 0.11, -bh * 1.2);
        g.lineTo(-bw + i * r * 0.24 + r * 0.53, bh * 1.2); g.stroke();
      }
      g.globalAlpha = a;
      g.fillStyle = aa('#150B04', .30); g.fillRect(-bw, bh * 0.42, bw * 2, bh * 0.58);
      g.restore();

      [-1, 1].forEach(s => {                                              
        g.fillStyle = ART.vgrad(g, 0, -r, r, [lt(PH.woodLt, .34), PH.woodLt, PH.wood[1]]);
        ell(g, s * bw, 0, r * 0.26, r * 1.02, 0); g.fill();
        ART.rim(g, null, aa('#FFE9C0', .55), Math.max(1.1, r * 0.06), .5);
        g.fillStyle = dk(PH.wood[1], .30); ell(g, s * bw, 0, r * 0.10, r * 0.34, 0); g.fill();
      });

      g.save(); g.globalAlpha = a * 0.34; g.fillStyle = '#FFFFFF';        
      ell(g, -r * 0.14, -r * 0.46, bw * 0.74, r * 0.24, -0.12); g.fill(); g.restore();
      g.save(); g.globalAlpha = a * 0.55; g.strokeStyle = '#FFF3D8';      
      g.lineWidth = Math.max(1.2, r * 0.09); g.lineCap = 'round';
      g.beginPath(); g.moveTo(-bw * 0.55, -bh * 0.94); g.lineTo(bw * 0.55, -bh * 0.94); g.stroke(); g.restore();

      g.restore(); g.globalAlpha = 1;
    }

    function strand(ax, ay, bx, by, c, a){
      const d = Math.hypot(bx - ax, by - ay), sag = Math.max(6, 40 - d * 0.13);
      const path = dy => { g.beginPath(); g.moveTo(ax, ay + dy);
        g.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + sag + dy, bx, by + dy); };
      g.save(); g.lineCap = 'round';
      g.globalAlpha = a * 0.5; g.strokeStyle = aa('#150B04', .8);
      g.lineWidth = Math.max(1.8, L.r * 0.10); path(1.6); g.stroke();
      g.globalAlpha = a; g.strokeStyle = c;
      g.lineWidth = Math.max(1.6, L.r * 0.09); path(0); g.stroke();
      g.globalAlpha = a * 0.45; g.strokeStyle = lt(c, .55);
      g.lineWidth = Math.max(.8, L.r * 0.035); path(-1.1); g.stroke();
      g.restore(); g.globalAlpha = 1;
    }

    if (!ITEMS.length){ ctx.after(0, finish); }
    else {
      newRound();
      ctx.say('soft', 'اسحب بكرة الخيط الصحيحة من مجرى النول وأفلتها على السطر المضيء ليُنسج النقش.');
    }

    ctx.raf((dtRaw, t) => {
      const dt = Math.min(50, dtRaw || 16);
      roundT += dt;
      const W = w(), H = h();
      if (Math.abs(W - L.W) > 1 || Math.abs(H - L.H) > 1) layout();

      const speed = red ? 0 : (16 + idx * 1.6);
      const loA = L.loA, loB = L.loB;
      for (let i = 0; i < opts.length; i++){
        const o = opts[i], held = hold && hold.i === i, flying = fly && fly.i === i;
        if (!held && !flying){
          o.x -= speed * dt / 1000;
          while (o.x < loA) o.x += L.span;
          while (o.x > loB) o.x -= L.span;
        }
        if (held){
          const k = 1 - Math.exp(-dt / 105);
          const nx = o.dx + (hold.px - o.x - o.dx) * k;
          const ny = o.dy + (hold.py - L.railY - o.dy) * k;
          o.vx = nx - o.dx; o.vy = ny - o.dy;
          o.dx = nx * 0.994; o.dy = ny * 0.994;            
        } else if (flying){
          fly.t = Math.min(fly.d, fly.t + dt);
          const e = 1 - Math.pow(1 - fly.t / fly.d, 3);
          o.dx = (fly.sx + (fly.tx - fly.sx) * e) - o.x;
          o.dy = (fly.sy + (fly.ty - fly.sy) * e) - L.railY;
          if (fly.t >= fly.d){ const ci = o.ci; fly = null; startWeave(ci, false); }
        } else {                                            
          o.vx += -o.dx * 0.22; o.vy += -o.dy * 0.22;
          o.vx *= 0.78; o.vy *= 0.78;
          o.dx += o.vx; o.dy += o.vy;
          if (Math.abs(o.dx) < 0.4 && Math.abs(o.vx) < 0.4){ o.dx = 0; o.vx = 0; }
          if (Math.abs(o.dy) < 0.4 && Math.abs(o.vy) < 0.4){ o.dy = 0; o.vy = 0; }
        }
        const v = Math.hypot(o.vx, o.vy);
        o.sq.s = red ? 0 : Math.min(0.3, v * 0.012);
        o.sq.ang = v > 0.6 ? Math.atan2(o.vy, o.vx) : 0;
      }
      const want = (phase === 'play' && !answered) || fly ? 1 : 0;
      optA += (want - optA) * (1 - Math.exp(-dt / 90));

      if (weave){
        weave.p = Math.min(1, weave.p + dt / (red ? 220 : 760));
        if (weave.p >= 1) advance();
      }
      SHK.step(dt);
      if (wRe){ wRe.t += dt; if (wRe.t > (red ? 320 : 1080)) wRe = null; }
      warp *= Math.exp(-dt / 380); glow *= Math.exp(-dt / 900); flash *= Math.exp(-dt / 320);
      parts.step(dt); pops.step(dt);

      g.clearRect(0, 0, W, H);
      room(t);
      lamp(t);
      lightWash(t);

      g.save();
      if (!red) SHK.apply(g);

      loomBed();
      warpThreads(t);
      loomGear();
      fellLight(t);
      preCloth(t);                                                       

      for (let k = 0; k < rows.length; k++){                              
        const y = rowTop(k);
        drawRow(y, col(rows[k].ci), rows[k].motif, 1, t);
        if (glow > 0.01) ART.glow(g, L.loomX + L.loomW * ((k % 5) + .5) / 5, y + L.rowH / 2,
          Math.max(40, L.loomW * 0.22), FX.goldLt, glow * 0.35);
      }
      if (weave) drawRow(rowTop(rows.length), col(weave.ci), weave.motif, weave.p, t);
      if (flash > 0.01){
        ART.glow(g, L.loomX + L.loomW * 0.5, flashY, Math.max(70, L.loomW * 0.62), lt(flashC, .35), flash * 0.55);
        ART.glow(g, L.loomX + L.loomW * 0.5, flashY, Math.max(40, L.loomW * 0.30), '#FFFFFF', flash * 0.35);
      }

      if (phase === 'play' && !weave){                                    
        const y = rowTop(rows.length);
        const pu = red ? 0.5 : 0.5 + 0.5 * Math.sin(t * 0.005);
        const on = !!hold, c = on ? (isHex(teamCol) ? teamCol : FX.gold) : FX.gold;
        ART.glow(g, L.loomX + L.loomW / 2, y + L.rowH / 2, Math.max(66, L.loomW * 0.44),
          on ? c : FX.goldLt, 0.14 + pu * 0.16);
        g.save(); g.globalAlpha = 0.16 + pu * 0.16; g.fillStyle = c;
        rr(g, L.loomX, y, L.loomW, L.rowH, Math.min(4, L.rowH / 2)); g.fill(); g.restore();
        g.save(); g.globalAlpha = 0.55 + pu * 0.4; g.strokeStyle = on ? '#FFFFFF' : FX.goldLt;
        g.lineWidth = on ? 3 : 2; g.setLineDash([9, 7]); g.lineDashOffset = red ? 0 : -t * 0.03;
        rr(g, L.loomX + 0.5, y + 0.5, L.loomW - 1, L.rowH - 1, Math.min(4, L.rowH / 2)); g.stroke();
        g.restore();
        if (on){
          dropEl.style.opacity = '1';
          dropEl.style.left = (L.loomX + L.loomW / 2) + 'px';
          dropEl.style.top = (y - Math.max(22, L.rowH * 1.5)) + 'px';
        } else dropEl.style.opacity = '0';
      } else dropEl.style.opacity = '0';

      const fx = proj ? 17 : 13, fw = proj ? 13 : 10;                     
      beamV(L.loomX - fx, L.vTop - 12, fw, (L.bot - L.vTop) + 26);
      beamV(L.loomX + L.loomW + (proj ? 4 : 3), L.vTop - 12, fw, (L.bot - L.vTop) + 26);
      beamH(L.loomX - fx, L.vTop - 12, L.loomW + fx * 2, proj ? 12 : 9);
      beamH(L.loomX - fx, L.bot + 2, L.loomW + fx * 2, proj ? 14 : 11);
      lash(L.loomX - fx - 2, L.vTop - 14, fw + 6, proj ? 17 : 13);
      lash(L.loomX + L.loomW + 1, L.vTop - 14, fw + 6, proj ? 17 : 13);
      lash(L.loomX - fx - 2, L.bot + 1, fw + 6, proj ? 17 : 13);
      lash(L.loomX + L.loomW + 1, L.bot + 1, fw + 6, proj ? 17 : 13);

      weaver(t);
      railDraw();

      for (let i = 0; i < opts.length; i++){                              
        const o = opts[i], x = o.x + o.dx, y = L.railY + o.dy;
        const a = optA * Math.max(0, Math.min(1, Math.min(x - loA, loB - x) / 26));
        const c = col(o.ci);
        if (a > 0.02){
          strand(o.x, L.railY, x, y, c, a * 0.8);
          spool(x, y, L.r, c, o.sq, a, !!(hold && hold.i === i));
        }
        const hw = (o.el.offsetWidth || 90) / 2;                        
        o.el.style.opacity = a;
        o.el.style.left = Math.max(hw + 4, Math.min(W - hw - 4, x)) + 'px';
        o.el.style.top = (y + L.r + 8) + 'px';
      }

      parts.draw(g);                                                     
      motes(t);
      g.restore();

      g.fillStyle = ART.vgrad(g, 0, H - Math.max(16, H * 0.06), H, [aa('#2A1206', 0), aa('#2A1206', .45)]);
      g.fillRect(0, H - Math.max(16, H * 0.06), W, Math.max(16, H * 0.06));
      g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .10;   
      g.fillStyle = ART.rgrad(g, L.lx, L.ly, 0, Math.max(W, H) * 0.9,
        [aa('#FFE9C0', 0), aa('#8A4A1E', .55)]);
      g.fillRect(0, 0, W, H); g.restore();
       
      g.save(); g.globalAlpha = .38;
      g.fillStyle = ART.rgrad(g, 0, 0, 0, Math.max(W, H) * 0.46, [aa('#140A04', .70), aa('#140A04', 0)]);
      g.fillRect(0, 0, W * 0.5, H * 0.5);
      g.fillStyle = ART.rgrad(g, W, 0, 0, Math.max(W, H) * 0.46, [aa('#140A04', .70), aa('#140A04', 0)]);
      g.fillRect(W * 0.5, 0, W * 0.5, H * 0.5);
      g.restore();
      ART.vignette(g, W, H, 0.42);

      paintPops();
    });

    return {
      destroy(){
        dead = true;
        cv.removeEventListener('pointerdown', onDown);
        cv.removeEventListener('pointermove', onMove);
        cv.removeEventListener('pointerup', onUp);
        cv.removeEventListener('pointercancel', onUp);
        endBtn.onclick = null;
        ui.remove();
      }
    };
  }
});

SHIFT.engine('timeline', {
  name:'ترتيب وخط زمني', mins:2,
  mount(root, ctx){
    const C = ctx.content;
    const sorted = C.items.slice().sort((a,b)=>a.y-b.y);
    const pool = ctx.shuffle(C.items.map((x,i)=>({...x, i})));
    const placed = [];
    let locked = false, held = null, tries = 0;    

    const wrap = document.createElement('div');
    wrap.className = 'tl-wrap';
    wrap.style.cssText = 'position:absolute;inset:0;padding:clamp(10px,2vw,18px);display:grid;gap:10px;overflow:hidden';
    if(!document.getElementById('tl-css')){
      const st = document.createElement('style'); st.id = 'tl-css';
      st.textContent = `
        .tl-wrap{grid-template-rows:auto minmax(0,1fr) minmax(0,48%)}   /* المخزن صفّ بنسبة ثابتة من اللوحة، لا auto: صفّ auto كان يبتلع الارتفاع كله على الجوال ويترك المواضع صفراً */
        /* **شريط «تحت الحافة» يطفو ولا يأخذ صفّاً**: كان صفّاً ثالثاً في الشبكة، فعلى لوحة
           قصيرة (‏٧٦٠×٣٩٠ و٨٤٤×٣٩٠: اللوحة ٢٥١px والعمود ٧٣px) ابتلع هو والمحور العمودَ
           كلّه وصار #slots بارتفاع **صفر** — فلا موضع يُرى أصلاً. قِيس 18 سبتمبر: ٦/٦
           تحت الحافة و٠ ظاهرة. الآن يطفو فوق قاع العمود فيبقى كل المتاح للمواضع. */
        .tl-wrap #slotcol{display:grid;grid-template-rows:auto minmax(0,1fr);gap:5px;min-height:0;position:relative}
        .tl-wrap #tl-axis{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
          font-weight:700;color:var(--muted);border-block-end:2px solid var(--line);padding-block-end:4px}
        .tl-wrap #tl-axis b{color:var(--ink)}
        .tl-wrap #tl-more{display:none;font-weight:700;color:var(--ink);background:var(--raised);
          border:2px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;
          position:absolute;inset-inline:0;inset-block-end:0;pointer-events:none;
          box-shadow:0 -6px 14px var(--shade-soft)}
        .tl-wrap.tl-has-more #tl-more{display:block}
        .tl-wrap #slots{overflow:auto;min-height:0;padding-inline-end:4px}
        .tl-wrap #pool{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;overflow:auto;min-height:0;
          padding-block-start:8px;border-block-start:2px solid var(--line)}
        .tl-wrap:not(.tl-wide) #pool button{min-height:42px!important;padding:6px 12px!important;font-size:14px!important;flex:1 1 44%}
        .tl-wrap.tl-wide{grid-template-columns:minmax(0,1fr) minmax(240px,36%);grid-template-rows:auto minmax(0,1fr);column-gap:14px}
        .tl-wrap.tl-wide #tl-hint{grid-column:1/-1}
        .tl-wrap.tl-wide #slotcol{grid-column:1;grid-row:2}
        .tl-wrap.tl-wide #pool{grid-column:2;grid-row:2;flex-direction:column;flex-wrap:nowrap;max-height:none;
          padding:0 0 0 2px;border-block-start:0;border-inline-start:2px solid var(--line);padding-inline-start:12px}
        .tl-wrap.tl-wide #pool button{width:100%}`;
      document.head.appendChild(st);
    }
    root.appendChild(wrap);
    const fit = () => { wrap.classList.toggle('tl-wide', root.clientWidth >= 820); ctx.after(0, more); };    
    fit(); const ro = new ResizeObserver(fit); ro.observe(root);

    function more(){
      const sl = wrap.querySelector('#slots'), tip = wrap.querySelector('#tl-more');
      if(!sl || !tip) return;
      const edge = sl.getBoundingClientRect().bottom;
      const n = [...sl.children].filter(b => b.getBoundingClientRect().bottom > edge + 2).length;
      wrap.classList.toggle('tl-has-more', n > 0);
       
      if(n > 0) tip.textContent = `تحت الحافة ${n} من ${sorted.length} — مرّر لأسفل ↓`;
    }

    function draw(){
      const fs = ctx.proj ? 21 : 15;
       
      const smin = ctx.proj ? 62 : 48;
       
      wrap.innerHTML = `
        <div id="tl-hint" style="font-size:14px;font-weight:700;color:var(--muted)">اضغط الحدث ثم اضغط موضعه على الخط · دور: <b>${ctx.esc(ctx.team().name)}</b></div>
        <div id="slotcol">
        <div id="tl-axis" style="font-size:${ctx.proj?16:13}px"><b>رتّب من الأقدم إلى الأحدث</b><span>${sorted.length} مواضع</span></div>
        <div style="display:grid;grid-template-rows:repeat(${sorted.length},minmax(${smin}px,1fr));gap:7px" id="slots">${sorted.map((_,n)=>{
          const p = placed[n];
           
          const bg = p ? (p.shown?'var(--amber-soft)':'var(--pine-soft)') : 'var(--ground)';
          const bd = p ? (p.shown?'var(--amber)':'var(--pine)') : 'var(--line)';
          return `<button data-slot="${n}" ${p?'disabled':''} style="display:flex;gap:11px;align-items:center;
            padding:11px 14px;border:2px ${p?'solid':'dashed'} ${bd};border-radius:10px;min-height:${smin}px;
            font-size:${fs}px;background:${bg};color:var(--ink);text-align:right;line-height:1.45;
            transition:transform var(--d-pop) var(--ease-settle),background var(--d-pop) var(--ease-settle);transform:scale(${p?1:1})">
            <span style="width:28px;height:28px;border-radius:50%;background:var(--raised);color:var(--muted);
              display:grid;place-items:center;font-size:14px;font-weight:600;flex:0 0 auto">${n+1}</span>            <span>${p ? ctx.esc(p.t) + ` — <b>${p.y}</b>` + (p.shown?' <span style="color:var(--muted);font-size:.85em">(كُشف)</span>':'') : '<span style="color:var(--faint)">اضغط لوضع الحدث هنا</span>'}</span>${
             
            (n === 0 || n === sorted.length - 1)
              ? `<span style="margin-inline-start:auto;flex:0 0 auto;font-size:13px;font-weight:800;
                  color:var(--muted);background:var(--raised);border:2px solid var(--line);
                  border-radius:999px;padding:2px 9px;white-space:nowrap">${n === 0 ? 'الأقدم' : 'الأحدث'}</span>`
              : ''}
          </button>`;}).join('')}
        </div>
        <div id="tl-more" style="font-size:${ctx.proj?15:13}px"></div>
        </div>
        <div id="pool">${pool.map(x=>{
          const used = placed.some(p=>p.i===x.i);
          const on = held === x.i;
          return `<button data-pool="${x.i}" ${used?'disabled':''} style="padding:11px 15px;
            border:2px solid ${on?'var(--accent)':'var(--line)'};border-radius:10px;
            background:${on?'var(--accent-soft)':'var(--surface)'};color:var(--ink);
            font-size:${fs}px;line-height:1.45;min-height:${ctx.proj?58:48}px;text-align:right;
            opacity:${used?.3:1};transform:${on?'translateY(-3px)':'none'};transition:transform var(--d-tap) var(--ease-settle)">${ctx.esc(x.t)}</button>`;}).join('')}
        </div>`;
      wrap.querySelectorAll('[data-pool]:not(:disabled)').forEach(b => b.onclick = () => {
        if(locked) return; held = +b.dataset.pool; ctx.beep('pop'); draw(); });
      wrap.querySelectorAll('[data-slot]:not(:disabled)').forEach(b => b.onclick = () => place(+b.dataset.slot));
       
      const nxt = wrap.querySelector('[data-slot]:not(:disabled)'); if(nxt && nxt.scrollIntoView) nxt.scrollIntoView({block:'nearest'});
      const sl = wrap.querySelector('#slots');
      sl.addEventListener('scroll', more, { passive:true });    
      more();
    }

    function place(n){
      if(locked) return;
      if(held === null){ ctx.say('soft','اختر الحدث أولاً ثم اضغط موضعه'); ctx.after(1200, ctx.clearSay); return; }
      if(n !== placed.length){ ctx.say('soft','املأ المواضع بالترتيب من الأعلى'); ctx.after(1200, ctx.clearSay); return; }
      const x = pool.find(p => p.i === held);
      const want = sorted[placed.length];
      const ok = want.y === x.y;

      if(ok){
         
        const pts = tries === 0 ? 10 : 6;
        ctx.correct(pts, {q:`ترتيب: ${x.t}`, obj:C.obj, correct:`سنة ${x.y}`}); ctx.beep('good');
        ctx.say('good', `في مكانه الصحيح — <b>+${pts}</b> لفريق ${ctx.esc(ctx.team().name.replace(/^فريق\s+/, ''))}`);    
        placed.push({...x, shown:false});
        tries = 0;
      } else {
        ctx.wrong({q:`ترتيب: ${x.t}`, obj:C.obj, correct:`الموضع الصحيح حسب سنة ${x.y}`});
        ctx.beep('soft');
        tries++;
        if(tries < 2){
           
          ctx.say('soft', `هذا الحدث سنة <b>${x.y}</b> — أعيدوه وجرّبوا غيره`);
        } else {
           
          placed.push({...want, shown:true});
          ctx.say('soft', `الصواب هنا: <b>${ctx.esc(want.t)}</b> — سنة <b>${want.y}</b>`);
          tries = 0;
        }
      }
      held = null; locked = true; draw();
      ctx.after(ok ? 1350 : 1900, () => {
        locked = false; ctx.clearSay(); ctx.next();
        if(placed.length >= sorted.length) ctx.finish(); else draw();
      });
    }

    draw();
    return { destroy(){ ro.disconnect(); wrap.remove(); } };
  }
});

  engine:'إبحار وملاحة',
  mins:3,
  title:'رحلة الجزر',
  obj:'الجزر والمواقع',
  brief:'انطلق من ميناء مدينة الكويت على جون الكويت، وارسُ عند الجزيرة التي تصفها البطاقة.',
  port:{x:48, y:49, label:'ميناء مدينة الكويت'},

  mouth:{x:62, y:44},

    root.appendChild(layer);

    const order   = ctx.shuffle(C.items);

    const inBay = p => (p.x < 57 && p.y > 30 && p.y < 52);

      for (let i=1;i<pts.length;i++){ acc += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); pts[i].d=acc; }

    function avoidIslands(pts, a, b){

          const p = pts[i];
          for (const is of live){
             
            const rx = is.r*is.sx*1.2 + 1.8, ry = is.r*is.sy*1.2 + 1.8;
            let dx = (p.x-is.x)/rx, dy = (p.y-is.y)/ry, d = Math.hypot(dx,dy);

          pts[i].x = pts[i].x*0.6 + (pts[i-1].x + pts[i+1].x)*0.2;
          pts[i].y = pts[i].y*0.6 + (pts[i-1].y + pts[i+1].y)*0.2;

        if (!moved) break;
      }

    function moorGap(is){
      if (!is) return 0;
      const rU  = Math.max(is.r, (PRJ ? 15 : 11) / Math.max(sc, 0.001));
       
      const hull = (34 * Math.max(sc*0.200, PRJ ? 0.78 : 0.56)) / Math.max(sc, 0.001);

        ? (bonus ? 'ريح مواتية — البوم يطير على الموج!' : 'السفينة تُبحر… شدّ الشراع.')
        : 'تابع البوم إلى الجزيرة الصحيحة.';
    }
    function resolve(){
      const right = (picked === target);
      const pts = right ? 10 + bonus : 0;
      const log = {q:'أبحر إلى: ' + target.d, obj:C.obj, right:right, correct:'جزيرة ' + target.n};
      if (right){
        ctx.correct(pts, log);
        ctx.beep('good');
        ctx.say('good', 'أحسنت! رَسَت السفينة عند <b>' + ctx.esc(target.n) + '</b>' +
                (bonus ? ' — وريح مواتية <b>+' + ar(bonus) + '</b>' : '') + '.');
        reveal(target);
        burst(target);
        pops.add(mx(target.x), my(target.y) - rad(target)*target.sy - 12, '+' + ar(pts), GOLD);
      } else {
        ctx.wrong(log);
        ctx.beep('soft');
        ctx.say('soft', 'هذه جزيرة <b>' + ctx.esc(picked.n) + '</b> — الوصف يدلّ على <b>' +
                ctx.esc(target.n) + '</b>. تابع البوم إليها.');
        picked._flash = 1;
        if (!RED){
          shake.hit(7);
          spray.burst(mx(picked.x), my(picked.y), 16,
            {col:SEA.sand, sp0:0.05, sp1:0.20, r0:1.4, r1:3.4, g:0.00030});
        }
      }
      ctx.next(); ctx.sync();
      idx++;
      if (right){ state='arrive'; stateT=0; }
      else { state='arrive'; stateT=0; ship.pending = target; }
    }
    function reveal(isl){ isl._found = true; isl._glow = 1; isl._lbl.style.opacity = '1'; updateLog(); }

    function hidePick(){ sel = null; pick.style.display = 'none'; }
    function showPick(is){
      sel = is;
      pick.textContent = 'أبحر إلى هنا';
      pick.style.display = 'block';
      const W = w(), H = h();
      const hh = pick.offsetHeight || (PRJ?64:48);
      const hw = (pick.offsetWidth  || (PRJ?170:128)) / 2;
      const gap = PRJ?14:10, ry = rad(is)*is.sy;
      let top = my(is.y) + ry + gap;
      if (top + hh > H - 6) top = my(is.y) - ry - gap - hh;    
      top = Math.max(6, Math.min(top, H - hh - 6));
      pick.style.left = Math.max(hw+6, Math.min(mx(is.x), W-hw-6))+'px';
      pick.style.top  = top+'px';
      is._flash = 0.35;                        
    }
    function onPick(){ const is = sel; hidePick(); if (is && state === 'aim') launch(is, true); }
    pick.addEventListener('click', onPick);

    function onDown(e){
      if (state !== 'aim') return;
      const r = cv.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      let best=null, bd=1e9;
      C.items.forEach(is => {
        if (is._found) return;                 
        const d = Math.hypot(px - mx(is.x), py - my(is.y));
        if (d < bd){ bd = d; best = is; }
      });
      if (!best){ hidePick(); ripples.push({x:ux(px), y:uy(py), l:1}); return; }
      const reach = Math.max(rad(best)*Math.max(best.sx,best.sy)*2.1, PRJ ? 48 : 38);
      if (bd > reach){ hidePick(); ripples.push({x:ux(px), y:uy(py), l:1}); return; }
      showPick(best);
    }
    cv.addEventListener('pointerdown', onDown);

    function sunSpot(W, H){
      const c = chart();
      if (c.x >= 44)                        
        return {x: c.x*0.42, y: H*0.14, r: Math.max(10, Math.min(c.x*0.40, H*0.055))};
      if (c.y >= 74)                        
        return {x: W*0.20, y: c.y*0.62, r: Math.max(10, Math.min(c.y*0.22, W*0.045))};
      return {x: Math.max(16, c.x*0.5), y: H*0.10, r: Math.max(9, Math.min(W*0.024, H*0.045))};
    }
    function backdrop(W, H, t){
      const S  = sunSpot(W, H);
      const hz = Math.max(H*0.15, S.y + S.r*2.8);       
       
      g.fillStyle = ART.vgrad(g, 0, 0, hz, ['#06253C','#12506E','#3E93A6']);
      g.fillRect(0, 0, W, hz+1);
       
      g.fillStyle = ART.vgrad(g, 0, hz, H, ['#0A3B58', DEEP, '#020D18']);
      g.fillRect(0, hz, W, H-hz+1);
       
      ART.sunDisc(g, S.x, S.y, S.r, {sun:'#FFE7B0', sunGlow:'#FFC46B'});
      ART.glow(g, S.x, S.y, Math.max(W,H)*0.55, '#2C86A8', .16);
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.22;
      g.fillStyle = ART.rgrad(g, S.x, hz, 0, Math.max(W,H)*0.32,
        [A('#FFC46B',.85), A('#FFC46B',0)]);
      g.fillRect(0, hz-H*0.06, W, H*0.26); g.restore();
       
      const dr = RED ? 0 : t*0.000012;
       
      const ridge = (baseY, amp, seed, col, al, det) => {
        g.save(); g.globalAlpha = al;
        ART.dune(g, W, baseY, amp, seed, col, det); g.restore();
      };
      ridge(hz + H*0.030, Math.max(6, H*0.022), 1.70 + dr,     '#2E7F98', .34, true);
      ridge(hz + H*0.115, Math.max(8, H*0.030), 4.20 + dr*2.1, '#123F5C', .62, false);
      ridge(H*0.860,      Math.max(9, H*0.034), 2.60 + dr*3.6, '#04182A', .94, false);
       
      ART.dhow(g, W*0.055, hz - H*0.008, Math.max(0.16, H*0.00050), 
        {hull:['#12506E','#0C3852','#08283C'], rope:'#12506E', sail:'#1C6482'},
        RED ? 0 : t*0.35, '#1C6482');
       
      const fps = Math.max(0.30, H*0.0016);
      [0.045, 0.135, 0.30, 0.52, 0.72, 0.915].forEach((k, i) => {
        const px2 = W*k + (RED ? 0 : Math.sin(t*0.0002 + i)*2);
        ART.palm(g, px2, H*0.885 + (i%2)*H*0.030, fps*(0.80 + (i%3)*0.22),
                 {trunk:'#04182A', palm:'#05202F', palmLt:'#082A3E'}, 0.16);
      });
       
      ART.vignette(g, W, H, .34);
    }

          ART.waves(g, c.w, y, SEA, t + k*1400, (1.8 + k*1.6)*Math.max(.6, sc*0.22),
                    0.0007 + k*0.0005, 0.050 + k*0.055, Math.max(1, sc*(0.09 + k*0.08)));

    function tracePoly(pts){
      g.beginPath();
      g.moveTo(mx(pts[0][0]), my(pts[0][1]));
      for (let i=1;i<pts.length;i++) g.lineTo(mx(pts[i][0]), my(pts[i][1]));
      g.closePath();
    }
    function coastline(t){
      const pts = C.coast, c = chart();
      g.save();
       
      for (let i=5;i>=1;i--){
        tracePoly(pts);
        g.lineWidth = sc*i*1.35; g.strokeStyle = A(SEA.surf, .085); g.stroke();
      }
       
      tracePoly(pts);
      g.lineWidth = Math.max(2, sc*0.55);
      g.strokeStyle = A(SEA.foam, .55 + (RED?0:0.12*Math.sin(t*0.0018))); g.stroke();
       
      g.save(); g.translate(sc*0.55, sc*0.8);
      tracePoly(pts); g.fillStyle = A('#02121F', .38); g.fill(); g.restore();
       
      tracePoly(pts);
      const lg = g.createLinearGradient(c.x, c.y, c.x + c.s*0.75, c.y + c.s);
      lg.addColorStop(0, MIX(LAND_L,'#FFFFFF',.25));
      lg.addColorStop(.42, LAND_M);
      lg.addColorStop(.78, SEA.sand);
      lg.addColorStop(1, LAND_D);

      g.save(); g.translate(-sc*0.75, -sc*0.95); tracePoly(pts);
